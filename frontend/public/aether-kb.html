\/strong>, open the data sheet and type the real figure. The tag goes away.<\/li>\n<\/ol>\n<p>To undo the pick, click <strong>Back to generic<\/strong>. The device goes back to its typical values.<\/p>\n<h2>What the picker covers<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Covered<\/th>\n<th>Not covered yet (no <strong>Product<\/strong> section)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Maglocks, strikes, electrified and electronic locks, deadlatches, latch-retraction kits, door holders, sirens, strobes, horns, sounders, bells<\/td>\n<td>PIRs, power supplies<\/td>\n<\/tr>\n<tr>\n<td>Readers: OSDP, Wiegand, keypad, mobile, QR, long-range, biometric / face<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>REX sensors, buttons, door contacts<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Some face terminals publish only their adapter rating, such as 12 V 3 A, and that is what is stored. PoE-only readers carry their PoE class or watts instead of mA.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The device's <strong>Draw<\/strong> no longer shows <strong>typical<\/strong> or <strong>assumed<\/strong>.<\/li>\n<li>The <strong>Power<\/strong> tab uses the new figure.<\/li>\n<li>The exported wire schedule lists <strong>Manufacturer<\/strong>, <strong>Model<\/strong>, ADI part and where the draw came from.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>Product<\/strong> section<\/td>\n<td>The device kind isn't covered yet. Type its voltage and draw by hand.<\/td>\n<\/tr>\n<tr>\n<td>The brand or model isn't listed<\/td>\n<td>Type the figures from the data sheet by hand.<\/td>\n<\/tr>\n<tr>\n<td><strong>Runs at<\/strong> can't be changed<\/td>\n<td>A power supply sets the device's voltage. Change it on the supply.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a080\">080 Power checks and device draws<\/a><\/li>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<li><a href=\"#a078\">078 Build a Hanwha Trove kit enclosure<\/a><\/li>\n<\/ul>", "text": "pick reader, lock and peripheral models how to use the product picker in blueprints to set a reader, lock or other device to a real manufacturer model, so voltage and current come from published data. for anyone drawing wiring or sizing power.  summary devices in board blueprints start with typical values. the product section lets you pick a real manufacturer and model, which fills in the voltage, current draw and spec from data sheets. use it whenever the power check matters, so the power tab works from real figures rather than typical ones. before you start board blueprints is open ( integrations › board blueprints ) on a wiring sheet with the device placed. know the brand and model of the device, or its adi part number. pick a model select the device on the sheet. the product section appears in its pane. open manufacturer . it lists only brands that make that kind of device, with the number of models each has. in model , type a model number, an adi part number or words, such as 9600 or 1200 lb . click the model in the list. screenshot to add: product section for a strike with manufacturer and model filled and the data sheet link shown check what was filled in: - spec : brand and model. - voltage : with a 12 v / 24 v choice when the model supports both. - draw : the published current at 12 v and 24 v. - for locks: fail mode, holding force, a data sheet link, and a warning if the model is discontinued. - for readers: poe, protocols and credential technology. if the draw shows assumed , open the data sheet and type the real figure. the tag goes away. to undo the pick, click back to generic . the device goes back to its typical values. what the picker covers covered not covered yet (no product section) maglocks, strikes, electrified and electronic locks, deadlatches, latch-retraction kits, door holders, sirens, strobes, horns, sounders, bells pirs, power supplies readers: osdp, wiegand, keypad, mobile, qr, long-range, biometric / face rex sensors, buttons, door contacts some face terminals publish only their adapter rating, such as 12 v 3 a, and that is what is stored. poe-only readers carry their poe class or watts instead of ma. check that it worked the device's draw no longer shows typical or assumed . the power tab uses the new figure. the exported wire schedule lists manufacturer , model , adi part and where the draw came from. if something goes wrong symptom what to do no product section the device kind isn't covered yet. type its voltage and draw by hand. the brand or model isn't listed type the figures from the data sheet by hand. runs at can't be changed a power supply sets the device's voltage. change it on the supply. related articles 080 power checks and device draws 076 what board blueprints does 078 build a hanwha trove kit enclosure "}, {"id": "a080", "num": "080", "title": "Power checks and device draws", "area": "Tools", "type": "Reference", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Reference for the power checks in Board Blueprints: design rules, terminal limits, controller input budgets and where each device draw comes from. For anyone sizing supplies and batteries.", "sources": ["Aether Board and Wiring tool", "Aether features presentation"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Power<\/strong> tab on a <strong>Wiring<\/strong> sheet adds up every load against the supply, controller, output and terminal that feeds it, and flags anything over its rating. This article lists the defaults it uses and how to read each figure's source. Each design rule can be changed per project in the <strong>Power<\/strong> tab, and per supply or device.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Power tab for a 2-door controller with maglocks, showing the terminal limits table and a warning<\/span><\/div>\n<h2>Design rules<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Default<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Battery standby<\/td>\n<td>4 h<\/td>\n<\/tr>\n<tr>\n<td>Alarm time on battery<\/td>\n<td>15 min<\/td>\n<\/tr>\n<tr>\n<td>Battery aging factor<\/td>\n<td>1.25<\/td>\n<\/tr>\n<tr>\n<td>Supply load limit<\/td>\n<td>80% of rating (also applied to each board terminal)<\/td>\n<\/tr>\n<tr>\n<td>Allowed voltage drop at a device<\/td>\n<td>10%<\/td>\n<\/tr>\n<tr>\n<td>Run length when a cable has none<\/td>\n<td>50 ft<\/td>\n<\/tr>\n<tr>\n<td>Voltage-drop model<\/td>\n<td>Solid copper, out and back: 2 × length × Ω per 1000 ft × current<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Battery sizes offered: 4, 7, 8, 12, 18, 26, 40, 55, 75 and 100 Ah. A 24 V supply uses 2 × 12 V in series.<\/p>\n<h2>Board terminal limits<\/h2>\n<p>Each load on a board terminal is checked against that terminal's rating. Over the rating is an error; over 80% is a warning.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Board<\/th>\n<th>Limits<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>P-series (NHP)<\/td>\n<td>Reader 300 mA; wet output 500 mA at 12 V or 350 mA at 24 V; REX POWER 50 mA<\/td>\n<\/tr>\n<tr>\n<td>NOP-IC2<\/td>\n<td>Readers 500 mA each, 600 mA combined; AUX 1 A<\/td>\n<\/tr>\n<tr>\n<td>NOP-RI2MS<\/td>\n<td>Readers 500 mA each, 1 A combined; AUX 1 A<\/td>\n<\/tr>\n<tr>\n<td>Dry contacts (all boards)<\/td>\n<td>2 A at 30 V DC<\/td>\n<\/tr>\n<tr>\n<td>NOP-RI4S, IO84<\/td>\n<td>No published figures: borrow the RI2MS and P-series limits and show <strong>assumed<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Controller input<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Controller<\/th>\n<th>Default feed<\/th>\n<th>Peripheral budget<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>P200, P400<\/td>\n<td>PoE++ (PoE+, 12 V DC or 24 V DC selectable)<\/td>\n<td>39 W on PoE++<\/td>\n<\/tr>\n<tr>\n<td>P100<\/td>\n<td>PoE+<\/td>\n<td>17 W on PoE+<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The budget is the input power minus the controller's own draw, times its efficiency. <span class=\"sme\">confirm the P200/P400 budget on 12 V DC and 24 V DC feeds.<\/span><\/p>\n<h2>Access power controllers<\/h2>\n<p>An ACM8 is paired with an Altronix eFlow supply (<strong>eFlow4NB<\/strong>, <strong>eFlow6NB<\/strong> by default, <strong>eFlow102NB<\/strong>, <strong>eFlow104NB<\/strong> or another supply). It is capped at 10 A, uses 3.5 A fuses, and its own 0.5 A draw is counted. Each lock is checked against the output it is actually on.<\/p>\n<h2>Where a draw comes from<\/h2>\n<p>The device pane shows the source of each current figure:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Source label<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Typed in<\/td>\n<td>You entered it.<\/td>\n<\/tr>\n<tr>\n<td>Manufacturer data sheet<\/td>\n<td>Read from the maker's data sheet.<\/td>\n<\/tr>\n<tr>\n<td>Reseller listing / ADI<\/td>\n<td>From a distributor catalog.<\/td>\n<\/tr>\n<tr>\n<td><strong>typical<\/strong><\/td>\n<td>A catalog default you haven't confirmed.<\/td>\n<\/tr>\n<tr>\n<td><strong>assumed<\/strong><\/td>\n<td>No published figure; check the data sheet.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The power CSV records which values are which. A device fed from a supply follows that supply's voltage.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a079\">079 Pick reader, lock and peripheral models<\/a><\/li>\n<li><a href=\"#a078\">078 Build a Hanwha Trove kit enclosure<\/a><\/li>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<\/ul>", "text": "power checks and device draws reference for the power checks in board blueprints: design rules, terminal limits, controller input budgets and where each device draw comes from. for anyone sizing supplies and batteries.  summary the power tab on a wiring sheet adds up every load against the supply, controller, output and terminal that feeds it, and flags anything over its rating. this article lists the defaults it uses and how to read each figure's source. each design rule can be changed per project in the power tab, and per supply or device. screenshot to add: power tab for a 2-door controller with maglocks, showing the terminal limits table and a warning design rules rule default battery standby 4 h alarm time on battery 15 min battery aging factor 1.25 supply load limit 80% of rating (also applied to each board terminal) allowed voltage drop at a device 10% run length when a cable has none 50 ft voltage-drop model solid copper, out and back: 2 × length × ω per 1000 ft × current battery sizes offered: 4, 7, 8, 12, 18, 26, 40, 55, 75 and 100 ah. a 24 v supply uses 2 × 12 v in series. board terminal limits each load on a board terminal is checked against that terminal's rating. over the rating is an error; over 80% is a warning. board limits p-series (nhp) reader 300 ma; wet output 500 ma at 12 v or 350 ma at 24 v; rex power 50 ma nop-ic2 readers 500 ma each, 600 ma combined; aux 1 a nop-ri2ms readers 500 ma each, 1 a combined; aux 1 a dry contacts (all boards) 2 a at 30 v dc nop-ri4s, io84 no published figures: borrow the ri2ms and p-series limits and show assumed controller input controller default feed peripheral budget p200, p400 poe++ (poe+, 12 v dc or 24 v dc selectable) 39 w on poe++ p100 poe+ 17 w on poe+ the budget is the input power minus the controller's own draw, times its efficiency. confirm the p200/p400 budget on 12 v dc and 24 v dc feeds. access power controllers an acm8 is paired with an altronix eflow supply ( eflow4nb , eflow6nb by default, eflow102nb , eflow104nb or another supply). it is capped at 10 a, uses 3.5 a fuses, and its own 0.5 a draw is counted. each lock is checked against the output it is actually on. where a draw comes from the device pane shows the source of each current figure: source label meaning typed in you entered it. manufacturer data sheet read from the maker's data sheet. reseller listing / adi from a distributor catalog. typical a catalog default you haven't confirmed. assumed no published figure; check the data sheet. the power csv records which values are which. a device fed from a supply follows that supply's voltage. related articles 079 pick reader, lock and peripheral models 078 build a hanwha trove kit enclosure 076 what board blueprints does "}, {"id": "a081", "num": "081", "title": "Read an OnCAFE site into Blueprints", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to import a real OnCAFE site into Board Blueprints by signing in through Aether, with the console connector and file drop as fallbacks. For T/S, FAEs and engineers who need a site drawing.", "sources": ["claude/oncafe-auth.md (via Blueprint tool automation)", "Blueprint tool automation", "Aether Board and Wiring tool", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Board Blueprints can read a site straight from OnCAFE: controllers, I/O, doors, locations and elevators. When the page is opened from Aether, the Pi signs in to OnCAFE for you, so nothing is pasted into a console. Use it to start a riser or wiring drawing from a real site instead of typing every device.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Board Blueprints is open from Aether at <strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong> (not as a standalone file).<\/li>\n<li>The Pi can reach the internet.<\/li>\n<li>You have an OnCAFE account with a password for that organization. Accounts that sign in through Okta have no OnCAFE password; use the connector instead (see below).<\/li>\n<\/ul>\n<h2>Sign in through Aether<\/h2>\n<ol>\n<li>In Board Blueprints, open <strong>Import<\/strong>, then <strong>Connect to OnCAFE<\/strong>. <span class=\"sme\">confirm the Import entry point (Site view Properties or top bar) in the current release.<\/span><\/li>\n<li>Enter the OnCAFE address, for example <code>https://&lt;org&gt;.oncafe.hanwhavision.cloud<\/code>. Only <code>*.oncafe.hanwhavision.cloud<\/code> addresses are accepted. <span class=\"sme\">confirm the address field label.<\/span><\/li>\n<li>In the <strong>Sign in through Aether<\/strong> box, enter your <strong>OnCAFE username<\/strong> and <strong>Password<\/strong>.<\/li>\n<li>Click <strong>Sign in and read site<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Connect to OnCAFE dialog with the Sign in through Aether box<\/span><\/div>\n<ol start=\"5\">\n<li>If you belong to several organizations, pick one from <strong>Organisation<\/strong>.<\/li>\n<li>Pick the location to import.<\/li>\n<li>Click <strong>Import<\/strong>.<\/li>\n<\/ol>\n<p>Your password is used for that one sign-in and is not saved. The Pi stays signed in for up to 48 hours, also across a backend restart. After that the box offers <strong>Read site<\/strong> and <strong>Sign out<\/strong>.<\/p>\n<h2>If you can't sign in through Aether: run the connector<\/h2>\n<ol>\n<li>In the same dialog, open <strong>Or run the connector in the OnCafe tab<\/strong>.<\/li>\n<li>Click <strong>Open OnCAFE<\/strong> and sign in there.<\/li>\n<li>Click <strong>Copy connector script<\/strong>. If copying is blocked, use <strong>Show script<\/strong> or <strong>Save as file<\/strong>.<\/li>\n<li>In the OnCAFE tab, open the browser's developer console, paste the script and press Enter. The pasted text starts with <code>// Board Blueprint Studio connector<\/code>.<\/li>\n<li>If the console says the file was saved, go back to Blueprints and click <strong>Load blueprint-site.json<\/strong> in step 3, or drop the file there.<\/li>\n<li>Pick the location and click <strong>Import<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The dialog shows how many devices and doors it read.<\/li>\n<li>After <strong>Import<\/strong>, the Site view shows the controllers, and doors are placed on their boards by their OnCAFE IDs.<\/li>\n<li>Doors with no controller or I/O in OnCAFE are listed as not placed.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>Sign in through Aether<\/strong> box<\/td>\n<td>The page was opened as a file, or Aether is missing the update. Open Blueprints from Aether, or use the connector.<\/td>\n<\/tr>\n<tr>\n<td>Wrong password, or password sign-in refused<\/td>\n<td>Check the account. Okta accounts need the connector.<\/td>\n<\/tr>\n<tr>\n<td>Message that the backend could not restart after an update<\/td>\n<td>Reboot the Pi or run <code>sudo systemctl restart aether-backend<\/code> once.<\/td>\n<\/tr>\n<tr>\n<td>Production address doesn't sign in<\/td>\n<td><span class=\"sme\">confirm production OnCAFE sign-in through Aether has been tested.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<li><a href=\"#a075\">075 Use the OnCAFE Console builder<\/a><\/li>\n<li><a href=\"#a082\">082 Share projects in team spaces<\/a><\/li>\n<\/ul>", "text": "read an oncafe site into blueprints how to import a real oncafe site into board blueprints by signing in through aether, with the console connector and file drop as fallbacks. for t/s, faes and engineers who need a site drawing.  summary board blueprints can read a site straight from oncafe: controllers, i/o, doors, locations and elevators. when the page is opened from aether, the pi signs in to oncafe for you, so nothing is pasted into a console. use it to start a riser or wiring drawing from a real site instead of typing every device. before you start board blueprints is open from aether at integrations › board blueprints (not as a standalone file). the pi can reach the internet. you have an oncafe account with a password for that organization. accounts that sign in through okta have no oncafe password; use the connector instead (see below). sign in through aether in board blueprints, open import , then connect to oncafe . confirm the import entry point (site view properties or top bar) in the current release. enter the oncafe address, for example https://<org>.oncafe.hanwhavision.cloud . only *.oncafe.hanwhavision.cloud addresses are accepted. confirm the address field label. in the sign in through aether box, enter your oncafe username and password . click sign in and read site . screenshot to add: connect to oncafe dialog with the sign in through aether box if you belong to several organizations, pick one from organisation . pick the location to import. click import . your password is used for that one sign-in and is not saved. the pi stays signed in for up to 48 hours, also across a backend restart. after that the box offers read site and sign out . if you can't sign in through aether: run the connector in the same dialog, open or run the connector in the oncafe tab . click open oncafe and sign in there. click copy connector script . if copying is blocked, use show script or save as file . in the oncafe tab, open the browser's developer console, paste the script and press enter. the pasted text starts with // board blueprint studio connector . if the console says the file was saved, go back to blueprints and click load blueprint-site.json in step 3, or drop the file there. pick the location and click import . check that it worked the dialog shows how many devices and doors it read. after import , the site view shows the controllers, and doors are placed on their boards by their oncafe ids. doors with no controller or i/o in oncafe are listed as not placed. if something goes wrong symptom what to do no sign in through aether box the page was opened as a file, or aether is missing the update. open blueprints from aether, or use the connector. wrong password, or password sign-in refused check the account. okta accounts need the connector. message that the backend could not restart after an update reboot the pi or run sudo systemctl restart aether-backend once. production address doesn't sign in confirm production oncafe sign-in through aether has been tested. related articles 076 what board blueprints does 075 use the oncafe console builder 082 share projects in team spaces "}, {"id": "a082", "num": "082", "title": "Share projects in team spaces", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How to connect an Aether Pi or a shared Blueprints file to a team space so projects save to the shared repository, and how access is approved. For team leads and anyone sharing Blueprints projects.", "sources": ["claude/board-blueprints-github.md (via Aether Board and Wiring tool)", "Aether Board and Wiring tool", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Team spaces let a team keep its Board Blueprints projects in one shared place. Each team's projects and edited boards are saved in their own folder in the shared repository, and each save is recorded under the person or Pi that made it. Use a team space when more than one person or bench works on the same projects.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Blueprints service address from the owner of the shared repository, for example <code>https://board-blueprints.example.workers.dev<\/code>.<\/li>\n<li>On a Pi: the Blueprints update that adds <strong>Check for updates<\/strong> and the service connection. See <a href=\"#a074\">074 Keep Board Blueprints up to date<\/a>.<\/li>\n<li>For people using the shared file: a GitHub account.<\/li>\n<\/ul>\n<h2>Connect a Pi to a team space<\/h2>\n<ol>\n<li>On the Pi, open <strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>, then <strong>Team space ▾<\/strong>.<\/li>\n<li>Enter the service address.<\/li>\n<li>Enter a name for this Pi.<\/li>\n<li>Enter its team space, for example <code>Tampa T/S<\/code>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Team space menu showing &quot;Waiting for owner approval&quot;<\/span><\/div>\n<ol start=\"5\">\n<li>Wait for the owner to approve the Pi. The menu shows <strong>Waiting for owner approval<\/strong> until then.<\/li>\n<\/ol>\n<p>An approved Pi can save only to its own team space. If it's offline, saves wait on the Pi and upload when it reconnects.<\/p>\n<h2>Use the shared file<\/h2>\n<ol>\n<li>Open <code>Board-Blueprints.html<\/code>. It needs internet; it loads the current release from the service.<\/li>\n<li>Click sign in with GitHub and approve the app once. <span class=\"sme\">confirm the sign-in button label.<\/span><\/li>\n<li>If you don't have access yet, click <strong>Request access<\/strong>. The owner gets your GitHub username.<\/li>\n<li>Accept the GitHub invite when it arrives, then reload the page.<\/li>\n<li>Pick your team's workspace, or create one.<\/li>\n<\/ol>\n<p>Teammates who join the same workspace see the same projects. Clearing the browser doesn't lose projects; sign in again and pick the same workspace.<\/p>\n<h2>Approve a Pi (owners)<\/h2>\n<ol>\n<li>Open <code>Board-Blueprints.html<\/code> and sign in with GitHub.<\/li>\n<li>Open <strong>Access<\/strong>.<\/li>\n<li>Approve the waiting Pi.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The <strong>Team space ▾<\/strong> menu shows the space name instead of the approval message.<\/li>\n<li>A saved project appears for teammates in the same space.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stuck on <strong>Waiting for owner approval<\/strong><\/td>\n<td>Ask the owner to approve the Pi under <strong>Access<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Shared file shows view-only after access was granted<\/td>\n<td>Accept the GitHub invite, then reload.<\/td>\n<\/tr>\n<tr>\n<td>Saves don't appear for others<\/td>\n<td>Check that the Pi is online; queued saves upload when it reconnects.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Treat the service address as private and don't post it publicly.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a074\">074 Keep Board Blueprints up to date<\/a><\/li>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<li><a href=\"#a081\">081 Read an OnCAFE site into Blueprints<\/a><\/li>\n<\/ul>", "text": "share projects in team spaces how to connect an aether pi or a shared blueprints file to a team space so projects save to the shared repository, and how access is approved. for team leads and anyone sharing blueprints projects.  summary team spaces let a team keep its board blueprints projects in one shared place. each team's projects and edited boards are saved in their own folder in the shared repository, and each save is recorded under the person or pi that made it. use a team space when more than one person or bench works on the same projects. before you start the blueprints service address from the owner of the shared repository, for example https://board-blueprints.example.workers.dev . on a pi: the blueprints update that adds check for updates and the service connection. see 074 keep board blueprints up to date . for people using the shared file: a github account. connect a pi to a team space on the pi, open integrations › board blueprints , then team space ▾ . enter the service address. enter a name for this pi. enter its team space, for example tampa t/s . screenshot to add: team space menu showing \"waiting for owner approval\" wait for the owner to approve the pi. the menu shows waiting for owner approval until then. an approved pi can save only to its own team space. if it's offline, saves wait on the pi and upload when it reconnects. use the shared file open board-blueprints.html . it needs internet; it loads the current release from the service. click sign in with github and approve the app once. confirm the sign-in button label. if you don't have access yet, click request access . the owner gets your github username. accept the github invite when it arrives, then reload the page. pick your team's workspace, or create one. teammates who join the same workspace see the same projects. clearing the browser doesn't lose projects; sign in again and pick the same workspace. approve a pi (owners) open board-blueprints.html and sign in with github. open access . approve the waiting pi. check that it worked the team space ▾ menu shows the space name instead of the approval message. a saved project appears for teammates in the same space. if something goes wrong symptom what to do stuck on waiting for owner approval ask the owner to approve the pi under access . shared file shows view-only after access was granted accept the github invite, then reload. saves don't appear for others check that the pi is online; queued saves upload when it reconnects. treat the service address as private and don't post it publicly. related articles 074 keep board blueprints up to date 076 what board blueprints does 081 read an oncafe site into blueprints "}, {"id": "a083", "num": "083", "title": "Log Analytics: Inspection and Product Test", "area": "Tools", "type": "Concept", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Explains the two Log Analytics modes, Inspection and Product Test, what each one needs and what it reports. For T/S, QA and engineers working with controller log bundles.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>Log Analytics reads a log bundle exported from an access controller and reports what went wrong. It has two modes. <strong>Inspection<\/strong> scans the bundle alone. <strong>Product Test<\/strong> also uses Aether's own record of what it triggered, and grades every action against what the controller logged. It works with Azure Access BLU-IC2 and Hanwha NHP-P200 controllers.<\/p>\n<h2>Where to find it<\/h2>\n<p>Open <strong class=\"path\">Reports<i>›<\/i>Log Analytics<\/strong>. Pick the mode with <strong>Inspection<\/strong> or <strong>Product Test<\/strong> at the top of the page.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Log Analytics with the Inspection / Product Test switch and the New scan card<\/span><\/div>\n<h2>Inspection<\/h2>\n<p><strong>Needs:<\/strong> the controller log bundle only (.tar.gz, .tgz, .zip, or loose CloudConnector, aspsdk or audit logs).<\/p>\n<p><strong>Reports:<\/strong> a list of findings. Each has a severity (<strong>Critical<\/strong>, <strong>High<\/strong>, <strong>Medium<\/strong>, <strong>Low<\/strong>, <strong>Info<\/strong>), a category (<strong>Cloud / MQTT<\/strong>, <strong>Door behavior<\/strong>, <strong>Delivery &amp; timing<\/strong>, <strong>Panel SDK link<\/strong>, <strong>Config / sync<\/strong>, <strong>Security<\/strong>) and sample lines with the file and line they came from. Each finding also carries a <strong>Likely cause<\/strong> and steps to check. Normal noise is labelled harmless rather than flagged.<\/p>\n<p>Use it when a customer reports a problem and you have their logs.<\/p>\n<h2>Product Test<\/h2>\n<p><strong>Needs:<\/strong> the bundle plus Aether's journal for the test. Aether always journals relay and opto changes, emulated board I/O, and card and keypad sends, and keeps the journal for 14 days.<\/p>\n<p><strong>Reports:<\/strong> every action Aether triggered, graded:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Grade<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pass<\/strong><\/td>\n<td>The controller logged the expected event within 1 s.<\/td>\n<\/tr>\n<tr>\n<td><strong>Warn<\/strong><\/td>\n<td>Logged, but after more than 1 s.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fail<\/strong><\/td>\n<td>Logged after more than 2 s, or never logged.<\/td>\n<\/tr>\n<tr>\n<td><strong>Unmapped<\/strong> / <strong>No data<\/strong><\/td>\n<td>No channel role, or no controller log for that time.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>It also lists controller events nobody triggered. The thresholds can be changed under <strong>Thresholds &amp; wiring<\/strong>.<\/p>\n<p>Use it after a scripted test run on the bench, to prove the controller saw each action in time.<\/p>\n<h2>What stays private<\/h2>\n<p>Sample text in reports and CSV exports is redacted, so tokens and keys don't leave the scanner. Treat bundles as confidential anyway: some controller logs contain secrets. The original lines can be shown one at a time with <strong>Show raw<\/strong>.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a084\">084 Scan a controller log bundle<\/a><\/li>\n<li><a href=\"#a085\">085 Grade a test run against controller logs<\/a><\/li>\n<li><a href=\"#a086\">086 Start from the reported problem and likely cause<\/a><\/li>\n<li><a href=\"#a087\">087 Show raw log lines safely<\/a><\/li>\n<li><a href=\"#a088\">088 Known harmless controller log messages<\/a><\/li>\n<\/ul>", "text": "log analytics: inspection and product test explains the two log analytics modes, inspection and product test, what each one needs and what it reports. for t/s, qa and engineers working with controller log bundles.  summary log analytics reads a log bundle exported from an access controller and reports what went wrong. it has two modes. inspection scans the bundle alone. product test also uses aether's own record of what it triggered, and grades every action against what the controller logged. it works with azure access blu-ic2 and hanwha nhp-p200 controllers. where to find it open reports › log analytics . pick the mode with inspection or product test at the top of the page. screenshot to add: log analytics with the inspection / product test switch and the new scan card inspection needs: the controller log bundle only (.tar.gz, .tgz, .zip, or loose cloudconnector, aspsdk or audit logs). reports: a list of findings. each has a severity ( critical , high , medium , low , info ), a category ( cloud / mqtt , door behavior , delivery & timing , panel sdk link , config / sync , security ) and sample lines with the file and line they came from. each finding also carries a likely cause and steps to check. normal noise is labelled harmless rather than flagged. use it when a customer reports a problem and you have their logs. product test needs: the bundle plus aether's journal for the test. aether always journals relay and opto changes, emulated board i/o, and card and keypad sends, and keeps the journal for 14 days. reports: every action aether triggered, graded: grade meaning pass the controller logged the expected event within 1 s. warn logged, but after more than 1 s. fail logged after more than 2 s, or never logged. unmapped / no data no channel role, or no controller log for that time. it also lists controller events nobody triggered. the thresholds can be changed under thresholds & wiring . use it after a scripted test run on the bench, to prove the controller saw each action in time. what stays private sample text in reports and csv exports is redacted, so tokens and keys don't leave the scanner. treat bundles as confidential anyway: some controller logs contain secrets. the original lines can be shown one at a time with show raw . related articles 084 scan a controller log bundle 085 grade a test run against controller logs 086 start from the reported problem and likely cause 087 show raw log lines safely 088 known harmless controller log messages "}, {"id": "a084", "num": "084", "title": "Scan a controller log bundle", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to scan a controller log bundle in Log Analytics (Inspection mode) and read the findings. For T/S and engineers handling a customer's controller logs.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>Inspection mode scans a log bundle exported from an Azure Access BLU-IC2 or Hanwha NHP-P200 controller and lists every anomaly it finds, sorted by severity. Use it when a site reports a problem and you have the controller's logs.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have the controller's log bundle on the computer you're using: a <code>.tar.gz<\/code>, <code>.tgz<\/code> or <code>.zip<\/code> exported from the controller, or loose CloudConnector, aspsdk or audit log files.<\/li>\n<li>Export the logs soon after the problem. The CloudConnector log rotates (10 files), so older events drop out.<\/li>\n<\/ul>\n<h2>Scan a bundle<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Reports<i>›<\/i>Log Analytics<\/strong>.<\/li>\n<li>At the top of the page, click <strong>Inspection<\/strong>.<\/li>\n<li>In the <strong>New scan<\/strong> card, drop the bundle on <strong>Drop the controller log bundle<\/strong>, or click it to choose files. You can add more than one file.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: New scan card with a bundle listed and the Scan for anomalies button<\/span><\/div>\n<ol start=\"4\">\n<li>Click <strong>Scan for anomalies<\/strong>.<\/li>\n<li>Wait while it shows <strong>Scanning…<\/strong>. A scan that takes longer than 5 minutes is stopped.<\/li>\n<\/ol>\n<p>The report opens when the scan finishes, and it is added to the <strong>Reports<\/strong> list on the left. Aether keeps the newest 30 reports.<\/p>\n<h2>Read the findings<\/h2>\n<ol>\n<li>Open the <strong>Findings<\/strong> tab.<\/li>\n<li>Narrow the list with the severity buttons (<strong>Critical<\/strong>, <strong>High<\/strong>, <strong>Medium<\/strong>, <strong>Low<\/strong>, <strong>Info<\/strong>) and the category buttons, such as <strong>Cloud / MQTT<\/strong> or <strong>Door behavior<\/strong>.<\/li>\n<li>Type in <strong>Search findings and log lines<\/strong> to find a message or a door.<\/li>\n<li>Click a finding to open it. It shows the <strong>Likely cause<\/strong>, who usually owns it (<strong>Field / T/S<\/strong> or <strong>Engineering<\/strong>), steps to check, and sample lines with their file and line number.<\/li>\n<li>Use the other tabs for context: <strong>Timeline<\/strong> for events per hour, <strong>Files &amp; coverage<\/strong> for which logs were in the bundle and the period they cover, and <strong>Panel SDK<\/strong> for the link between the Cloud Connector and the controller.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The report shows a findings count and the period the logs cover.<\/li>\n<li><strong>Files &amp; coverage<\/strong> lists the files you expected from the bundle.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Scan took longer than 5 minutes and was stopped\"<\/td>\n<td>Remove files you don't need, such as large archives, and scan again.<\/td>\n<\/tr>\n<tr>\n<td><strong>No RealTime events in this bundle<\/strong><\/td>\n<td>The bundle has no event feed for that period. Export the logs again, closer to the problem.<\/td>\n<\/tr>\n<tr>\n<td><strong>No ASP SDK trace in this bundle<\/strong><\/td>\n<td>The bundle has no aspsdk logs; the <strong>Panel SDK<\/strong> tab stays empty. The other findings still apply.<\/td>\n<\/tr>\n<tr>\n<td>An older report has no <strong>Likely cause<\/strong> or <strong>Show raw<\/strong><\/td>\n<td>Scan the bundle again; older reports don't have that data.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Treat log bundles as confidential. Some controller logs contain secrets; the report hides them in what it shows.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<li><a href=\"#a086\">086 Start from the reported problem and likely cause<\/a><\/li>\n<li><a href=\"#a087\">087 Show raw log lines safely<\/a><\/li>\n<li><a href=\"#a088\">088 Known harmless controller log messages<\/a><\/li>\n<\/ul>", "text": "scan a controller log bundle how to scan a controller log bundle in log analytics (inspection mode) and read the findings. for t/s and engineers handling a customer's controller logs.  summary inspection mode scans a log bundle exported from an azure access blu-ic2 or hanwha nhp-p200 controller and lists every anomaly it finds, sorted by severity. use it when a site reports a problem and you have the controller's logs. before you start you have the controller's log bundle on the computer you're using: a .tar.gz , .tgz or .zip exported from the controller, or loose cloudconnector, aspsdk or audit log files. export the logs soon after the problem. the cloudconnector log rotates (10 files), so older events drop out. scan a bundle open reports › log analytics . at the top of the page, click inspection . in the new scan card, drop the bundle on drop the controller log bundle , or click it to choose files. you can add more than one file. screenshot to add: new scan card with a bundle listed and the scan for anomalies button click scan for anomalies . wait while it shows scanning… . a scan that takes longer than 5 minutes is stopped. the report opens when the scan finishes, and it is added to the reports list on the left. aether keeps the newest 30 reports. read the findings open the findings tab. narrow the list with the severity buttons ( critical , high , medium , low , info ) and the category buttons, such as cloud / mqtt or door behavior . type in search findings and log lines to find a message or a door. click a finding to open it. it shows the likely cause , who usually owns it ( field / t/s or engineering ), steps to check, and sample lines with their file and line number. use the other tabs for context: timeline for events per hour, files & coverage for which logs were in the bundle and the period they cover, and panel sdk for the link between the cloud connector and the controller. check that it worked the report shows a findings count and the period the logs cover. files & coverage lists the files you expected from the bundle. if something goes wrong symptom what to do \"scan took longer than 5 minutes and was stopped\" remove files you don't need, such as large archives, and scan again. no realtime events in this bundle the bundle has no event feed for that period. export the logs again, closer to the problem. no asp sdk trace in this bundle the bundle has no aspsdk logs; the panel sdk tab stays empty. the other findings still apply. an older report has no likely cause or show raw scan the bundle again; older reports don't have that data. treat log bundles as confidential. some controller logs contain secrets; the report hides them in what it shows. related articles 083 log analytics: inspection and product test 086 start from the reported problem and likely cause 087 show raw log lines safely 088 known harmless controller log messages "}, {"id": "a085", "num": "085", "title": "Grade a test run against controller logs", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to record a test run in Aether and grade it against the controller's logs with Log Analytics Product Test. For QA and engineers running bench tests.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>Product Test compares what Aether did during a test with what the controller logged. Every relay, input, card and keypad action Aether triggered is graded <strong>Pass<\/strong>, <strong>Warn<\/strong> or <strong>Fail<\/strong> by how long the controller took to log it. Use it to prove a controller or firmware version handles a scripted test correctly.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is wired to the controller under test. See <a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a>.<\/li>\n<li>The controller's clock and time zone are set correctly. Times are matched without correcting for clock drift.<\/li>\n<li>You have a test to run: by hand, or as an AEGIS Emulation workflow.<\/li>\n<\/ul>\n<h2>Record a run<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Reports<i>›<\/i>Log Analytics<\/strong>.<\/li>\n<li>Click <strong>Product Test<\/strong>.<\/li>\n<li>In the <strong>Test recorder<\/strong> card, type a run name, for example <code>FW 1.2 door regression<\/code>.<\/li>\n<li>Click <strong>Start<\/strong>. The card shows <strong>Recording<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Test recorder card while recording, with the Stop run button<\/span><\/div>\n<ol start=\"5\">\n<li>Run your test.<\/li>\n<li>Click <strong>Stop run<\/strong>.<\/li>\n<li>Export the controller's log bundle straight away, before its logs rotate.<\/li>\n<\/ol>\n<p>Aether journals actions all the time and keeps 14 days. A named run only groups them, so you can also grade a time window you didn't name.<\/p>\n<h2>Grade the run<\/h2>\n<ol>\n<li>In <strong>New scan<\/strong>, drop the controller log bundle.<\/li>\n<li>Under <strong>Emulator journal — what Aether triggered<\/strong>, pick the source:\n   - <strong>Recorded test run<\/strong>, then pick the run.\n   - <strong>Time window<\/strong>, then set the start and end.\n   - <strong>Whatever the controller logs cover<\/strong>.\n   - <strong>Upload a journal file<\/strong>, then <strong>Choose journal<\/strong> (an <code>aether-journal-*.jsonl<\/code> exported earlier).<\/li>\n<li>Click <strong>Run Product Test<\/strong>.<\/li>\n<li>Open the <strong>Product Test<\/strong> tab.<\/li>\n<\/ol>\n<h2>Read the results<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Grade<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pass<\/strong><\/td>\n<td>Logged within 1 s.<\/td>\n<\/tr>\n<tr>\n<td><strong>Warn<\/strong><\/td>\n<td>Logged after more than 1 s.<\/td>\n<\/tr>\n<tr>\n<td><strong>Fail<\/strong><\/td>\n<td>Logged after more than 2 s, or not at all.<\/td>\n<\/tr>\n<tr>\n<td><strong>Unmapped<\/strong><\/td>\n<td>Aether doesn't know what the channel is wired to.<\/td>\n<\/tr>\n<tr>\n<td><strong>No data<\/strong><\/td>\n<td>The controller logs don't cover that moment.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Latency — Aether action → controller event<\/strong> shows how the delays spread.<\/li>\n<li><strong>Controller events nobody triggered<\/strong> lists events Aether didn't cause.<\/li>\n<li><strong>Channel roles<\/strong> shows which Aether channel it took as REX, door contact, lock or reader. Correct any wrong role and save it; saved roles appear under <strong>Thresholds &amp; wiring<\/strong> &gt; <strong>Wiring map<\/strong>.<\/li>\n<\/ul>\n<p>To change the 1 s and 2 s limits, open <strong>Thresholds &amp; wiring<\/strong>.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Many <strong>No data<\/strong> results<\/td>\n<td>The bundle doesn't cover the run. Export the logs again sooner after the test.<\/td>\n<\/tr>\n<tr>\n<td>Many <strong>Unmapped<\/strong> results<\/td>\n<td>Set the roles in <strong>Channel roles<\/strong> and save them.<\/td>\n<\/tr>\n<tr>\n<td><strong>No runs recorded yet<\/strong><\/td>\n<td>Start and stop a run in <strong>Test recorder<\/strong>, or use <strong>Time window<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<li><a href=\"#a038\">038 Build a test run from blocks (Emulation)<\/a><\/li>\n<li><a href=\"#a084\">084 Scan a controller log bundle<\/a><\/li>\n<\/ul>", "text": "grade a test run against controller logs how to record a test run in aether and grade it against the controller's logs with log analytics product test. for qa and engineers running bench tests.  summary product test compares what aether did during a test with what the controller logged. every relay, input, card and keypad action aether triggered is graded pass , warn or fail by how long the controller took to log it. use it to prove a controller or firmware version handles a scripted test correctly. before you start aether is wired to the controller under test. see 037 wire aether to an nhp or nop controller . the controller's clock and time zone are set correctly. times are matched without correcting for clock drift. you have a test to run: by hand, or as an aegis emulation workflow. record a run open reports › log analytics . click product test . in the test recorder card, type a run name, for example fw 1.2 door regression . click start . the card shows recording . screenshot to add: test recorder card while recording, with the stop run button run your test. click stop run . export the controller's log bundle straight away, before its logs rotate. aether journals actions all the time and keeps 14 days. a named run only groups them, so you can also grade a time window you didn't name. grade the run in new scan , drop the controller log bundle. under emulator journal — what aether triggered , pick the source: - recorded test run , then pick the run. - time window , then set the start and end. - whatever the controller logs cover . - upload a journal file , then choose journal (an aether-journal-*.jsonl exported earlier). click run product test . open the product test tab. read the results grade meaning pass logged within 1 s. warn logged after more than 1 s. fail logged after more than 2 s, or not at all. unmapped aether doesn't know what the channel is wired to. no data the controller logs don't cover that moment. latency — aether action → controller event shows how the delays spread. controller events nobody triggered lists events aether didn't cause. channel roles shows which aether channel it took as rex, door contact, lock or reader. correct any wrong role and save it; saved roles appear under thresholds & wiring > wiring map . to change the 1 s and 2 s limits, open thresholds & wiring . if something goes wrong symptom what to do many no data results the bundle doesn't cover the run. export the logs again sooner after the test. many unmapped results set the roles in channel roles and save them. no runs recorded yet start and stop a run in test recorder , or use time window . related articles 083 log analytics: inspection and product test 038 build a test run from blocks (emulation) 084 scan a controller log bundle "}, {"id": "a086", "num": "086", "title": "Start from the reported problem and Likely cause", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to tell Log Analytics what the customer reported, so it shows the related findings, the most likely cause and a checklist first. For T/S working a support case.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>A scan can return dozens of findings. The reported-problem picker narrows them to the evidence for the customer's complaint, puts the most likely cause first and gives a checklist for that complaint. If the logs hold nothing related, it says so. Use it to start a support case from the customer's words instead of the full findings list.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have scanned the site's controller log bundle. See <a href=\"#a084\">084 Scan a controller log bundle<\/a>.<\/li>\n<li>You know what the customer reported.<\/li>\n<\/ul>\n<h2>Pick the reported problem<\/h2>\n<ol>\n<li>Open the report in <strong class=\"path\">Reports<i>›<\/i>Log Analytics<\/strong>.<\/li>\n<li>Open the <strong>Findings<\/strong> tab.<\/li>\n<li>Under <strong>What's the reported problem?<\/strong>, pick one or more complaints: <span class=\"sme\">confirm the exact picker label and option wording on the Pi.<\/span>\n   - Controller offline\n   - Failure to connect / claim\n   - Door unlocks unexpectedly\n   - Door forced / held alarms\n   - Unknown credentials at door\n   - Valid user denied\n   - Reader offline / not reading\n   - Events missing or late in the cloud\n   - Settings / sync not applied\n   - Tamper / security concern<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: reported-problem panel with &quot;Door unlocks unexpectedly&quot; picked, showing the likely cause and checklist<\/span><\/div>\n<ol start=\"4\">\n<li>Read the panel for each complaint:\n   - how many findings relate to it;\n   - the most likely cause and who owns it (<strong>Field / T/S<\/strong>, <strong>Engineering<\/strong>, or <strong>Field / T/S → Engineering<\/strong>);\n   - a checklist for that complaint.<\/li>\n<li>Click the likely cause to jump to its finding.<\/li>\n<\/ol>\n<p>By default the list shows only related findings. Untick the option to see everything again.<\/p>\n<h2>Use the likely cause<\/h2>\n<p>Each finding opens with a <strong>Likely cause<\/strong> banner:<\/p>\n<ul>\n<li><strong>likely<\/strong> means evidence in this bundle points there; <strong>possible<\/strong> means a common cause that the logs don't prove.<\/li>\n<li>The owner says who should act: site, wiring, network or configuration problems go to <strong>Field / T/S<\/strong>; firmware or cloud defects go to <strong>Engineering<\/strong>.<\/li>\n<li>The numbered steps are ordered most likely first.<\/li>\n<\/ul>\n<p>Filter the list by owner with <strong>Everyone<\/strong>, <strong>T/S<\/strong> or <strong>Engineering<\/strong>. <span class=\"sme\">confirm the owner filter labels.<\/span><\/p>\n<h2>Narrow by date<\/h2>\n<p>Use the date filter to see only recent anomalies: all dates, the last 24 h, 7 days or 30 days of the log, or a custom range. Sort by <strong>Newest first<\/strong> or by severity. The ranges count back from the end of the log, not from today.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The panel says the logs hold no evidence<\/td>\n<td>Check the period the logs cover in <strong>Files &amp; coverage<\/strong>. If the problem happened outside it, export the logs again.<\/td>\n<\/tr>\n<tr>\n<td>No picker on an older report<\/td>\n<td>Scan the bundle again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a084\">084 Scan a controller log bundle<\/a><\/li>\n<li><a href=\"#a087\">087 Show raw log lines safely<\/a><\/li>\n<li><a href=\"#a088\">088 Known harmless controller log messages<\/a><\/li>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<\/ul>", "text": "start from the reported problem and likely cause how to tell log analytics what the customer reported, so it shows the related findings, the most likely cause and a checklist first. for t/s working a support case.  summary a scan can return dozens of findings. the reported-problem picker narrows them to the evidence for the customer's complaint, puts the most likely cause first and gives a checklist for that complaint. if the logs hold nothing related, it says so. use it to start a support case from the customer's words instead of the full findings list. before you start you have scanned the site's controller log bundle. see 084 scan a controller log bundle . you know what the customer reported. pick the reported problem open the report in reports › log analytics . open the findings tab. under what's the reported problem? , pick one or more complaints: confirm the exact picker label and option wording on the pi. - controller offline - failure to connect / claim - door unlocks unexpectedly - door forced / held alarms - unknown credentials at door - valid user denied - reader offline / not reading - events missing or late in the cloud - settings / sync not applied - tamper / security concern screenshot to add: reported-problem panel with \"door unlocks unexpectedly\" picked, showing the likely cause and checklist read the panel for each complaint: - how many findings relate to it; - the most likely cause and who owns it ( field / t/s , engineering , or field / t/s → engineering ); - a checklist for that complaint. click the likely cause to jump to its finding. by default the list shows only related findings. untick the option to see everything again. use the likely cause each finding opens with a likely cause banner: likely means evidence in this bundle points there; possible means a common cause that the logs don't prove. the owner says who should act: site, wiring, network or configuration problems go to field / t/s ; firmware or cloud defects go to engineering . the numbered steps are ordered most likely first. filter the list by owner with everyone , t/s or engineering . confirm the owner filter labels. narrow by date use the date filter to see only recent anomalies: all dates, the last 24 h, 7 days or 30 days of the log, or a custom range. sort by newest first or by severity. the ranges count back from the end of the log, not from today. if something goes wrong symptom what to do the panel says the logs hold no evidence check the period the logs cover in files & coverage . if the problem happened outside it, export the logs again. no picker on an older report scan the bundle again. related articles 084 scan a controller log bundle 087 show raw log lines safely 088 known harmless controller log messages 083 log analytics: inspection and product test "}, {"id": "a087", "num": "087", "title": "Show raw log lines safely", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How to view the original controller log line behind a Log Analytics finding with Show raw, and how lines with secrets are protected. For T/S and engineers who need the exact log text.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>Finding samples in Log Analytics are redacted, so tokens and keys don't show. When you need the exact text, <strong>Show raw<\/strong> opens the original log line with its line number and 3 lines of context either side. Use it to confirm a finding or to copy the exact line into a ticket for Engineering.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The report was scanned with a version of Log Analytics that keeps raw lines. Older reports have none; scan the bundle again.<\/li>\n<li><strong>Show raw<\/strong> is turned on. It can be turned off under <strong>Thresholds &amp; wiring<\/strong>. <span class=\"sme\">confirm the label of the Show raw on/off setting.<\/span><\/li>\n<\/ul>\n<h2>Show a raw line<\/h2>\n<ol>\n<li>Open the report in <strong class=\"path\">Reports<i>›<\/i>Log Analytics<\/strong>.<\/li>\n<li>Open the <strong>Findings<\/strong> tab and click a finding.<\/li>\n<li>Find the sample you want. Each sample shows its source file and line number.<\/li>\n<li>Click <strong>Show raw<\/strong> next to it.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: a finding sample expanded with Show raw, showing line numbers and the copy button<\/span><\/div>\n<ol start=\"5\">\n<li>Read the line in context. The original line is highlighted between the lines before and after it.<\/li>\n<li>To copy it, click the copy button.<\/li>\n<\/ol>\n<h2>Lines that contain secrets<\/h2>\n<p>Some controller logs write tokens or passwords in plain text. When a raw line contains one:<\/p>\n<ul>\n<li>a warning appears above the line;<\/li>\n<li>the line hides itself again after 60 s.<\/li>\n<\/ul>\n<p>Don't paste such a line into an email, chat or ticket. Copy only the part you need, and leave the secret out.<\/p>\n<h2>What is stored where<\/h2>\n<ul>\n<li>Reports and CSV exports hold only the redacted text.<\/li>\n<li>The raw lines are kept in a separate file on the Pi that only Aether can read, and are deleted with the report.<\/li>\n<li>A raw line is sent to your browser only when you click <strong>Show raw<\/strong>, and each reveal is logged.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The raw line matches the redacted sample, with the masked parts shown.<\/li>\n<li>The file name and line number match the sample.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>Show raw<\/strong> button<\/td>\n<td>The sample has no file and line, the report is too old (scan again), or <strong>Show raw<\/strong> is turned off.<\/td>\n<\/tr>\n<tr>\n<td>The line disappeared<\/td>\n<td>It contained a secret and hid after 60 s. Click <strong>Show raw<\/strong> again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a084\">084 Scan a controller log bundle<\/a><\/li>\n<li><a href=\"#a086\">086 Start from the reported problem and likely cause<\/a><\/li>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<\/ul>", "text": "show raw log lines safely how to view the original controller log line behind a log analytics finding with show raw, and how lines with secrets are protected. for t/s and engineers who need the exact log text.  summary finding samples in log analytics are redacted, so tokens and keys don't show. when you need the exact text, show raw opens the original log line with its line number and 3 lines of context either side. use it to confirm a finding or to copy the exact line into a ticket for engineering. before you start the report was scanned with a version of log analytics that keeps raw lines. older reports have none; scan the bundle again. show raw is turned on. it can be turned off under thresholds & wiring . confirm the label of the show raw on/off setting. show a raw line open the report in reports › log analytics . open the findings tab and click a finding. find the sample you want. each sample shows its source file and line number. click show raw next to it. screenshot to add: a finding sample expanded with show raw, showing line numbers and the copy button read the line in context. the original line is highlighted between the lines before and after it. to copy it, click the copy button. lines that contain secrets some controller logs write tokens or passwords in plain text. when a raw line contains one: a warning appears above the line; the line hides itself again after 60 s. don't paste such a line into an email, chat or ticket. copy only the part you need, and leave the secret out. what is stored where reports and csv exports hold only the redacted text. the raw lines are kept in a separate file on the pi that only aether can read, and are deleted with the report. a raw line is sent to your browser only when you click show raw , and each reveal is logged. check that it worked the raw line matches the redacted sample, with the masked parts shown. the file name and line number match the sample. if something goes wrong symptom what to do no show raw button the sample has no file and line, the report is too old (scan again), or show raw is turned off. the line disappeared it contained a secret and hid after 60 s. click show raw again. related articles 084 scan a controller log bundle 086 start from the reported problem and likely cause 083 log analytics: inspection and product test "}, {"id": "a088", "num": "088", "title": "Known harmless controller log messages", "area": "Tools", "type": "Reference", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Reference list of controller log messages that Log Analytics treats as normal noise, and what each one means. For T/S and engineers reading controller logs.", "sources": ["claude/log-analytics.md (via Aether analytics logs anomaly scanner)", "Aether analytics logs anomaly scanner"], "html": "<h2>Summary<\/h2>\n<p>Controller logs contain messages that look like errors but are part of normal operation. Log Analytics labels these as harmless instead of raising them as problems. Use this list when you read a raw log by hand, or to explain to a customer why a message they spotted is not the cause.<\/p>\n<h2>Harmless messages<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Message (as logged)<\/th>\n<th>Controller<\/th>\n<th>Why it is harmless<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>Automation triggered failed<\/code><\/td>\n<td>Azure Access BLU-IC2<\/td>\n<td>No automations are configured, so every event logs an empty trigger lookup. Can appear hundreds of times.<\/td>\n<td>Nothing.<\/td>\n<\/tr>\n<tr>\n<td><code>checkNUpdateDoorFPISchedule<\/code> at ERROR level<\/td>\n<td>Azure Access BLU-IC2<\/td>\n<td>Normal door schedule evaluation logged at the wrong level.<\/td>\n<td>Nothing on site.<\/td>\n<\/tr>\n<tr>\n<td><code>Pending for Camera Platform Package Update<\/code><\/td>\n<td>Azure Access BLU-IC2<\/td>\n<td>A status message, not a failure. <span class=\"sme\">confirm the meaning of this message.<\/span><\/td>\n<td>Nothing.<\/td>\n<\/tr>\n<tr>\n<td><code>Offline Event: Number of rows<\/code><\/td>\n<td>Azure Access BLU-IC2<\/td>\n<td>Behaves like a row counter when the offline event database is small, not a backlog.<\/td>\n<td>Nothing, unless the number keeps rising while the controller is online.<\/td>\n<\/tr>\n<tr>\n<td>Reader offline for less than 5 s, at the same time each night<\/td>\n<td>Hanwha NHP-P200<\/td>\n<td>A nightly reader re-initialisation. Shown as low severity with a time-of-day note.<\/td>\n<td>Nothing, unless it also happens during the day.<\/td>\n<\/tr>\n<tr>\n<td>Serial number skips in the event feed<\/td>\n<td>Both<\/td>\n<td>Event classes the connector isn't subscribed to.<\/td>\n<td>Nothing. A serial that goes backwards is a replay after a reconnect.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"sme\">confirm the exact NHP-P200 message text for the short reader offline blip.<\/span><\/p>\n<h2>Messages that look harmless but aren't<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Pattern<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A door re-reported \"open\" at exactly the same time on several days<\/td>\n<td>Usually a door schedule. Check the schedules synced to that door.<\/td>\n<\/tr>\n<tr>\n<td>Permissions point to floors that aren't set up<\/td>\n<td>The access profiles include floors, but no elevator is configured on that controller. Remove the floors or configure the elevator.<\/td>\n<\/tr>\n<tr>\n<td>A reader setting points to an I/O port that doesn't exist<\/td>\n<td>Reader and I/O configuration are out of step. Re-select the reader's I/O port in the cloud and re-sync.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a084\">084 Scan a controller log bundle<\/a><\/li>\n<li><a href=\"#a086\">086 Start from the reported problem and likely cause<\/a><\/li>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<\/ul>", "text": "known harmless controller log messages reference list of controller log messages that log analytics treats as normal noise, and what each one means. for t/s and engineers reading controller logs.  summary controller logs contain messages that look like errors but are part of normal operation. log analytics labels these as harmless instead of raising them as problems. use this list when you read a raw log by hand, or to explain to a customer why a message they spotted is not the cause. harmless messages message (as logged) controller why it is harmless what to do automation triggered failed azure access blu-ic2 no automations are configured, so every event logs an empty trigger lookup. can appear hundreds of times. nothing. checknupdatedoorfpischedule at error level azure access blu-ic2 normal door schedule evaluation logged at the wrong level. nothing on site. pending for camera platform package update azure access blu-ic2 a status message, not a failure. confirm the meaning of this message. nothing. offline event: number of rows azure access blu-ic2 behaves like a row counter when the offline event database is small, not a backlog. nothing, unless the number keeps rising while the controller is online. reader offline for less than 5 s, at the same time each night hanwha nhp-p200 a nightly reader re-initialisation. shown as low severity with a time-of-day note. nothing, unless it also happens during the day. serial number skips in the event feed both event classes the connector isn't subscribed to. nothing. a serial that goes backwards is a replay after a reconnect. confirm the exact nhp-p200 message text for the short reader offline blip. messages that look harmless but aren't pattern why it matters a door re-reported \"open\" at exactly the same time on several days usually a door schedule. check the schedules synced to that door. permissions point to floors that aren't set up the access profiles include floors, but no elevator is configured on that controller. remove the floors or configure the elevator. a reader setting points to an i/o port that doesn't exist reader and i/o configuration are out of step. re-select the reader's i/o port in the cloud and re-sync. related articles 084 scan a controller log bundle 086 start from the reported problem and likely cause 083 log analytics: inspection and product test "}, {"id": "a089", "num": "089", "title": "Reports: Audit, System and Emulation logs", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to view, filter, refresh and clear Aether's own Audit, System and Emulation logs on the Reports page. For anyone checking what Aether did during a test.", "sources": ["Aether product QA testing", "Aether analytics logs anomaly scanner", "Access Controls tabs layout"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Reports<\/strong> page holds Aether's own logs. <strong>Audit<\/strong> records card reads, access and configuration changes; <strong>System<\/strong> records I/O, serial and error messages; <strong>Emulation<\/strong> records workflow steps and results. The logs are kept on the Pi, so they survive a page reload and every browser sees the same entries. Use them to check what Aether did and when during a test.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is open in a browser and connected to the Pi.<\/li>\n<\/ul>\n<h2>View a log<\/h2>\n<ol>\n<li>In the sidebar, click <strong class=\"path\">Reports<i>›<\/i>Audit<\/strong>, <strong class=\"path\">Reports<i>›<\/i>System<\/strong> or <strong class=\"path\">Reports<i>›<\/i>Emulation<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Reports &gt; Audit with the log table and filters<\/span><\/div>\n<ol start=\"2\">\n<li>Read the table. The newest entries are first.<\/li>\n<li>Use the page controls at the bottom to move through older entries.<\/li>\n<\/ol>\n<h2>Filter a log<\/h2>\n<ol>\n<li>Set the date filter. <strong>Today<\/strong> is selected by default; widen it if you're looking for older entries. <span class=\"sme\">confirm the date filter options.<\/span><\/li>\n<li>Pick a level to show only errors or warnings. Warnings are counted in the summary at the top.<\/li>\n<li>Pick a <strong>Type<\/strong>. The list only offers types that appear in the log you're viewing.<\/li>\n<li>Type in the search box to find a door, card number or message. <span class=\"sme\">confirm the search box exists and its label.<\/span><\/li>\n<\/ol>\n<p>Changing any filter takes you back to page 1.<\/p>\n<h2>Refresh and clear<\/h2>\n<ul>\n<li>Click <strong>Refresh<\/strong> to load the latest entries from the Pi.<\/li>\n<li>Click <strong>Clear<\/strong> to empty the log you're viewing.<\/li>\n<\/ul>\n<p class=\"caution\"><strong>Caution:<\/strong> <strong>Clear<\/strong> deletes the Pi's copy of that log for every browser, not just yours. It cannot be undone. Export or note anything you need first. <span class=\"sme\">confirm whether the page offers an export of Audit, System and Emulation logs.<\/span><\/p>\n<h2>How much is kept<\/h2>\n<p>The Pi keeps up to 5000 entries for each of the Audit, System and Emulation logs. When a log is full, the oldest entries are dropped.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>After a reload, the same entries are still there.<\/li>\n<li>A card read or door action you just made appears at the top of <strong>Audit<\/strong> after <strong>Refresh<\/strong>.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The table is empty<\/td>\n<td>Widen the date filter from <strong>Today<\/strong>, and clear the <strong>Type<\/strong> and level filters.<\/td>\n<\/tr>\n<tr>\n<td>An error appears above the table<\/td>\n<td>The page couldn't load the Pi's copy. Check that the backend is running; see <a href=\"#a092\">092 Aether won't load or shows Backend offline<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>New entries don't appear<\/td>\n<td>Click <strong>Refresh<\/strong>. Entries are sent to the Pi every few seconds.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a083\">083 Log Analytics: Inspection and Product Test<\/a><\/li>\n<li><a href=\"#a039\">039 Run, pause and schedule a workflow<\/a><\/li>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<\/ul>", "text": "reports: audit, system and emulation logs how to view, filter, refresh and clear aether's own audit, system and emulation logs on the reports page. for anyone checking what aether did during a test.  summary the reports page holds aether's own logs. audit records card reads, access and configuration changes; system records i/o, serial and error messages; emulation records workflow steps and results. the logs are kept on the pi, so they survive a page reload and every browser sees the same entries. use them to check what aether did and when during a test. before you start aether is open in a browser and connected to the pi. view a log in the sidebar, click reports › audit , reports › system or reports › emulation . screenshot to add: reports > audit with the log table and filters read the table. the newest entries are first. use the page controls at the bottom to move through older entries. filter a log set the date filter. today is selected by default; widen it if you're looking for older entries. confirm the date filter options. pick a level to show only errors or warnings. warnings are counted in the summary at the top. pick a type . the list only offers types that appear in the log you're viewing. type in the search box to find a door, card number or message. confirm the search box exists and its label. changing any filter takes you back to page 1. refresh and clear click refresh to load the latest entries from the pi. click clear to empty the log you're viewing. caution: clear deletes the pi's copy of that log for every browser, not just yours. it cannot be undone. export or note anything you need first. confirm whether the page offers an export of audit, system and emulation logs. how much is kept the pi keeps up to 5000 entries for each of the audit, system and emulation logs. when a log is full, the oldest entries are dropped. check that it worked after a reload, the same entries are still there. a card read or door action you just made appears at the top of audit after refresh . if something goes wrong symptom what to do the table is empty widen the date filter from today , and clear the type and level filters. an error appears above the table the page couldn't load the pi's copy. check that the backend is running; see 092 aether won't load or shows backend offline . new entries don't appear click refresh . entries are sent to the pi every few seconds. related articles 083 log analytics: inspection and product test 039 run, pause and schedule a workflow 004 find your way around: sidebar, page tabs, last page "}, {"id": "a090", "num": "090", "title": "Open OSDP Academy and use Live mode", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P3", "status": "Draft", "brief": "How to open OSDP Academy from Aether and use Live mode to follow Readers > OSDP Trace in the Academy. For anyone using the Academy with live traffic from a bench.", "sources": ["claude/osdp-academy.md (via Access devices enrollment and AETHER device communication features)", "Access devices enrollment", "AETHER device communication features"], "html": "<h2>Summary<\/h2>\n<p>OSDP Academy is a training page that runs inside Aether. Its Live mode follows <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> as it happens, so frames from your bench appear in the Academy as they are captured. Live mode only reads the trace; it never sends anything to the RS-485 bus.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>OSDP traffic reaches <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>: from Aether's reader emulation, from Controller Emulator boards, or from a capture.<\/li>\n<li><strong>Caution:<\/strong> OSDP Trace's <strong>Passive capture<\/strong> also polls the bus. On a live panel bus, use a separate tap instead.<\/li>\n<\/ul>\n<h2>Open OSDP Academy<\/h2>\n<ol>\n<li>In the sidebar, click <strong class=\"path\">Tools<i>›<\/i>OSDP Academy<\/strong>.<\/li>\n<li>Wait for the Academy home page. It follows Aether's Dark/Light theme.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: OSDP Academy home page inside Aether with the &quot;Live from Aether&quot; card<\/span><\/div>\n<p>The same page is at <code>http://&lt;pi-ip&gt;:3001/osdp-training/<\/code> if you want it in its own browser tab.<\/p>\n<h2>Start Live mode<\/h2>\n<ol>\n<li>On the home page, click the <strong>Live from Aether<\/strong> card. It opens the <strong>Aether integration<\/strong> page.<\/li>\n<li>Click <strong>Start live<\/strong>.<\/li>\n<li>Watch the <strong>Status<\/strong> and <strong>Frames received<\/strong> counters.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Aether integration page with Status &quot;live&quot;, Frames received counting and the Start live / Stop live button<\/span><\/div>\n<ol start=\"4\">\n<li>Make some traffic, for example present a card on an emulated OSDP reader. The frames appear in the Academy.<\/li>\n<li>Click <strong>Stop live<\/strong> when you're done.<\/li>\n<\/ol>\n<p>The Academy keeps the frames it has received after you stop, and also if the trace is cleared on the Pi.<\/p>\n<h2>What Live mode reads<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Read<\/th>\n<th>Not touched<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A snapshot of <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> to find where to start<\/td>\n<td>Reader emulation, the sniffer and the Controller Emulator<\/td>\n<\/tr>\n<tr>\n<td>Each new trace frame as the Pi captures it<\/td>\n<td>Anything that sends on the bus<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If the live connection can't be made, the Academy reads the trace every 2 s instead. The status then shows <strong>Live (polling)<\/strong>.<\/p>\n<h2>Open the Academy outside Aether<\/h2>\n<p>If you open the Academy page from another server, enter the Aether address on the <strong>Aether integration<\/strong> page, for example <code>http://&lt;pi-ip&gt;:3001<\/code>. Click <strong>Save<\/strong>, then <strong>Test connection<\/strong>, then <strong>Start live<\/strong>. Inside Aether this field stays empty.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Frames received<\/strong> stays at 0<\/td>\n<td>Check that frames appear in <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>. If none do, the bus has no traffic for Ae
