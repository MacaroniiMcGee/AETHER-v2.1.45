ther to trace.<\/td>\n<\/tr>\n<tr>\n<td>Status stays at <strong>Connecting…<\/strong><\/td>\n<td>Click <strong>Test connection<\/strong>. Check the Aether address if the page is opened outside Aether.<\/td>\n<\/tr>\n<tr>\n<td>The menu entry is missing or shows an old page<\/td>\n<td>See <a href=\"#a093\">093 A tool page still shows the old version<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a018\">018 OSDP Trace tabs: Conversation, Readers, Timeline, Tests<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<\/ul>", "text": "open osdp academy and use live mode how to open osdp academy from aether and use live mode to follow readers > osdp trace in the academy. for anyone using the academy with live traffic from a bench.  summary osdp academy is a training page that runs inside aether. its live mode follows readers › osdp trace as it happens, so frames from your bench appear in the academy as they are captured. live mode only reads the trace; it never sends anything to the rs-485 bus. before you start osdp traffic reaches readers › osdp trace : from aether's reader emulation, from controller emulator boards, or from a capture. caution: osdp trace's passive capture also polls the bus. on a live panel bus, use a separate tap instead. open osdp academy in the sidebar, click tools › osdp academy . wait for the academy home page. it follows aether's dark/light theme. screenshot to add: osdp academy home page inside aether with the \"live from aether\" card the same page is at http://<pi-ip>:3001/osdp-training/ if you want it in its own browser tab. start live mode on the home page, click the live from aether card. it opens the aether integration page. click start live . watch the status and frames received counters. screenshot to add: aether integration page with status \"live\", frames received counting and the start live / stop live button make some traffic, for example present a card on an emulated osdp reader. the frames appear in the academy. click stop live when you're done. the academy keeps the frames it has received after you stop, and also if the trace is cleared on the pi. what live mode reads read not touched a snapshot of readers › osdp trace to find where to start reader emulation, the sniffer and the controller emulator each new trace frame as the pi captures it anything that sends on the bus if the live connection can't be made, the academy reads the trace every 2 s instead. the status then shows live (polling) . open the academy outside aether if you open the academy page from another server, enter the aether address on the aether integration page, for example http://<pi-ip>:3001 . click save , then test connection , then start live . inside aether this field stays empty. if something goes wrong symptom what to do frames received stays at 0 check that frames appear in readers › osdp trace . if none do, the bus has no traffic for aether to trace. status stays at connecting… click test connection . check the aether address if the page is opened outside aether. the menu entry is missing or shows an old page see 093 a tool page still shows the old version . related articles 017 read a conversation in osdp trace 018 osdp trace tabs: conversation, readers, timeline, tests 010 present a card or pin on an emulated osdp reader "}, {"id": "a091", "num": "091", "title": "Open KB Studio from Aether", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How to open KB Studio from Aether, connect it to the KB Studio service the first time, and sign in to edit. For anyone who reads or writes Aether and OnCAFE knowledge-base articles.", "sources": ["OnCAFE knowledge base tool"], "html": "<h2>Summary<\/h2>\n<p>KB Studio is the editor for the knowledge base. Aether opens it under <strong class=\"path\">Tools<i>›<\/i>KB Studio<\/strong>, so you can read articles beside the feature you're testing and edit them if you have access. Everyone can read without signing in; editing needs a GitHub account with access to the knowledge-base repository.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Pi's browser can reach the internet. KB Studio loads from a cloud service.<\/li>\n<li>For the first open on a computer: the KB Studio service address from the knowledge-base owner, for example <code>https://kb-studio.example.workers.dev<\/code>. You may not need it; the owner can build it into Aether.<\/li>\n<li>To edit: a GitHub account.<\/li>\n<\/ul>\n<h2>Open KB Studio<\/h2>\n<ol>\n<li>In the sidebar, click <strong class=\"path\">Tools<i>›<\/i>KB Studio<\/strong>.<\/li>\n<li>If a <strong>Connect KB Studio<\/strong> box appears, paste the service address and click <strong>Open KB Studio<\/strong>. You only do this once on each computer.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Connect KB Studio box asking for the service address<\/span><\/div>\n<ol start=\"3\">\n<li>Wait for KB Studio to load. You can read every article straight away.<\/li>\n<\/ol>\n<p>If KB Studio doesn't appear inside Aether, use the <strong>open it in a new tab<\/strong> link on the loading message.<\/p>\n<h2>Sign in to edit<\/h2>\n<ol>\n<li>In KB Studio, click <strong>Sign in with GitHub<\/strong>.<\/li>\n<li>Approve the KB Studio app once.<\/li>\n<li>If you don't have access yet, the <strong>Request access<\/strong> screen appears. Click <strong>Send request<\/strong>.<\/li>\n<li>Accept the GitHub invite that arrives by email. Until you do, KB Studio shows you as view-only.<\/li>\n<li>Reload KB Studio. You can now edit, save to GitHub and submit for review.<\/li>\n<\/ol>\n<p>Your sign-in is stored only in your own browser. It expires after 8 hours and renews by itself. <strong>Sign out<\/strong> removes it.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Articles load in KB Studio inside Aether.<\/li>\n<li>After signing in with access, the editing controls are available.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Connect KB Studio<\/strong> says to enter the full address<\/td>\n<td>Paste the complete <code>https://<\/code> address from the owner.<\/td>\n<\/tr>\n<tr>\n<td>KB Studio shows \"not available\"<\/td>\n<td>The service isn't set up yet. Ask the knowledge-base owner.<\/td>\n<\/tr>\n<tr>\n<td>Still view-only after access was granted<\/td>\n<td>Accept the GitHub invite, then reload.<\/td>\n<\/tr>\n<tr>\n<td>No <strong>KB Studio<\/strong> entry under <strong>Tools<\/strong><\/td>\n<td>Install the Aether update that adds it. See <a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Screen capture doesn't work inside Aether<\/td>\n<td>Capture needs HTTPS. Open Aether by its HTTPS name, or open KB Studio in a new tab. See <a href=\"#a007\">007 Set up HTTPS and a domain name<\/a>. <span class=\"sme\">confirm in-tool capture works under Tools &gt; KB Studio over HTTPS.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<\/ul>", "text": "open kb studio from aether how to open kb studio from aether, connect it to the kb studio service the first time, and sign in to edit. for anyone who reads or writes aether and oncafe knowledge-base articles.  summary kb studio is the editor for the knowledge base. aether opens it under tools › kb studio , so you can read articles beside the feature you're testing and edit them if you have access. everyone can read without signing in; editing needs a github account with access to the knowledge-base repository. before you start the pi's browser can reach the internet. kb studio loads from a cloud service. for the first open on a computer: the kb studio service address from the knowledge-base owner, for example https://kb-studio.example.workers.dev . you may not need it; the owner can build it into aether. to edit: a github account. open kb studio in the sidebar, click tools › kb studio . if a connect kb studio box appears, paste the service address and click open kb studio . you only do this once on each computer. screenshot to add: connect kb studio box asking for the service address wait for kb studio to load. you can read every article straight away. if kb studio doesn't appear inside aether, use the open it in a new tab link on the loading message. sign in to edit in kb studio, click sign in with github . approve the kb studio app once. if you don't have access yet, the request access screen appears. click send request . accept the github invite that arrives by email. until you do, kb studio shows you as view-only. reload kb studio. you can now edit, save to github and submit for review. your sign-in is stored only in your own browser. it expires after 8 hours and renews by itself. sign out removes it. check that it worked articles load in kb studio inside aether. after signing in with access, the editing controls are available. if something goes wrong symptom what to do connect kb studio says to enter the full address paste the complete https:// address from the owner. kb studio shows \"not available\" the service isn't set up yet. ask the knowledge-base owner. still view-only after access was granted accept the github invite, then reload. no kb studio entry under tools install the aether update that adds it. see 066 install an aether update (device firmware) . screen capture doesn't work inside aether capture needs https. open aether by its https name, or open kb studio in a new tab. see 007 set up https and a domain name . confirm in-tool capture works under tools > kb studio over https. related articles 004 find your way around: sidebar, page tabs, last page 066 install an aether update (device firmware) 007 set up https and a domain name "}, {"id": "a092", "num": "092", "title": "Aether won't load or shows Backend offline", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Draft", "brief": "For anyone who can't open Aether or sees Backend offline: how to check, restart and enable the aether-backend service and spot a second backend.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool", "chat: Starting aether-frontend service"], "html": "<h2>Summary<\/h2>\n<p>Use this article when Aether doesn't open in the browser or a page shows <strong>Backend offline<\/strong> or <strong>Disconnected<\/strong>. The web app is served by the <code>aether-backend<\/code> service on port 3001. If that service is stopped, crashed or running twice, the pages can't load or can't get live data.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>The browser can't reach <code>http://&lt;pi-ip&gt;:3001<\/code> at all.<\/li>\n<li>The page loads but shows <strong>Backend offline<\/strong>, or <strong>Disconnected<\/strong> at the top right.<\/li>\n<li>Pages load but no live states appear (relays, inputs, readers).<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The backend restarted (for example after an update) and the page lost its live connection.<\/li>\n<li><code>aether-backend<\/code> is stopped or keeps crashing.<\/li>\n<li>A second backend was started by hand, so two copies fight over port 3001, the HAT and the serial ports.<\/li>\n<li>You're using the wrong address or port, or the Pi's address changed.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Check the address in the browser bar. It should be <code>http://&lt;pi-ip&gt;:3001<\/code> (or your HTTPS name).<\/li>\n<li>If the page shows <strong>Disconnected<\/strong>, press <strong>Connect<\/strong> or refresh the page. This often follows a backend restart.<\/li>\n<li>Open a terminal on the Pi (SSH or the desktop) and check both services:<\/li>\n<\/ol>\n<p><code>bash\n   systemctl is-active aether-backend aether-stream<\/code><\/p>\n<ol start=\"4\">\n<li>Check that the backend answers:<\/li>\n<\/ol>\n<p><code>bash\n   curl -s --max-time 5 localhost:3001/api/health; echo<\/code><\/p>\n<ol start=\"5\">\n<li>Check that exactly one backend is running. You should see one line, user <code>aether<\/code>:<\/li>\n<\/ol>\n<p><code>bash\n   ps -o pid,user,cmd -C node | grep server.js<\/code><\/p>\n<ol start=\"6\">\n<li><strong>Caution:<\/strong> restarting the backend stops door, reader and emulator activity for a few seconds, and cuts any reader firmware upload in progress. Check that no upload is running, then restart:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-backend<\/code><\/p>\n<ol start=\"7\">\n<li>Wait about 10 s, then refresh the browser.<\/li>\n<li>If the backend doesn't start at boot, enable it:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl enable aether-backend<\/code><\/p>\n<p>Don't start the backend by hand with <code>node server.js<\/code>. That creates a second copy next to the service.<\/p>\n<h2>Still stuck<\/h2>\n<p>Collect this and send it to the Aether team:<\/p>\n<pre><code class=\"language-bash\">{\n  systemctl status aether-backend --no-pager\n  ps -o pid,user,etime,cmd -C node\n  sudo journalctl -u aether-backend -n 120 --no-pager\n} &gt; ~/backend-offline-$(date +%F-%H%M).txt 2&gt;&amp;1\n<\/code><\/pre>\n<p>Also note the exact address you opened and a screenshot of the page.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a099\">099 VMS shows a black tile or Backend offline<\/a><\/li>\n<li><a href=\"#a101\">101 Lost access after a network change<\/a><\/li>\n<\/ul>", "text": "aether won't load or shows backend offline for anyone who can't open aether or sees backend offline: how to check, restart and enable the aether-backend service and spot a second backend.  summary use this article when aether doesn't open in the browser or a page shows backend offline or disconnected . the web app is served by the aether-backend service on port 3001. if that service is stopped, crashed or running twice, the pages can't load or can't get live data. symptoms the browser can't reach http://<pi-ip>:3001 at all. the page loads but shows backend offline , or disconnected at the top right. pages load but no live states appear (relays, inputs, readers). likely causes the backend restarted (for example after an update) and the page lost its live connection. aether-backend is stopped or keeps crashing. a second backend was started by hand, so two copies fight over port 3001, the hat and the serial ports. you're using the wrong address or port, or the pi's address changed. fix it check the address in the browser bar. it should be http://<pi-ip>:3001 (or your https name). if the page shows disconnected , press connect or refresh the page. this often follows a backend restart. open a terminal on the pi (ssh or the desktop) and check both services: bash systemctl is-active aether-backend aether-stream check that the backend answers: bash curl -s --max-time 5 localhost:3001/api/health; echo check that exactly one backend is running. you should see one line, user aether : bash ps -o pid,user,cmd -c node | grep server.js caution: restarting the backend stops door, reader and emulator activity for a few seconds, and cuts any reader firmware upload in progress. check that no upload is running, then restart: bash sudo systemctl restart aether-backend wait about 10 s, then refresh the browser. if the backend doesn't start at boot, enable it: bash sudo systemctl enable aether-backend don't start the backend by hand with node server.js . that creates a second copy next to the service. still stuck collect this and send it to the aether team: { systemctl status aether-backend --no-pager ps -o pid,user,etime,cmd -c node sudo journalctl -u aether-backend -n 120 --no-pager } > ~/backend-offline-$(date +%f-%h%m).txt 2>&1 also note the exact address you opened and a screenshot of the page. related articles 003 open aether in a browser 072 system & backup: health, backup and restore 099 vms shows a black tile or backend offline 101 lost access after a network change "}, {"id": "a093", "num": "093", "title": "A tool page still shows the old version", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "For users who installed an update or replaced a tool page but still see the old one: clearing the browser and frame cache and checking the dist copy on the Pi.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Some tools, such as the <strong>OnCAFE Console<\/strong> builder, are standalone pages that Aether shows inside a frame. After you install an update or replace one of these pages, the browser can keep showing its saved copy. This article shows how to get the new version on screen.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>After an update, a tool page looks exactly as it did before.<\/li>\n<li>The rest of Aether shows the change, but one tool inside a frame doesn't.<\/li>\n<li>A different computer or a private window shows the new version.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The browser is showing a cached copy of the page. <span class=\"sme\">confirm how long tool pages are cached and whether a later update made the Pi tell browsers to always recheck HTML pages.<\/span><\/li>\n<li>A normal refresh of the app didn't reload the page inside the frame.<\/li>\n<li>The new page was copied into <code>frontend/public<\/code> but not into <code>frontend/dist<\/code>, which is what port 3001 serves.<\/li>\n<li>The new file has a different name from the one the page loads.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Press <strong>Ctrl+Shift+R<\/strong> in the Aether tab.<\/li>\n<li>If the tool still looks old, right-click inside the tool area, choose <strong>Reload frame<\/strong>, then press <strong>Ctrl+Shift+R<\/strong> again.<\/li>\n<li>Open the tool page on its own and hard-refresh it. For the OnCAFE Console builder:<\/li>\n<\/ol>\n<p><code>http://&lt;pi-ip&gt;:3001/oncafe-console-builder.html<\/code> then <strong>Ctrl+Shift+R<\/strong>.<\/p>\n<ol start=\"4\">\n<li>Go back to the app and open the tool again.<\/li>\n<li>To rule out the cache completely, open the same address in a private or incognito window.<\/li>\n<li>If the private window also shows the old version, check what the Pi is serving:<\/li>\n<\/ol>\n<p><code>bash\n   cd /home/aether/Desktop/Aether/M1.2.2/frontend\n   ls -la public/oncafe-console-builder.html dist/oncafe-console-builder.html\n   curl -sI localhost:3001/oncafe-console-builder.html | grep -i -E \"content-length|last-modified\"<\/code><\/p>\n<p>The <code>dist<\/code> copy is the one served on port 3001. If it is older than the <code>public<\/code> copy, copy it across:<\/p>\n<p><code>bash\n   cp public/oncafe-console-builder.html dist/<\/code><\/p>\n<ol start=\"7\">\n<li>If the page needs new backend code too, restart the backend. <strong>Caution:<\/strong> this cuts any reader firmware upload in progress.<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-backend<\/code><\/p>\n<p>If you open Aether on port 5173 (the development server), it serves <code>frontend/public<\/code> directly, so a hard refresh is usually enough.<\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>the output of the <code>ls<\/code> and <code>curl<\/code> commands in step 6;<\/li>\n<li>the address in your browser bar (port 3001, 5173 or HTTPS);<\/li>\n<li>a screenshot of the tool in a private window;<\/li>\n<li>the update name you installed.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a075\">075 Use the OnCAFE Console builder<\/a><\/li>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a100\">100 An update failed or rolled back<\/a><\/li>\n<\/ul>", "text": "a tool page still shows the old version for users who installed an update or replaced a tool page but still see the old one: clearing the browser and frame cache and checking the dist copy on the pi.  summary some tools, such as the oncafe console builder, are standalone pages that aether shows inside a frame. after you install an update or replace one of these pages, the browser can keep showing its saved copy. this article shows how to get the new version on screen. symptoms after an update, a tool page looks exactly as it did before. the rest of aether shows the change, but one tool inside a frame doesn't. a different computer or a private window shows the new version. likely causes the browser is showing a cached copy of the page. confirm how long tool pages are cached and whether a later update made the pi tell browsers to always recheck html pages. a normal refresh of the app didn't reload the page inside the frame. the new page was copied into frontend/public but not into frontend/dist , which is what port 3001 serves. the new file has a different name from the one the page loads. fix it press ctrl+shift+r in the aether tab. if the tool still looks old, right-click inside the tool area, choose reload frame , then press ctrl+shift+r again. open the tool page on its own and hard-refresh it. for the oncafe console builder: http://<pi-ip>:3001/oncafe-console-builder.html then ctrl+shift+r . go back to the app and open the tool again. to rule out the cache completely, open the same address in a private or incognito window. if the private window also shows the old version, check what the pi is serving: bash cd /home/aether/desktop/aether/m1.2.2/frontend ls -la public/oncafe-console-builder.html dist/oncafe-console-builder.html curl -si localhost:3001/oncafe-console-builder.html | grep -i -e \"content-length|last-modified\" the dist copy is the one served on port 3001. if it is older than the public copy, copy it across: bash cp public/oncafe-console-builder.html dist/ if the page needs new backend code too, restart the backend. caution: this cuts any reader firmware upload in progress. bash sudo systemctl restart aether-backend if you open aether on port 5173 (the development server), it serves frontend/public directly, so a hard refresh is usually enough. still stuck send the aether team: the output of the ls and curl commands in step 6; the address in your browser bar (port 3001, 5173 or https); a screenshot of the tool in a private window; the update name you installed. related articles 075 use the oncafe console builder 066 install an aether update (device firmware) 100 an update failed or rolled back "}, {"id": "a094", "num": "094", "title": "IOplus not detected or relays stop responding", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "Both", "priority": "P1", "status": "Draft", "brief": "For users and developers whose relays or inputs stop responding: how to tell a hung IOplus HAT from a backend fault, recover with a full power cycle and collect lock-up evidence.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Aether drives its relays, opto inputs and supervision channels through the Sequent Microsystems IOplus HAT over I2C (GPIO 2 = SDA, GPIO 3 = SCL). If the HAT stops answering, relays stop clicking and inputs freeze. This article shows how to tell a stuck HAT from a stopped backend, and how to recover.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>Relays don't switch when you press them on <strong class=\"path\">Access Control<i>›<\/i>Controls<\/strong>.<\/li>\n<li>Inputs and EOL zones stop changing, or show errors.<\/li>\n<li><code>ioplus<\/code> on the command line says <code>IO-PLUS id 0 not detected<\/code>.<\/li>\n<li>The kernel log shows <code>i2c_designware ... timeout waiting for bus ready<\/code>.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The HAT's microcontroller has hung and is holding the I2C lines low. A plain <code>reboot<\/code> often won't clear this, because the HAT stays powered.<\/li>\n<li>Two backends are running and both use the bus.<\/li>\n<li>Heat: the HAT sits on top of the Pi 5's CPU.<\/li>\n<li>Under-voltage from the power supply.<\/li>\n<li>The HAT isn't seated on the 40-pin header.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Check the bus lines. Healthy is <code>hi<\/code> on both:<\/li>\n<\/ol>\n<p><code>bash\n   sudo pinctrl get 2,3<\/code><\/p>\n<ol start=\"2\">\n<li>Ask the HAT for its version:<\/li>\n<\/ol>\n<p><code>bash\n   ioplus 0 board<\/code><\/p>\n<ol start=\"3\">\n<li>Check that the HAT shows on the bus at address 0x28. The grid should show <code>28<\/code>:<\/li>\n<\/ol>\n<p><code>bash\n   sudo i2cdetect -y 1<\/code><\/p>\n<ol start=\"4\">\n<li>Check power and temperature. <code>throttled=0x0<\/code> means no under-voltage since boot:<\/li>\n<\/ol>\n<p><code>bash\n   vcgencmd get_throttled; vcgencmd measure_temp<\/code><\/p>\n<ol start=\"5\">\n<li>Check that only one backend runs (one line, user <code>aether<\/code>):<\/li>\n<\/ol>\n<p><code>bash\n   ps -o pid,user,cmd -C node | grep server.js<\/code><\/p>\n<ol start=\"6\">\n<li>If both lines in step 1 read <code>lo<\/code>, or step 2 says <code>not detected<\/code>, the HAT is hung. Save evidence before you power off (see <strong>Still stuck<\/strong>).<\/li>\n<li><strong>Caution:<\/strong> this shuts the Pi down and stops all doors and readers. Shut down, wait for the green LED to stop, unplug power for 10 s, then plug it back in:<\/li>\n<\/ol>\n<p><code>bash\n   sudo shutdown -h now<\/code><\/p>\n<ol start=\"8\">\n<li>After boot, repeat steps 1 and 2.<\/li>\n<li>If lock-ups repeat, ask the Aether team about slowing the I2C bus to 50 kHz. <strong>Caution:<\/strong> this edits <code>/boot/firmware/config.txt<\/code> and needs a power cycle to take effect:<\/li>\n<\/ol>\n<p><code>bash\n   echo \"dtparam=i2c_arm_baudrate=50000\" | sudo tee -a /boot/firmware/config.txt<\/code><\/p>\n<ol start=\"10\">\n<li>Improve cooling (active cooler or taller standoffs) if the temperature in step 4 is near 70 °C or above.<\/li>\n<\/ol>\n<p>The backend tries to recover the bus on its own first: it drains pending commands, probes the HAT, resets the I2C bus and probes again, then backs off and resumes. If that fails, the backend log says the HAT <strong>needs POWER CYCLE<\/strong>; do step 7.<\/p>\n<h2>Still stuck<\/h2>\n<p>Run this before you power off, then send the file:<\/p>\n<pre><code class=\"language-bash\">{\n  echo &quot;== $(date)&quot;; uptime\n  vcgencmd get_throttled; vcgencmd measure_temp\n  sudo pinctrl get 2,3\n  timeout 5 ioplus 0 board; echo &quot;exit $?&quot;\n  sudo timeout 10 i2cdetect -y 1\n  dmesg --ctime | grep -iE &quot;i2c|voltage|throttl&quot; | tail -30\n  sudo journalctl -u aether-backend -n 120 --no-pager\n} &gt; ~/lockup-$(date +%F-%H%M).txt 2&gt;&amp;1\n<\/code><\/pre>\n<p>If <code>aether-diag<\/code> is installed, add the output of <code>aether-diag --lockups<\/code>.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<li><a href=\"#a028\">028 Controls page: outputs, inputs and system outputs<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a095\">095 One CPU core runs high<\/a><\/li>\n<\/ul>", "text": "ioplus not detected or relays stop responding for users and developers whose relays or inputs stop responding: how to tell a hung ioplus hat from a backend fault, recover with a full power cycle and collect lock-up evidence.  summary aether drives its relays, opto inputs and supervision channels through the sequent microsystems ioplus hat over i2c (gpio 2 = sda, gpio 3 = scl). if the hat stops answering, relays stop clicking and inputs freeze. this article shows how to tell a stuck hat from a stopped backend, and how to recover. symptoms relays don't switch when you press them on access control › controls . inputs and eol zones stop changing, or show errors. ioplus on the command line says io-plus id 0 not detected . the kernel log shows i2c_designware ... timeout waiting for bus ready . likely causes the hat's microcontroller has hung and is holding the i2c lines low. a plain reboot often won't clear this, because the hat stays powered. two backends are running and both use the bus. heat: the hat sits on top of the pi 5's cpu. under-voltage from the power supply. the hat isn't seated on the 40-pin header. fix it check the bus lines. healthy is hi on both: bash sudo pinctrl get 2,3 ask the hat for its version: bash ioplus 0 board check that the hat shows on the bus at address 0x28. the grid should show 28 : bash sudo i2cdetect -y 1 check power and temperature. throttled=0x0 means no under-voltage since boot: bash vcgencmd get_throttled; vcgencmd measure_temp check that only one backend runs (one line, user aether ): bash ps -o pid,user,cmd -c node | grep server.js if both lines in step 1 read lo , or step 2 says not detected , the hat is hung. save evidence before you power off (see still stuck ). caution: this shuts the pi down and stops all doors and readers. shut down, wait for the green led to stop, unplug power for 10 s, then plug it back in: bash sudo shutdown -h now after boot, repeat steps 1 and 2. if lock-ups repeat, ask the aether team about slowing the i2c bus to 50 khz. caution: this edits /boot/firmware/config.txt and needs a power cycle to take effect: bash echo \"dtparam=i2c_arm_baudrate=50000\" | sudo tee -a /boot/firmware/config.txt improve cooling (active cooler or taller standoffs) if the temperature in step 4 is near 70 °c or above. the backend tries to recover the bus on its own first: it drains pending commands, probes the hat, resets the i2c bus and probes again, then backs off and resumes. if that fails, the backend log says the hat needs power cycle ; do step 7. still stuck run this before you power off, then send the file: { echo \"== $(date)\"; uptime vcgencmd get_throttled; vcgencmd measure_temp sudo pinctrl get 2,3 timeout 5 ioplus 0 board; echo \"exit $?\" sudo timeout 10 i2cdetect -y 1 dmesg --ctime | grep -ie \"i2c|voltage|throttl\" | tail -30 sudo journalctl -u aether-backend -n 120 --no-pager } > ~/lockup-$(date +%f-%h%m).txt 2>&1 if aether-diag is installed, add the output of aether-diag --lockups . related articles 036 hat pinout: pi header and sequent board pages 028 controls page: outputs, inputs and system outputs 072 system & backup: health, backup and restore 095 one cpu core runs high "}, {"id": "a095", "num": "095", "title": "One CPU core runs high", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "Both", "priority": "P2", "status": "Needs SME", "brief": "For users and developers who see one CPU core pegged on System & Backup: finding USB power-management churn, an unused SPI serial overlay or a stale serial port, and stopping it.", "sources": ["docs/house-style-and-facts.md", "chat: Core 1 processor high usage"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong> shows live CPU use per core. If one core (usually <strong>Core 1<\/strong>) sits high while the others are idle, the cause is usually the kernel or a stuck serial port rather than Aether's own work. This article helps you find which one and stop it.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li><strong>Core 1<\/strong> stays high (for example 30% or more) while the other three cores sit at a few percent.<\/li>\n<li><strong>Busiest processes<\/strong> lists <code>kworker/0:…+pm<\/code> or <code>irq/…-spi1.0<\/code> near the top.<\/li>\n<li>The Pi runs warm, around 70 °C or more.<\/li>\n<\/ul>\n<p><strong>System &amp; Backup<\/strong> numbers cores from 1, so <strong>Core 1<\/strong> is CPU 0 in Linux tools.<\/p>\n<h2>Likely causes<\/h2>\n<ul>\n<li><strong>USB power management churn.<\/strong> A USB serial adapter or hub port keeps suspending and waking. USB interrupts land on CPU 0 by default.<\/li>\n<li><strong>An unused SPI serial overlay.<\/strong> <code>dtoverlay=sc16is752-spi1<\/code> is loaded in <code>/boot/firmware/config.txt<\/code> but no SPI RS-485 HAT is fitted, so the driver spins on an interrupt.<\/li>\n<li><strong>A stale serial port.<\/strong> A USB adapter dropped out and came back with a new name, and a program is still looping on the old one.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Watch the live <strong>Core 1<\/strong> bar, not the <strong>Busiest processes<\/strong> list. The list uses a lifetime average and drops slowly. From a terminal:<\/li>\n<\/ol>\n<p><code>bash\n   top -1 -bn2 -d2 | grep -m2 \"^%Cpu0\"<\/code><\/p>\n<ol start=\"2\">\n<li>List the busiest threads. <code>PSR<\/code> 0 is Core 1:<\/li>\n<\/ol>\n<p><code>bash\n   ps -eLo pid,tid,psr,pcpu,stat,etime,comm --sort=-pcpu | head -15<\/code><\/p>\n<ol start=\"3\">\n<li>Look for USB adapters dropping and reconnecting:<\/li>\n<\/ol>\n<p><code>bash\n   sudo dmesg -T | grep -iE \"usb|ttyACM|disconnect|EMI\" | tail -30<\/code><\/p>\n<ol start=\"4\">\n<li><strong>If <code>irq/…-spi1.0<\/code> is busy<\/strong>, check whether anything uses the SPI ports. No output means nothing does:<\/li>\n<\/ol>\n<p><code>bash\n   sudo fuser /dev/ttySC0 /dev/ttySC1<\/code><\/p>\n<ol start=\"5\">\n<li>Detach the SPI serial driver for now. <code>/dev/ttySC0<\/code> and <code>ttySC1<\/code> disappear until the next reboot:<\/li>\n<\/ol>\n<p><code>bash\n   echo spi1.0 | sudo tee /sys/bus/spi/drivers/sc16is7xx/unbind<\/code><\/p>\n<ol start=\"6\">\n<li>If no SPI RS-485 HAT is fitted, turn the overlay off for good. <strong>Caution:<\/strong> this edits <code>/boot/firmware/config.txt<\/code> and takes effect at the next reboot:<\/li>\n<\/ol>\n<p><code>bash\n   sudo sed -i 's/^dtoverlay=sc16is752-spi1/#&amp;/' /boot/firmware/config.txt<\/code><\/p>\n<ol start=\"7\">\n<li><strong>If <code>kworker/0:…+pm<\/code> is busy<\/strong>, turn off USB autosuspend as a test. Core 1 should drop within a few seconds:<\/li>\n<\/ol>\n<p><code>bash\n   for f in /sys/bus/usb/devices/*/power/control; do echo on | sudo tee $f &gt;/dev/null; done<\/code><\/p>\n<p><span class=\"sme\">confirm whether Aether kits should make this permanent with <code>usbcore.autosuspend=-1<\/code> in <code>/boot/firmware/cmdline.txt<\/code>.<\/span><\/p>\n<ol start=\"8\">\n<li><strong>If step 3 showed an adapter drop<\/strong>, restart the backend so it reopens its ports. <strong>Caution:<\/strong> this stops doors and readers for a few seconds and cuts any reader firmware upload in progress:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-backend<\/code><\/p>\n<ol start=\"9\">\n<li>Reduce USB drops: use shorter or shielded cables and a powered hub.<\/li>\n<li>Fit an active cooler if the Pi runs above 70 °C.<\/li>\n<\/ol>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of <strong>System &amp; Backup<\/strong> (cores, temperature, <strong>Busiest processes<\/strong>, USB devices);<\/li>\n<li>the output of steps 2 and 3;<\/li>\n<li>the output of <code>grep -n dtoverlay /boot/firmware/config.txt<\/code>;<\/li>\n<li>when the high load started and what was being tested at the time.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<li><a href=\"#a094\">094 IOplus not detected or relays stop responding<\/a><\/li>\n<\/ul>", "text": "one cpu core runs high for users and developers who see one cpu core pegged on system & backup: finding usb power-management churn, an unused spi serial overlay or a stale serial port, and stopping it.  summary setup › system & backup shows live cpu use per core. if one core (usually core 1 ) sits high while the others are idle, the cause is usually the kernel or a stuck serial port rather than aether's own work. this article helps you find which one and stop it. symptoms core 1 stays high (for example 30% or more) while the other three cores sit at a few percent. busiest processes lists kworker/0:…+pm or irq/…-spi1.0 near the top. the pi runs warm, around 70 °c or more. system & backup numbers cores from 1, so core 1 is cpu 0 in linux tools. likely causes usb power management churn. a usb serial adapter or hub port keeps suspending and waking. usb interrupts land on cpu 0 by default. an unused spi serial overlay. dtoverlay=sc16is752-spi1 is loaded in /boot/firmware/config.txt but no spi rs-485 hat is fitted, so the driver spins on an interrupt. a stale serial port. a usb adapter dropped out and came back with a new name, and a program is still looping on the old one. fix it watch the live core 1 bar, not the busiest processes list. the list uses a lifetime average and drops slowly. from a terminal: bash top -1 -bn2 -d2 | grep -m2 \"^%cpu0\" list the busiest threads. psr 0 is core 1: bash ps -elo pid,tid,psr,pcpu,stat,etime,comm --sort=-pcpu | head -15 look for usb adapters dropping and reconnecting: bash sudo dmesg -t | grep -ie \"usb|ttyacm|disconnect|emi\" | tail -30 if irq/…-spi1.0 is busy , check whether anything uses the spi ports. no output means nothing does: bash sudo fuser /dev/ttysc0 /dev/ttysc1 detach the spi serial driver for now. /dev/ttysc0 and ttysc1 disappear until the next reboot: bash echo spi1.0 | sudo tee /sys/bus/spi/drivers/sc16is7xx/unbind if no spi rs-485 hat is fitted, turn the overlay off for good. caution: this edits /boot/firmware/config.txt and takes effect at the next reboot: bash sudo sed -i 's/^dtoverlay=sc16is752-spi1/#&/' /boot/firmware/config.txt if kworker/0:…+pm is busy , turn off usb autosuspend as a test. core 1 should drop within a few seconds: bash for f in /sys/bus/usb/devices/*/power/control; do echo on | sudo tee $f >/dev/null; done confirm whether aether kits should make this permanent with usbcore.autosuspend=-1 in /boot/firmware/cmdline.txt . if step 3 showed an adapter drop , restart the backend so it reopens its ports. caution: this stops doors and readers for a few seconds and cuts any reader firmware upload in progress: bash sudo systemctl restart aether-backend reduce usb drops: use shorter or shielded cables and a powered hub. fit an active cooler if the pi runs above 70 °c. still stuck send the aether team: a screenshot of system & backup (cores, temperature, busiest processes , usb devices); the output of steps 2 and 3; the output of grep -n dtoverlay /boot/firmware/config.txt ; when the high load started and what was being tested at the time. related articles 072 system & backup: health, backup and restore 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters 094 ioplus not detected or relays stop responding "}, {"id": "a096", "num": "096", "title": "An OSDP reader doesn't answer", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "For users whose real OSDP reader doesn't reply: using Scan, Diagnose and Start to find baud, address, wiring and direction-control problems.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Use this article when a real OSDP reader on one of Aether's USB-RS485 adapters doesn't reply: <strong>Scan<\/strong> finds nothing, <strong>Diagnose<\/strong> reports no valid reply, or a controller-side test sees no reader. The cause is almost always baud, address, wiring or direction control.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li><strong>Scan<\/strong> says no reader answered.<\/li>\n<li><strong>Diagnose<\/strong> says frames were seen but none was a valid reply.<\/li>\n<li><strong>Diagnose<\/strong> says data is arriving but can't be framed as OSDP.<\/li>\n<li>Polls climb but replies stay at 0.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>Wrong baud rate. OSDP readers use 9600, 19200, 38400, 57600, 115200 or 230400 baud.<\/li>\n<li>Wrong address. <strong>Scan<\/strong> sweeps addresses 0–7 and <strong>Diagnose<\/strong> sweeps 0–15. A reader set higher won't show.<\/li>\n<li>RS-485 A and B swapped.<\/li>\n<li>The adapter needs (or must not have) RTS direction control.<\/li>\n<li>The reader only comes online with steady polling, not a short burst.<\/li>\n<li>The reader is in secure channel and needs its key.<\/li>\n<li>The reader has no power.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Check the reader has power and its LED is on.<\/li>\n<li>Check the RS-485 wiring: A to A, B to B, and a common ground.<\/li>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and go to the tool that holds <strong>Scan<\/strong>, <strong>Diagnose<\/strong> and <strong>Start<\/strong>. <span class=\"sme\">confirm which tab holds Scan, Diagnose and Start after the menu reorder (Enrollment or Bus &amp; readers).<\/span><\/li>\n<li>Pick the reader's USB-RS485 port.<\/li>\n<li>Press <strong>Scan<\/strong>. It tries every baud and both RTS settings. If it finds the reader, it fills in baud, address and RTS.<\/li>\n<li>If <strong>Scan<\/strong> finds nothing, press <strong>Diagnose<\/strong> and read the verdict:\n   - <strong>can't be framed as OSDP<\/strong>: try another baud, then swap A and B.\n   - <strong>frames seen but no valid reply<\/strong>: the address may be above 15, or the reader only talks when polled. Go to step 7.\n   - <strong>nothing came back<\/strong>: check power, wiring and the port.<\/li>\n<li>Set the baud and address you expect, then press <strong>Start<\/strong> (not <strong>Diagnose<\/strong>). Leave it running 15–20 s, then present a card.<\/li>\n<li>If <strong>Start<\/strong> still gets no replies, power-cycle the reader while <strong>Start<\/strong> is running. Some readers only answer steady polling at boot.<\/li>\n<li>If you see a note about secure channel or a NAK, the reader needs its secure channel key. See article 015.<\/li>\n<li>Once the reader answers, article 071 shows how to change its address or baud.<\/li>\n<\/ol>\n<p>While <strong>Scan<\/strong>, <strong>Diagnose<\/strong> or <strong>Start<\/strong> runs, Aether borrows the port from reader emulation and gives it back when it's done.<\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of the full <strong>Diagnose<\/strong> report (the per-port table and the hex lines);<\/li>\n<li>reader make, model and expected address and baud;<\/li>\n<li>the adapter port name (for example <code>/dev/ttyACM6<\/code>);<\/li>\n<li>an OSDP trace export if you captured one (article 019).<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a015\">015 Set or reset a reader's secure channel key (SCBK)<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a><\/li>\n<li><a href=\"#a071\">071 Change a reader's OSDP address or baud (COMSET)<\/a><\/li>\n<li><a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a><\/li>\n<\/ul>", "text": "an osdp reader doesn't answer for users whose real osdp reader doesn't reply: using scan, diagnose and start to find baud, address, wiring and direction-control problems.  summary use this article when a real osdp reader on one of aether's usb-rs485 adapters doesn't reply: scan finds nothing, diagnose reports no valid reply, or a controller-side test sees no reader. the cause is almost always baud, address, wiring or direction control. symptoms scan says no reader answered. diagnose says frames were seen but none was a valid reply. diagnose says data is arriving but can't be framed as osdp. polls climb but replies stay at 0. likely causes wrong baud rate. osdp readers use 9600, 19200, 38400, 57600, 115200 or 230400 baud. wrong address. scan sweeps addresses 0–7 and diagnose sweeps 0–15. a reader set higher won't show. rs-485 a and b swapped. the adapter needs (or must not have) rts direction control. the reader only comes online with steady polling, not a short burst. the reader is in secure channel and needs its key. the reader has no power. fix it check the reader has power and its led is on. check the rs-485 wiring: a to a, b to b, and a common ground. open readers › osdp and go to the tool that holds scan , diagnose and start . confirm which tab holds scan, diagnose and start after the menu reorder (enrollment or bus & readers). pick the reader's usb-rs485 port. press scan . it tries every baud and both rts settings. if it finds the reader, it fills in baud, address and rts. if scan finds nothing, press diagnose and read the verdict: - can't be framed as osdp : try another baud, then swap a and b. - frames seen but no valid reply : the address may be above 15, or the reader only talks when polled. go to step 7. - nothing came back : check power, wiring and the port. set the baud and address you expect, then press start (not diagnose ). leave it running 15–20 s, then present a card. if start still gets no replies, power-cycle the reader while start is running. some readers only answer steady polling at boot. if you see a note about secure channel or a nak, the reader needs its secure channel key. see article 015. once the reader answers, article 071 shows how to change its address or baud. while scan , diagnose or start runs, aether borrows the port from reader emulation and gives it back when it's done. still stuck send the aether team: a screenshot of the full diagnose report (the per-port table and the hex lines); reader make, model and expected address and baud; the adapter port name (for example /dev/ttyacm6 ); an osdp trace export if you captured one (article 019). related articles 014 assign a serial interface and baud rate 015 set or reset a reader's secure channel key (scbk) 017 read a conversation in osdp trace 019 export an osdp trace for a manufacturer 071 change a reader's osdp address or baud (comset) 097 \"port in use\" when starting the emulator or an upload "}, {"id": "a097", "num": "097", "title": "\"Port in use\" when starting the emulator or an upload", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "For users who get a port-in-use refusal when starting the Controller Emulator, a firmware upload or a reader scan: finding what holds the serial port and freeing it.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Each USB-RS485 adapter can be opened by only one thing at a time. When the Controller Emulator, reader emulation, a firmware upload or a reader scan asks for a port that something else already holds, Aether refuses with a \"port in use\" message instead of fighting over it. This article shows how to find the owner and free the port.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>Starting the <strong>Controller Emulator<\/strong> on a port opens <strong>Port In Use by Reader Emulation<\/strong>, or fails with a \"port in use\" message.<\/li>\n<li>A reader firmware upload or COMSET change won't start on a port.<\/li>\n<li>A scan or diagnose reports <strong>Cannot lock port<\/strong> or <strong>Resource temporarily unavailable<\/strong>.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>Reader emulation (<strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong>) has the port open for an emulated reader.<\/li>\n<li>The <strong>Controller Emulator<\/strong> already uses the port.<\/li>\n<li>Another reader firmware upload is running. Only one upload runs at a time.<\/li>\n<li>A program outside Aether holds the port, such as ModemManager or brltty, or a second backend started by hand.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Note the port named in the message (for example <code>/dev/ttyACM4<\/code>).<\/li>\n<li>Check <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Bus &amp; readers<\/strong> for readers assigned to that port.<\/li>\n<li>Check <strong>Controller Emulator<\/strong> for boards on that port.<\/li>\n<li>Decide which job should own the port. In <strong>Port In Use by Reader Emulation<\/strong>, <strong>Release &amp; Start<\/strong> hands the port to the emulator until you stop the bus (article 046).<\/li>\n<li>Move the other job to a different adapter, or stop it, then try again.<\/li>\n<li>If a firmware upload is running, wait for it to finish. The upload gives the port back to reader emulation when it ends.<\/li>\n<li>If nothing in Aether uses the port, see what program has it open:<\/li>\n<\/ol>\n<p><code>bash\n   sudo fuser -v /dev/ttyACM4\n   ps -o pid,user,cmd -C node | grep server.js<\/code><\/p>\n<p>Replace <code>ttyACM4<\/code> with your port. The second command should show exactly one backend.<\/p>\n<ol start=\"8\">\n<li>If ModemManager or brltty holds the port, ask the Aether team before removing them. <span class=\"sme\">confirm the recommended way to stop ModemManager/brltty grabbing RS-485 adapters on Aether kits.<\/span><\/li>\n<li>If two backends are running, restart the service so only one is left. <strong>Caution:<\/strong> this stops doors and readers for a few seconds and cuts any firmware upload in progress:<\/li>\n<\/ol>\n<p><code>bash\n   sudo pkill -f \"node server.js\"\n   sudo systemctl restart aether-backend<\/code><\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of the message;<\/li>\n<li>the port name and what you were trying to start;<\/li>\n<li>the output of <code>sudo fuser -v /dev/ttyACM*<\/code> and <code>ps -o pid,user,cmd -C node<\/code>;<\/li>\n<li>the last backend log lines: <code>sudo journalctl -u aether-backend -n 80 --no-pager<\/code>.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a046\">046 Share a serial port between readers and the emulator<\/a><\/li>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a098\">098 Reader firmware upload fails or stalls<\/a><\/li>\n<\/ul>", "text": "\"port in use\" when starting the emulator or an upload for users who get a port-in-use refusal when starting the controller emulator, a firmware upload or a reader scan: finding what holds the serial port and freeing it.  summary each usb-rs485 adapter can be opened by only one thing at a time. when the controller emulator, reader emulation, a firmware upload or a reader scan asks for a port that something else already holds, aether refuses with a \"port in use\" message instead of fighting over it. this article shows how to find the owner and free the port. symptoms starting the controller emulator on a port opens port in use by reader emulation , or fails with a \"port in use\" message. a reader firmware upload or comset change won't start on a port. a scan or diagnose reports cannot lock port or resource temporarily unavailable . likely causes reader emulation ( readers › osdp ) has the port open for an emulated reader. the controller emulator already uses the port. another reader firmware upload is running. only one upload runs at a time. a program outside aether holds the port, such as modemmanager or brltty, or a second backend started by hand. fix it note the port named in the message (for example /dev/ttyacm4 ). check readers › osdp › bus & readers for readers assigned to that port. check controller emulator for boards on that port. decide which job should own the port. in port in use by reader emulation , release & start hands the port to the emulator until you stop the bus (article 046). move the other job to a different adapter, or stop it, then try again. if a firmware upload is running, wait for it to finish. the upload gives the port back to reader emulation when it ends. if nothing in aether uses the port, see what program has it open: bash sudo fuser -v /dev/ttyacm4 ps -o pid,user,cmd -c node | grep server.js replace ttyacm4 with your port. the second command should show exactly one backend. if modemmanager or brltty holds the port, ask the aether team before removing them. confirm the recommended way to stop modemmanager/brltty grabbing rs-485 adapters on aether kits. if two backends are running, restart the service so only one is left. caution: this stops doors and readers for a few seconds and cuts any firmware upload in progress: bash sudo pkill -f \"node server.js\" sudo systemctl restart aether-backend still stuck send the aether team: a screenshot of the message; the port name and what you were trying to start; the output of sudo fuser -v /dev/ttyacm* and ps -o pid,user,cmd -c node ; the last backend log lines: sudo journalctl -u aether-backend -n 80 --no-pager . related articles 046 share a serial port between readers and the emulator 014 assign a serial interface and baud rate 069 update osdp reader firmware (firmware wizard) 098 reader firmware upload fails or stalls "}, {"id": "a098", "num": "098", "title": "Reader firmware upload fails or stalls", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "For users whose reader firmware upload won't start, fails or seems stuck: reading the live trace, aborting safely and what to send the manufacturer.", "sources": ["docs/house-style-and-facts.md", "chat: OSDP firmware upload logger"], "html": "<h2>Summary<\/h2>\n<p>The Firmware wizard on <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Firmware<\/strong> sends a firmware file to a real reader over OSDP file transfer. At 9600 baud a transfer can take many minutes. This article covers transfers that won't start, stop with an error, or seem stuck.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>The upload won't start, or says the port is in use.<\/li>\n<li>The upload fails with a NAK, a rejected file, or a timeout.<\/li>\n<li>The progress bar stops moving for a long time.<\/li>\n<li>After the upload, the reader doesn't answer <strong>Identify<\/strong>.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>Another upload is running. Only one runs at a time.<\/li>\n<li>The reader doesn't answer at the baud and address set in the wizard.<\/li>\n<li>The reader rejected the file (wrong model or file type).<\/li>\n<li>The reader stopped replying. The uploader waits up to 30 s for each reply, then fails.<\/li>\n<li>A long pause is normal when the reader asks for a delay between fragments, or while it processes the file at the end.<\/li>\n<li>For uploads through a controller with the <strong>SUNAPI Console<\/strong>, the reader bus is below 38400 baud.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Check that no other upload is running on any reader.<\/li>\n<li>Run <strong>Identify<\/strong> on the reader first. If it doesn't answer, fix that before uploading (article 096).<\/li>\n<li>Check that the file matches the reader model.<\/li>\n<li>Start the upload and leave the page open.<\/li>\n<li>If the bar stops, watch the live trace panel below it. Replies marked busy or a requested delay mean the reader is still working. Wait.<\/li>\n<li>If the trace shows no replies for over 30 s, the upload fails on its own and gives the port back.<\/li>\n<li>To stop an upload, press <strong>Abort batch<\/strong> and confirm. The reader keeps a partial file it won't install and normally keeps its current firmware. <span class=\"sme\">confirm abort behaviour is safe for every supported reader family.<\/span><\/li>\n<li>After an abort or failure, run <strong>Identify<\/strong> again. If the reader doesn't answer, power-cycle it and run <strong>Identify<\/strong> once more.<\/li>\n<li>Flash it again.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> don't restart <code>aether-backend<\/code>, install an Aether update or reboot while an upload is running. A restart cuts the transfer. Aether refuses updates that restart the backend while an upload runs.<\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team the <strong>Manufacturer bundle (.zip)<\/strong> from <strong>OSDP trace logs<\/strong> at the top of the wizard. It holds a report, the raw frames and the file checksum. Add:<\/p>\n<ul>\n<li>reader make, model and current firmware version;<\/li>\n<li>baud and address used;<\/li>\n<li>what the reader's LED did, if you added markers.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a070\">070 Manage the reader firmware library<\/a><\/li>\n<li><a href=\"#a063\">063 Send reader firmware or config through a controller<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<li><a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a><\/li>\n<\/ul>", "text": "reader firmware upload fails or stalls for users whose reader firmware upload won't start, fails or seems stuck: reading the live trace, aborting safely and what to send the manufacturer.  summary the firmware wizard on readers › osdp › firmware sends a firmware file to a real reader over osdp file transfer. at 9600 baud a transfer can take many minutes. this article covers transfers that won't start, stop with an error, or seem stuck. symptoms the upload won't start, or says the port is in use. the upload fails with a nak, a rejected file, or a timeout. the progress bar stops moving for a long time. after the upload, the reader doesn't answer identify . likely causes another upload is running. only one runs at a time. the reader doesn't answer at the baud and address set in the wizard. the reader rejected the file (wrong model or file type). the reader stopped replying. the uploader waits up to 30 s for each reply, then fails. a long pause is normal when the reader asks for a delay between fragments, or while it processes the file at the end. for uploads through a controller with the sunapi console , the reader bus is below 38400 baud. fix it check that no other upload is running on any reader. run identify on the reader first. if it doesn't answer, fix that before uploading (article 096). check that the file matches the reader model. start the upload and leave the page open. if the bar stops, watch the live trace panel below it. replies marked busy or a requested delay mean the reader is still working. wait. if the trace shows no replies for over 30 s, the upload fails on its own and gives the port back. to stop an upload, press abort batch and confirm. the reader keeps a partial file it won't install and normally keeps its current firmware. confirm abort behaviour is safe for every supported reader family. after an abort or failure, run identify again. if the reader doesn't answer, power-cycle it and run identify once more. flash it again. caution: don't restart aether-backend , install an aether update or reboot while an upload is running. a restart cuts the transfer. aether refuses updates that restart the backend while an upload runs. still stuck send the aether team the manufacturer bundle (.zip) from osdp trace logs at the top of the wizard. it holds a report, the raw frames and the file checksum. add: reader make, model and current firmware version; baud and address used; what the reader's led did, if you added markers. related articles 069 update osdp reader firmware (firmware wizard) 070 manage the reader firmware library 063 send reader firmware or config through a controller 096 an osdp reader doesn't answer 097 \"port in use\" when starting the emulator or an upload "}, {"id": "a099", "num": "099", "title": "VMS shows a black tile or Backend offline", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P2", "status": "Draft", "brief": "For users whose VMS tile is black or shows Backend offline: checking the backend and stream page and restarting aether-stream.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Tools<i>›<\/i>VMS Stream<\/strong> sends a live view of Aether to a VMS as an RTSP camera at <code>rtsp://&lt;pi-ip&gt;:8554/aether<\/code>. The <code>aether-stream<\/code> service captures Aether's stream page in a browser and encodes it. A black tile or <strong>Backend offline<\/strong> on the stream means the page it captures didn't load or can't reach the backend.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>The VMS connects but the tile is black.<\/li>\n<li>The tile shows <strong>Backend offline<\/strong>.<\/li>\n<li>The VMS can't connect at all.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The capture started before the backend was up and kept showing a dead page. It doesn't reload on its own.<\/li>\n<li><code>aether-backend<\/code> is down, so the page loads but can't reach port 3001.<\/li>\n<li>The stream page isn't built, so there is nothing to capture.<\/li>\n<li><code>aether-stream<\/code> isn't running, so nothing listens on port 8554.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>VMS Stream<\/strong> and check the status, viewer count and preview.<\/li>\n<li>Check that the backend answers:<\/li>\n<\/ol>\n<p><code>bash\n   curl -s --max-time 5 localhost:3001/api/vms/stream-status; echo<\/code><\/p>\n<p>JSON back means the backend is up. No answer: follow article 092 first.<\/p>\n<ol start=\"3\">\n<li>Check that the stream page is served. <code>200<\/code> is good:<\/li>\n<\/ol>\n<p><code>bash\n   curl -sI localhost:3001/stream | head -1<\/code><\/p>\n<ol start=\"4\">\n<li><strong>Caution:<\/strong> this drops the VMS tile for a moment. Restart the stream so it loads the page fresh:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-stream<\/code><\/p>\n<ol start=\"5\">\n<li>Wait 10–15 s. The tile should come back on its own. If not, refresh the camera in the VMS.<\/li>\n<li>If nothing listens on port 8554, check the service:<\/li>\n<\/ol>\n<p><code>bash\n   systemctl status aether-stream --no-pager<\/code><\/p>\n<ol start=\"7\">\n<li>Check that both services start at boot:<\/li>\n<\/ol>\n<p><code>bash\n   systemctl is-enabled aether-backend aether-stream<\/code><\/p>\n<p>The stream starts when the first viewer connects and stops 30 s after the last one leaves, so the first frame takes a few seconds.<\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<pre><code class=\"language-bash\">{\n  systemctl status aether-stream aether-backend --no-pager\n  curl -s localhost:3001/api/vms/stream-status; echo\n  curl -sI localhost:3001/stream | head -1\n  sudo journalctl -u aether-stream -n 60 --no-pager\n} &gt; ~/vms-$(date +%F-%H%M).txt 2&gt;&amp;1\n<\/code><\/pre>\n<p>Add the VMS name and version and a screenshot of the tile.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a064\">064 Add Aether to a VMS as an RTSP camera<\/a><\/li>\n<li><a href=\"#a065\">065 VMS Stream settings: frame rate, bitrate, encoder<\/a><\/li>\n<li><a href=\"#a092\">092 Aether won't load or shows Backend offline<\/a><\/li>\n<\/ul>", "text": "vms shows a black tile or backend offline for users whose vms tile is black or shows backend offline: checking the backend and stream page and restarting aether-stream.  summary tools › vms stream sends a live view of aether to a vms as an rtsp camera at rtsp://<pi-ip>:8554/aether . the aether-stream service captures aether's stream page in a browser and encodes it. a black tile or backend offline on the stream means the page it captures didn't load or can't reach the backend. symptoms the vms connects but the tile is black. the tile shows backend offline . the vms can't connect at all. likely causes the capture started before the backend was up and kept showing a dead page. it doesn't reload on its own. aether-backend is down, so the page loads but can't reach port 3001. the stream page isn't built, so there is nothing to capture. aether-stream isn't running, so nothing listens on port 8554. fix it open tools › vms stream and check the status, viewer count and preview. check that the backend answers: bash curl -s --max-time 5 localhost:3001/api/vms/stream-status; echo json back means the backend is up. no answer: follow article 092 first. check that the stream page is served. 200 is good: bash curl -si localhost:3001/stream | head -1 caution: this drops the vms tile for a moment. restart the stream so it loads the page fresh: bash sudo systemctl restart aether-stream wait 10–15 s. the tile should come back on its own. if not, refresh the camera in the vms. if nothing listens on port 8554, check the service: bash systemctl status aether-stream --no-pager check that both services start at boot: bash systemctl is-enabled aether-backend aether-stream the stream starts when the first viewer connects and stops 30 s after the last one leaves, so the first frame takes a few seconds. still stuck send the aether team: { systemctl status aether-stream aether-backend --no-pager curl -s localhost:3001/api/vms/stream-status; echo curl -si localhost:3001/stream | head -1 sudo journalctl -u aether-stream -n 60 --no-pager } > ~/vms-$(date +%f-%h%m).txt 2>&1 add the vms name and version and a screenshot of the tile. related articles 064 add aether to a vms as an rtsp camera 065 vms stream settings: frame rate, bitrate, encoder 092 aether won't load or shows backend offline "}, {"id": "a100", "num": "100", "title": "An update failed or rolled back", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Draft", "brief": "For users whose Device Firmware update failed or rolled back: reading the job log, common causes and how to recover.", "sources": ["docs/house-style-and-facts.md", "chat: Device firmware tool development", "chat: OSDP Trace tool app"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> backs up the Aether folder before every update. If the update stops partway, or Aether doesn't answer its health check twice within 60 s afterwards, the backup is put back and the job ends as rolled back. This article explains what that means and what to do next.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>The update log ends with a line such as <strong>The previous version was put back.<\/strong><\/li>\n<li>The job in the history shows as rolled back or failed.<\/li>\n<li>The update was refused before it started.<\/li>\n<li>After an update, Aether doesn't answer at all.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The bundle's <code>apply.sh<\/code> stopped with an error, for example because your files don't match what the update expects.<\/li>\n<li>The web page build failed.<\/li>\n<li>The backend didn't come back within 60 s after the update.<\/li>\n<li>An update that restarts the backend was refused because a reader firmware upload was running.<\/li>\n<li>A Blueprints update was installed before an Aether update it depends on.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> and open the job's log.<\/li>\n<li>Find the line that starts <strong>Rolling back:<\/strong>. It says which step failed.<\/li>\n<li>If it says <strong>apply.sh stopped with exit code<\/strong>, read the lines just above it. They name the step and the file that didn't fit. Send the log to whoever built the update.<\/li>\n<li>If it says the backend didn't come back within 60 s, check the backend now (article 092).<\/li>\n<li>If the update was refused because a reader upload is running, wait for the upload to finish, then apply again.<\/li>\n<li>If you are installing several updates, install Aether updates before Blueprints updates.<\/li>\n<li>After a rollback, press <strong>Ctrl+Shift+R<\/strong> so the browser drops any half-loaded pages.<\/li>\n<li>If the log says the old files are back but the backend still isn't answering, check its log:<\/li>\n<\/ol>\n<p><code>bash\n   sudo journalctl -u aether-backend -n 60 --no-pager<\/code><\/p>\n<ol start=\"9\">\n<li><strong>Caution:<\/strong> restarting the backend stops doors and readers for a few seconds. Restart it once you have saved the log:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-backend<\/code><\/p>\n<ol start=\"10\">\n<li>To go back to the state before an earlier update, use <strong>Restore<\/strong> on that job in the history (article 067). Only the newest backup is kept, so older jobs may have no <strong>Restore<\/strong>.<\/li>\n<\/ol>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>the full job log from <strong>Device Firmware<\/strong> (copy the text);<\/li>\n<li>the update file name;<\/li>\n<li>the list of updates installed before it;<\/li>\n<li><code>sudo journalctl -u aether-backend -n 120 --no-pager<\/code> if the backend isn't answering.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a067\">067 Update history, restore and automatic rollback<\/a><\/li>\n<li><a href=\"#a068\">068 Install order and named update bundles<\/a><\/li>\n<li><a href=\"#a092\">092 Aether won't load or shows Backend offline<\/a><\/li>\n<li><a href=\"#a093\">093 A tool page still shows the old version<\/a><\/li>\n<\/ul>", "text": "an update failed or rolled back for users whose device firmware update failed or rolled back: reading the job log, common causes and how to recover.  summary setup › device firmware backs up the aether folder before every update. if the update stops partway, or aether doesn't answer its health check twice within 60 s afterwards, the backup is put back and the job ends as rolled back. this article explains what that means and what to do next. symptoms the update log ends with a line such as the previous version was put back. the job in the history shows as rolled back or failed. the update was refused before it started. after an update, aether doesn't answer at all. likely causes the bundle's apply.sh stopped with an error, for example because your files don't match what the update expects. the web page build failed. the backend didn't come back within 60 s after the update. an update that restarts the backend was refused because a reader firmware upload was running. a blueprints update was installed before an aether update it depends on. fix it open setup › device firmware and open the job's log. find the line that starts rolling back: . it says which step failed. if it says apply.sh stopped with exit code , read the lines just above it. they name the step and the file that didn't fit. send the log to whoever built the update. if it says the backend didn't come back within 60 s, check the backend now (article 092). if the update was refused because a reader upload is running, wait for the upload to finish, then apply again. if you are installing several updates, install aether updates before blueprints updates. after a rollback, press ctrl+shift+r so the browser drops any half-loaded pages. if the log says the old files are back but the backend still isn't answering, check its log: bash sudo journalctl -u aether-backend -n 60 --no-pager caution: restarting the backend stops doors and readers for a few seconds. restart it once you have saved the log: bash sudo systemctl restart aether-backend to go back to the state before an earlier update, use restore on that job in the history (article 067). only the newest backup is kept, so older jobs may have no restore . still stuck send the aether team: the full job log from device firmware (copy the text); the update file name; the list of updates installed before it; sudo journalctl -u aether-backend -n 120 --no-pager if the backend isn't answering. related articles 066 install an aether update (device firmware) 067 update history, restore and automatic rollback 068 install order and named update bundles 092 aether won't load or shows backend offline 093 a tool page still shows the old version "}, {"id": "a101", "num": "101", "title": "Lost access after a network change", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Draft", "brief": "For users who lost the Aether page after changing network settings: using the 90 s Keep window and the automatic switch-back to get back in.", "sources": ["docs/house-style-and-facts.md", "chat: Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>Network<\/strong> applies new settings through NetworkManager and arms a 90 s rollback. You must press <strong>Keep<\/strong> from the new address within 90 s, or the Pi switches back to its old settings by itself. This article helps you get back in after a network change.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>After <strong>Apply<\/strong>, the page stops responding.<\/li>\n<li>The new address doesn't open in the browser.<\/li>\n<li>The Pi came back on its old address after a minute or two.<\/li>\n<li>A yellow banner says the new settings are on trial with a countdown.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>The Pi moved to a new address and the browser is still on the old one.<\/li>\n<li><strong>Keep<\/strong> wasn't pressed within 90 s, so the settings rolled back. This is expected.<\/li>\n<li>The new address is on a different subnet from your computer, or the gateway is wrong.<\/li>\n<li>DHCP gave the Pi an address you don't know yet.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Don't change anything else on the Pi for 90 s.<\/li>\n<li>If you set a static address, open <code>http://&lt;new-ip&gt;:3001<\/code> on a computer in the same subnet.<\/li>\n<li>Go to <strong class=\"path\">Setup<i>›<\/i>Network<\/strong> and press <strong>Keep<\/strong> before the countdown ends.<\/li>\n<li>If the new address doesn't open, wait 90 s. The Pi restores its old settings.<\/li>\n<li>Open <code>http://&lt;old-ip&gt;:3001<\/code> again. The page should load.<\/li>\n<li>Check the values you entered (address, prefix, gateway, DNS) and try again.<\/li>\n<li>If you switched to DHCP and don't know the new address, find it on the Pi's own screen or in your router's DHCP list, or run this on the Pi:<\/li>\n<\/ol>\n<p><code>bash\n   hostname -I<\/code><\/p>\n<ol start=\"8\">\n<li>If you were using the HTTPS name, use the plain address first. The name updates to the new address within about 10 min.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> network changes can cut you off from a remote Pi. Make changes from a computer on the same network, or with someone at the Pi.<\/p>\n<h2>Still stuck<\/h2>\n<p>On the Pi (screen and keyboard), collect:<\/p>\n<pre><code class=\"language-bash\">{\n  nmcli device status\n  ip -4 addr\n  systemctl status aether-net-rollback.timer --no-pager\n  sudo journalctl -t aether-netcfg -n 20 --no-pager\n} &gt; ~/network-$(date +%F-%H%M).txt 2&gt;&amp;1\n<\/code><\/pre>\n<p>Send the file with the settings you tried to apply (use placeholders for real addresses if you share it outside the team).<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a073\">073 Change the Pi's network settings with rollback<\/a><\/li>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a102\">102 No padlock, or the HTTPS name doesn't load<\/a><\/li>\n<\/ul>", "text": "lost access after a network change for users who lost the aether page after changing network settings: using the 90 s keep window and the automatic switch-back to get back in.  summary setup › network applies new settings through networkmanager and arms a 90 s rollback. you must press keep from the new address within 90 s, or the pi switches back to its old settings by itself. this article helps you get back in after a network change. symptoms after apply , the page stops responding. the new address doesn't open in the browser. the pi came back on its old address after a minute or two. a yellow banner says the new settings are on trial with a countdown. likely causes the pi moved to a new address and the browser is still on the old one. keep wasn't pressed within 90 s, so the settings rolled back. this is expected. the new address is on a different subnet from your computer, or the gateway is wrong. dhcp gave the pi an address you don't know yet. fix it don't change anything else on the pi for 90 s. if you set a static address, open http://<new-ip>:3001 on a computer in the same subnet. go to setup › network and press keep before the countdown ends. if the new address doesn't open, wait 90 s. the pi restores its old settings. open http://<old-ip>:3001 again. the page should load. check the values you entered (address, prefix, gateway, dns) and try again. if you switched to dhcp and don't know the new address, find it on the pi's own screen or in your router's dhcp list, or run this on the pi: bash hostname -i if you were using the https name, use the plain address first. the name updates to the new address within about 10 min. caution: network changes can cut you off from a remote pi. make changes from a computer on the same network, or with someone at the pi. still stuck on the pi (screen and keyboard), collect: { nmcli device status ip -4 addr systemctl status aether-net-rollback.timer --no-pager sudo journalctl -t aether-netcfg -n 20 --no-pager } > ~/network-$(date +%f-%h%m).txt 2>&1 send the file with the settings you tried to apply (use placeholders for real addresses if you share it outside the team). related articles 073 change the pi's network settings with rollback 003 open aether in a browser 102 no padlock, or the https name doesn't load "}, {"id": "a102", "num": "102", "title": "No padlock, or the HTTPS name doesn't load", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "For users whose HTTPS name doesn't load or shows no padlock: port 3443, DNS cache, router DNS rebinding protection and certificate checks.", "sources": ["docs/house-style-and-facts.md", "chat: Aether product QA testing", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong> gives the Pi a name like <code>&lt;name&gt;.aetheraccesstools.com<\/code> with a Let's Encrypt certificate, got through a Cloudflare DNS token. This article covers the name not loading, and the browser showing a warning instead of a padlock.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>The browser says the DNS address could not be found.<\/li>\n<li>The page loads with a certificate warning and no padlock.<\/li>\n<li>The page loads by IP but not by name.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>Port 443 was taken on the Pi, so HTTPS runs on 3443 and the address needs <code>:3443<\/code>.<\/li>\n<li>The browser or computer remembered \"name not found\" from before the name existed.<\/li>\n<li>The router blocks public names that point to local addresses (DNS rebinding protection).<\/li>\n<li>No certificate was issued yet, or it lapsed. Then the Pi uses a self-signed certificate and the browser warns.<\/li>\n<li>The Cloudflare token is wrong or lacks permission.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong> and read the status and <strong>HTTPS port<\/strong>.<\/li>\n<li>If the port is 3443, add it to the address: <code>https://bench1.example.com:3443<\/code>.<\/li>\n<li>If no certificate is shown, press <strong>Get certificate<\/strong> and watch the step
