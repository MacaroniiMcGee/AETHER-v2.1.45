ead one port click a port on the board. scroll to port n monitor . it shows device , link , identified via , speed , ip address , mac , duplex , remote port , throughput , description , traffic totals , poe , poe draw , errors and drops . click inspect port to read the port's admin and link state straight from the switch. throughput comes from the counter change between the last two scans. it is not a live rate. chart traffic during a test select the ports to watch. ctrl-click to add ports. the chart shows up to 8 ports. in the traffic panel, click start monitoring . screenshot to add: the traffic chart with receive and transmit lines and a disable marker run your test. port changes made by aether appear as markers on the chart. click stop monitoring when the test ends. the monitor reads the switch every 30 s by default, and never more often than every 10 s. a disconnect shows as traffic falling to zero. a switch reboot breaks the line instead of drawing a spike. check that it worked the chart title shows port n traffic or traffic - n ports , and a note under it gives the sample interval. event log lists each change with its time, link or poe , and the reason. it is kept in memory since the backend started. if something goes wrong symptom what to do device says unknown the device doesn't send lldp. identified via may show learned mac (not a hostname) . ip address says not in arp table the switch hasn't seen traffic from it recently. scan again after the device talks. the chart is empty monitoring isn't running. click start monitoring . related articles 051 add a switch profile and test the login 052 turn a switch port off with an automatic hold 053 cut poe to cold-boot a device 055 revert all held ports and reconcile drift "}, {"id": "a057", "num": "057", "title": "What the SUNAPI Console does", "area": "Network switch, SUNAPI and VMS", "type": "Concept", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "What the SUNAPI Console is, what its tabs do and how it keeps device changes safe. For testers who used Hanwha's Windows SUNAPI Test Client.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)", "OSDP Trace tool app (chat)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>SUNAPI Console<\/strong> (<strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong>) sends SUNAPI requests to Hanwha cameras, recorders and access controllers through the Pi. It replaces Hanwha's Windows SUNAPI Test Client.<\/p>\n<h2>Where the menus come from<\/h2>\n<p>The Console doesn't carry a fixed list of commands. When you connect to a device, it reads the device's own <code>attributes.cgi<\/code> and builds the menu tree from it. Each parameter gets a matching control, so any model works without an Aether update.<\/p>\n<h2>The tabs<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Devices<\/strong><\/td>\n<td>Saved devices, grouped as Camera, Recorder, Access control or Other. Scan the network and add devices. Tick devices to send one request to many.<\/td>\n<\/tr>\n<tr>\n<td><strong>Explorer<\/strong><\/td>\n<td>Pick a menu and action, fill in parameters, preview the URL and send.<\/td>\n<\/tr>\n<tr>\n<td><strong>Capabilities<\/strong><\/td>\n<td>What the device says it supports, including per-channel attributes.<\/td>\n<\/tr>\n<tr>\n<td><strong>History<\/strong><\/td>\n<td>Your last 150 requests to each device, kept on the Pi, with passwords masked.<\/td>\n<\/tr>\n<tr>\n<td><strong>Snapshots<\/strong><\/td>\n<td>Capture every readable setting, then compare before/after or one device against another.<\/td>\n<\/tr>\n<tr>\n<td><strong>Reader file<\/strong><\/td>\n<td>Send reader firmware or a reader config file through an access controller.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"sme\">confirm the tab names and order on the current Pi build.<\/span><\/p>\n<h2>How it keeps changes safe<\/h2>\n<ul>\n<li><strong>Read actions<\/strong> (<code>view<\/code>) are sent straight away.<\/li>\n<li><strong>Any other action<\/strong> asks you to confirm first. The Pi also refuses a change that wasn't confirmed.<\/li>\n<li><strong>Risky actions<\/strong>, such as factory reset, power, firmware, network, users and remove, also need you to tick <strong>I understand<\/strong>.<\/li>\n<li><strong>Actions that move real hardware<\/strong>, such as door, alarm output and reader commands, show a note before you send them.<\/li>\n<li><strong>Only changed fields are sent.<\/strong> After a change, the Console reads the menu back and checks each value.<\/li>\n<\/ul>\n<h2>Logins and data<\/h2>\n<p>Device passwords are kept on the Pi only and are never sent back to the browser. <strong>Copy as curl<\/strong> leaves the password out. Devices, history and snapshots are stored on the Pi. When you send one request to many devices, the Pi runs it on 8 devices at a time.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a058\">058 Find Hanwha devices with Scan<\/a><\/li>\n<li><a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a><\/li>\n<li><a href=\"#a060\">060 Change device settings safely: confirm, baseline, read-back<\/a><\/li>\n<li><a href=\"#a061\">061 Run one request on many devices and compare<\/a><\/li>\n<li><a href=\"#a062\">062 SUNAPI snapshots, history and capabilities<\/a><\/li>\n<li><a href=\"#a063\">063 Send reader firmware or config through a controller<\/a><\/li>\n<\/ul>", "text": "what the sunapi console does what the sunapi console is, what its tabs do and how it keeps device changes safe. for testers who used hanwha's windows sunapi test client.  summary the sunapi console ( tools › sunapi console ) sends sunapi requests to hanwha cameras, recorders and access controllers through the pi. it replaces hanwha's windows sunapi test client. where the menus come from the console doesn't carry a fixed list of commands. when you connect to a device, it reads the device's own attributes.cgi and builds the menu tree from it. each parameter gets a matching control, so any model works without an aether update. the tabs tab what it does devices saved devices, grouped as camera, recorder, access control or other. scan the network and add devices. tick devices to send one request to many. explorer pick a menu and action, fill in parameters, preview the url and send. capabilities what the device says it supports, including per-channel attributes. history your last 150 requests to each device, kept on the pi, with passwords masked. snapshots capture every readable setting, then compare before/after or one device against another. reader file send reader firmware or a reader config file through an access controller. confirm the tab names and order on the current pi build. how it keeps changes safe read actions ( view ) are sent straight away. any other action asks you to confirm first. the pi also refuses a change that wasn't confirmed. risky actions , such as factory reset, power, firmware, network, users and remove, also need you to tick i understand . actions that move real hardware , such as door, alarm output and reader commands, show a note before you send them. only changed fields are sent. after a change, the console reads the menu back and checks each value. logins and data device passwords are kept on the pi only and are never sent back to the browser. copy as curl leaves the password out. devices, history and snapshots are stored on the pi. when you send one request to many devices, the pi runs it on 8 devices at a time. related articles 058 find hanwha devices with scan 059 send a sunapi request with the explorer 060 change device settings safely: confirm, baseline, read-back 061 run one request on many devices and compare 062 sunapi snapshots, history and capabilities 063 send reader firmware or config through a controller "}, {"id": "a058", "num": "058", "title": "Find Hanwha devices with Scan", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to find Hanwha cameras, recorders and access controllers on the network with the SUNAPI Console scan and add them in one step. For testers setting up a bench.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p><strong>Scan<\/strong> finds Hanwha devices without logging in to them. It listens for ONVIF discovery replies and sweeps the addresses you give on ports 80 and 443, recognising SUNAPI devices by how they answer. You can then add the devices you pick with one shared login.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether's SUNAPI Console update is installed and <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> opens.<\/li>\n<li>The address range of the devices, for example <code>&lt;subnet&gt;/24<\/code>.<\/li>\n<li>ONVIF discovery only reaches devices on the same network segment (VLAN) as the Pi. The address sweep also works across routed subnets.<\/li>\n<\/ul>\n<h2>Scan the network<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> and go to the <strong>Devices<\/strong> tab.<\/li>\n<li>Find <strong>Scan the network<\/strong>.<\/li>\n<li>In <strong>Addresses<\/strong>, type what to sweep: a CIDR range from /21 to /32, a range such as <code>&lt;first-ip&gt;-&lt;last-ip&gt;<\/code>, or single IPs. Up to 2048 addresses per scan.<\/li>\n<li>Leave <strong>Ports<\/strong> at <code>80, 443<\/code>. Port 443 is HTTPS, which access controllers often require.<\/li>\n<li>Leave ONVIF discovery on.<\/li>\n<li>Optional: turn on identify and enter a username and password. Aether makes one login attempt per confirmed SUNAPI device and reads its model and firmware.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Scan the network with Addresses, Ports and the identify option filled in<\/span><\/div>\n<ol start=\"7\">\n<li>Start the scan. <span class=\"sme\">confirm the scan button label.<\/span><\/li>\n<\/ol>\n<h2>Add the devices you found<\/h2>\n<ol>\n<li>Check the results. The top line counts devices per type, for example \"3 Cameras · 1 Access control\".<\/li>\n<li>Tick the devices to add. Devices that answered SUNAPI are ticked for you.<\/li>\n<li>Enter the shared username and password.<\/li>\n<li>Click the add button. <span class=\"sme\">confirm the add button label.<\/span><\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The new devices appear under <strong>Devices<\/strong>, grouped by type.<\/li>\n<li>Access controllers land under <strong>Access control<\/strong>. If one lands under the wrong type, change it in the device's settings.<\/li>\n<li>Connect to a device. A device saved as HTTP that redirects to HTTPS is switched to HTTPS automatically.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Access controllers are missing<\/td>\n<td>Turn off <strong>Only SUNAPI / Hanwha<\/strong> and read the device's <strong>Answered:<\/strong> line. See <a href=\"#a103\">103 SUNAPI scan misses access controllers<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>A device shows <strong>No SUNAPI answer<\/strong><\/td>\n<td>It announced itself over ONVIF but didn't answer on the ports scanned. Add its port to <strong>Ports<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Nothing is found across a router<\/td>\n<td>ONVIF doesn't cross subnets. Make sure <strong>Addresses<\/strong> covers the remote range.<\/td>\n<\/tr>\n<tr>\n<td>You need to change the scan settings after results appear<\/td>\n<td>Click <strong>Change options<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a><\/li>\n<li><a href=\"#a061\">061 Run one request on many devices and compare<\/a><\/li>\n<li><a href=\"#a103\">103 SUNAPI scan misses access controllers<\/a><\/li>\n<\/ul>", "text": "find hanwha devices with scan how to find hanwha cameras, recorders and access controllers on the network with the sunapi console scan and add them in one step. for testers setting up a bench.  summary scan finds hanwha devices without logging in to them. it listens for onvif discovery replies and sweeps the addresses you give on ports 80 and 443, recognising sunapi devices by how they answer. you can then add the devices you pick with one shared login. before you start aether's sunapi console update is installed and tools › sunapi console opens. the address range of the devices, for example <subnet>/24 . onvif discovery only reaches devices on the same network segment (vlan) as the pi. the address sweep also works across routed subnets. scan the network open tools › sunapi console and go to the devices tab. find scan the network . in addresses , type what to sweep: a cidr range from /21 to /32, a range such as <first-ip>-<last-ip> , or single ips. up to 2048 addresses per scan. leave ports at 80, 443 . port 443 is https, which access controllers often require. leave onvif discovery on. optional: turn on identify and enter a username and password. aether makes one login attempt per confirmed sunapi device and reads its model and firmware. screenshot to add: scan the network with addresses, ports and the identify option filled in start the scan. confirm the scan button label. add the devices you found check the results. the top line counts devices per type, for example \"3 cameras · 1 access control\". tick the devices to add. devices that answered sunapi are ticked for you. enter the shared username and password. click the add button. confirm the add button label. check that it worked the new devices appear under devices , grouped by type. access controllers land under access control . if one lands under the wrong type, change it in the device's settings. connect to a device. a device saved as http that redirects to https is switched to https automatically. if something goes wrong symptom what to do access controllers are missing turn off only sunapi / hanwha and read the device's answered: line. see 103 sunapi scan misses access controllers . a device shows no sunapi answer it announced itself over onvif but didn't answer on the ports scanned. add its port to ports . nothing is found across a router onvif doesn't cross subnets. make sure addresses covers the remote range. you need to change the scan settings after results appear click change options . related articles 057 what the sunapi console does 059 send a sunapi request with the explorer 061 run one request on many devices and compare 103 sunapi scan misses access controllers "}, {"id": "a059", "num": "059", "title": "Send a SUNAPI request with the Explorer", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to pick a SUNAPI menu in the Explorer, fill in its parameters and send it to a Hanwha device. For testers who need to read or check device settings.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Explorer<\/strong> tab builds a SUNAPI request for you. You pick a CGI, a menu and an action from the device's own list, fill in typed controls, and send. It shows the exact URL first, so you can also copy it or copy a ready-made curl command. Start with <code>view<\/code> actions, which only read.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The device is saved in the SUNAPI Console. See <a href=\"#a058\">058 Find Hanwha devices with Scan<\/a>.<\/li>\n<\/ul>\n<h2>Connect to the device<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong>.<\/li>\n<li>Pick the device in the device bar.<\/li>\n<li>Click <strong>Connect<\/strong>. The Console logs in and reads the device's menu list.<\/li>\n<\/ol>\n<h2>Build and send a request<\/h2>\n<ol>\n<li>Go to the <strong>Explorer<\/strong> tab.<\/li>\n<li>Type part of a menu name in the search box. Press <code>/<\/code> to jump to the search box. Exact menu names are listed first.<\/li>\n<li>Pick the CGI, menu and action. For a first try, pick <code>view<\/code>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Explorer with a view action selected, parameter controls and the URL preview<\/span><\/div>\n<ol start=\"4\">\n<li>Fill in the parameters. Each control shows the values the device allows.<\/li>\n<li>Check the URL preview.<\/li>\n<li>Choose <strong>JSON<\/strong> or <strong>Text<\/strong> for the answer format.<\/li>\n<li>Send the request. <span class=\"sme\">confirm the send button label; it may include the action name.<\/span><\/li>\n<\/ol>\n<h2>Copy the request<\/h2>\n<ul>\n<li>Copy the URL to paste into a browser or a bug report.<\/li>\n<li>Use <strong>Copy as curl<\/strong> to run the same request from a terminal. The password is left out, so curl asks for it.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The response appears below the request with its status code and the device's answer.<\/li>\n<li>The request is added to the device's <strong>History<\/strong> tab.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Connect to load the device's menus<\/strong><\/td>\n<td>The device is not connected. Click <strong>Connect<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Login fails<\/td>\n<td>Edit the device and save its password again.<\/td>\n<\/tr>\n<tr>\n<td>The menu you need is missing<\/td>\n<td>The device doesn't support it. Check the <strong>Capabilities<\/strong> tab.<\/td>\n<\/tr>\n<tr>\n<td>An action asks you to confirm<\/td>\n<td>It changes the device. See <a href=\"#a060\">060 Change device settings safely: confirm, baseline, read-back<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a058\">058 Find Hanwha devices with Scan<\/a><\/li>\n<li><a href=\"#a060\">060 Change device settings safely: confirm, baseline, read-back<\/a><\/li>\n<li><a href=\"#a062\">062 SUNAPI snapshots, history and capabilities<\/a><\/li>\n<\/ul>", "text": "send a sunapi request with the explorer how to pick a sunapi menu in the explorer, fill in its parameters and send it to a hanwha device. for testers who need to read or check device settings.  summary the explorer tab builds a sunapi request for you. you pick a cgi, a menu and an action from the device's own list, fill in typed controls, and send. it shows the exact url first, so you can also copy it or copy a ready-made curl command. start with view actions, which only read. before you start the device is saved in the sunapi console. see 058 find hanwha devices with scan . connect to the device open tools › sunapi console . pick the device in the device bar. click connect . the console logs in and reads the device's menu list. build and send a request go to the explorer tab. type part of a menu name in the search box. press / to jump to the search box. exact menu names are listed first. pick the cgi, menu and action. for a first try, pick view . screenshot to add: explorer with a view action selected, parameter controls and the url preview fill in the parameters. each control shows the values the device allows. check the url preview. choose json or text for the answer format. send the request. confirm the send button label; it may include the action name. copy the request copy the url to paste into a browser or a bug report. use copy as curl to run the same request from a terminal. the password is left out, so curl asks for it. check that it worked the response appears below the request with its status code and the device's answer. the request is added to the device's history tab. if something goes wrong symptom what to do connect to load the device's menus the device is not connected. click connect . login fails edit the device and save its password again. the menu you need is missing the device doesn't support it. check the capabilities tab. an action asks you to confirm it changes the device. see 060 change device settings safely: confirm, baseline, read-back . related articles 057 what the sunapi console does 058 find hanwha devices with scan 060 change device settings safely: confirm, baseline, read-back 062 sunapi snapshots, history and capabilities "}, {"id": "a060", "num": "060", "title": "Change device settings safely: confirm, baseline, read-back", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to change a Hanwha device setting from the SUNAPI Console so only the fields you changed are sent and the result is checked. For testers who change camera or controller settings.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)"], "html": "<h2>Summary<\/h2>\n<p>Changing a device setting by hand risks sending a value you didn't mean to change. The SUNAPI Console avoids that in three ways. It loads the device's current values as a <em>baseline<\/em>, so only fields you edit are sent. It asks you to confirm before any change. After the change, it reads the menu back and checks that each value stuck.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The device is saved and connected. See <a href=\"#a058\">058 Find Hanwha devices with Scan<\/a> and <a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a>.<\/li>\n<li>Know which setting you want to change and what it should be.<\/li>\n<\/ul>\n<h2>Load the current values<\/h2>\n<ol>\n<li>Go to the <strong>Explorer<\/strong> tab and pick the menu.<\/li>\n<li>Pick the action that changes it, for example <code>set<\/code> or <code>update<\/code>.<\/li>\n<li>Click <strong>Fill from current values<\/strong> (or <strong>Edit these values<\/strong> from a <code>view<\/code> answer). The controls now show what the device has.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Explorer set action with fields filled from current values and one field changed<\/span><\/div>\n<ol start=\"4\">\n<li>Change only the fields you need. Identifiers such as <strong>Channel<\/strong> are always sent with them.<\/li>\n<\/ol>\n<h2>Send and confirm<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> These requests change the real device. A network change can make the device unreachable. Door, alarm output and reader commands move real hardware; the Console shows a note before you send them.<\/p>\n<ol>\n<li>Send the request.<\/li>\n<li>Read the confirmation. It shows what will change.<\/li>\n<li>If the action is risky (factory reset, power, firmware, network, users, remove and similar), tick <strong>I understand<\/strong>.<\/li>\n<li>Confirm.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>After the change, the Console reads the menu back. <strong>Read back: all stuck<\/strong> means every value took. Any value that didn't take is listed.<\/li>\n<li>The before and after values show side by side.<\/li>\n<li>The request is saved in the device's <strong>History<\/strong> with passwords masked.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A value didn't stick<\/td>\n<td>The device may round or refuse it. Check the allowed range in the control and try again.<\/td>\n<\/tr>\n<tr>\n<td>The device stops answering after a network change<\/td>\n<td>Find it again with a scan, or reach it at its new address.<\/td>\n<\/tr>\n<tr>\n<td>You need to undo a change<\/td>\n<td>Open <strong>History<\/strong>, open the earlier request, and send the old values back. A snapshot taken before the change makes this easy. See <a href=\"#a062\">062 SUNAPI snapshots, history and capabilities<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a><\/li>\n<li><a href=\"#a061\">061 Run one request on many devices and compare<\/a><\/li>\n<li><a href=\"#a062\">062 SUNAPI snapshots, history and capabilities<\/a><\/li>\n<\/ul>", "text": "change device settings safely: confirm, baseline, read-back how to change a hanwha device setting from the sunapi console so only the fields you changed are sent and the result is checked. for testers who change camera or controller settings.  summary changing a device setting by hand risks sending a value you didn't mean to change. the sunapi console avoids that in three ways. it loads the device's current values as a baseline , so only fields you edit are sent. it asks you to confirm before any change. after the change, it reads the menu back and checks that each value stuck. before you start the device is saved and connected. see 058 find hanwha devices with scan and 059 send a sunapi request with the explorer . know which setting you want to change and what it should be. load the current values go to the explorer tab and pick the menu. pick the action that changes it, for example set or update . click fill from current values (or edit these values from a view answer). the controls now show what the device has. screenshot to add: explorer set action with fields filled from current values and one field changed change only the fields you need. identifiers such as channel are always sent with them. send and confirm caution: these requests change the real device. a network change can make the device unreachable. door, alarm output and reader commands move real hardware; the console shows a note before you send them. send the request. read the confirmation. it shows what will change. if the action is risky (factory reset, power, firmware, network, users, remove and similar), tick i understand . confirm. check that it worked after the change, the console reads the menu back. read back: all stuck means every value took. any value that didn't take is listed. the before and after values show side by side. the request is saved in the device's history with passwords masked. if something goes wrong symptom what to do a value didn't stick the device may round or refuse it. check the allowed range in the control and try again. the device stops answering after a network change find it again with a scan, or reach it at its new address. you need to undo a change open history , open the earlier request, and send the old values back. a snapshot taken before the change makes this easy. see 062 sunapi snapshots, history and capabilities . related articles 057 what the sunapi console does 059 send a sunapi request with the explorer 061 run one request on many devices and compare 062 sunapi snapshots, history and capabilities "}, {"id": "a061", "num": "061", "title": "Run one request on many devices and compare", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to send the same SUNAPI request to several Hanwha devices at once and compare their answers side by side. For testers checking a fleet for odd settings.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)"], "html": "<h2>Summary<\/h2>\n<p>The SUNAPI Console can send one request to many devices at once. The device you have open supplies the menus, and the same request goes to every device you ticked. For a <code>view<\/code>, the answers come back as one <strong>Compare<\/strong> table, so a device with a different setting stands out. For a change, each device is confirmed and read back on its own.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The devices are saved in the Console. See <a href=\"#a058\">058 Find Hanwha devices with Scan<\/a>.<\/li>\n<li>The device you open first should be the same model as the others, or at least support the menu you want.<\/li>\n<\/ul>\n<h2>Pick the devices<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> and go to <strong>Devices<\/strong>.<\/li>\n<li>Tick each device that should get the request.<\/li>\n<li>Pick and connect the main device. Its menus are used for the request.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Devices tab with three devices ticked as targets<\/span><\/div>\n<h2>Compare a setting across devices<\/h2>\n<ol>\n<li>Go to <strong>Explorer<\/strong> and pick a <code>view<\/code> action.<\/li>\n<li>Send it. The Pi sends it to all ticked devices, 8 at a time.<\/li>\n<li>Open the <strong>Compare<\/strong> table. Rows are fields, columns are devices. Values that differ from most devices are highlighted.<\/li>\n<li>Export the table as CSV if you need to attach it to a report.<\/li>\n<\/ol>\n<p><span class=\"sme\">confirm the label of the Compare view and whether \"Only differences\" is on by default.<\/span><\/p>\n<h2>Change a setting on many devices<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> A changing action goes to every ticked device at once. Check the target list in the confirmation before you send.<\/p>\n<ol>\n<li>Pick the changing action and fill in the values.<\/li>\n<li>Send it. The confirmation lists every target device.<\/li>\n<li>Confirm, ticking <strong>I understand<\/strong> if asked.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Each device is read back on its own. The result says how many stuck, for example \"4 of 5 stuck\", and names the device and value that didn't.<\/li>\n<li>Devices that don't support that menu or action are skipped with a note instead of failing.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A device is skipped<\/td>\n<td>It's a different model or doesn't have that menu. Connect to it once so the Console reads its menus, or send to it separately.<\/td>\n<\/tr>\n<tr>\n<td>One device times out<\/td>\n<td>Check that it answers on its own in <strong>Explorer<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a058\">058 Find Hanwha devices with Scan<\/a><\/li>\n<li><a href=\"#a060\">060 Change device settings safely: confirm, baseline, read-back<\/a><\/li>\n<li><a href=\"#a062\">062 SUNAPI snapshots, history and capabilities<\/a><\/li>\n<\/ul>", "text": "run one request on many devices and compare how to send the same sunapi request to several hanwha devices at once and compare their answers side by side. for testers checking a fleet for odd settings.  summary the sunapi console can send one request to many devices at once. the device you have open supplies the menus, and the same request goes to every device you ticked. for a view , the answers come back as one compare table, so a device with a different setting stands out. for a change, each device is confirmed and read back on its own. before you start the devices are saved in the console. see 058 find hanwha devices with scan . the device you open first should be the same model as the others, or at least support the menu you want. pick the devices open tools › sunapi console and go to devices . tick each device that should get the request. pick and connect the main device. its menus are used for the request. screenshot to add: devices tab with three devices ticked as targets compare a setting across devices go to explorer and pick a view action. send it. the pi sends it to all ticked devices, 8 at a time. open the compare table. rows are fields, columns are devices. values that differ from most devices are highlighted. export the table as csv if you need to attach it to a report. confirm the label of the compare view and whether \"only differences\" is on by default. change a setting on many devices caution: a changing action goes to every ticked device at once. check the target list in the confirmation before you send. pick the changing action and fill in the values. send it. the confirmation lists every target device. confirm, ticking i understand if asked. check that it worked each device is read back on its own. the result says how many stuck, for example \"4 of 5 stuck\", and names the device and value that didn't. devices that don't support that menu or action are skipped with a note instead of failing. if something goes wrong symptom what to do a device is skipped it's a different model or doesn't have that menu. connect to it once so the console reads its menus, or send to it separately. one device times out check that it answers on its own in explorer . related articles 057 what the sunapi console does 058 find hanwha devices with scan 060 change device settings safely: confirm, baseline, read-back 062 sunapi snapshots, history and capabilities "}, {"id": "a062", "num": "062", "title": "SUNAPI snapshots, history and capabilities", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How to use SUNAPI Console snapshots to capture and compare device settings, and how to use History and Capabilities. For testers who need before-and-after evidence.", "sources": ["claude/sunapi-console.md", "AETHER device communication features (chat)"], "html": "<h2>Summary<\/h2>\n<p>Three tabs help you keep track of device settings. <strong>Snapshots<\/strong> capture every readable setting on one or more devices so you can compare before and after a change, or one device against another. <strong>History<\/strong> keeps your recent requests to each device. <strong>Capabilities<\/strong> shows what the device says it supports. You can also open a saved <code>attributes.xml<\/code> file without a device.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The device is saved and connected. See <a href=\"#a058\">058 Find Hanwha devices with Scan<\/a>.<\/li>\n<\/ul>\n<h2>Take a snapshot<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> and pick the device. Tick more devices to capture them too.<\/li>\n<li>Go to the <strong>Snapshots<\/strong> tab.<\/li>\n<li>Take a snapshot. The Console runs every <code>view<\/code> the device offers and stores the answers on the Pi. <span class=\"sme\">confirm the capture button label.<\/span><\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Snapshots tab with two snapshots listed and a compare result<\/span><\/div>\n<p>The Pi keeps the last 40 snapshots.<\/p>\n<h2>Compare snapshots<\/h2>\n<ol>\n<li>Pick two snapshots: before and after a change on one device, or the same time on two devices.<\/li>\n<li>Read the differences.<\/li>\n<li>Export them as CSV if you need them in a report.<\/li>\n<\/ol>\n<h2>Use History<\/h2>\n<ol>\n<li>Go to the <strong>History<\/strong> tab.<\/li>\n<li>Find the request. History keeps the last 150 requests per device, on the Pi. Passwords are masked.<\/li>\n<li>Open a request to load it back into <strong>Explorer<\/strong>, where you can send it again.<\/li>\n<\/ol>\n<h2>Check what a device supports<\/h2>\n<ol>\n<li>Go to the <strong>Capabilities<\/strong> tab.<\/li>\n<li>Read the device's capability list, including per-channel attributes for multi-channel devices.<\/li>\n<\/ol>\n<p>To read a device's menus without the device, open a saved <code>attributes.xml<\/code> file from the Console. It also accepts XML copied from a browser. <span class=\"sme\">confirm where the open-file option sits on the current build.<\/span><\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>New snapshots appear in the list with the time and device.<\/li>\n<li>A comparison lists each field that differs, with both values.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Snapshots<\/strong> or <strong>History<\/strong> is greyed out<\/td>\n<td>Pick a saved device. These tabs don't work on an opened file.<\/td>\n<\/tr>\n<tr>\n<td>A snapshot is missing a menu<\/td>\n<td>The device didn't answer that <code>view<\/code>. Try it alone in <strong>Explorer<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a><\/li>\n<li><a href=\"#a060\">060 Change device settings safely: confirm, baseline, read-back<\/a><\/li>\n<li><a href=\"#a061\">061 Run one request on many devices and compare<\/a><\/li>\n<\/ul>", "text": "sunapi snapshots, history and capabilities how to use sunapi console snapshots to capture and compare device settings, and how to use history and capabilities. for testers who need before-and-after evidence.  summary three tabs help you keep track of device settings. snapshots capture every readable setting on one or more devices so you can compare before and after a change, or one device against another. history keeps your recent requests to each device. capabilities shows what the device says it supports. you can also open a saved attributes.xml file without a device. before you start the device is saved and connected. see 058 find hanwha devices with scan . take a snapshot open tools › sunapi console and pick the device. tick more devices to capture them too. go to the snapshots tab. take a snapshot. the console runs every view the device offers and stores the answers on the pi. confirm the capture button label. screenshot to add: snapshots tab with two snapshots listed and a compare result the pi keeps the last 40 snapshots. compare snapshots pick two snapshots: before and after a change on one device, or the same time on two devices. read the differences. export them as csv if you need them in a report. use history go to the history tab. find the request. history keeps the last 150 requests per device, on the pi. passwords are masked. open a request to load it back into explorer , where you can send it again. check what a device supports go to the capabilities tab. read the device's capability list, including per-channel attributes for multi-channel devices. to read a device's menus without the device, open a saved attributes.xml file from the console. it also accepts xml copied from a browser. confirm where the open-file option sits on the current build. check that it worked new snapshots appear in the list with the time and device. a comparison lists each field that differs, with both values. if something goes wrong symptom what to do snapshots or history is greyed out pick a saved device. these tabs don't work on an opened file. a snapshot is missing a menu the device didn't answer that view . try it alone in explorer . related articles 057 what the sunapi console does 059 send a sunapi request with the explorer 060 change device settings safely: confirm, baseline, read-back 061 run one request on many devices and compare "}, {"id": "a063", "num": "063", "title": "Send reader firmware or config through a controller", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to send reader firmware or a reader config file to an OSDP reader through a Hanwha access controller from the SUNAPI Console Reader file tab. For testers checking controller-driven file transfer.", "sources": ["claude/sunapi-console.md", "OSDP Trace tool app (chat)", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Reader file<\/strong> tab sends a reader firmware or config file to an access controller over SUNAPI. The controller passes it to the OSDP reader on the port you choose. This tests the controller's file transfer, not Aether's.<\/p>\n<p>The tab uses a temporary controller call (<code>msubmenu=credentialreader&amp;action=install<\/code>); the official file-transfer call is not implemented yet. One transfer runs per controller at a time. <span class=\"sme\">confirm whether the controller answers at once or only when the transfer ends.<\/span><\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The access controller is saved in the SUNAPI Console and connected. See <a href=\"#a058\">058 Find Hanwha devices with Scan<\/a>.<\/li>\n<li>For firmware, the reader and that controller port run at 38400 baud or faster. Config files also work at 9600 baud. To change a reader's baud, see <a href=\"#a071\">071 Change a reader's OSDP address or baud (COMSET)<\/a>.<\/li>\n<li>The file is in Aether's firmware library, or on your PC (up to 20 MB). See <a href=\"#a070\">070 Manage the reader firmware library<\/a>.<\/li>\n<\/ul>\n<h2>Choose the reader and file<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> and pick the controller.<\/li>\n<li>Go to the <strong>Reader file<\/strong> tab.<\/li>\n<li>In <strong>Reader port (Index)<\/strong>, type the controller's reader port, for example 1.<\/li>\n<li>In <strong>Reader on that port (Reader.Index)<\/strong>, type the reader, 0 for the first one.<\/li>\n<li>Under <strong>What you're sending<\/strong>, pick <strong>Reader firmware<\/strong> or <strong>Reader config file<\/strong>.<\/li>\n<li>Under <strong>File<\/strong>, pick <strong>Aether firmware library<\/strong> and select a file, or pick <strong>From this PC<\/strong> and click <strong>Choose file…<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Reader file tab with port, reader, file type and a library file selected<\/span><\/div>\n<ol start=\"7\">\n<li>Leave <strong>SUNAPI call<\/strong> on <strong>Temporary (action=install)<\/strong>.<\/li>\n<li>For firmware, tick that the reader and controller port are at <strong>38400 baud or faster<\/strong>.<\/li>\n<\/ol>\n<h2>Send the file<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> The reader rewrites its firmware and reboots. Don't power it off or unplug it while the transfer runs.<\/p>\n<ol>\n<li>Click <strong>Send firmware to reader<\/strong> (or <strong>Send config to reader<\/strong>).<\/li>\n<li>Read the confirmation, tick <strong>I understand<\/strong>, then click <strong>Yes, send<\/strong>.<\/li>\n<\/ol>\n<p>To watch the transfer, use OSDP Trace on a listen-only tap; don't let Aether poll the same bus. See <a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a>.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The status shows <strong>Uploading the file to the controller…<\/strong>, then <strong>File delivered to the controller, waiting for its answer…<\/strong> with an elapsed timer.<\/li>\n<li>It ends with <strong>Controller accepted the file<\/strong> or <strong>Controller refused the file<\/strong>.<\/li>\n<li>The device's <strong>History<\/strong> logs the file name, size and checksum.<\/li>\n<li>The reader comes back online with the new firmware version.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Controller refused the file<\/strong><\/td>\n<td>Read the controller's answer. Firmware below 38400 baud is refused.<\/td>\n<\/tr>\n<tr>\n<td>The transfer runs past <strong>Give up after<\/strong><\/td>\n<td>Raise the minutes (default 30, maximum 90) and try again. See <a href=\"#a098\">098 Reader firmware upload fails or stalls<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a070\">070 Manage the reader firmware library<\/a><\/li>\n<li><a href=\"#a071\">071 Change a reader's OSDP address or baud (COMSET)<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a098\">098 Reader firmware upload fails or stalls<\/a><\/li>\n<\/ul>", "text": "send reader firmware or config through a controller how to send reader firmware or a reader config file to an osdp reader through a hanwha access controller from the sunapi console reader file tab. for testers checking controller-driven file transfer.  summary the reader file tab sends a reader firmware or config file to an access controller over sunapi. the controller passes it to the osdp reader on the port you choose. this tests the controller's file transfer, not aether's. the tab uses a temporary controller call ( msubmenu=credentialreader&action=install ); the official file-transfer call is not implemented yet. one transfer runs per controller at a time. confirm whether the controller answers at once or only when the transfer ends. before you start the access controller is saved in the sunapi console and connected. see 058 find hanwha devices with scan . for firmware, the reader and that controller port run at 38400 baud or faster. config files also work at 9600 baud. to change a reader's baud, see 071 change a reader's osdp address or baud (comset) . the file is in aether's firmware library, or on your pc (up to 20 mb). see 070 manage the reader firmware library . choose the reader and file open tools › sunapi console and pick the controller. go to the reader file tab. in reader port (index) , type the controller's reader port, for example 1. in reader on that port (reader.index) , type the reader, 0 for the first one. under what you're sending , pick reader firmware or reader config file . under file , pick aether firmware library and select a file, or pick from this pc and click choose file… . screenshot to add: reader file tab with port, reader, file type and a library file selected leave sunapi call on temporary (action=install) . for firmware, tick that the reader and controller port are at 38400 baud or faster . send the file caution: the reader rewrites its firmware and reboots. don't power it off or unplug it while the transfer runs. click send firmware to reader (or send config to reader ). read the confirmation, tick i understand , then click yes, send . to watch the transfer, use osdp trace on a listen-only tap; don't let aether poll the same bus. see 017 read a conversation in osdp trace . check that it worked the status shows uploading the file to the controller… , then file delivered to the controller, waiting for its answer… with an elapsed timer. it ends with controller accepted the file or controller refused the file . the device's history logs the file name, size and checksum. the reader comes back online with the new firmware version. if something goes wrong symptom what to do controller refused the file read the controller's answer. firmware below 38400 baud is refused. the transfer runs past give up after raise the minutes (default 30, maximum 90) and try again. see 098 reader firmware upload fails or stalls . related articles 057 what the sunapi console does 070 manage the reader firmware library 071 change a reader's osdp address or baud (comset) 017 read a conversation in osdp trace 098 reader firmware upload fails or stalls "}, {"id": "a064", "num": "064", "title": "Add Aether to a VMS as an RTSP camera", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to add Aether's live status page to Hanwha Wave, Genetec Security Center or Milestone XProtect as a generic RTSP camera. For anyone showing Aether door states in a VMS.", "sources": ["Resistor calibration tool (chat)"], "html": "<h2>Summary<\/h2>\n<p><strong>VMS Stream<\/strong> turns Aether's status page (doors, elevator, I/O, OSDP traffic and events) into an RTSP video stream. You add it to a VMS as a generic RTSP camera, with no ONVIF and no login. The stream only runs while a VMS is watching, so it costs almost nothing when idle.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The <code>aether-stream<\/code> service is installed on the Pi.<\/li>\n<li>The VMS server can reach the Pi on TCP port 8554.<\/li>\n<li>The stream URL is <code>rtsp://&lt;pi-ip&gt;:8554/aether<\/code>. No username or password. Use TCP transport.<\/li>\n<\/ul>\n<h2>Find the URL in Aether<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>VMS Stream<\/strong>.<\/li>\n<li>Copy the RTSP URL shown on the page.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: VMS Stream panel with the RTSP URL, the status badge and the live preview<\/span><\/div>\n<p>The badge says <strong>Idle · starts when a VMS connects<\/strong> until a VMS opens the stream, then <strong>Streaming · N viewers<\/strong>.<\/p>\n<h2>Add it to Hanwha Wave<\/h2>\n<ol>\n<li>Choose <strong>Add Device<\/strong>.<\/li>\n<li>Paste <code>rtsp://&lt;pi-ip&gt;:8554/aether<\/code> in the address field.<\/li>\n<li>Leave the credentials blank.<\/li>\n<\/ol>\n<h2>Add it to Genetec Security Center<\/h2>\n<ol>\n<li>In Config Tool, add a video unit.<\/li>\n<li>Pick the generic <strong>RTSP<\/strong> manufacturer.<\/li>\n<li>Enter <code>&lt;pi-ip&gt;<\/code>, port 8554 and path <code>/aether<\/code>.<\/li>\n<\/ol>\n<h2>Add it to Milestone XProtect<\/h2>\n<ol>\n<li>In Management Client, choose <strong>Add hardware<\/strong>, then <strong>Manual<\/strong>.<\/li>\n<li>Pick the <strong>Universal 1 channel<\/strong> driver and enter <code>&lt;pi-ip&gt;<\/code>.<\/li>\n<li>On the camera, set RTSP port 8554, path <code>aether<\/code>, and transport RTP/RTSP/TCP.<\/li>\n<\/ol>\n<p>Menu names vary between VMS versions. <span class=\"sme\">confirm these steps against the VMS versions in your lab.<\/span><\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The tile shows the Aether status page within about 8 s. The first connect is slower because the capture starts then.<\/li>\n<li><strong class=\"path\">Tools<i>›<\/i>VMS Stream<\/strong> shows <strong>Streaming<\/strong> and counts the viewer.<\/li>\n<li>From any PC with ffmpeg, <code>ffprobe rtsp://&lt;pi-ip&gt;:8554/aether<\/code> reports <code>h264<\/code> at 1920x1080.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Black tile or <strong>Backend offline<\/strong> on the stream<\/td>\n<td>See <a href=\"#a099\">099 VMS shows a black tile or Backend offline<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>The VMS refuses the stream for its frame rate<\/td>\n<td>Some generic drivers want more than 2 fps. Raise <strong>FPS<\/strong>. See <a href=\"#a065\">065 VMS Stream settings: frame rate, bitrate, encoder<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>An old VMS entry uses <code>/live<\/code><\/td>\n<td>It still works. New entries should use <code>/aether<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a065\">065 VMS Stream settings: frame rate, bitrate, encoder<\/a><\/li>\n<li><a href=\"#a099\">099 VMS shows a black tile or Backend offline<\/a><\/li>\n<\/ul>", "text": "add aether to a vms as an rtsp camera how to add aether's live status page to hanwha wave, genetec security center or milestone xprotect as a generic rtsp camera. for anyone showing aether door states in a vms.  summary vms stream turns aether's status page (doors, elevator, i/o, osdp traffic and events) into an rtsp video stream. you add it to a vms as a generic rtsp camera, with no onvif and no login. the stream only runs while a vms is watching, so it costs almost nothing when idle. before you start the aether-stream service is installed on the pi. the vms server can reach the pi on tcp port 8554. the stream url is rtsp://<pi-ip>:8554/aether . no username or password. use tcp transport. find the url in aether open tools › vms stream . copy the rtsp url shown on the page. screenshot to add: vms stream panel with the rtsp url, the status badge and the live preview the badge says idle · starts when a vms connects until a vms opens the stream, then streaming · n viewers . add it to hanwha wave choose add device . paste rtsp://<pi-ip>:8554/aether in the address field. leave the credentials blank. add it to genetec security center in config tool, add a video unit. pick the generic rtsp manufacturer. enter <pi-ip> , port 8554 and path /aether . add it to milestone xprotect in management client, choose add hardware , then manual . pick the universal 1 channel driver and enter <pi-ip> . on the camera, set rtsp port 8554, path aether , and transport rtp/rtsp/tcp. menu names vary between vms versions. confirm these steps against the vms versions in your lab. check that it worked the tile shows the aether status page within about 8 s. the first connect is slower because the capture starts then. tools › vms stream shows streaming and counts the viewer. from any pc with ffmpeg, ffprobe rtsp://<pi-ip>:8554/aether reports h264 at 1920x1080. if something goes wrong symptom what to do black tile or backend offline on the stream see 099 vms shows a black tile or backend offline . the vms refuses the stream for its frame rate some generic drivers want more than 2 fps. raise fps . see 065 vms stream settings: frame rate, bitrate, encoder . an old vms entry uses /live it still works. new entries should use /aether . related articles 065 vms stream settings: frame rate, bitrate, encoder 099 vms shows a black tile or backend offline "}, {"id": "a065", "num": "065", "title": "VMS Stream settings: frame rate, bitrate, encoder", "area": "Network switch, SUNAPI and VMS", "type": "Reference", "audience": "User", "priority": "P3", "status": "Draft", "brief": "Reference for the VMS Stream settings file: frame rate, bitrate, resolution, encoder and page settings, with defaults. For anyone tuning the RTSP stream.", "sources": ["Resistor calibration tool (chat)"], "html": "<h2>Summary<\/h2>\n<p>The VMS Stream settings live in <code>/etc/aether-stream.conf<\/code> on the Pi. The defaults keep the stream light: 2 fps, 1920×1080, at most 400 kbps. Change a setting only when a VMS needs it, for example a generic driver that refuses 2 fps.<\/p>\n<h2>Settings<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Setting<\/th>\n<th>Default<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>FPS<\/code><\/td>\n<td><code>2<\/code><\/td>\n<td>Frames per second, 1–5. CPU use rises with it.<\/td>\n<\/tr>\n<tr>\n<td><code>BITRATE<\/code><\/td>\n<td><code>400k<\/code><\/td>\n<td>Bitrate ceiling. A page that isn't changing uses much less.<\/td>\n<\/tr>\n<tr>\n<td><code>WIDTH<\/code> / <code>HEIGHT<\/code><\/td>\n<td><code>1920<\/code> / <code>1080<\/code><\/td>\n<td>Capture size. The page is laid out for 1920×1080 and scales to fit.<\/td>\n<\/tr>\n<tr>\n<td><code>ENCODER<\/code><\/td>\n<td><code>x264<\/code><\/td>\n<td><code>x264<\/code> encodes in software. <code>hw<\/code> uses the hardware H.264 encoder on a Pi 4. The Pi 5 has no hardware H.264 encoder, so keep <code>x264<\/code> on Aether.<\/td>\n<\/tr>\n<tr>\n<td><code>STREAM_PAGE<\/code><\/td>\n<td><code>http://127.0.0.1:3001/stream<\/code><\/td>\n<td>The page that is captured. Add <code>?backend=&lt;pi-ip&gt;<\/code> to show another Aether unit.<\/td>\n<\/tr>\n<tr>\n<td><code>WARMUP_SECONDS<\/code><\/td>\n<td><code>6<\/code><\/td>\n<td>Time for the page to load before the first frame is sent.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Fixed behaviour, not in the file:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>URL<\/td>\n<td><code>rtsp://&lt;pi-ip&gt;:8554/aether<\/code> (old <code>/live<\/code> still works)<\/td>\n<\/tr>\n<tr>\n<td>Login<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>Transport<\/td>\n<td>TCP<\/td>\n<\/tr>\n<tr>\n<td>Video<\/td>\n<td>H.264, keyframe every 2 s<\/td>\n<\/tr>\n<tr>\n<td>Start and stop<\/td>\n<td>Starts on the first viewer; stops 30 s after the last viewer leaves<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Change a setting<\/h2>\n<ol>\n<li>Open the file on the Pi:<\/li>\n<\/ol>\n<p><code>bash\n   sudo nano /etc/aether-stream.conf<\/code><\/p>\n<ol start=\"2\">\n<li>Change the value, for example <code>FPS=5<\/code>, and save.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> The next step restarts the stream service. Every VMS tile showing Aether drops and reconnects.<\/p>\n<ol start=\"3\">\n<li>Restart the service:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-stream<\/code><\/p>\n<ol start=\"4\">\n<li>Check the stream starts:<\/li>\n<\/ol>\n<p><code>bash\n   journalctl -u aether-stream -f<\/code><\/p>\n<p>To preview the page without hardware, open <code>http://&lt;pi-ip&gt;:3001/stream?demo=8<\/code> in a browser (4, 8, 12 or 16 doors).<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a064\">064 Add Aether to a VMS as an RTSP camera<\/a><\/li>\n<li><a href=\"#a099\">099 VMS shows a black tile or Backend offline<\/a><\/li>\n<\/ul>", "text": "vms stream settings: frame rate, bitrate, encoder reference for the vms stream settings file: frame rate, bitrate, resolution, encoder and page settings, with defaults. for anyone tuning the rtsp stream.  summary the vms stream settings live in /etc/aether-stream.conf on the pi. the defaults keep the stream light: 2 fps, 1920×1080, at most 400 kbps. change a setting only when a vms needs it, for example a generic driver that refuses 2 fps. settings setting default what it does fps 2 frames per second, 1–5. cpu use rises with it. bitrate 400k bitrate ceiling. a page that isn't changing uses much less. width / height 1920 / 1080 capture size. the page is laid out for 1920×1080 and scales to fit. encoder x264 x264 encodes in software. hw uses the hardware h.264 encoder on a pi 4. the pi 5 has no hardware h.264 encoder, so keep x264 on aether. stream_page http://127.0.0.1:3001/stream the page that is captured. add ?backend=<pi-ip> to show another aether unit. warmup_seconds 6 time for the page to load before the first frame is sent. fixed behaviour, not in the file: item value url rtsp://<pi-ip>:8554/aether (old /live still works) login none transport tcp video h.264, keyframe every 2 s start and stop starts on the first viewer; stops 30 s after the last viewer leaves change a setting open the file on the pi: bash sudo nano /etc/aether-stream.conf change the value, for example fps=5 , and save. caution: the next step restarts the stream service. every vms tile showing aether drops and reconnects. restart the service: bash sudo systemctl restart aether-stream check the stream starts: bash journalctl -u aether-stream -f to preview the page without hardware, open http://<pi-ip>:3001/stream?demo=8 in a browser (4, 8, 12 or 16 doors). related articles 064 add aether to a vms as an rtsp camera 099 vms shows a black tile or backend offline "}, {"id": "a066", "num": "066", "title": "Install an Aether update (Device Firmware)", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "Shows how to install an Aether update bundle or a single file from Setup > Device Firmware, with no terminal. For anyone who keeps a kit up to date.", "sources": ["Device firmware tool development", "Aether features presentation", "Export Figma GUI guidelines", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> installs Aether updates from the browser. You drop an update file on the page, check what it will do, and press <strong>Apply<\/strong>. The page backs up the Aether folder first and puts the old version back on its own if the update fails.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have the update file: a <code>.tgz<\/code> or <code>.zip<\/code> bundle, for example <code>aether-update-NN.tgz<\/code>.<\/li>\n<li>No OSDP reader firmware upload is running. An update that restarts the backend is refused while one runs.<\/li>\n<li>Check the install order if you have more than one update. See <a href=\"#a068\">068 Install order and named update bundles<\/a>.<\/li>\n<\/ul>\n<h2>Install an update bundle<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong>.<\/li>\n<li>Drop the file on <strong>Update bundle<\/strong>, or click it and pick the file.<\/li>\n<li>Read what the page says the update will do: its name, the files it changes, and whether it rebuilds the pages or restarts the backend. Nothing has changed yet.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Device Firmware page with a staged update showing its title, file list and the Apply button<\/span><\/div>\n<ol start=\"4\">\n<li>Click <strong>Apply<\/strong>.<\/li>\n<li>Watch the log. It streams live and keeps going through the backend restart.<\/li>\n<li>Wait for the result line, for example \"Update applied.\"<\/li>\n<li>Press Ctrl+Shift+R to reload the pages.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> An update that restarts the backend stops reader emulation, OSDP polling and any running workflow for a short time. Do not apply one in the middle of a test.<\/p>\n<h2>Install a single file<\/h2>\n<ol>\n<li>Drop the file on <strong>Single file<\/strong>.<\/li>\n<li>Check the place the page found for it. It looks for where a file with that name already lives in the Aether folder.<\/li>\n<li>Pick what happens next: nothing, rebuild the pages, or restart the backend. The page picks what the file needs by default.<\/li>\n<li>Click <strong>Apply<\/strong>.<\/li>\n<\/ol>\n<p><span class=\"sme\">confirm the Single file option labels on the Pi.<\/span><\/p>\n<h2>What happens during an update<\/h2>\n<ol>\n<li>The Aether folder is backed up.<\/li>\n<li>The update runs: <code>apply.sh<\/code>, or the files are copied in.<\/li>\n<li>The pages are rebuilt and the backend restarts, if the update needs it.<\/li>\n<li>Aether must answer its health check twice within 60 s.<\/li>\n<li>If any step fails, the backup is restored and the result says the update was rolled back.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The job shows as successful in the history list.<\/li>\n<li>After Ctrl+Shift+R, the change the update describes is visible.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The page shows a one-time setup command<\/td>\n<td>Run <code>sudo bash backend/device-firmware/setup.sh<\/code> in the Aether folder on the Pi once.<\/td>\n<\/tr>\n<tr>\n<td>Result says rolled back<\/td>\n<td>The old version is back. Copy the log and send it to whoever built the update. See <a href=\"#a100\">100<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><code>apply.sh<\/code> says files changed and nothing was changed<\/td>\n<td>The update was built for an older copy of those files. Ask for a rebuilt update.<\/td>\n<\/tr>\n<tr>\n<td>Refused because a reader upload is running<\/td>\n<td>Wait for the upload to finish, then apply again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a067\">067 Update history, restore and automatic rollback<\/a><\/li>\n<li><a href=\"#a068\">068 Install order and named update bundles<\/a><\/li>\n<li><a href=\"#a074\">074 Keep Board Blueprints up to date<\/a><\/li>\n<li><a href=\"#a100\">100 An update failed or rolled back<\/a><\/li>\n<li><a href=\"#a093\">093 A tool page still shows the old version<\/a><\/li>\n<\/ul>", "text": "install an aether update (device firmware) shows how to install an aether update bundle or a single file from setup > device firmware, with no terminal. for anyone who keeps a kit up to date.  summary setup › device firmware installs aether updates from the browser. you drop an update file on the page, check what it will do, and press apply . the page backs up the aether folder first and puts the old version back on its own if the update fails. before you start you have the update file: a .tgz or .zip bundle, for example aether-update-nn.tgz . no osdp reader firmware upload is running. an update that restarts the backend is refused while one runs. check the install order if you have more than one update. see 068 install order and named update bundles . install an update bundle open setup › device firmware . drop the file on update bundle , or click it and pick the file. read what the page says the update will do: its name, the files it changes, and whether it rebuilds the pages or restarts the backend. nothing has changed yet. screenshot to add: device firmware page with a staged update showing its title, file list and the apply button click apply . watch the log. it streams live and keeps going through the backend restart. wait for the result line, for example \"update applied.\" press ctrl+shift+r to reload the pages. caution: an update that restarts the backend stops reader emulation, osdp polling and any running workflow for a short time. do not apply one in the middle of a test. install a single file drop the file on single file . check the place the page found for it. it looks for where a file with that name already lives in the aether folder. pick what happens next: nothing, rebuild the pages, or restart the backend. the page picks what the file needs by default. click apply . confirm the single file option labels on the pi. what happens during an update the aether folder is backed up. the update runs: apply.sh , or the files are copied in. the pages are rebuilt and the backend restarts, if the update needs it. aether must answer its health check twice within 60 s. if any step fails, the backup is restored and the result says the update was rolled back. check that it worked the job shows as successful in the history list. after ctrl+shift+r, the change the update describes is visible. if something goes wrong symptom what to do the page shows a one-time setup command run sudo bash backend/device-firmware/setup.sh in the aether folder on the pi once. result says rolled back the old version is back. copy the log and send it to whoever built the update. see 100 . apply.sh says files changed and nothing was changed the update was built for an older copy of those files. ask for a rebuilt update. refused because a reader upload is running wait for the upload to finish, then apply again. related articles 067 update history, restore and automatic rollback 068 install order and named update bundles 074 keep board blueprints up to date 100 an update failed or rolled back 093 a tool page still shows the old version "}, {"id": "a067", "num": "067", "title": "Update history, restore and automatic rollback", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "Explains the Device Firmware history list, how automatic rollback works and how to put a backup back with Restore. For anyone who installs Aether updates.", "sources": ["Device firmware tool development", "Aether features presentation", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Every job on <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> is kept in a history list with its log. Each update backs up the Aether folder first. If the update fails, the backup goes back on its own. You can also put the latest backup back yourself with <strong>Restore<\/strong>.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li><strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> is open.<\/li>\n<li>No OSDP reader firmware upload is running.<\/li>\n<\/ul>\n<h2>Read the history<\/h2>\n<ol>\n<li>Scroll to <strong>History and backups<\/strong> on the Device Firmware page. <span class=\"sme\">confirm the section title on the Pi<\/span><\/li>\n<li>Find the job. Each entry shows its name, time and result.<\/li>\n<li>Click the entry to open its log.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: History list with one successful update, one rolled-back update and a Restore button on the newest entry<\/span><\/div>\n<p>Results you may see:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Result<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Success<\/td>\n<td>The update was applied and Aether passed its health check.<\/td>\n<\/tr>\n<tr>\n<td>Failed<\/td>\n<td>The job stopped before changing anything, or a restore could not finish. Read the log.<\/td>\n<\/tr>\n<tr>\n<td>Rolled back<\/td>\n<td>Something failed after files changed. The backup was put back.<\/td>\n<\/tr>\n<tr>\n<td>Rollback failed<\/td>\n<td>The old files are back, but the backend did not answer. Check the backend on the Pi.<\/td>\n<\/tr>\n<tr>\n<td>Interrupted<\/td>\n<td>The job stopped part way, for example by a power cut.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>How automatic rollback works<\/h2>\n<ol>\n<li>Before an update changes anything, the whole Aether folder is backed up.<\/li>\n<li>After the update, Aether must answer its health check twice within 60 s.<\/li>\n<li>If <code>apply.sh<\/code> fails, the pages do not build, or the health check fails, the backup is restored and the backend restarted.<\/li>\n<\/ol>\n<p>Only one full backup is kept: the newest. When an update finishes, its backup replaces the previous one. The last 15 jobs stay in the history with their logs, but only the newest has <strong>Restore<\/strong>. A rollback puts back files the update changed; it doesn't delete files the update added.<\/p>\n<h2>Restore the latest backup<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Restore puts the whole Aether folder back to how it was before that update and may restart the backend. Stop any running test first.<\/p>\n<ol>\n<li>Find the newest update in the history list.<\/li>\n<li>Click <strong>Restore<\/strong> on that entry.<\/li>\n<li>Confirm. <span class=\"sme\">confirm whether Restore asks for confirmation<\/span><\/li>\n<li>Watch the log until it says \"Restored.\"<\/li>\n<li>Press Ctrl+Shift+R.<\/li>\n<\/ol>\n<p>Single-file installs keep their own small backup, so each file can be restored separately from its entry.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The restore job shows as successful.<\/li>\n<li>After reload, the change from the restored update is gone.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>Restore<\/strong> on an older entry<\/td>\n<td>Its backup was replaced by a newer one. Restore the newest, or reinstall an older update.<\/td>\n<\/tr>\n<tr>\n<td>Rollback failed<\/td>\n<td>Run <code>sudo journalctl -u aether-backend -n 60<\/code> on the Pi and send the output. See <a href=\"#a100\">100<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a068\">068 Install order and named update bundles<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a100\">100 An update failed or rolled back<\/a><\/li>\n<\/ul>", "text": "update history, restore and automatic rollback explains the device firmware history list, how automatic rollback works and how to put a backup back with restore. for anyone who installs aether updates.  summary every job on setup › device firmware is kept in a history list with its log. each update backs up the aether folder first. if the update fails, the backup goes back on its own. you can also put the latest backup back yourself with restore . before you start setup › device firmware is open. no osdp reader firmware upload is running. read the history scroll to history and backups on the device firmware page. confirm the section title on the pi find the job. each entry shows its name, time and result. click the entry to open its log. screenshot to add: history list with one successful update, one rolled-back update and a restore button on the newest entry results you may see: result meaning success the update was applied and aether passed its health check. failed the job stopped before changing anything, or a restore could not finish. read the log. rolled back something failed after files changed. the backup was put back. rollback failed the old files are back, but the backend did not answer. check the backend on the pi. interrupted the job stopped part way, for example by a power cut. how automatic rollback works before an update changes anything, the whole aether folder is backed up. after the update, aether must answer its health check twice within 60 s. if apply.sh fails, the pages do not build, or the health check fails, the backup is restored and the backend restarted. only one full backup is kept: the newest. when an update finishes, its backup replaces the previous one. the last 15 jobs stay in the history with their logs, but only the newest has restore . a rollback puts back files the update changed; it doesn't delete files the update added. restore the latest backup caution: restore puts the whole aether folder back to how it was before that update and may restart the backend. stop any running test first. find the newest update in the history list. click restore on that entry. confirm. confirm whether restore asks for confirmation watch the log until it says \"restored.\" press ctrl+shift+r. single-file installs keep their own small backup, so each file can be restored separately from its entry. check that it worked the restore job shows as successful. after reload, the change from the restored update is gone. if something goes wrong symptom what to do no restore on an older entry its backup was replaced by a newer one. restore the newest, or reinstall an older update. rollback failed run sudo journalctl -u aether-backend -n 60 on the pi and send the output. see 100 . related articles 066 install an aether update (device firmware) 068 install order and named update bundles 072 system & backup: health, backup and restore 100 an update failed or rolled back "}, {"id": "a068", "num": "068", "title": "Install order and named update bundles", "area": "Firmware, updates and system", "type": "Reference", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Reference for the kinds of Aether update bundles, how they are named, and the order to install them in. For anyone handling several updates.", "sources": ["Device firmware tool development", "Aether Board and Wiring tool", "Export Figma GUI guidelines", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Aether updates come as files you drop on <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong>. This page lists the bundle types, how their names appear on the page, and the order to install them in.<\/p>\n<h2>Bundle types<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>What is inside<\/th>\n<th>What the page does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Script bundle (<code>.tgz<\/code> or <code>.zip<\/code>)<\/td>\n<td>An <code>apply.sh<\/code> script plus the files it needs<\/td>\n<td>Backs up, runs <code>apply.sh<\/code>, checks health<\/td>\n<\/tr>\n<tr>\n<td>File bundle (<code>.tgz<\/code> or <code>.zip<\/code>)<\/td>\n<td>Plain <code>backend/…<\/code> and <code>frontend/…<\/code> files<\/td>\n<td>Backs up, copies the files in, rebuilds pages and restarts as needed, checks health<\/td>\n<\/tr>\n<tr>\n<td>Single file<\/td>\n<td>One file, for example a script<\/td>\n<td>Finds where it lives, puts it in place, then does nothing, rebuilds or restarts<\/td>\n<\/tr>\n<tr>\n<td>Board Blueprints bundle (<code>aether-update-blueprints-&lt;date&gt;.zip<\/code>)<\/td>\n<td>The Board Blueprints page and its installer<\/td>\n<td>As a script bundle; see <a href=\"#a074\">074<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Every bundle backs up the Aether folder first. After applying, Aether must answer its health check twice within 60 s, or the backup is restored.<\/p>\n<h2>How names appear<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>File<\/th>\n<th>Name on the page<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>apply.sh<\/code> with line 2 like <code># Update NN: title<\/code><\/td>\n<td>The title from that line, for example \"Update 82: Integrations tab\"<\/td>\n<\/tr>\n<tr>\n<td>Bundle without that line<\/td>\n<td>The file name<\/td>\n<\/tr>\n<tr>\n<td>Named bundles, for example <code>aether-update-https-1.tgz<\/code><\/td>\n<td>The title from <code>apply.sh<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Update numbers have collided before. Newer bundles are named, not numbered, for example SUNAPI-4, HTTPS-1 or ACADEMY-2.2. Before installing a numbered update, check <strong>History<\/strong> on the Device Firmware page for the latest number, and if two files claim the same number, ask which one is current.<\/p>\n<h2>Install order<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Install numbered Aether updates in number order<\/td>\n<td>Later updates are built on top of earlier ones and check the files they change<\/td>\n<\/tr>\n<tr>\n<td>Install Aether updates before Board Blueprints updates<\/td>\n<td>Aether updates check their files against the version they expect; Blueprints changes one line in a shared file<\/td>\n<\/tr>\n<tr>\n<td>An update that says files changed and stops needs a rebuild<\/td>\n<td>It was built for an older copy; nothing was changed<\/td>\n<\/tr>\n<tr>\n<td>Do not apply an update that restarts the backend during a reader firmware upload<\/td>\n<td>The page refuses it until the upload ends<\/td>\n<\/tr>\n<tr>\n<td>Reload with Ctrl+Shift+R after each update<\/td>\n<td>The browser may keep the old pages<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>What a refused update looks like<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Log line<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"STOPPED: these files changed since Update NN\"<\/td>\n<td>The update did not fit; nothing was changed. The page then rolls back as a precaution<\/td>\n<\/tr>\n<tr>\n<td>\"already in\"<\/td>\n<td>That part was installed before; running the update again is safe<\/td>\n<\/tr>\n<tr>\n<td>\"Refused: a reader firmwa
