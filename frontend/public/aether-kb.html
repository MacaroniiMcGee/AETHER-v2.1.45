 and make sure it is enabled.<\/td>\n<\/tr>\n<tr>\n<td>Controller reads the wrong number<\/td>\n<td>Check the format. Formats marked <strong>UNVERIFIED<\/strong> may need checking; see <a href=\"#a023\">023 The built-in card format library<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Reader shows offline while you send<\/td>\n<td>A firmware upload or Enrollment may have borrowed the port. Wait until it finishes.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a011\">011 Watch the controller's LED and buzzer commands<\/a><\/li>\n<li><a href=\"#a012\">012 Review OSDP reader history<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a026\">026 Save cards for quick reuse<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "present a card or pin on an emulated osdp reader how to send a card read or a pin from an emulated osdp reader to the controller, using the card composer on the emulate tab.  summary the emulate tab lets you present a card or a pin on any emulated osdp reader. aether builds the card bits from the format you pick and answers the controller's next poll with them. use it to check that the controller grants, denies or logs a credential as expected. before you start the controller is wired to the bus and polling the reader's address. see 014 assign a serial interface and baud rate . the reader is set up and enabled in readers › osdp › bus & readers . you know the format, facility code and card number the controller expects. present a card open readers › osdp and select the emulate tab. pick the reader in the reader list. this also picks its serial port. in the card composer, open the format picker. the common section lists the ten most-used formats; type to search the rest. enter the facility code and card # , plus il (issue level) if the format has one. values above the format's range are clamped to the maximum as you type. check the live bit strip under the fields. click send card . screenshot to add: emulate tab with the card composer, format picker open on common, bit strip below tapping the card zone on the on-screen reader sends the same credential as send card . present a pin stay on the emulate tab with the same reader selected. type the digits under quick pins . send the pin. aether answers the next poll with a keypad reply. check that it worked open readers › osdp trace and select conversation . find the poll that was answered with card read (or keypad ). the line shows the bit count and, for a known format, the facility code and card number. check the controller's event log for the grant or denial. a message in aether only means the card was queued. the trace shows when it went out. if something goes wrong symptom what to do aether says sent, but nothing in the trace the controller isn't polling that address. check address, port and baud. see 096 an osdp reader doesn't answer . send card is greyed out pick a reader and make sure it is enabled. controller reads the wrong number check the format. formats marked unverified may need checking; see 023 the built-in card format library . reader shows offline while you send a firmware upload or enrollment may have borrowed the port. wait until it finishes. related articles 009 how osdp reader emulation works 011 watch the controller's led and buzzer commands 012 review osdp reader history 017 read a conversation in osdp trace 023 the built-in card format library 026 save cards for quick reuse 096 an osdp reader doesn't answer "}, {"id": "a011", "num": "011", "title": "Watch the controller's LED and buzzer commands", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to see the LED and buzzer commands a controller sends to an emulated OSDP reader, using OSDP Trace. For testers checking grant and deny feedback.", "sources": ["OSDP Trace tool app (chat)", "Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Aether product QA testing (chat)", "Access devices enrollment (chat: OSDP Academy)"], "html": "<h2>Summary<\/h2>\n<p>After a card read, a controller usually tells the reader to flash its LED and beep: green for a grant, red for a denial. OSDP Trace decodes those commands into plain English. Use it to check that the controller gives the right feedback, and how fast.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The controller is polling an emulated reader. See <a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a>.<\/li>\n<li>OSDP Trace shows the emulated readers' bus.<\/li>\n<\/ul>\n<h2>Watch the commands in the Conversation tab<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> and select <strong>Conversation<\/strong>.<\/li>\n<li>Filter on the reader you are testing, and hide idle polling.<\/li>\n<li>Send a card from <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong>.<\/li>\n<li>Look for the lines that follow the card read:\n   - <strong>LED<\/strong> lines say which LED, the colour, whether it flashes, for how long, and the resting colour after. For example: \"LED: reader 0 LED 0 — show green, for 2 s, then steady green\".\n   - <strong>Buzzer<\/strong> lines give the tone, on and off time and the number of beeps.<\/li>\n<li>Click a line to open the byte inspector, which labels every byte.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Conversation tab, card read followed by LED and buzzer lines, byte inspector open<\/span><\/div>\n<h2>Check the timing in the Timeline tab<\/h2>\n<ol>\n<li>Select <strong>Timeline<\/strong>.<\/li>\n<li>Find the reader's strip. Card reads, LED changes, buzzer and NAKs each have their own mark.<\/li>\n<li>Compare the gap between the card read and the LED mark.<\/li>\n<\/ol>\n<h2>Make it a pass/fail test<\/h2>\n<ol>\n<li>Select <strong>Tests<\/strong>.<\/li>\n<li>Use the preloaded rule that expects an LED within 2 s of a card read, or add your own.<\/li>\n<li>Send cards and watch the rule score pass or fail live.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<p>A grant shows a green LED line within the time you expect; a denial shows red, often with beeps. The Tests tab scores each read.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No LED line after a card read<\/td>\n<td>The controller may not send one for this reader type. Check the controller's reader settings.<\/td>\n<\/tr>\n<tr>\n<td>LED reply is <strong>Refused (NAK)<\/strong><\/td>\n<td>Read the NAK reason in the line; an unknown command means the reader didn't support it.<\/td>\n<\/tr>\n<tr>\n<td>Tests rule edits disappear<\/td>\n<td>Finish editing before the next refresh, then save the rule. <span class=\"sme\">confirm how Tests rules are saved.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The <strong>Set LED<\/strong> and <strong>Trigger Buzzer<\/strong> controls on the Emulate tab only change the on-screen reader; nothing is sent to the controller. To see what the controller commanded, always use OSDP Trace.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a018\">018 OSDP Trace tabs: Conversation, Readers, Timeline, Tests<\/a><\/li>\n<li><a href=\"#a090\">090 Open OSDP Academy and use Live mode<\/a><\/li>\n<\/ul>", "text": "watch the controller's led and buzzer commands how to see the led and buzzer commands a controller sends to an emulated osdp reader, using osdp trace. for testers checking grant and deny feedback.  summary after a card read, a controller usually tells the reader to flash its led and beep: green for a grant, red for a denial. osdp trace decodes those commands into plain english. use it to check that the controller gives the right feedback, and how fast. before you start the controller is polling an emulated reader. see 010 present a card or pin on an emulated osdp reader . osdp trace shows the emulated readers' bus. watch the commands in the conversation tab open readers › osdp trace and select conversation . filter on the reader you are testing, and hide idle polling. send a card from readers › osdp › emulate . look for the lines that follow the card read: - led lines say which led, the colour, whether it flashes, for how long, and the resting colour after. for example: \"led: reader 0 led 0 — show green, for 2 s, then steady green\". - buzzer lines give the tone, on and off time and the number of beeps. click a line to open the byte inspector, which labels every byte. screenshot to add: conversation tab, card read followed by led and buzzer lines, byte inspector open check the timing in the timeline tab select timeline . find the reader's strip. card reads, led changes, buzzer and naks each have their own mark. compare the gap between the card read and the led mark. make it a pass/fail test select tests . use the preloaded rule that expects an led within 2 s of a card read, or add your own. send cards and watch the rule score pass or fail live. check that it worked a grant shows a green led line within the time you expect; a denial shows red, often with beeps. the tests tab scores each read. if something goes wrong symptom what to do no led line after a card read the controller may not send one for this reader type. check the controller's reader settings. led reply is refused (nak) read the nak reason in the line; an unknown command means the reader didn't support it. tests rule edits disappear finish editing before the next refresh, then save the rule. confirm how tests rules are saved. the set led and trigger buzzer controls on the emulate tab only change the on-screen reader; nothing is sent to the controller. to see what the controller commanded, always use osdp trace. related articles 010 present a card or pin on an emulated osdp reader 017 read a conversation in osdp trace 018 osdp trace tabs: conversation, readers, timeline, tests 090 open osdp academy and use live mode "}, {"id": "a012", "num": "012", "title": "Review OSDP reader history", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P3", "status": "Draft", "brief": "How to review what was sent from the emulated OSDP readers on the OSDP History tab, and where to look for the full bus record.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Access Controls tabs layout (chat)", "OSDP Trace tool app (chat)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>History<\/strong> tab on the OSDP page lists what you sent from the emulated readers: each card with its format, facility code and card number, and any send that failed. Use it to check what you did during a test. For what actually crossed the wire, use OSDP Trace.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>At least one card or PIN has been sent from <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong>.<\/li>\n<\/ul>\n<h2>Review the history<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong>.<\/li>\n<li>Select the <strong>History<\/strong> tab.<\/li>\n<li>Read the entries, newest first. A successful send shows a tick with the bit length, format, facility code and card number. A failed send shows a cross with the error.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: OSDP History tab with a few card entries and one failed send<\/span><\/div>\n<ol start=\"4\">\n<li>To compare with the controller's log, note the time of each entry.<\/li>\n<\/ol>\n<h2>Keep a record<\/h2>\n<p>The History tab is a quick view, not a long-term log. It is kept only in this browser tab, holds the last 100 entries and is cleared when you reload the page. To keep a record of a test:<\/p>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>.<\/li>\n<li>Save a capture, or export the trace. See <a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<p>Each card you sent appears once, with the values you entered in the Card Composer.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>History is empty after a reload<\/td>\n<td>Expected. Use OSDP Trace for a lasting record.<\/td>\n<\/tr>\n<tr>\n<td>Entry shows success but the controller saw nothing<\/td>\n<td>Success means the card was queued. Check OSDP Trace for the poll that carried it.<\/td>\n<\/tr>\n<tr>\n<td>Entry shows a cross<\/td>\n<td>Read the error, fix the reader or format, and send again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a><\/li>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<\/ul>", "text": "review osdp reader history how to review what was sent from the emulated osdp readers on the osdp history tab, and where to look for the full bus record.  summary the history tab on the osdp page lists what you sent from the emulated readers: each card with its format, facility code and card number, and any send that failed. use it to check what you did during a test. for what actually crossed the wire, use osdp trace. before you start at least one card or pin has been sent from readers › osdp › emulate . review the history open readers › osdp . select the history tab. read the entries, newest first. a successful send shows a tick with the bit length, format, facility code and card number. a failed send shows a cross with the error. screenshot to add: osdp history tab with a few card entries and one failed send to compare with the controller's log, note the time of each entry. keep a record the history tab is a quick view, not a long-term log. it is kept only in this browser tab, holds the last 100 entries and is cleared when you reload the page. to keep a record of a test: open readers › osdp trace . save a capture, or export the trace. see 019 export an osdp trace for a manufacturer . check that it worked each card you sent appears once, with the values you entered in the card composer. if something goes wrong symptom what to do history is empty after a reload expected. use osdp trace for a lasting record. entry shows success but the controller saw nothing success means the card was queued. check osdp trace for the poll that carried it. entry shows a cross read the error, fix the reader or format, and send again. related articles 010 present a card or pin on an emulated osdp reader 017 read a conversation in osdp trace 019 export an osdp trace for a manufacturer 009 how osdp reader emulation works "}, {"id": "a013", "num": "013", "title": "Add, edit and import OSDP readers (Bus & readers)", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to add, edit, enable and import emulated OSDP readers on the Bus & readers tab. For anyone preparing an OSDP test bench.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Access Controls tabs layout (chat)", "Aether product QA testing (chat)", "frontend/src/components/OSDPBusManager.tsx (2026-09-20 source)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Bus &amp; readers<\/strong> tab is where you manage the OSDP readers Aether emulates: which serial port each one is on, its address, and whether it is enabled. Set this up before you send cards, so the controller sees the readers it expects.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You know the address the controller expects for each reader (0–126).<\/li>\n<li>The RS-485 wiring from the controller goes to the onboard HAT port or a USB-RS485 adapter. See <a href=\"#a014\">014 Assign a serial interface and baud rate<\/a>.<\/li>\n<\/ul>\n<h2>Add a reader<\/h2>\n<p>The tab shows one card per bus (serial port), with its readers listed inside. Click <strong>Rescan<\/strong> if a USB-RS485 adapter you just plugged in is missing.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select the <strong>Bus &amp; readers<\/strong> tab.<\/li>\n<li>On the card for the right bus, click <strong>Add a reader to this bus<\/strong>.<\/li>\n<li>Enter a <strong>Name<\/strong> you will recognise, such as \"Door 1 entry\".<\/li>\n<li>Check the <strong>Address<\/strong>. Aether suggests the next free one; an address already used on this bus shows \"in use\". Don't use 127; it is the broadcast address.<\/li>\n<li>Set <strong>Secure<\/strong> to <strong>On<\/strong> or <strong>Off<\/strong>.<\/li>\n<li>Save the reader.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Bus &amp; readers tab with the reader list and the add-reader form open<\/span><\/div>\n<h2>Edit or disable a reader<\/h2>\n<ol>\n<li>In the reader list, click <strong>Edit<\/strong> on the reader.<\/li>\n<li>Change the <strong>Name<\/strong> or <strong>Address<\/strong>.<\/li>\n<li>To stop a reader answering polls without deleting it, set <strong>Status<\/strong> to <strong>Disabled<\/strong>.<\/li>\n<li>Click <strong>Save changes<\/strong>.<\/li>\n<\/ol>\n<p>Keep every reader you need enabled. <span class=\"sme\">confirm that disabled readers stay listed after a backend restart on the current build; earlier builds only reloaded enabled readers.<\/span><\/p>\n<h2>Export and import readers<\/h2>\n<ol>\n<li>Click <strong>Export<\/strong> at the top of the tab. Aether downloads <code>osdp-readers-&lt;date&gt;.json<\/code> with every bus, baud and reader.<\/li>\n<li>On the other Aether, open the same tab and click <strong>Import<\/strong>.<\/li>\n<li>Pick the JSON file.<\/li>\n<li>Review the preview of the changes. Tick <strong>Replace all<\/strong> only if readers that aren't in the file should be deleted.<\/li>\n<li>Click <strong>Apply<\/strong>.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> <strong>Replace all<\/strong> deletes readers on this Aether that aren't in the file.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The OSDP page header counts the enabled readers. The <strong>Readers<\/strong> badge in the sidebar shows the same number.<\/li>\n<li>In <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<i>›<\/i>Readers<\/strong>, each reader the controller polls shows as online.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Controller reports the reader offline<\/td>\n<td>Check address, port and baud. See <a href=\"#a096\">096 An OSDP reader doesn't answer<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Port can't be opened<\/td>\n<td>Another tool may hold it. See <a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a015\">015 Set or reset a reader's secure channel key (SCBK)<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<li><a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a><\/li>\n<\/ul>", "text": "add, edit and import osdp readers (bus & readers) how to add, edit, enable and import emulated osdp readers on the bus & readers tab. for anyone preparing an osdp test bench.  summary the bus & readers tab is where you manage the osdp readers aether emulates: which serial port each one is on, its address, and whether it is enabled. set this up before you send cards, so the controller sees the readers it expects. before you start you know the address the controller expects for each reader (0–126). the rs-485 wiring from the controller goes to the onboard hat port or a usb-rs485 adapter. see 014 assign a serial interface and baud rate . add a reader the tab shows one card per bus (serial port), with its readers listed inside. click rescan if a usb-rs485 adapter you just plugged in is missing. open readers › osdp and select the bus & readers tab. on the card for the right bus, click add a reader to this bus . enter a name you will recognise, such as \"door 1 entry\". check the address . aether suggests the next free one; an address already used on this bus shows \"in use\". don't use 127; it is the broadcast address. set secure to on or off . save the reader. screenshot to add: bus & readers tab with the reader list and the add-reader form open edit or disable a reader in the reader list, click edit on the reader. change the name or address . to stop a reader answering polls without deleting it, set status to disabled . click save changes . keep every reader you need enabled. confirm that disabled readers stay listed after a backend restart on the current build; earlier builds only reloaded enabled readers. export and import readers click export at the top of the tab. aether downloads osdp-readers-<date>.json with every bus, baud and reader. on the other aether, open the same tab and click import . pick the json file. review the preview of the changes. tick replace all only if readers that aren't in the file should be deleted. click apply . caution: replace all deletes readers on this aether that aren't in the file. check that it worked the osdp page header counts the enabled readers. the readers badge in the sidebar shows the same number. in readers › osdp trace › readers , each reader the controller polls shows as online. if something goes wrong symptom what to do controller reports the reader offline check address, port and baud. see 096 an osdp reader doesn't answer . port can't be opened another tool may hold it. see 097 \"port in use\" when starting the emulator or an upload . related articles 009 how osdp reader emulation works 014 assign a serial interface and baud rate 015 set or reset a reader's secure channel key (scbk) 010 present a card or pin on an emulated osdp reader 096 an osdp reader doesn't answer 097 \"port in use\" when starting the emulator or an upload "}, {"id": "a014", "num": "014", "title": "Assign a serial interface and baud rate", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to choose which serial port (onboard RS-485 or a USB-RS485 adapter) an emulated OSDP reader uses, and set the baud rate to match the controller.", "sources": ["IOAccessEmulator codebase review (chat)", "Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "frontend/src/components/OSDPBusManager.tsx (2026-09-20 source)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>Every emulated OSDP reader sits on one serial port. The port's baud rate must match the controller, or the controller sees noise instead of replies. Use this when you wire a new controller or move a reader to another bus.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The controller's RS-485 A/B pair is wired to the HAT's RS-485 terminals or to a USB-RS485 adapter plugged into the Pi.<\/li>\n<li>You know the controller's baud rate for that reader port.<\/li>\n<\/ul>\n<h2>Know your ports<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Port<\/th>\n<th>What it is<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>/dev/ttyAMA0<\/code><\/td>\n<td>The onboard RS-485 port on the IOplus HAT. It sets transmit direction in hardware.<\/td>\n<\/tr>\n<tr>\n<td><code>/dev/ttyACM…<\/code><\/td>\n<td>USB-RS485 adapters, one per adapter.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Supported baud rates: 9600, 19200, 38400, 57600, 115200 and 230400. The controller and Aether must use the same one.<\/p>\n<h2>Assign the port and baud<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Changing the port or baud of a reader that a live controller is polling makes it go offline at the controller until both sides match again.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select <strong>Bus &amp; readers<\/strong>.<\/li>\n<li>Find the card for the bus (port) the controller is wired to. Click <strong>Rescan<\/strong> if a USB adapter is missing.<\/li>\n<li>Add the reader on that bus, or edit it there.<\/li>\n<li>Save the reader.<\/li>\n<li>On the bus card, pick the <strong>Baud<\/strong> to match the controller and click <strong>Apply to bus<\/strong>. Baud applies to all readers on that bus.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Bus &amp; readers, one bus card with the Baud selector and Apply to bus<\/span><\/div>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> and select <strong>Readers<\/strong>.<\/li>\n<li>The reader shows online, with polls counting up and a short reply time.<\/li>\n<li>In <strong>Conversation<\/strong>, polls to that address are answered with <strong>ACK<\/strong>.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bytes arrive but can't be framed as OSDP<\/td>\n<td>The baud is wrong, or A and B are swapped. Check both.<\/td>\n<\/tr>\n<tr>\n<td>No traffic at all<\/td>\n<td>Check the wiring and that the controller is polling that port.<\/td>\n<\/tr>\n<tr>\n<td>Port in use<\/td>\n<td>A firmware upload or Enrollment has borrowed it. Wait, or see <a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Reader firmware upload is slow or fails<\/td>\n<td>Firmware over SUNAPI needs 38400 baud or faster.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>To change a real reader's own address or baud, use COMSET instead; see the related article.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a013\">013 Add, edit and import OSDP readers (Bus &amp; readers)<\/a><\/li>\n<li><a href=\"#a046\">046 Share a serial port between readers and the emulator<\/a><\/li>\n<li><a href=\"#a071\">071 Change a reader's OSDP address or baud (COMSET)<\/a><\/li>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "assign a serial interface and baud rate how to choose which serial port (onboard rs-485 or a usb-rs485 adapter) an emulated osdp reader uses, and set the baud rate to match the controller.  summary every emulated osdp reader sits on one serial port. the port's baud rate must match the controller, or the controller sees noise instead of replies. use this when you wire a new controller or move a reader to another bus. before you start the controller's rs-485 a/b pair is wired to the hat's rs-485 terminals or to a usb-rs485 adapter plugged into the pi. you know the controller's baud rate for that reader port. know your ports port what it is /dev/ttyama0 the onboard rs-485 port on the ioplus hat. it sets transmit direction in hardware. /dev/ttyacm… usb-rs485 adapters, one per adapter. supported baud rates: 9600, 19200, 38400, 57600, 115200 and 230400. the controller and aether must use the same one. assign the port and baud caution: changing the port or baud of a reader that a live controller is polling makes it go offline at the controller until both sides match again. open readers › osdp and select bus & readers . find the card for the bus (port) the controller is wired to. click rescan if a usb adapter is missing. add the reader on that bus, or edit it there. save the reader. on the bus card, pick the baud to match the controller and click apply to bus . baud applies to all readers on that bus. screenshot to add: bus & readers, one bus card with the baud selector and apply to bus check that it worked open readers › osdp trace and select readers . the reader shows online, with polls counting up and a short reply time. in conversation , polls to that address are answered with ack . if something goes wrong symptom what to do bytes arrive but can't be framed as osdp the baud is wrong, or a and b are swapped. check both. no traffic at all check the wiring and that the controller is polling that port. port in use a firmware upload or enrollment has borrowed it. wait, or see 097 \"port in use\" when starting the emulator or an upload . reader firmware upload is slow or fails firmware over sunapi needs 38400 baud or faster. to change a real reader's own address or baud, use comset instead; see the related article. related articles 009 how osdp reader emulation works 013 add, edit and import osdp readers (bus & readers) 046 share a serial port between readers and the emulator 071 change a reader's osdp address or baud (comset) 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters 096 an osdp reader doesn't answer "}, {"id": "a015", "num": "015", "title": "Set or reset a reader's secure channel key (SCBK)", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to set a custom secure channel key (SCBK) on an emulated OSDP reader, or reset it to the default key, so it matches the controller.", "sources": ["Aether product QA testing (chat)", "Access devices enrollment (chat: OSDP Academy)", "frontend/src/components/OSDPBusManager.tsx (2026-09-20 source)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>When OSDP Secure Channel is on, the controller and the reader must hold the same key, the SCBK. New readers start on the default install key, SCBK-D. Use this article to give an emulated reader the controller's site key, or to put it back on the default.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Secure Channel is turned on for the reader in <strong>Bus &amp; readers<\/strong>.<\/li>\n<li>You have the site key from the controller's configuration. Treat it as a secret: don't paste it into tickets, chats or captures.<\/li>\n<\/ul>\n<h2>Set a custom key<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> A key that doesn't match the controller stops the secure session, and the controller reports the reader offline or in a secure-channel fault.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select <strong>Bus &amp; readers<\/strong>.<\/li>\n<li>Click <strong>Edit<\/strong> on the reader.<\/li>\n<li>Under <strong>Secure channel key (SCBK)<\/strong>, enter the key as 32 hex characters (16 bytes). <strong>Random<\/strong> makes a new random key; leave the field blank to keep the current key.<\/li>\n<li>Click <strong>Save changes<\/strong>.<\/li>\n<\/ol>\n<p>The key is set on every emulated reader with the same address, on every port. Check which other readers share this address before you save.<\/p>\n<h2>Reset to the default key (SCBK-D)<\/h2>\n<ol>\n<li>Select the reader in <strong>Bus &amp; readers<\/strong>.<\/li>\n<li>Choose the reset-to-default option for its key. <span class=\"sme\">confirm the label.<\/span><\/li>\n<li>Confirm.<\/li>\n<\/ol>\n<p>Resetting works per address.<\/p>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> and select <strong>Conversation<\/strong>.<\/li>\n<li>Look for the four-step handshake: controller challenge, reader cryptogram, controller cryptogram, then \"session established\".<\/li>\n<li>After that, card reads show as encrypted, and the trace labels them so instead of showing garbage.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Conversation tab showing the Secure Channel handshake steps<\/span><\/div>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Handshake ends with <strong>REJECTED<\/strong><\/td>\n<td>The keys differ. Check the key on both sides, or reset both to SCBK-D.<\/td>\n<\/tr>\n<tr>\n<td>Trace notes <strong>Default key<\/strong><\/td>\n<td>The controller is using SCBK-D. Fine during install; use a site key in service.<\/td>\n<\/tr>\n<tr>\n<td>Repeated handshakes<\/td>\n<td>Points to key mismatch or reader resets. Check the key first.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a013\">013 Add, edit and import OSDP readers (Bus &amp; readers)<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "set or reset a reader's secure channel key (scbk) how to set a custom secure channel key (scbk) on an emulated osdp reader, or reset it to the default key, so it matches the controller.  summary when osdp secure channel is on, the controller and the reader must hold the same key, the scbk. new readers start on the default install key, scbk-d. use this article to give an emulated reader the controller's site key, or to put it back on the default. before you start secure channel is turned on for the reader in bus & readers . you have the site key from the controller's configuration. treat it as a secret: don't paste it into tickets, chats or captures. set a custom key caution: a key that doesn't match the controller stops the secure session, and the controller reports the reader offline or in a secure-channel fault. open readers › osdp and select bus & readers . click edit on the reader. under secure channel key (scbk) , enter the key as 32 hex characters (16 bytes). random makes a new random key; leave the field blank to keep the current key. click save changes . the key is set on every emulated reader with the same address, on every port. check which other readers share this address before you save. reset to the default key (scbk-d) select the reader in bus & readers . choose the reset-to-default option for its key. confirm the label. confirm. resetting works per address. check that it worked open readers › osdp trace and select conversation . look for the four-step handshake: controller challenge, reader cryptogram, controller cryptogram, then \"session established\". after that, card reads show as encrypted, and the trace labels them so instead of showing garbage. screenshot to add: conversation tab showing the secure channel handshake steps if something goes wrong symptom what to do handshake ends with rejected the keys differ. check the key on both sides, or reset both to scbk-d. trace notes default key the controller is using scbk-d. fine during install; use a site key in service. repeated handshakes points to key mismatch or reader resets. check the key first. related articles 009 how osdp reader emulation works 013 add, edit and import osdp readers (bus & readers) 017 read a conversation in osdp trace 096 an osdp reader doesn't answer "}, {"id": "a016", "num": "016", "title": "Enroll a card format from a real OSDP reader", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to plug a real OSDP reader into Aether, present cards, and save the card's bit layout as a new format. For engineers working out an unknown credential.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Aether product QA testing (chat)", "OSDP enrollment multi-card diff (search)"], "html": "<h2>Summary<\/h2>\n<p><strong>Enrollment<\/strong> turns the Pi into the controller for a real OSDP reader. You present cards, Aether captures the exact bits, and it works out the format: from the library, from the number printed on the card, or by comparing several cards. You can then save the layout as your own format and send it from any emulated reader.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A real OSDP reader in plain (non-secure) mode, powered, and wired to a USB-RS485 adapter or the onboard port.<\/li>\n<li>The reader's address and baud, if you know them.<\/li>\n<li>Ideally, a few cards with their printed facility code and card number.<\/li>\n<\/ul>\n<p class=\"caution\"><strong>Caution:<\/strong> Starting Enrollment on a port takes that port away from reader emulation until you click <strong>Stop<\/strong>. Emulated readers on that port stop answering their controller. Use a separate USB-RS485 adapter when you can.<\/p>\n<h2>Connect the reader<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select the <strong>Enrollment<\/strong> tab.<\/li>\n<li>Under <strong>Reader connection<\/strong>, pick the port.<\/li>\n<li>Set <strong>Baud<\/strong> and <strong>Address<\/strong>. If you don't know them, click <strong>Scan<\/strong>; it tries common settings and fills them in when a reader answers.<\/li>\n<li>Tick <strong>Toggle RTS for direction control<\/strong> only if a USB adapter needs it. The onboard port doesn't.<\/li>\n<li>Click <strong>Start<\/strong>. Use <strong>Start<\/strong>, not <strong>Diagnose<\/strong>; some readers only come online under steady polling.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Enrollment tab, Reader connection card with the Reader panel filled in<\/span><\/div>\n<ol start=\"6\">\n<li>Wait for the <strong>Reader<\/strong> panel to show the model, firmware, serial and capabilities, with <strong>Polls<\/strong> and <strong>replies<\/strong> counting.<\/li>\n<\/ol>\n<h2>Present cards<\/h2>\n<ol>\n<li>Answer the question about whether you know the numbers printed on the cards.<\/li>\n<li>If you do, enter each card number (and facility code), then present each card 3 times when asked.<\/li>\n<li>If you don't, present several different cards. The bits that change between them are the card number.<\/li>\n<\/ol>\n<h2>Identify and save the format<\/h2>\n<ol>\n<li>Read <strong>What this credential is<\/strong>. It lists library matches, a layout solved from your number, and a layout derived from the cards.<\/li>\n<li>Pick the best row and check the colour-coded bit map.<\/li>\n<li>Enter a name.<\/li>\n<li>Click <strong>Enroll format<\/strong>. It is saved as one of yours, tagged <strong>MINE<\/strong>.<\/li>\n<li>Click <strong>Stop<\/strong> to hand the port back to emulation.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<p>Open the format picker on <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong>. Your format is in the list, tagged <strong>MINE<\/strong>.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Keypad data received (not a card)\" only<\/td>\n<td>Present a card, not keys. If the reader doesn't beep, it can't read that card type.<\/td>\n<\/tr>\n<tr>\n<td>Reader beeps but no card appears<\/td>\n<td>The reader may send character data instead of raw bits. Set it to raw or Wiegand pass-through output.<\/td>\n<\/tr>\n<tr>\n<td>No reader answered<\/td>\n<td>Check A/B wiring, power, baud and address; try RTS on a USB adapter.<\/td>\n<\/tr>\n<tr>\n<td>Data can't be framed as OSDP<\/td>\n<td>Wrong baud or A/B swapped.<\/td>\n<\/tr>\n<tr>\n<td>Start fails but the steps move on<\/td>\n<td>Check the message under <strong>Reader connection<\/strong> before presenting cards.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a024\">024 Build a custom card format (Builder)<\/a><\/li>\n<li><a href=\"#a025\">025 Decode a card with the Format Analyzer<\/a><\/li>\n<li><a href=\"#a097\">097 \"Port in use\" when starting the emulator or an upload<\/a><\/li>\n<\/ul>", "text": "enroll a card format from a real osdp reader how to plug a real osdp reader into aether, present cards, and save the card's bit layout as a new format. for engineers working out an unknown credential.  summary enrollment turns the pi into the controller for a real osdp reader. you present cards, aether captures the exact bits, and it works out the format: from the library, from the number printed on the card, or by comparing several cards. you can then save the layout as your own format and send it from any emulated reader. before you start a real osdp reader in plain (non-secure) mode, powered, and wired to a usb-rs485 adapter or the onboard port. the reader's address and baud, if you know them. ideally, a few cards with their printed facility code and card number. caution: starting enrollment on a port takes that port away from reader emulation until you click stop . emulated readers on that port stop answering their controller. use a separate usb-rs485 adapter when you can. connect the reader open readers › osdp and select the enrollment tab. under reader connection , pick the port. set baud and address . if you don't know them, click scan ; it tries common settings and fills them in when a reader answers. tick toggle rts for direction control only if a usb adapter needs it. the onboard port doesn't. click start . use start , not diagnose ; some readers only come online under steady polling. screenshot to add: enrollment tab, reader connection card with the reader panel filled in wait for the reader panel to show the model, firmware, serial and capabilities, with polls and replies counting. present cards answer the question about whether you know the numbers printed on the cards. if you do, enter each card number (and facility code), then present each card 3 times when asked. if you don't, present several different cards. the bits that change between them are the card number. identify and save the format read what this credential is . it lists library matches, a layout solved from your number, and a layout derived from the cards. pick the best row and check the colour-coded bit map. enter a name. click enroll format . it is saved as one of yours, tagged mine . click stop to hand the port back to emulation. check that it worked open the format picker on readers › osdp › emulate . your format is in the list, tagged mine . if something goes wrong symptom what to do \"keypad data received (not a card)\" only present a card, not keys. if the reader doesn't beep, it can't read that card type. reader beeps but no card appears the reader may send character data instead of raw bits. set it to raw or wiegand pass-through output. no reader answered check a/b wiring, power, baud and address; try rts on a usb adapter. data can't be framed as osdp wrong baud or a/b swapped. start fails but the steps move on check the message under reader connection before presenting cards. related articles 009 how osdp reader emulation works 023 the built-in card format library 024 build a custom card format (builder) 025 decode a card with the format analyzer 097 \"port in use\" when starting the emulator or an upload "}, {"id": "a017", "num": "017", "title": "Read a conversation in OSDP Trace", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to read the OSDP conversation between a controller and readers in OSDP Trace: commands, replies, timing and problems. For anyone debugging an OSDP bus.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Access devices enrollment (chat: OSDP Academy)", "OSDP Trace tool app (chat)", "claude/osdp-academy.md (via chat)"], "html": "<h2>Summary<\/h2>\n<p><strong>OSDP Trace<\/strong> decodes every OSDP frame into plain English. The <strong>Conversation<\/strong> tab pairs each command with its reply, shows the reply time and flags problems. Use it to see what really went over the wire.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is emulating readers on the bus, the Controller Emulator is running, or you have a capture to load.<\/li>\n<li>To watch a bus Aether isn't part of, plan a listen-only tap. See \"Watch a bus Aether isn't on\" below.<\/li>\n<\/ul>\n<h2>Read the conversation<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> and select <strong>Conversation<\/strong>. The trace includes the emulated readers' bus and the Controller Emulator's traffic.<\/li>\n<li>Read each line from left to right: time, direction, reader address, command, and the reply with its time in ms.<\/li>\n<li>Idle polling folds into one line such as \"Polled 40 times, all normal\". Turn on hiding idle polling to see only events.<\/li>\n<li>Problems are flagged in the line. A refused command shows <strong>Refused<\/strong> with the NAK reason and a hint.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Conversation tab with a card read, an LED command and a flagged NAK<\/span><\/div>\n<h2>Find what you need<\/h2>\n<ol>\n<li>Type in the search box in plain words, such as <code>card 45678<\/code>, <code>NAK<\/code> or <code>reader 2<\/code>.<\/li>\n<li>Filter by reader to follow one address.<\/li>\n<li>Click a line to open the byte inspector. It labels every byte (address, length, control, command, data, check bytes), shows whether the CRC or checksum matches, and gives the spec section.<\/li>\n<\/ol>\n<h2>Save a capture<\/h2>\n<ol>\n<li>Open the captures menu in the toolbar. <span class=\"sme\">confirm the control name.<\/span><\/li>\n<li>Save the current trace on the Pi with a name.<\/li>\n<li>To review later, load it. Loading decodes again with the current decoder.<\/li>\n<\/ol>\n<h2>Watch a bus Aether isn't on<\/h2>\n<p>The <strong>Passive capture<\/strong> button sends polls of its own while it listens. On a live controller bus that adds a second controller, so:<\/p>\n<ul>\n<li>Don't use Passive capture on a live controller bus.<\/li>\n<li>Use a separate, listen-only RS-485 tap and load its capture into OSDP Trace instead.<\/li>\n<li>Passive capture is fine on a bench bus with no other controller.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<p>You can see the controller's polls, the readers' replies, and any card reads, LED or buzzer commands with times.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Only replies, no commands<\/td>\n<td>The tap hears one side only. Move the tap or check its wiring.<\/td>\n<\/tr>\n<tr>\n<td>Frames marked bad CRC<\/td>\n<td>Check wiring, termination and baud. One bad frame doesn't prove a bad cable.<\/td>\n<\/tr>\n<tr>\n<td>A loaded capture gains live frames<\/td>\n<td>Pause the live feed before you load a capture. <span class=\"sme\">confirm the pause control.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a018\">018 OSDP Trace tabs: Conversation, Readers, Timeline, Tests<\/a><\/li>\n<li><a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a><\/li>\n<li><a href=\"#a011\">011 Watch the controller's LED and buzzer commands<\/a><\/li>\n<li><a href=\"#a090\">090 Open OSDP Academy and use Live mode<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "read a conversation in osdp trace how to read the osdp conversation between a controller and readers in osdp trace: commands, replies, timing and problems. for anyone debugging an osdp bus.  summary osdp trace decodes every osdp frame into plain english. the conversation tab pairs each command with its reply, shows the reply time and flags problems. use it to see what really went over the wire. before you start aether is emulating readers on the bus, the controller emulator is running, or you have a capture to load. to watch a bus aether isn't part of, plan a listen-only tap. see \"watch a bus aether isn't on\" below. read the conversation open readers › osdp trace and select conversation . the trace includes the emulated readers' bus and the controller emulator's traffic. read each line from left to right: time, direction, reader address, command, and the reply with its time in ms. idle polling folds into one line such as \"polled 40 times, all normal\". turn on hiding idle polling to see only events. problems are flagged in the line. a refused command shows refused with the nak reason and a hint. screenshot to add: conversation tab with a card read, an led command and a flagged nak find what you need type in the search box in plain words, such as card 45678 , nak or reader 2 . filter by reader to follow one address. click a line to open the byte inspector. it labels every byte (address, length, control, command, data, check bytes), shows whether the crc or checksum matches, and gives the spec section. save a capture open the captures menu in the toolbar. confirm the control name. save the current trace on the pi with a name. to review later, load it. loading decodes again with the current decoder. watch a bus aether isn't on the passive capture button sends polls of its own while it listens. on a live controller bus that adds a second controller, so: don't use passive capture on a live controller bus. use a separate, listen-only rs-485 tap and load its capture into osdp trace instead. passive capture is fine on a bench bus with no other controller. check that it worked you can see the controller's polls, the readers' replies, and any card reads, led or buzzer commands with times. if something goes wrong symptom what to do only replies, no commands the tap hears one side only. move the tap or check its wiring. frames marked bad crc check wiring, termination and baud. one bad frame doesn't prove a bad cable. a loaded capture gains live frames pause the live feed before you load a capture. confirm the pause control. related articles 018 osdp trace tabs: conversation, readers, timeline, tests 019 export an osdp trace for a manufacturer 011 watch the controller's led and buzzer commands 090 open osdp academy and use live mode 096 an osdp reader doesn't answer "}, {"id": "a018", "num": "018", "title": "OSDP Trace tabs: Conversation, Readers, Timeline, Tests", "area": "Readers and protocols", "type": "Reference", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Reference for the four tabs of OSDP Trace: what each shows and when to use it.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Access devices enrollment (chat: OSDP Academy)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>OSDP Trace has four tabs that show the same traffic in different ways. The traffic includes the emulated OSDP readers and the Controller Emulator. This table says what each tab shows and when to use it.<\/p>\n<h2>The tabs<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tab<\/th>\n<th>What it shows<\/th>\n<th>Use it to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Conversation<\/strong><\/td>\n<td>Each command paired with its reply, the reply time in ms, idle polls folded, problems flagged inline. Search in plain words; filter by reader; click a line for the byte inspector.<\/td>\n<td>Follow what happened, step by step.<\/td>\n<\/tr>\n<tr>\n<td><strong>Readers<\/strong><\/td>\n<td>One card per reader address: online or offline, average and peak reply time, counts of polls, cards, NAKs, timeouts, retries and CRC errors, model and firmware, last card, tamper and power status with a \"what to check\" note, and a readable capabilities list.<\/td>\n<td>Check reader health at a glance.<\/td>\n<\/tr>\n<tr>\n<td><strong>Timeline<\/strong><\/td>\n<td>One strip per reader with coloured marks for card reads, LED changes, buzzer, NAKs and bad frames.<\/td>\n<td>See timing, such as card read to LED.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tests<\/strong><\/td>\n<td>Rules such as \"after a card read, expect an LED within 2 s\", scored pass or fail live. Two defaults are preloaded; you can add your own.<\/td>\n<td>Run acceptance checks.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Readers tab with health cards for two readers<\/span><\/div>\n<h2>Toolbar<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Control<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Clear<\/td>\n<td>Empties the live trace.<\/td>\n<\/tr>\n<tr>\n<td>Passive capture<\/td>\n<td>Listens on a serial port. It also polls, so use it only on a bench bus; on a live controller bus use a listen-only tap.<\/td>\n<\/tr>\n<tr>\n<td>Captures<\/td>\n<td>Saves the trace on the Pi, or loads a saved capture. Loading decodes again with the current decoder.<\/td>\n<\/tr>\n<tr>\n<td>Export<\/td>\n<td>Downloads the trace as CSV, text or JSON. <span class=\"sme\">confirm the export control and formats on the current build.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Integrity checks on every frame<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Flagged when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CRC or checksum<\/td>\n<td>It doesn't match the bytes.<\/td>\n<\/tr>\n<tr>\n<td>Length<\/td>\n<td>The length field doesn't match.<\/td>\n<\/tr>\n<tr>\n<td>Sequence<\/td>\n<td>The sequence number skips or repeats.<\/td>\n<\/tr>\n<tr>\n<td>Reply address<\/td>\n<td>The reply comes from a different address.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Notes<\/h2>\n<ul>\n<li>Edits to a Tests rule can be lost on the next refresh. Finish and save the rule in one go. <span class=\"sme\">confirm on the current build.<\/span><\/li>\n<li>OSDP Academy can follow the same trace live without sending anything to the bus.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a><\/li>\n<li><a href=\"#a011\">011 Watch the controller's LED and buzzer commands<\/a><\/li>\n<li><a href=\"#a090\">090 Open OSDP Academy and use Live mode<\/a><\/li>\n<\/ul>", "text": "osdp trace tabs: conversation, readers, timeline, tests reference for the four tabs of osdp trace: what each shows and when to use it.  summary osdp trace has four tabs that show the same traffic in different ways. the traffic includes the emulated osdp readers and the controller emulator. this table says what each tab shows and when to use it. the tabs tab what it shows use it to conversation each command paired with its reply, the reply time in ms, idle polls folded, problems flagged inline. search in plain words; filter by reader; click a line for the byte inspector. follow what happened, step by step. readers one card per reader address: online or offline, average and peak reply time, counts of polls, cards, naks, timeouts, retries and crc errors, model and firmware, last card, tamper and power status with a \"what to check\" note, and a readable capabilities list. check reader health at a glance. timeline one strip per reader with coloured marks for card reads, led changes, buzzer, naks and bad frames. see timing, such as card read to led. tests rules such as \"after a card read, expect an led within 2 s\", scored pass or fail live. two defaults are preloaded; you can add your own. run acceptance checks. screenshot to add: readers tab with health cards for two readers toolbar control what it does clear empties the live trace. passive capture listens on a serial port. it also polls, so use it only on a bench bus; on a live controller bus use a listen-only tap. captures saves the trace on the pi, or loads a saved capture. loading decodes again with the current decoder. export downloads the trace as csv, text or json. confirm the export control and formats on the current build. integrity checks on every frame check flagged when crc or checksum it doesn't match the bytes. length the length field doesn't match. sequence the sequence number skips or repeats. reply address the reply comes from a different address. notes edits to a tests rule can be lost on the next refresh. finish and save the rule in one go. confirm on the current build. osdp academy can follow the same trace live without sending anything to the bus. related articles 017 read a conversation in osdp trace 019 export an osdp trace for a manufacturer 011 watch the controller's led and buzzer commands 090 open osdp academy and use live mode "}, {"id": "a019", "num": "019", "title": "Export an OSDP trace for a manufacturer", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to export an OSDP trace, or a reader firmware upload trace, to send to a reader manufacturer.", "sources": ["OSDP firmware upload logger (chat)", "Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Access devices enrollment (chat: OSDP Academy)"], "html": "<h2>Summary<\/h2>\n<p>When a reader misbehaves, the manufacturer will want the bytes. Aether can export a bus trace from OSDP Trace, and every reader firmware upload records its own trace with a ready-made manufacturer bundle. Use this to send clean evidence instead of screenshots.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have reproduced the problem while OSDP Trace was running, or during a firmware upload.<\/li>\n<li>You have noted the port, baud, reader model and firmware, and the time it happened.<\/li>\n<\/ul>\n<h2>Export from OSDP Trace<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>.<\/li>\n<li>Filter to the reader and time range you want. <span class=\"sme\">confirm whether the export follows the current filter.<\/span><\/li>\n<li>Save the trace as a capture first, so you can export it again later.<\/li>\n<li>Export it as CSV, text or JSON. <span class=\"sme\">confirm the export control label.<\/span>\n   - CSV for spreadsheets.\n   - Text for a readable log.\n   - JSON for tools, including OSDP Academy.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: OSDP Trace toolbar with the export options open<\/span><\/div>\n<h2>Export a firmware upload trace<\/h2>\n<p>Every reader firmware upload is traced from start to finish, even if it fails.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select <strong>Firmware<\/strong>.<\/li>\n<li>Open the trace of the upload, live or from the trace history.<\/li>\n<li>Add notes for the manufacturer: technician and what happened. Add a marker at the moment the problem appeared.<\/li>\n<li>Under <strong>Export<\/strong>, click <strong>Manufacturer bundle (.zip)<\/strong>. It holds a readable report, a standard <code>.osdpcap<\/code> capture, a frame-by-frame CSV and the trace details.<\/li>\n<li>If they ask for single files, use <strong>Report (.txt)<\/strong>, <strong>.osdpcap<\/strong>, <strong>.csv<\/strong> or <strong>.jsonl<\/strong>.<\/li>\n<\/ol>\n<h2>Before you send<\/h2>\n<ul>\n<li>Remove anything that identifies a customer site from the notes.<\/li>\n<li>Never include a secure channel key.<\/li>\n<li>State observations, not guesses: \"reader 3 stopped answering at 14:02:11 after a COMSET\".<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<p>Open the downloaded file. The report or CSV shows every frame with its time, direction and decode.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Export is empty<\/td>\n<td>The trace was cleared, or the filter hides everything. Load the saved capture.<\/td>\n<\/tr>\n<tr>\n<td>Only replies are in the trace<\/td>\n<td>The capture point heard one side. Say so in the notes.<\/td>\n<\/tr>\n<tr>\n<td>Upload trace missing<\/td>\n<td>Uploads started before the trace logger was installed have no trace. Upload again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a018\">018 OSDP Trace tabs: Conversation, Readers, Timeline, Tests<\/a><\/li>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a098\">098 Reader firmware upload fails or stalls<\/a><\/li>\n<li><a href=\"#a090\">090 Open OSDP Academy and use Live mode<\/a><\/li>\n<\/ul>", "text": "export an osdp trace for a manufacturer how to export an osdp trace, or a reader firmware upload trace, to send to a reader manufacturer.  summary when a reader misbehaves, the manufacturer will want the bytes. aether can export a bus trace from osdp trace, and every reader firmware upload records its own trace with a ready-made manufacturer bundle. use this to send clean evidence instead of screenshots. before you start you have reproduced the problem while osdp trace was running, or during a firmware upload. you have noted the port, baud, reader model and firmware, and the time it happened. export from osdp trace open readers › osdp trace . filter to the reader and time range you want. confirm whether the export follows the current filter. save the trace as a capture first, so you can export it again later. export it as csv, text or json. confirm the export control label. - csv for spreadsheets. - text for a readable log. - json for tools, including osdp academy. screenshot to add: osdp trace toolbar with the export options open export a firmware upload trace every reader firmware upload is traced from start to finish, even if it fails. open readers › osdp and select firmware . open the trace of the upload, live or from the trace history. add notes for the manufacturer: technician and what happened. add a marker at the moment the problem appeared. under export , click manufacturer bundle (.zip) . it holds a readable report, a standard .osdpcap capture, a frame-by-frame csv and the trace details. if they ask for single files, use report (.txt) , .osdpcap , .csv or .jsonl . before you send remove anything that identifies a customer site from the notes. never include a secure channel key. state observations, not guesses: \"reader 3 stopped answering at 14:02:11 after a comset\". check that it worked open the downloaded file. the report or csv shows every frame with its time, direction and decode. if something goes wrong symptom what to do export is empty the trace was cleared, or the filter hides everything. load the saved capture. only replies are in the trace the capture point heard one side. say so in the notes. upload trace missing uploads started before the trace logger was installed have no trace. upload again. related articles 017 read a conversation in osdp trace 018 osdp trace tabs: conversation, readers, timeline, tests 069 update osdp reader firmware (firmware wizard) 098 reader firmware upload fails or stalls 090 open osdp academy and use live mode "}, {"id": "a020", "num": "020", "title": "Send a card from an emulated Wiegand reader", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to send a card from one of Aether's four onboard Wiegand readers (R1–R4) to a controller.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Aether product QA testing (chat)", "Aether Board and Wiring tool (chat)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>Aether drives four Wiegand reader outputs, R1–R4, straight from the Pi's GPIO. The <strong>Wiegand<\/strong> page sends a card in any library format on the reader you pick, and shows each frame it sent. Use it to test a controller's Wiegand reader ports.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The reader's D0, D1 and GND are wired to the controller's reader port. See <a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a>.<\/li>\n<li>If the controller's Wiegand inputs are 5 V, a level shifter or open-collector buffer is fitted. The Pi's GPIO is 3.3 V.<\/li>\n<\/ul>\n<h2>Send a card<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong>.<\/li>\n<li>Pick the reader (R1–R4). These are the same Wiegand readers you can assign to doors on <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>In the Card Composer, open the format picker. Choose from <strong>Common<\/strong> or type to search.<\/li>\n<li>Enter the <strong>facility code<\/strong> and <strong>card number<\/strong>, plus issue level if the format has one.<\/li>\n<li>Check the bit strip.<\/li>\n<li>Click <strong>Send to<\/strong> <em>reader name<\/em>. <span class=\"sme\">confirm the button text on the current build.<\/span><\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Wiegand page with reader picked, composer filled in and bit strip<\/span><\/div>\n<p>You can also tap the card on the on-screen reader. It sends the credential set in the composer.<\/p>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Read the <strong>Sent<\/strong> table at the bottom: time, reader, what was sent, bit count and the frame.<\/li>\n<li>Check the controller's event log for the card.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Send is greyed out<\/td>\n<td>Aether isn't connected, no reader is picked, or the reader is disabled.<\/td>\n<\/tr>\n<tr>\n<td>The page shows default reader names and pins<\/td>\n<td>The Pi's reader setup didn't load. Refresh before sending; don't trust a send from this fallback. <span class=\"sme\">confirm the current fallback behaviour.<\/span><\/td>\n<\/tr>\n<tr>\n<td>Send fails with a permission error<\/td>\n<td>The Wiegand transmitter needs permission to drive GPIO. Ask your Aether admin. <span class=\"sme\">confirm the fix shipped for the transmitter permission on the current build.<\/span><\/td>\n<\/tr>\n<tr>\n<td>Controller reads nothing<\/td>\n<td>Check D0/D1 aren't swapped, GND is shared, and the voltage level.<\/td>\n<\/tr>\n<tr>\n<td>Controller reads the wrong number<\/td>\n<td>Check the format. <strong>UNVERIFIED<\/strong> formats may need checking.<\/td>\n<\/tr>\n<tr>\n<td>Frames over 128 bits fail<\/td>\n<td>The transmitter on the Pi needs rebuilding for long frames. Ask your Aether admin.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a021\">021 Send keypad entries over Wiegand<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a026\">026 Save cards for quick reuse<\/a><\/li>\n<li><a href=\"#a029\">029 Set up a door: reader, strike, DPS and REX<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<\/ul>", "text": "send a card from an emulated wiegand reader how to send a card from one of aether's four onboard wiegand readers (r1–r4) to a controller.  summary aether drives four wiegand reader outputs, r1–r4, straight from the pi's gpio. the wiegand page sends a card in any library format on the reader you pick, and shows each frame it sent. use it to test a controller's wiegand reader ports. before you start the reader's d0, d1 and gnd are wired to the controller's reader port. see 022 wiegand pins and voltage levels (r1–r4) . if the controller's wiegand inputs are 5 v, a level shifter or open-collector buffer is fitted. the pi's gpio is 3.3 v. send a card open readers › wiegand . pick the reader (r1–r4). these are the same wiegand readers you can assign to doors on access control › doors . in the card composer, open the format picker. choose from common or type to search. enter the facility code and card number , plus issue level if the format has one. check the bit strip. click send to reader name . confirm the button text on the current build. screenshot to add: wiegand page with reader picked, composer filled in and bit strip you can also tap the card on the on-screen reader. it sends the credential set in the composer. check that it worked read the sent table at the bottom: time, reader, what was sent, bit count and the frame. check the controller's event log for the card. if something goes wrong symptom what to do send is greyed out aether isn't connected, no reader is picked, or the reader is disabled. the page shows default reader names and pins the pi's reader setup didn't load. refresh before sending; don't trust a send from this fallback. confirm the current fallback behaviour. send fails with a permission error the wiegand transmitter needs permission to drive gpio. ask your aether admin. confirm the fix shipped for the transmitter permission on the current build. controller reads nothing check d0/d1 aren't swapped, gnd is shared, and the voltage level. controller reads the wrong number check the format. unverified formats may need checking. frames over 128 bits fail the transmitter on the pi needs rebuilding for long frames. ask your aether admin. related articles 021 send keypad entries over wiegand 022 wiegand pins and voltage levels (r1–r4) 023 the built-in card format library 026 save cards for quick reuse 029 set up a door: reader, strike, dps and rex 037 wire aether to an nhp or nop controller "}, {"id": "a021", "num": "021", "title": "Send keypad entries over Wiegand", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to send a PIN from an emulated Wiegand reader, and choose how the digits go out (one frame, 8-bit or 4-bit per key).", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>The Wiegand page has a keypad on the on-screen reader. You type a PIN and Aether sends all the digits together, in the keypad format the controller expects. Use it to test PIN-only and card-plus-PIN doors.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The reader is wired and a card send works. See <a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a>.<\/li>\n<li>You know which keypad format the controller expects.<\/li>\n<\/ul>\n<h2>Pick the keypad format<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong> and pick the reader.<\/li>\n<li>Above the on-screen reader, open <strong>Keypad format<\/strong>.<\/li>\n<li>Choose one:<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>What goes out<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One frame, 8 bits per key (default)<\/td>\n<td>All digits in one frame, each key as an HID 8-bit code.<\/td>\n<\/tr>\n<tr>\n<td>8-bit burst<\/td>\n<td>One 8-bit frame per key.<\/td>\n<\/tr>\n<tr>\n<td>4-bit burst<\/td>\n<td>One 4-bit frame per key.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol start=\"4\">\n<li>Choose whether the PIN ends with <code>#<\/code> or with nothing.<\/li>\n<\/ol>\n<p>In an 8-bit code, the top half is the inverse of the key value, so 1 = 0xE1, * = 0x5A and # = 0x4B.<\/p>\n<h2>Send a PIN<\/h2>\n<ol>\n<li>Type the digits on the on-screen keypad.<\/li>\n<li>Press <strong>#<\/strong> or <strong>Send<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Wiegand on-screen reader with keypad and the Keypad format selector<\/span><\/div>\n<p>For example, PIN 1234 ending in <code>#<\/code> goes out as one 40-bit frame with the default setting.<\/p>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>In the <strong>Sent<\/strong> table, the row shows <strong>PIN<\/strong>, the number of digits and the mode. The digits themselves are masked.<\/li>\n<li>Check the controller's log for the PIN entry.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Controller ignores the PIN<\/td>\n<td>Try 8-bit burst or 4-bit burst; many controllers expect one frame per key.<\/td>\n<\/tr>\n<tr>\n<td>Controller waits for more digits<\/td>\n<td>Turn on ending with <code>#<\/code>.<\/td>\n<\/tr>\n<tr>\n<td>Send fails<\/td>\n<td>See the troubleshooting rows in <a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a044\">044 Send a card or keys through a board's reader port<\/a><\/li>\n<\/ul>", "text": "send keypad entries over wiegand how to send a pin from an emulated wiegand reader, and choose how the digits go out (one frame, 8-bit or 4-bit per key).  summary the wiegand page has a keypad on the on-screen reader. you type a pin and aether sends all the digits together, in the keypad format the controller expects. use it to test pin-only and card-plus-pin doors. before you start the reader is wired and a card send works. see 020 send a card from an emulated wiegand reader . you know which keypad format the controller expects. pick the keypad format open readers › wiegand and pick the reader. above the on-screen reader, open keypad format . choose one: option what goes out one frame, 8 bits per key (default) all digits in one frame, each key as an hid 8-bit code. 8-bit burst one 8-bit frame per key. 4-bit burst one 4-bit frame per key. choose whether the pin ends with # or with nothing. in an 8-bit code, the top half is the inverse of the key value, so 1 = 0xe1, * = 0x5a and # = 0x4b. send a pin type the digits on the on-screen keypad. press # or send . screenshot to add: wiegand on-screen reader with keypad and the keypad format selector for example, pin 1234 ending in # goes out as one 40-bit frame with the default setting. check that it worked in the sent table, the row shows pin , the number of digits and the mode. the digits themselves are masked. check the controller's log for the pin entry. if something goes wrong symptom what to do controller ignores the pin try 8-bit burst or 4-bit burst; many controllers expect one frame per key. controller waits for more digits turn on ending with # . send fails see the troubleshooting rows in 020 send a card from an emulated wiegand reader . related articles 020 send a card from an emulated wiegand reader 022 wiegand pins and voltage levels (r1–r4) 010 present a card or pin on an emulated osdp reader 044 send a card or keys through a board's reader port "}, {"id": "a022", "num": "022", "title": "Wiegand pins and voltage levels (R1–R4)", "area": "Readers and protocols", "type": "Reference", "audience": "Both", "priority": "P1", "status": "Needs SME", "brief": "Reference for the Pi GPIO pins that drive Wiegand readers R1–R4 and the voltage levels to respect when wiring a controller.", "sources": ["Aether Board and Wiring tool (chat: board-blueprints-aether)", "Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>Aether's four Wiegand reader outputs use Pi GPIO pins. This page lists the pins and the voltage rules for wiring them to a controller's reader ports.<\/p>\n<h2>Pins<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Reader<\/th>\n<th>D0 (GPIO)<\/th>\n<th>D1 (GPIO)<\/th>\n<th>Default name<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R1<\/td>\n<td>17<\/td>\n<td>27<\/td>\n<td>Main Entrance<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>22<\/td>\n<td>23<\/td>\n<td>Back Door<\/td>\n<\/tr>\n<tr>\n<td>R3<\/td>\n<td>24<\/td>\n<td>25<\/td>\n<td>Side Door<\/td>\n<\/tr>\n<tr>\n<td>R4<\/td>\n<td>5<\/td>\n<td>6<\/td>\n<td>Elevator<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>GPIO numbers are BCM numbers, not header pin numbers. See <a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a> for the header positions.<\/p>\n<h2>Terminal block<\/h2>\n<p>In Board Blueprints, the Aether board has a 10-wire Wiegand block: +5V, GND, then R1–R4 D0/D1 in the order above.<\/p>\n<h2>Voltage levels<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Pi GPIO logic<\/td>\n<td>3.3 V<\/td>\n<\/tr>\n<tr>\n<td>Controller Wiegand input at 5 V<\/td>\n<td>Needs a level shifter or an open-collector buffer<\/td>\n<\/tr>\n<tr>\n<td>Ground<\/td>\n<td>Share GND between Aether and the controller<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p class=\"caution\"><strong>Caution:<\/strong> Don't connect a 5 V Wiegand line directly to a Pi GPIO pin. Fit a level shifter or open-collector buffer first.<\/p>\n<h2>Wiring to a controller<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Aether<\/th>\n<th>Controller reader port<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R<em>n<\/em> D0<\/td>\n<td>D0 (DATA 0)<\/td>\n<\/tr>\n<tr>\n<td>R<em>n<\/em> D1<\/td>\n<td>D1 (DATA 1)<\/td>\n<\/tr>\n<tr>\n<td>GND<\/td>\n<td>GND<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Auto-wire in Board Blueprints wires reader <em>n<\/em> to door <em>n<\/em> this way. +5V isn't wired to the panel.<\/p>\n<h2>Frame length<\/h2>\n<p>Frames up to 256 bits are supported. Frames over 128 bits need the updated transmitter on the Pi. <span class=\"sme\">confirm the transmitter on the shipped Pi supports 256-bit frames.<\/span><\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\
