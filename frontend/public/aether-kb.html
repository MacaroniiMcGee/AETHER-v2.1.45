s. It takes about a minute.<\/li>\n<li>If the token check fails, make a new token (article 008) and save it again.<\/li>\n<li>Clear the computer's DNS cache. On Windows:<\/li>\n<\/ol>\n<p><code>ipconfig /flushdns<\/code><\/p>\n<ol start=\"6\">\n<li>In Chrome or Brave, open <code>chrome://net-internals/#dns<\/code> (<code>brave://net-internals/#dns<\/code>) and press <strong>Clear host cache<\/strong>.<\/li>\n<li>Look the name up on your computer, first with your normal DNS, then with a public DNS server such as Cloudflare's:<\/li>\n<\/ol>\n<p><code>nslookup bench1.example.com\n   nslookup bench1.example.com &lt;public-dns-ip&gt;<\/code><\/p>\n<ul>\n<li>Both give the Pi's address: it was the cache. Reload.<\/li>\n<li>Only the second works: your router blocks it. Ask your network admin to allow the domain in DNS rebinding protection. <span class=\"sme\">confirm the router setting names to list for common lab routers.<\/span><\/li>\n<li>Neither works: the name isn't in Cloudflare yet. Press <strong>Get certificate<\/strong> again, or check the token.<\/li>\n<\/ul>\n<ol start=\"8\">\n<li>Once the page loads with the padlock, press <strong>Check from this browser<\/strong> on <strong>HTTPS &amp; Domain<\/strong>.<\/li>\n<\/ol>\n<p><code>http://&lt;pi-ip&gt;:3001<\/code> keeps working throughout, so you can always get back in that way.<\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of <strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong> (no token visible);<\/li>\n<li>the output of both <code>nslookup<\/code> commands;<\/li>\n<li>the browser's exact error text.<\/li>\n<\/ul>\n<p>Never paste the Cloudflare token into a message or ticket.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<li><a href=\"#a008\">008 Create the Cloudflare token for HTTPS<\/a><\/li>\n<li><a href=\"#a101\">101 Lost access after a network change<\/a><\/li>\n<\/ul>", "text": "no padlock, or the https name doesn't load for users whose https name doesn't load or shows no padlock: port 3443, dns cache, router dns rebinding protection and certificate checks.  summary setup › https & domain gives the pi a name like <name>.aetheraccesstools.com with a let's encrypt certificate, got through a cloudflare dns token. this article covers the name not loading, and the browser showing a warning instead of a padlock. symptoms the browser says the dns address could not be found. the page loads with a certificate warning and no padlock. the page loads by ip but not by name. likely causes port 443 was taken on the pi, so https runs on 3443 and the address needs :3443 . the browser or computer remembered \"name not found\" from before the name existed. the router blocks public names that point to local addresses (dns rebinding protection). no certificate was issued yet, or it lapsed. then the pi uses a self-signed certificate and the browser warns. the cloudflare token is wrong or lacks permission. fix it open setup › https & domain and read the status and https port . if the port is 3443, add it to the address: https://bench1.example.com:3443 . if no certificate is shown, press get certificate and watch the steps. it takes about a minute. if the token check fails, make a new token (article 008) and save it again. clear the computer's dns cache. on windows: ipconfig /flushdns in chrome or brave, open chrome://net-internals/#dns ( brave://net-internals/#dns ) and press clear host cache . look the name up on your computer, first with your normal dns, then with a public dns server such as cloudflare's: nslookup bench1.example.com nslookup bench1.example.com <public-dns-ip> both give the pi's address: it was the cache. reload. only the second works: your router blocks it. ask your network admin to allow the domain in dns rebinding protection. confirm the router setting names to list for common lab routers. neither works: the name isn't in cloudflare yet. press get certificate again, or check the token. once the page loads with the padlock, press check from this browser on https & domain . http://<pi-ip>:3001 keeps working throughout, so you can always get back in that way. still stuck send the aether team: a screenshot of setup › https & domain (no token visible); the output of both nslookup commands; the browser's exact error text. never paste the cloudflare token into a message or ticket. related articles 007 set up https and a domain name 008 create the cloudflare token for https 101 lost access after a network change "}, {"id": "a103", "num": "103", "title": "SUNAPI scan misses access controllers", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "For users whose SUNAPI Console scan finds cameras but not access controllers: scan ports, ONVIF limits and identifying HTTPS-only controllers.", "sources": ["docs/house-style-and-facts.md", "chat: AETHER device communication features", "chat: OSDP Trace tool app"], "html": "<h2>Summary<\/h2>\n<p><strong>Scan<\/strong> in <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> finds Hanwha devices two ways: ONVIF discovery, and a sweep of ports 80 and 443 across the ranges you give. Cameras usually show up straight away. Access controllers such as the NHP series are often HTTPS-only, so they need port 443 in the sweep or an ONVIF answer.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li><strong>Scan<\/strong> lists cameras but not the access controllers on the same network.<\/li>\n<li>A controller shows up but isn't typed as access control.<\/li>\n<li>A controller you can open in a browser never appears.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>Port 443 isn't in the scan ports, so an HTTPS-only controller is never tried.<\/li>\n<li>The controller is on a different subnet or VLAN. ONVIF discovery only reaches devices on the Pi's own network segment; the port sweep works across routed subnets.<\/li>\n<li>The controller is outside the address range you entered.<\/li>\n<li>The controller uses a port other than 80 or 443.<\/li>\n<li>Aether is on an older SUNAPI Console version that swept port 80 only. <span class=\"sme\">confirm the minimum Aether/SUNAPI update that scans port 443 by default.<\/span><\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>SUNAPI Console<\/strong> and go to <strong>Scan<\/strong>.<\/li>\n<li>Check the ports field. It should include <code>80, 443<\/code>. Add <code>443<\/code> if it's missing.<\/li>\n<li>If the controller uses another port, add that port too.<\/li>\n<li>Check the address range covers the controller's address.<\/li>\n<li>Leave ONVIF discovery on.<\/li>\n<li>Run <strong>Scan<\/strong> again.<\/li>\n<li>If the controller is on another subnet, enter its range. ONVIF can't cross subnets, but the sweep can.<\/li>\n<li>If it shows up as an unknown device, add a login so <strong>Scan<\/strong> can identify it. A model like NHP-P100 with device type ACS is typed as access control.<\/li>\n<li>If it still doesn't show, check from the Pi that the controller answers on HTTPS. A <code>200<\/code>, <code>301<\/code>, <code>302<\/code> or <code>401<\/code> line means it answers:<\/li>\n<\/ol>\n<p><code>bash\n   curl -skI https://&lt;controller-ip&gt;/ | head -1<\/code><\/p>\n<ol start=\"10\">\n<li>If that fails, check the network path between the Pi and the controller (firewall, VLAN, cable).<\/li>\n<\/ol>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of the scan settings and results;<\/li>\n<li>the controller model and the port it uses;<\/li>\n<li>whether the Pi and the controller are on the same subnet;<\/li>\n<li>the output of the <code>curl<\/code> command in step 9.<\/li>\n<\/ul>\n<p>Don't include device passwords; they stay on the Pi.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a058\">058 Find Hanwha devices with Scan<\/a><\/li>\n<li><a href=\"#a057\">057 What the SUNAPI Console does<\/a><\/li>\n<li><a href=\"#a059\">059 Send a SUNAPI request with the Explorer<\/a><\/li>\n<\/ul>", "text": "sunapi scan misses access controllers for users whose sunapi console scan finds cameras but not access controllers: scan ports, onvif limits and identifying https-only controllers.  summary scan in tools › sunapi console finds hanwha devices two ways: onvif discovery, and a sweep of ports 80 and 443 across the ranges you give. cameras usually show up straight away. access controllers such as the nhp series are often https-only, so they need port 443 in the sweep or an onvif answer. symptoms scan lists cameras but not the access controllers on the same network. a controller shows up but isn't typed as access control. a controller you can open in a browser never appears. likely causes port 443 isn't in the scan ports, so an https-only controller is never tried. the controller is on a different subnet or vlan. onvif discovery only reaches devices on the pi's own network segment; the port sweep works across routed subnets. the controller is outside the address range you entered. the controller uses a port other than 80 or 443. aether is on an older sunapi console version that swept port 80 only. confirm the minimum aether/sunapi update that scans port 443 by default. fix it open tools › sunapi console and go to scan . check the ports field. it should include 80, 443 . add 443 if it's missing. if the controller uses another port, add that port too. check the address range covers the controller's address. leave onvif discovery on. run scan again. if the controller is on another subnet, enter its range. onvif can't cross subnets, but the sweep can. if it shows up as an unknown device, add a login so scan can identify it. a model like nhp-p100 with device type acs is typed as access control. if it still doesn't show, check from the pi that the controller answers on https. a 200 , 301 , 302 or 401 line means it answers: bash curl -ski https://<controller-ip>/ | head -1 if that fails, check the network path between the pi and the controller (firewall, vlan, cable). still stuck send the aether team: a screenshot of the scan settings and results; the controller model and the port it uses; whether the pi and the controller are on the same subnet; the output of the curl command in step 9. don't include device passwords; they stay on the pi. related articles 058 find hanwha devices with scan 057 what the sunapi console does 059 send a sunapi request with the explorer "}, {"id": "a104", "num": "104", "title": "Switch Ports says the manager isn't initialized", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "For users who see Switch Ports report that the switch manager isn't initialized: checking the switch, the profile and restarting the backend.", "sources": ["docs/house-style-and-facts.md", "chat: Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> controls a managed PoE switch through a switch profile. If Aether can't set up its connection to the switch, the page says the switch manager isn't initialized and no port actions work. This article helps you get the connection working.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li><strong>Switch Ports<\/strong> shows a message that the manager isn't initialized. <span class=\"sme\">confirm the exact on-screen wording.<\/span><\/li>\n<li>Port lists stay empty and every action fails.<\/li>\n<li>Profile changes can't be saved from the page.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>No switch profile is set up yet, or the profile has the wrong address. <span class=\"sme\">confirm the causes that leave the manager uninitialized.<\/span><\/li>\n<li>The switch login (user or password) in the profile is wrong.<\/li>\n<li>The Pi can't reach the switch on the network.<\/li>\n<li>The backend started before the switch was reachable.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Check the switch is powered and reachable from the Pi:<\/li>\n<\/ol>\n<p><code>bash\n   ping -c 3 &lt;switch-ip&gt;<\/code><\/p>\n<ol start=\"2\">\n<li>Open the switch's own web page from a computer to confirm the address and login work.<\/li>\n<li>On <strong>Switch Ports<\/strong>, open the switch profile, check the address and login, and use the login test (article 051).<\/li>\n<li>If the page won't let you edit the profile, ask the Aether team to check the profile file on the Pi. <span class=\"sme\">confirm the supported way to fix a switch profile when the page refuses changes, and the file location.<\/span><\/li>\n<li>Once the switch answers, restart the backend so it sets up the switch connection again. <strong>Caution:<\/strong> this stops doors and readers for a few seconds and cuts any reader firmware upload in progress:<\/li>\n<\/ol>\n<p><code>bash\n   sudo systemctl restart aether-backend<\/code><\/p>\n<ol start=\"6\">\n<li>Refresh the page with <strong>Ctrl+Shift+R<\/strong> and open <strong>Switch Ports<\/strong> again.<\/li>\n<li>Before you use <strong>Take down<\/strong> or PoE off, make sure the port Aether itself is connected through can't be switched off. <span class=\"sme\">confirm where the protected (uplink) ports are set in the profile.<\/span><\/li>\n<\/ol>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>a screenshot of <strong>Switch Ports<\/strong> with the message;<\/li>\n<li>the switch make and model (no password);<\/li>\n<li>the output of the <code>ping<\/code> in step 1;<\/li>\n<li>the backend log lines about the switch:<\/li>\n<\/ul>\n<p><code>bash\n  sudo journalctl -u aether-backend -n 200 --no-pager | grep -i switch<\/code><\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a051\">051 Add a switch profile and test the login<\/a><\/li>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<li><a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a><\/li>\n<li><a href=\"#a092\">092 Aether won't load or shows Backend offline<\/a><\/li>\n<\/ul>", "text": "switch ports says the manager isn't initialized for users who see switch ports report that the switch manager isn't initialized: checking the switch, the profile and restarting the backend.  summary tools › switch ports controls a managed poe switch through a switch profile. if aether can't set up its connection to the switch, the page says the switch manager isn't initialized and no port actions work. this article helps you get the connection working. symptoms switch ports shows a message that the manager isn't initialized. confirm the exact on-screen wording. port lists stay empty and every action fails. profile changes can't be saved from the page. likely causes no switch profile is set up yet, or the profile has the wrong address. confirm the causes that leave the manager uninitialized. the switch login (user or password) in the profile is wrong. the pi can't reach the switch on the network. the backend started before the switch was reachable. fix it check the switch is powered and reachable from the pi: bash ping -c 3 <switch-ip> open the switch's own web page from a computer to confirm the address and login work. on switch ports , open the switch profile, check the address and login, and use the login test (article 051). if the page won't let you edit the profile, ask the aether team to check the profile file on the pi. confirm the supported way to fix a switch profile when the page refuses changes, and the file location. once the switch answers, restart the backend so it sets up the switch connection again. caution: this stops doors and readers for a few seconds and cuts any reader firmware upload in progress: bash sudo systemctl restart aether-backend refresh the page with ctrl+shift+r and open switch ports again. before you use take down or poe off, make sure the port aether itself is connected through can't be switched off. confirm where the protected (uplink) ports are set in the profile. still stuck send the aether team: a screenshot of switch ports with the message; the switch make and model (no password); the output of the ping in step 1; the backend log lines about the switch: bash sudo journalctl -u aether-backend -n 200 --no-pager | grep -i switch related articles 051 add a switch profile and test the login 052 turn a switch port off with an automatic hold 055 revert all held ports and reconcile drift 092 aether won't load or shows backend offline "}, {"id": "a105", "num": "105", "title": "The controller doesn't read a Wiegand card", "area": "Troubleshooting", "type": "Troubleshooting", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "For users whose controller doesn't log a card sent from Aether's Wiegand readers: pins, wiring, ground, 3.3 V vs 5 V levels and card format.", "sources": ["docs/house-style-and-facts.md", "chat: Aether Board and Wiring tool"], "html": "<h2>Summary<\/h2>\n<p>Aether's four onboard Wiegand readers (R1–R4) send card data from Pi GPIO pins to a controller's reader inputs. If the controller logs nothing, or logs the wrong card, the cause is usually wiring, voltage level or card format. Use this article when a card sent from <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong> doesn't arrive as expected.<\/p>\n<h2>Symptoms<\/h2>\n<ul>\n<li>You press send on <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong> and the controller logs nothing.<\/li>\n<li>The controller logs a read error, or a card number that doesn't match.<\/li>\n<li>One reader works and another doesn't.<\/li>\n<\/ul>\n<h2>Likely causes<\/h2>\n<ul>\n<li>D0 and D1 are swapped, or wired to the wrong reader terminals.<\/li>\n<li>No common ground between Aether and the controller.<\/li>\n<li>The controller's reader input expects 5 V Wiegand. Pi GPIO is 3.3 V, so a 5 V line needs a level shifter or open-collector buffer.<\/li>\n<li>The card format sent doesn't match the format the controller expects (bit length, facility code).<\/li>\n<li>The card isn't enrolled or valid on the controller.<\/li>\n<\/ul>\n<h2>Fix it<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>HAT Pinout<\/strong> and find the pins for the reader you're using:<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Reader<\/th>\n<th>D0<\/th>\n<th>D1<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R1<\/td>\n<td>GPIO 17<\/td>\n<td>GPIO 27<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>GPIO 22<\/td>\n<td>GPIO 23<\/td>\n<\/tr>\n<tr>\n<td>R3<\/td>\n<td>GPIO 24<\/td>\n<td>GPIO 25<\/td>\n<\/tr>\n<tr>\n<td>R4<\/td>\n<td>GPIO 5<\/td>\n<td>GPIO 6<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol start=\"2\">\n<li><strong>Caution:<\/strong> power down the controller's reader port before you rewire. Check D0 goes to the controller's D0 (DATA0) and D1 to D1 (DATA1).<\/li>\n<li>Connect a ground wire from the Pi's GND to the controller's reader GND.<\/li>\n<li>Check the controller's reader input voltage in its manual. If it's a 5 V input, fit a level shifter or open-collector buffer between Aether and the controller. Don't connect a 5 V line straight to a Pi GPIO pin.<\/li>\n<li>On <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong>, check the card format matches the controller (for example 26-bit with the same facility code).<\/li>\n<li>Check the card number is enrolled and valid on the controller.<\/li>\n<li>Send the card again and watch the controller's event log.<\/li>\n<li>If D0 and D1 look swapped (wrong or garbled numbers), swap the two wires and test again.<\/li>\n<li>Try the same card on another reader (R1–R4) to tell a wiring fault from a format fault.<\/li>\n<\/ol>\n<p><span class=\"sme\">confirm the controller-side terminal names and the recommended level-shifter part for 5 V Wiegand inputs.<\/span><\/p>\n<h2>Still stuck<\/h2>\n<p>Send the Aether team:<\/p>\n<ul>\n<li>the reader used (R1–R4) and a photo of the wiring at both ends;<\/li>\n<li>the controller model and its reader input voltage;<\/li>\n<li>the card format, facility code and card number sent;<\/li>\n<li>what the controller logged, with its timestamp.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<li><a href=\"#a025\">025 Decode a card with the Format Analyzer<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<\/ul>", "text": "the controller doesn't read a wiegand card for users whose controller doesn't log a card sent from aether's wiegand readers: pins, wiring, ground, 3.3 v vs 5 v levels and card format.  summary aether's four onboard wiegand readers (r1–r4) send card data from pi gpio pins to a controller's reader inputs. if the controller logs nothing, or logs the wrong card, the cause is usually wiring, voltage level or card format. use this article when a card sent from readers › wiegand doesn't arrive as expected. symptoms you press send on readers › wiegand and the controller logs nothing. the controller logs a read error, or a card number that doesn't match. one reader works and another doesn't. likely causes d0 and d1 are swapped, or wired to the wrong reader terminals. no common ground between aether and the controller. the controller's reader input expects 5 v wiegand. pi gpio is 3.3 v, so a 5 v line needs a level shifter or open-collector buffer. the card format sent doesn't match the format the controller expects (bit length, facility code). the card isn't enrolled or valid on the controller. fix it open setup › hat pinout and find the pins for the reader you're using: reader d0 d1 r1 gpio 17 gpio 27 r2 gpio 22 gpio 23 r3 gpio 24 gpio 25 r4 gpio 5 gpio 6 caution: power down the controller's reader port before you rewire. check d0 goes to the controller's d0 (data0) and d1 to d1 (data1). connect a ground wire from the pi's gnd to the controller's reader gnd. check the controller's reader input voltage in its manual. if it's a 5 v input, fit a level shifter or open-collector buffer between aether and the controller. don't connect a 5 v line straight to a pi gpio pin. on readers › wiegand , check the card format matches the controller (for example 26-bit with the same facility code). check the card number is enrolled and valid on the controller. send the card again and watch the controller's event log. if d0 and d1 look swapped (wrong or garbled numbers), swap the two wires and test again. try the same card on another reader (r1–r4) to tell a wiring fault from a format fault. confirm the controller-side terminal names and the recommended level-shifter part for 5 v wiegand inputs. still stuck send the aether team: the reader used (r1–r4) and a photo of the wiring at both ends; the controller model and its reader input voltage; the card format, facility code and card number sent; what the controller logged, with its timestamp. related articles 020 send a card from an emulated wiegand reader 022 wiegand pins and voltage levels (r1–r4) 037 wire aether to an nhp or nop controller 025 decode a card with the format analyzer 036 hat pinout: pi header and sequent board pages "}], "sme": [{"id": "a029", "q": "confirm the option names in **Lock Signal** on the Pi."}, {"id": "a031", "q": "confirm which card-level changes now save automatically on the Pi."}, {"id": "a032", "q": "confirm the switch labels on the Pi; older builds show an **I/O Source** list."}, {"id": "a032", "q": "confirm the field names for board points in Mandatory I/O."}, {"id": "a033", "q": "confirm the Auto-assign button names and the defaults they use."}, {"id": "a033", "q": "confirm whether Elevator settings are now saved on the Pi or only in this browser."}, {"id": "a034", "q": "confirm the elevator Auto-assign defaults (O.D. 1–4, then DAC 1–4 for tracking; EOL zones 1–8 for grants) on the current Pi."}, {"id": "a035", "q": "confirm the table titles and the Save button label on the Pi."}, {"id": "a036", "q": "confirm the page tab names and which groups are marked unused on the current Pi."}, {"id": "a037", "q": "confirm the REX terminal label on NHP P-series boards."}, {"id": "a045", "q": "confirm emulator configs are part of the full backup."}, {"id": "a047", "q": "confirm the button label for a new rule."}, {"id": "a048", "q": "confirm the trigger label."}, {"id": "a048", "q": "confirm how days are picked on the current page."}, {"id": "a050", "q": "confirm the button labels for starting and capturing."}, {"id": "a066", "q": "confirm the Single file option labels on the Pi."}, {"id": "a067", "q": "confirm the section title on the Pi"}, {"id": "a067", "q": "confirm whether Restore asks for confirmation"}, {"id": "a068", "q": "confirm exact wording"}, {"id": "a071", "q": "confirm the confirm button label"}, {"id": "a072", "q": "confirm the restore button label"}, {"id": "a072", "q": "confirm how to restore that kept copy from the page"}, {"id": "a074", "q": "confirm which current update carries the OnCAFE sign-in page"}, {"id": "a002", "q": "confirm the current case build"}, {"id": "a004", "q": "confirm the final Tools order on the Pi."}, {"id": "a004", "q": "confirm whether the last page is kept after the browser is closed."}, {"id": "a005", "q": "confirm the button position and tooltip text on the Pi"}, {"id": "a007", "q": "confirm the card and button labels on the Pi"}, {"id": "a011", "q": "confirm how Tests rules are saved."}, {"id": "a013", "q": "confirm that disabled readers stay listed after a backend restart on the current build; earlier builds only reloaded enabled readers."}, {"id": "a015", "q": "confirm the label."}, {"id": "a017", "q": "confirm the control name."}, {"id": "a017", "q": "confirm the pause control."}, {"id": "a018", "q": "confirm the export control and formats on the current build."}, {"id": "a018", "q": "confirm on the current build."}, {"id": "a019", "q": "confirm whether the export follows the current filter."}, {"id": "a019", "q": "confirm the export control label."}, {"id": "a020", "q": "confirm the button text on the current build."}, {"id": "a020", "q": "confirm the current fallback behaviour."}, {"id": "a020", "q": "confirm the fix shipped for the transmitter permission on the current build."}, {"id": "a022", "q": "confirm the transmitter on the shipped Pi supports 256-bit frames."}, {"id": "a023", "q": "confirm the current counts."}, {"id": "a024", "q": "confirm the button labels for issue level and fixed bits"}, {"id": "a024", "q": "confirm the test-send control and which reader it uses."}, {"id": "a025", "q": "confirm the input mode labels."}, {"id": "a026", "q": "confirm whether the rebuilt Wiegand page has Quick Credentials."}, {"id": "a027", "q": "confirm how NFC is enabled and whether it is enabled on shipped kits."}, {"id": "a055", "q": "confirm whether the current build has a button to run this check from the page; the 2026-09-20 code only runs it at backend start."}, {"id": "a057", "q": "confirm the tab names and order on the current Pi build."}, {"id": "a058", "q": "confirm the scan button label."}, {"id": "a058", "q": "confirm the add button label."}, {"id": "a059", "q": "confirm the send button label; it may include the action name."}, {"id": "a061", "q": "confirm the label of the Compare view and whether \"Only differences\" is on by default."}, {"id": "a062", "q": "confirm the capture button label."}, {"id": "a062", "q": "confirm where the open-file option sits on the current build."}, {"id": "a063", "q": "confirm whether the controller answers at once or only when the transfer ends."}, {"id": "a064", "q": "confirm these steps against the VMS versions in your lab."}, {"id": "a075", "q": "confirm what the Console / API switch changes in the generated script."}, {"id": "a075", "q": "confirm what Parallel workers controls and a safe default."}, {"id": "a075", "q": "confirm which fields Connection holds."}, {"id": "a075", "q": "confirm the script is run from the browser DevTools console of a signed-in OnCAFE tab."}, {"id": "a078", "q": "confirm the control label and whether it is a button or a picker."}, {"id": "a078", "q": "confirm whether the VR6 shipped in NOA-E1W4/US should be drawn anyway."}, {"id": "a078", "q": "confirm how knockout fill is handled in the current release."}, {"id": "a080", "q": "confirm the P200/P400 budget on 12 V DC and 24 V DC feeds."}, {"id": "a081", "q": "confirm the Import entry point (Site view Properties or top bar) in the current release."}, {"id": "a081", "q": "confirm the address field label."}, {"id": "a081", "q": "confirm production OnCAFE sign-in through Aether has been tested."}, {"id": "a082", "q": "confirm the sign-in button label."}, {"id": "a086", "q": "confirm the exact picker label and option wording on the Pi."}, {"id": "a086", "q": "confirm the owner filter labels."}, {"id": "a087", "q": "confirm the label of the Show raw on/off setting."}, {"id": "a088", "q": "confirm the meaning of this message."}, {"id": "a088", "q": "confirm the exact NHP-P200 message text for the short reader offline blip."}, {"id": "a089", "q": "confirm the date filter options."}, {"id": "a089", "q": "confirm the search box exists and its label."}, {"id": "a089", "q": "confirm whether the page offers an export of Audit, System and Emulation logs."}, {"id": "a091", "q": "confirm in-tool capture works under Tools > KB Studio over HTTPS."}, {"id": "a093", "q": "confirm how long tool pages are cached and whether a later update made the Pi tell browsers to always recheck HTML pages."}, {"id": "a095", "q": "confirm whether Aether kits should make this permanent with `usbcore.autosuspend=-1` in `/boot/firmware/cmdline.txt`."}, {"id": "a096", "q": "confirm which tab holds Scan, Diagnose and Start after the menu reorder (Enrollment or Bus & readers)."}, {"id": "a097", "q": "confirm the recommended way to stop ModemManager/brltty grabbing RS-485 adapters on Aether kits."}, {"id": "a098", "q": "confirm abort behaviour is safe for every supported reader family."}, {"id": "a102", "q": "confirm the router setting names to list for common lab routers."}, {"id": "a103", "q": "confirm the minimum Aether/SUNAPI update that scans port 443 by default."}, {"id": "a104", "q": "confirm the exact on-screen wording."}, {"id": "a104", "q": "confirm the causes that leave the manager uninitialized."}, {"id": "a104", "q": "confirm the supported way to fix a switch profile when the page refuses changes, and the file location."}, {"id": "a104", "q": "confirm where the protected (uplink) ports are set in the profile."}, {"id": "a105", "q": "confirm the controller-side terminal names and the recommended level-shifter part for 5 V Wiegand inputs."}], "start": ["a001", "a002", "a003", "a004", "a009", "a010", "a013", "a014"]}</script>
<script>
(function(){
const KB=JSON.parse(document.getElementById('kb').textContent);
const A=KB.articles, byId={}; A.forEach((a,i)=>{a.i=i;byId[a.id]=a});
const areas=KB.areas;
const nav=document.getElementById('nav'), view=document.getElementById('view'), q=document.getElementById('q'), main=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stKey=s=>s.split(' ')[0];
let filt={aud:null,st:null};
const get=(k,d)=>{try{return localStorage.getItem(k)??d}catch(e){return d}}, put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

// theme
const tb=document.getElementById('themeBtn');
function applyTheme(t){ if(t) document.documentElement.setAttribute('data-theme',t); }
if(!document.documentElement.classList.contains('in-aether'))applyTheme(get('aetherkb-theme',null));
tb.onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const n=cur==='dark'?'light':'dark';applyTheme(n);put('aetherkb-theme',n)};

// menu (phone)
const mb=document.getElementById('menuBtn');
mb.onclick=()=>{const o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',o)};

function passes(a){return (!filt.aud||a.audience===filt.aud||(filt.aud==='User'&&a.audience==='Both'))&&(!filt.st||stKey(a.status)===filt.st)}

function renderNav(cur){
  const chips=[['aud','User','User'],['aud','Both','Both'],['aud','Dev','Dev'],['st','Draft','Draft'],['st','Needs','Needs SME'],['st','Ready','Ready']]
    .filter(([k,v])=>A.some(a=>k==='aud'?a.audience===v:stKey(a.status)===v));
  let h='<div class="filters" role="group" aria-label="Filter">'+chips.map(([k,v,l])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${filt[k]===v}">${l}</button>`).join('')+'</div>';
  h+=`<a class="navtop" href="#home" ${cur==='home'?'aria-current="page"':''}>Overview</a>`;
  if(KB.sme.length) h+=`<a class="navtop" href="#sme" ${cur==='sme'?'aria-current="page"':''}>Open SME questions <span style="color:var(--text-3);font-weight:500">${KB.sme.length}</span></a>`;
  const curA=byId[cur];
  areas.forEach(ar=>{
    const list=A.filter(a=>a.area===ar.name&&passes(a)); if(!list.length) return;
    const open=(curA&&curA.area===ar.name)||get('aetherkb-open-'+ar.slug,'0')==='1';
    h+=`<details class="area" data-slug="${ar.slug}" ${open?'open':''}><summary><svg class="caret" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>${esc(ar.name)}<span class="n">${list.length}</span></summary><ul class="alist">`+
      list.map(a=>`<li><a href="#${a.id}" ${a.id===cur?'aria-current="page"':''}><span class="dot ${stKey(a.status)}" title="${esc(a.status)}"></span><span class="num">${a.num}</span><span>${esc(a.title)}</span></a></li>`).join('')+'</ul></details>';
  });
  nav.innerHTML=h;
  nav.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;filt[k]=filt[k]===v?null:v;renderNav(current())});
  nav.querySelectorAll('details.area').forEach(d=>d.addEventListener('toggle',()=>put('aetherkb-open-'+d.dataset.slug,d.open?'1':'0')));
  const c=nav.querySelector('[aria-current="page"]'); if(c&&c.scrollIntoView&&cur!=='home') c.scrollIntoView({block:'nearest'});
}

function badges(a){
  return `<span class="badge st-${stKey(a.status)}">${esc(a.status)}</span><span class="badge">${esc(a.type)}</span><span class="badge">${esc(a.audience==='Both'?'User + Dev':a.audience)}</span><span class="badge ${a.priority==='P1'?'p1':''}">${esc(a.priority)}</span>`;
}

function renderArticle(a){
  const ar=areas.find(x=>x.name===a.area);
  const prev=A[a.i-1], next=A[a.i+1];
  view.innerHTML=`<div class="crumb"><a href="#home">${esc(KB.brand)}</a> › <a href="#area-${ar.slug}">${esc(a.area)}</a> › ${a.num}</div>
  <h1>${esc(a.title)}</h1><div class="meta">${badges(a)}</div>
  ${a.brief?`<p class="brief">${esc(a.brief).replace(/ &gt; /g,' › ')}</p>`:''}
  <article class="article">${a.html}</article>
  <div class="foot">${prev?`<a href="#${prev.id}"><small>← ${prev.num}</small>${esc(prev.title)}</a>`:''}${next?`<a class="next" href="#${next.id}"><small>${next.num} →</small>${esc(next.title)}</a>`:''}</div>
  ${a.sources.length?`<p class="src">Sources: ${a.sources.map(esc).join(' · ')}</p>`:''}`;
  view.querySelectorAll('pre').forEach(p=>{const b=document.createElement('button');b.className='copy';b.textContent='Copy';
    b.onclick=()=>{const t=p.querySelector('code').innerText;const done=()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)};
      try{navigator.clipboard.writeText(t).then(done,()=>sel(p))}catch(e){sel(p)}};p.appendChild(b)});
  document.title=a.num+' '+a.title+' · '+KB.brand;
}
function sel(p){const r=document.createRange();r.selectNodeContents(p.querySelector('code'));const s=getSelection();s.removeAllRanges();s.addRange(r)}

function counts(list){const c={Draft:0,Needs:0,Ready:0};list.forEach(a=>{const k=stKey(a.status);c[k==='Published'?'Ready':k]++});return c}
function bar(c,n){return `<div class="bar2" aria-hidden="true"><i class="r" style="width:${c.Ready/n*100}%"></i><i class="d" style="width:${c.Draft/n*100}%"></i><i class="s" style="width:${c.Needs/n*100}%"></i></div>`}

function renderHome(){
  const c=counts(A), p1=A.filter(a=>a.priority==='P1').length;
  view.innerHTML=`<div class="hero"><h1>${esc(KB.heading)}</h1><p class="lead">${esc(KB.lead)}</p></div>
  <div class="stats"><div class="stat"><b>${A.length}</b><span>Articles</span></div><div class="stat"><b>${p1}</b><span>Priority 1</span></div>
  <div class="stat"><b>${c.Draft}</b><span>Draft</span></div><div class="stat"><b>${c.Needs}</b><span>Needs SME</span></div></div>
  <div class="sect">Areas</div><div class="areas">${areas.map(ar=>{const l=A.filter(a=>a.area===ar.name);if(!l.length)return'';const cc=counts(l);
    return `<a class="areacard" href="#area-${ar.slug}"><b>${esc(ar.name)}</b><small>${l.length} articles · ${cc.Needs} need SME</small>${bar(cc,l.length)}</a>`}).join('')}</div>
  <div class="legend"><span><i class="dot Ready"></i>Ready</span><span><i class="dot Draft"></i>Draft</span><span><i class="dot Needs"></i>Needs SME check on a real Pi</span></div>
  <div class="sect">Start here</div><div class="list">${KB.start.map(id=>byId[id]).filter(Boolean).map(a=>rowHtml(a)).join('')}</div>`;
  document.title=KB.title;
}
function rowHtml(a,extra){return `<a class="row" href="#${a.id}"><span class="num">${a.num}</span><span class="t">${esc(a.title)}${extra?`<small>${extra}</small>`:`<small>${esc(a.brief)}</small>`}</span><span class="dot ${stKey(a.status)}"></span></a>`}

function renderArea(slug){
  const ar=areas.find(x=>x.slug===slug); if(!ar) return renderHome();
  const l=A.filter(a=>a.area===ar.name);
  view.innerHTML=`<div class="crumb"><a href="#home">${esc(KB.brand)}</a> › ${esc(ar.name)}</div><h1>${esc(ar.name)}</h1>
  <p class="lead">${l.length} articles.</p><div class="list">${l.map(a=>rowHtml(a)).join('')}</div>`;
  document.title=ar.name+' · '+KB.brand;
}

function renderSme(){
  const g={};KB.sme.forEach(s=>{(g[s.id]=g[s.id]||[]).push(s.q)});
  view.innerHTML=`<div class="crumb"><a href="#home">${esc(KB.brand)}</a> › Open SME questions</div><h1>Open SME questions</h1>
  <p class="lead">${KB.sme.length} facts to confirm on a real Pi, in ${Object.keys(g).length} articles. Fix the article, remove the flag, then move it to Ready after review.</p>
  <div class="list">${Object.keys(g).map(id=>{const a=byId[id];return `<a class="row" href="#${id}"><span class="num">${a.num}</span><span class="t">${esc(a.title)}<small>${g[id].map(esc).join('<br>')}</small></span></a>`}).join('')}</div>`;
  document.title='Open SME questions · '+KB.brand;
}

function renderSearch(term){
  const t=term.trim().toLowerCase(), words=t.split(/\s+/).filter(Boolean);
  const hits=A.map(a=>{let s=0;words.forEach(w=>{if(a.title.toLowerCase().includes(w))s+=5;if(a.text.includes(w))s+=1});
    return {a,s:words.every(w=>a.title.toLowerCase().includes(w)||a.text.includes(w))?s:0}}).filter(h=>h.s>0&&passes(h.a)).sort((x,y)=>y.s-x.s);
  const snip=a=>{const i=a.text.indexOf(words[0]);if(i<0)return esc(a.brief);const s=a.text.slice(Math.max(0,i-60),i+120);
    let h=esc((i>60?'…':'')+s+'…');words.forEach(w=>{h=h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>')});return h};
  view.innerHTML=`<h1>Search</h1><p class="lead">${hits.length} result${hits.length===1?'':'s'} for “${esc(term)}”.</p>
  <div class="list">${hits.length?hits.slice(0,60).map(h=>rowHtml(h.a,snip(h.a))).join(''):'<div class="empty">No articles match. Try a menu name, a button label or a protocol term.</div>'}</div>`;
}

function current(){const h=location.hash.slice(1);return h||'home'}
function route(){
  const h=current(); nav.classList.remove('open'); mb.setAttribute('aria-expanded','false');
  if(q.value&&!h.startsWith('a')) {}
  if(byId[h]) renderArticle(byId[h]);
  else if(h.startsWith('area-')) renderArea(h.slice(5));
  else if(h==='sme') renderSme();
  else renderHome();
  renderNav(h); window.scrollTo(0,0);
}
let st;q.addEventListener('input',()=>{clearTimeout(st);st=setTimeout(()=>{if(q.value.trim().length>1){renderSearch(q.value);renderNav('search')}else route()},120)});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){q.value='';route()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
window.addEventListener('hashchange',()=>{q.value='';route()});
route();
})();
</script>

</body>
