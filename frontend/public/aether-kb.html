are saved on the pi, in the backend's emulator-configs folder. before you start for saving: the boards you want are added on controller emulator . save the current boards open controller emulator . click save . enter a config name, for example azure-3board . click save . saving under an existing name replaces that config. screenshot to add: saved configurations row with load, save, export and import buttons load a saved config caution: loading replaces every board on the page. if the bus is running, the controller sees the old boards disappear and the new ones appear. in saved configurations , pick the config. each entry shows how many devices it has. click load . export a config pick the config in saved configurations . click export . the browser downloads it as a json file. import a config click import . choose a config .json file. the config is added to saved configurations and selected. click load to use it. check that it worked after load , the devices grid shows the config's boards and the log says how many devices were applied. after import , the log shows \"imported config\" with its name. if something goes wrong symptom what to do the new config isn't in the list click the refresh icon next to saved configurations . import fails the file isn't a valid config json. export it again from the other aether. boards loaded but show never polled the controller doesn't have those addresses enrolled. configs are also included in setup › system & backup › download backup . confirm emulator configs are part of the full backup. related articles 042 add a downstream board and drive its i/o 041 what the controller emulator does 072 system & backup: health, backup and restore "}, {"id": "a046", "num": "046", "title": "Share a serial port between readers and the emulator", "area": "Emulation, Controller Emulator and automations", "type": "Concept", "audience": "User", "priority": "P2", "status": "Draft", "brief": "Explains how Aether shares each serial port between OSDP reader emulation, the Controller Emulator, firmware uploads and enrollment. For anyone running several RS-485 features.", "sources": ["claude/source-frontend.md", "claude/source-backend-routes.md", "Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Each USB-RS485 adapter is one serial port, and only one part of Aether can use a port at a time. OSDP reader emulation, the Controller Emulator, reader firmware uploads, COMSET and enrollment all need ports. Aether lends a port from one to another and gives it back, so you rarely have to stop anything by hand.<\/p>\n<h2>Who uses a port<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Uses the port as<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OSDP reader emulation (<strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong>)<\/td>\n<td>Readers answering a controller's polls<\/td>\n<\/tr>\n<tr>\n<td><strong>Controller Emulator<\/strong><\/td>\n<td>Downstream boards answering an IC2's polls<\/td>\n<\/tr>\n<tr>\n<td>Reader firmware upload and COMSET<\/td>\n<td>A controller talking to one real reader<\/td>\n<\/tr>\n<tr>\n<td>Enrollment (Scan, Diagnose, Start)<\/td>\n<td>A controller talking to one real reader<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Starting the Controller Emulator on a reader port<\/h2>\n<p>If you pick a port that OSDP reader emulation is using, <strong>Start Bus<\/strong> opens <strong>Port In Use by Reader Emulation<\/strong>. It lists the port and the readers configured on it.<\/p>\n<ul>\n<li><strong>Release &amp; Start<\/strong> stops reader polling on that port and starts the Controller Emulator there.<\/li>\n<li><strong>Stop Bus<\/strong> later gives the port back to reader emulation automatically.<\/li>\n<li><strong>Cancel<\/strong> leaves everything as it was.<\/li>\n<\/ul>\n<p>While the emulator holds the port, the readers on it don't answer their controller.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Port In Use by Reader Emulation dialog with Release &amp; Start<\/span><\/div>\n<h2>Firmware uploads, COMSET and enrollment<\/h2>\n<p>These borrow the port from reader emulation for the time they need it, then give it back, even if they fail or you press Stop. While they hold it, the readers on that port don't answer. Only one firmware upload runs at a time, and an Aether update that restarts the backend is refused during an upload.<\/p>\n<h2>Ports Aether can't take back<\/h2>\n<p>Another program outside Aether, such as a modem manager, can also hold a port. Aether reports the port as locked; free it on the Pi or use another adapter.<\/p>\n<h2>Good practice<\/h2>\n<ul>\n<li>Give the Controller Emulator its own adapter when you can, so readers and boards run at the same time.<\/li>\n<li>Keep one controller per bus. Two masters polling the same wires corrupt each other's frames.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a097\">097 Port in use when starting the emulator or an upload<\/a><\/li>\n<\/ul>", "text": "share a serial port between readers and the emulator explains how aether shares each serial port between osdp reader emulation, the controller emulator, firmware uploads and enrollment. for anyone running several rs-485 features.  summary each usb-rs485 adapter is one serial port, and only one part of aether can use a port at a time. osdp reader emulation, the controller emulator, reader firmware uploads, comset and enrollment all need ports. aether lends a port from one to another and gives it back, so you rarely have to stop anything by hand. who uses a port feature uses the port as osdp reader emulation ( readers › osdp ) readers answering a controller's polls controller emulator downstream boards answering an ic2's polls reader firmware upload and comset a controller talking to one real reader enrollment (scan, diagnose, start) a controller talking to one real reader starting the controller emulator on a reader port if you pick a port that osdp reader emulation is using, start bus opens port in use by reader emulation . it lists the port and the readers configured on it. release & start stops reader polling on that port and starts the controller emulator there. stop bus later gives the port back to reader emulation automatically. cancel leaves everything as it was. while the emulator holds the port, the readers on it don't answer their controller. screenshot to add: port in use by reader emulation dialog with release & start firmware uploads, comset and enrollment these borrow the port from reader emulation for the time they need it, then give it back, even if they fail or you press stop. while they hold it, the readers on that port don't answer. only one firmware upload runs at a time, and an aether update that restarts the backend is refused during an upload. ports aether can't take back another program outside aether, such as a modem manager, can also hold a port. aether reports the port as locked; free it on the pi or use another adapter. good practice give the controller emulator its own adapter when you can, so readers and boards run at the same time. keep one controller per bus. two masters polling the same wires corrupt each other's frames. related articles 042 add a downstream board and drive its i/o 014 assign a serial interface and baud rate 069 update osdp reader firmware (firmware wizard) 097 port in use when starting the emulator or an upload "}, {"id": "a047", "num": "047", "title": "Automation rules: triggers, conditions, actions", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to build AEGIS Automation rules from a trigger, conditions and actions, test them and understand the loop protection. For testers who want background behaviour during a test.", "sources": ["claude/source-backend-automation.md", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">AEGIS<i>›<\/i>Automation<\/strong> runs rules that react to what happens on Aether. Each rule reads <strong>When<\/strong> something happens, <strong>If<\/strong> conditions are met, <strong>Then<\/strong> do these actions. Use rules for background behaviour during a test, such as pulsing a relay whenever a door opens, or turning a switch port off when a card is read.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The relays, inputs, doors and readers the rule uses are set up.<\/li>\n<li>Keep an Aether page open in a browser if the rule watches opto inputs or EOL zones. The Pi reads those only while a browser is connected.<\/li>\n<\/ul>\n<h2>Create a rule<\/h2>\n<ol>\n<li>Open <strong class=\"path\">AEGIS<i>›<\/i>Automation<\/strong>.<\/li>\n<li>Create a new rule. <span class=\"sme\">confirm the button label for a new rule.<\/span><\/li>\n<li>Enter a name.<\/li>\n<li>Under <strong>When<\/strong>, pick the trigger:\n   - a relay changing;\n   - an opto input changing;\n   - an EOL zone changing state;\n   - door activity (lock, DPS, REX);\n   - an OSDP card read, an NFC read or a Wiegand send;\n   - a schedule (see <a href=\"#a048\">048<\/a>);\n   - <strong>Run now<\/strong> only.<\/li>\n<li>Under <strong>If<\/strong>, add any conditions, for example another input's state. Leave it empty to run every time.<\/li>\n<li>Under <strong>Then<\/strong>, add the actions in order:\n   - set or pulse a relay, optionally switching back after a set time;\n   - wait;\n   - send a Wiegand card;\n   - toggle a switch port;\n   - write a log line.<\/li>\n<li>Save the rule and make sure it is enabled.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Automation rule editor with When, If and Then sections filled in<\/span><\/div>\n<p>The pickers list your real relays, inputs, EOL zones, doors by name, readers and switch profiles.<\/p>\n<h2>Test a rule<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Running a rule performs its actions on real relays, readers and switch ports.<\/p>\n<ol>\n<li>On the rule's card, click <strong>Run now<\/strong>. A disabled rule can't be run.<\/li>\n<li>Check <strong>Recent firings<\/strong> for the result.<\/li>\n<\/ol>\n<h2>Built-in protection<\/h2>\n<ul>\n<li>A rule is never triggered by its own relay changes, and one rule can set off another at most twice in a row.<\/li>\n<li>Relay writes and runs started by rules are rate-limited.<\/li>\n<li>A rule triggered more than 10 times in 30 s is disabled, and its card says why.<\/li>\n<li>Disabling, deleting or editing a rule cancels its run and releases any relay it was holding.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The rule card reads in plain English, for example \"When REL 3 turns ON → pulse REL 4 for 500 ms\".<\/li>\n<li>The summary strip counts runs and errors today, and <strong>Recent firings<\/strong> lists each run.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A rule on an opto or zone never fires<\/td>\n<td>Open Aether in a browser and leave it open.<\/td>\n<\/tr>\n<tr>\n<td>A rule switched itself off<\/td>\n<td>It fired more than 10 times in 30 s. Fix the trigger or conditions, then enable it again.<\/td>\n<\/tr>\n<tr>\n<td>A rule has a warning badge saying it fires on every Pi GPIO write<\/td>\n<td>It is an older rule with no trigger. Edit it to add one, or disable it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a048\">048 Schedule an automation rule<\/a><\/li>\n<li><a href=\"#a038\">038 Build a test run from blocks (Emulation)<\/a><\/li>\n<li><a href=\"#a049\">049 EOL supervision: the four zone states<\/a><\/li>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<\/ul>", "text": "automation rules: triggers, conditions, actions how to build aegis automation rules from a trigger, conditions and actions, test them and understand the loop protection. for testers who want background behaviour during a test.  summary aegis › automation runs rules that react to what happens on aether. each rule reads when something happens, if conditions are met, then do these actions. use rules for background behaviour during a test, such as pulsing a relay whenever a door opens, or turning a switch port off when a card is read. before you start the relays, inputs, doors and readers the rule uses are set up. keep an aether page open in a browser if the rule watches opto inputs or eol zones. the pi reads those only while a browser is connected. create a rule open aegis › automation . create a new rule. confirm the button label for a new rule. enter a name. under when , pick the trigger: - a relay changing; - an opto input changing; - an eol zone changing state; - door activity (lock, dps, rex); - an osdp card read, an nfc read or a wiegand send; - a schedule (see 048 ); - run now only. under if , add any conditions, for example another input's state. leave it empty to run every time. under then , add the actions in order: - set or pulse a relay, optionally switching back after a set time; - wait; - send a wiegand card; - toggle a switch port; - write a log line. save the rule and make sure it is enabled. screenshot to add: automation rule editor with when, if and then sections filled in the pickers list your real relays, inputs, eol zones, doors by name, readers and switch profiles. test a rule caution: running a rule performs its actions on real relays, readers and switch ports. on the rule's card, click run now . a disabled rule can't be run. check recent firings for the result. built-in protection a rule is never triggered by its own relay changes, and one rule can set off another at most twice in a row. relay writes and runs started by rules are rate-limited. a rule triggered more than 10 times in 30 s is disabled, and its card says why. disabling, deleting or editing a rule cancels its run and releases any relay it was holding. check that it worked the rule card reads in plain english, for example \"when rel 3 turns on → pulse rel 4 for 500 ms\". the summary strip counts runs and errors today, and recent firings lists each run. if something goes wrong symptom what to do a rule on an opto or zone never fires open aether in a browser and leave it open. a rule switched itself off it fired more than 10 times in 30 s. fix the trigger or conditions, then enable it again. a rule has a warning badge saying it fires on every pi gpio write it is an older rule with no trigger. edit it to add one, or disable it. related articles 048 schedule an automation rule 038 build a test run from blocks (emulation) 049 eol supervision: the four zone states 052 turn a switch port off with an automatic hold "}, {"id": "a048", "num": "048", "title": "Schedule an automation rule", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to give an Automation rule a time-of-day schedule, test it and stop it. For testers who need actions at set times.", "sources": ["claude/source-backend-automation.md", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>A rule with a schedule trigger runs its actions at a set time of day, on the days you choose, without anyone pressing a button. Use it for things like turning a relay on every morning before a test shift, or cycling a switch port overnight.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You know how to build a rule's actions. See <a href=\"#a047\">047<\/a>.<\/li>\n<li>The Pi's clock and time zone are right. Schedules use the Pi's local time.<\/li>\n<\/ul>\n<h2>Schedule a rule<\/h2>\n<ol>\n<li>Open <strong class=\"path\">AEGIS<i>›<\/i>Automation<\/strong>.<\/li>\n<li>Create a rule, or open an existing one to edit it.<\/li>\n<li>Under <strong>When<\/strong>, pick the schedule trigger. <span class=\"sme\">confirm the trigger label.<\/span><\/li>\n<li>Enter the time in 24-hour form, for example <code>07:05<\/code>. A time such as <code>7:05<\/code> is accepted too.<\/li>\n<li>Pick the days it runs. Leave all days off to run every day. <span class=\"sme\">confirm how days are picked on the current page.<\/span><\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Rule editor with a schedule trigger at 07:05 on weekdays<\/span><\/div>\n<ol start=\"6\">\n<li>Add any <strong>If<\/strong> conditions. They are checked at the scheduled time.<\/li>\n<li>Add the <strong>Then<\/strong> actions.<\/li>\n<li>Save the rule and make sure it is enabled.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> Once saved and enabled, the rule switches real relays or switch ports at the scheduled time, whether or not anyone is at the bench.<\/p>\n<h2>Try it without waiting<\/h2>\n<ol>\n<li>On the rule's card, click <strong>Run now<\/strong>. The actions run once straight away.<\/li>\n<\/ol>\n<h2>Stop a scheduled rule<\/h2>\n<ol>\n<li>Turn the rule's enabled switch off. The schedule stops until you turn it on again.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>At the scheduled minute, <strong>Recent firings<\/strong> lists the run and the summary strip counts it.<\/li>\n<li>The rule card shows its last run time.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rule didn't run at the time<\/td>\n<td>Check it is enabled, the time and days are right, and the Pi's clock matches local time.<\/td>\n<\/tr>\n<tr>\n<td>Rule ran twice in the same minute<\/td>\n<td>Make sure only one rule has that schedule. Each rule runs once per scheduled minute.<\/td>\n<\/tr>\n<tr>\n<td>Rule ran but did nothing<\/td>\n<td>Its <strong>If<\/strong> conditions weren't met at that time. Check <strong>Recent firings<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A schedule in a rule runs on the Pi. To start an Emulation workflow at a time, use <strong>Schedule Run<\/strong> in Emulation instead; see <a href=\"#a039\">039<\/a>.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a047\">047 Automation rules: triggers, conditions, actions<\/a><\/li>\n<li><a href=\"#a039\">039 Run, pause and schedule a workflow<\/a><\/li>\n<\/ul>", "text": "schedule an automation rule how to give an automation rule a time-of-day schedule, test it and stop it. for testers who need actions at set times.  summary a rule with a schedule trigger runs its actions at a set time of day, on the days you choose, without anyone pressing a button. use it for things like turning a relay on every morning before a test shift, or cycling a switch port overnight. before you start you know how to build a rule's actions. see 047 . the pi's clock and time zone are right. schedules use the pi's local time. schedule a rule open aegis › automation . create a rule, or open an existing one to edit it. under when , pick the schedule trigger. confirm the trigger label. enter the time in 24-hour form, for example 07:05 . a time such as 7:05 is accepted too. pick the days it runs. leave all days off to run every day. confirm how days are picked on the current page. screenshot to add: rule editor with a schedule trigger at 07:05 on weekdays add any if conditions. they are checked at the scheduled time. add the then actions. save the rule and make sure it is enabled. caution: once saved and enabled, the rule switches real relays or switch ports at the scheduled time, whether or not anyone is at the bench. try it without waiting on the rule's card, click run now . the actions run once straight away. stop a scheduled rule turn the rule's enabled switch off. the schedule stops until you turn it on again. check that it worked at the scheduled minute, recent firings lists the run and the summary strip counts it. the rule card shows its last run time. if something goes wrong symptom what to do rule didn't run at the time check it is enabled, the time and days are right, and the pi's clock matches local time. rule ran twice in the same minute make sure only one rule has that schedule. each rule runs once per scheduled minute. rule ran but did nothing its if conditions weren't met at that time. check recent firings . a schedule in a rule runs on the pi. to start an emulation workflow at a time, use schedule run in emulation instead; see 039 . related articles 047 automation rules: triggers, conditions, actions 039 run, pause and schedule a workflow "}, {"id": "a049", "num": "049", "title": "EOL supervision: the four zone states", "area": "Emulation, Controller Emulator and automations", "type": "Concept", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Explains EOL supervision on Aether's analog inputs: the four zone states, their default voltages, profiles, and where zone states show. For testers using supervised inputs.", "sources": ["claude/docs-and-config.md", "Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Aether's 8 analog inputs measure the voltage on a supervised (EOL) loop and sort it into one of four states: <strong>NORMAL<\/strong>, <strong>ALARM<\/strong>, <strong>TAMPER<\/strong> or <strong>TROUBLE<\/strong>. This lets Aether watch a controller output or a test circuit the way a supervised panel input would, and see a cut or shorted wire as well as on and off.<\/p>\n<h2>How a supervised loop works<\/h2>\n<p>A supervised loop has two resistors: an end-of-line (EOL) resistor and an alarm resistor. The sensor contact switches the alarm resistor in or out. Because each wiring condition gives a different resistance, the voltage tells Aether what is happening:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>Wiring<\/th>\n<th>Default range<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TAMPER<\/strong><\/td>\n<td>Loop shorted, bypassing the resistors<\/td>\n<td>0–0.103 V<\/td>\n<\/tr>\n<tr>\n<td><strong>ALARM<\/strong><\/td>\n<td>Sensor triggered (contact open)<\/td>\n<td>0.104–0.292 V<\/td>\n<\/tr>\n<tr>\n<td><strong>NORMAL<\/strong><\/td>\n<td>Contact closed (door shut, sensor secured)<\/td>\n<td>0.293–1.354 V<\/td>\n<\/tr>\n<tr>\n<td><strong>TROUBLE<\/strong><\/td>\n<td>Wire cut (open loop)<\/td>\n<td>1.355–3.5 V<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>These defaults come from a 4-point calibration of the factory 1k/2.2k pair (measured: short 0.003 V, alarm 0.204 V, normal 0.380 V, open 3.304 V) with safety margins between states. Other resistor pairs give other voltages, so calibrate each pair you use. See <a href=\"#a050\">050<\/a>.<\/p>\n<h2>Zones and profiles<\/h2>\n<ul>\n<li>Analog inputs 1–8 are EOL zones 1–8. All 8 are monitored, wired or not, so an unwired zone usually reads TROUBLE.<\/li>\n<li>Each calibrated resistor pair is saved as a profile, such as <code>1k/2.2k<\/code> or <code>3k/4.5k<\/code>. One profile is the default for every zone; you can point single zones at another profile.<\/li>\n<\/ul>\n<h2>Where zone states show<\/h2>\n<ul>\n<li><strong class=\"path\">Access Control<i>›<\/i>Controls<\/strong>: the <strong>Live Inputs<\/strong> panel shows all 8 zones with their volts and state. A monitored input set to <strong>Analog<\/strong> in <strong>I/O Mapping<\/strong> shows the zone state.<\/li>\n<li><strong class=\"path\">Setup<i>›<\/i>HAT Pinout<\/strong>: the Sequent board page shows each zone's voltage and state.<\/li>\n<li><strong>Doors<\/strong>: a door's lock can watch an EOL zone instead of an opto input.<\/li>\n<li><strong>Elevator<\/strong>: floor grants can be read on EOL zones.<\/li>\n<li><strong>AEGIS<\/strong>: Emulation <strong>Supervision<\/strong> blocks and Automation rules can react to zone changes.<\/li>\n<\/ul>\n<p>Zones are read about every 0.5 s while an Aether page is open in a browser.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Controls, Live Inputs panel with zone 5 in ALARM and zone 7 in TAMPER<\/span><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a050\">050 Calibrate an EOL zone<\/a><\/li>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a028\">028 Controls page: outputs, inputs and system outputs<\/a><\/li>\n<li><a href=\"#a047\">047 Automation rules: triggers, conditions, actions<\/a><\/li>\n<\/ul>", "text": "eol supervision: the four zone states explains eol supervision on aether's analog inputs: the four zone states, their default voltages, profiles, and where zone states show. for testers using supervised inputs.  summary aether's 8 analog inputs measure the voltage on a supervised (eol) loop and sort it into one of four states: normal , alarm , tamper or trouble . this lets aether watch a controller output or a test circuit the way a supervised panel input would, and see a cut or shorted wire as well as on and off. how a supervised loop works a supervised loop has two resistors: an end-of-line (eol) resistor and an alarm resistor. the sensor contact switches the alarm resistor in or out. because each wiring condition gives a different resistance, the voltage tells aether what is happening: state wiring default range tamper loop shorted, bypassing the resistors 0–0.103 v alarm sensor triggered (contact open) 0.104–0.292 v normal contact closed (door shut, sensor secured) 0.293–1.354 v trouble wire cut (open loop) 1.355–3.5 v these defaults come from a 4-point calibration of the factory 1k/2.2k pair (measured: short 0.003 v, alarm 0.204 v, normal 0.380 v, open 3.304 v) with safety margins between states. other resistor pairs give other voltages, so calibrate each pair you use. see 050 . zones and profiles analog inputs 1–8 are eol zones 1–8. all 8 are monitored, wired or not, so an unwired zone usually reads trouble. each calibrated resistor pair is saved as a profile, such as 1k/2.2k or 3k/4.5k . one profile is the default for every zone; you can point single zones at another profile. where zone states show access control › controls : the live inputs panel shows all 8 zones with their volts and state. a monitored input set to analog in i/o mapping shows the zone state. setup › hat pinout : the sequent board page shows each zone's voltage and state. doors : a door's lock can watch an eol zone instead of an opto input. elevator : floor grants can be read on eol zones. aegis : emulation supervision blocks and automation rules can react to zone changes. zones are read about every 0.5 s while an aether page is open in a browser. screenshot to add: controls, live inputs panel with zone 5 in alarm and zone 7 in tamper related articles 050 calibrate an eol zone 034 default i/o map: relays, inputs, supervision channels 028 controls page: outputs, inputs and system outputs 047 automation rules: triggers, conditions, actions "}, {"id": "a050", "num": "050", "title": "Calibrate an EOL zone", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to calibrate a resistor pair on Setup > EOL Calibration, save it as a profile and assign it to zones. For testers setting up supervised inputs.", "sources": ["Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>EOL Calibration<\/strong> measures a real supervised loop in its four wiring states and works out the voltage bands Aether uses for NORMAL, ALARM, TAMPER and TROUBLE. Each resistor pair you calibrate is saved as a named profile. Calibrate once per resistor pair before you rely on zone states in a test.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A test loop with the EOL and alarm resistors you will use is wired to one of Aether's analog inputs.<\/li>\n<li>You can short the loop, open the contact, close the contact and cut (disconnect) the wire during the calibration.<\/li>\n<li>You know both resistor values in ohms.<\/li>\n<\/ul>\n<h2>Calibrate a resistor pair<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>EOL Calibration<\/strong>.<\/li>\n<li>Pick the board and zone the test loop is wired to.<\/li>\n<li>Enter the EOL resistor and alarm resistor values. The profile is named from them, for example 3000 and 4500 become <code>3k/4.5k<\/code>.<\/li>\n<li>Start the calibration. <span class=\"sme\">confirm the button labels for starting and capturing.<\/span><\/li>\n<li>For each state, set up the wiring shown on screen, wait for the live reading to settle, then capture it:\n   - <strong>Tamper (short)<\/strong>: short the two zone wires together, bypassing both resistors.\n   - <strong>Alarm (contact open)<\/strong>: wire the resistors in and open the sensor contact.\n   - <strong>Normal (secured)<\/strong>: close the sensor contact.\n   - <strong>Trouble<\/strong>: cut or disconnect a zone wire.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: EOL Calibration with the live band meter and the four capture steps<\/span><\/div>\n<ol start=\"6\">\n<li>Review the captured voltages and the bands they produce.<\/li>\n<li>Choose to save as a new profile or overwrite an existing one, and edit the name if needed.<\/li>\n<li>Tick <strong>make default<\/strong> to use it for every zone, and/or <strong>use for this zone<\/strong> for just this one. The first profile you save becomes the default.<\/li>\n<li>Save.<\/li>\n<\/ol>\n<p>Saving is refused if the four states are not in voltage order, if two are within 50 mV of each other, or if the name is already taken. Capture again if so.<\/p>\n<h2>Assign profiles to zones<\/h2>\n<ol>\n<li>In the <strong>Zones<\/strong> table, pick a profile for any zone that uses a different resistor pair.<\/li>\n<li>Zones you leave alone use the default profile.<\/li>\n<\/ol>\n<h2>Manage profiles<\/h2>\n<p>Each profile card shows its resistors, date and the four measured voltages, with <strong>Make default<\/strong>, <strong>Recalibrate<\/strong>, <strong>Rename<\/strong> and <strong>Delete<\/strong>. Deleting a profile moves its zones back to the default. The built-in <strong>Factory 1k/2.2k<\/strong> profile can't be edited or deleted. <strong>Reset<\/strong> makes the factory profile the default and clears zone overrides; saved profiles are kept.<\/p>\n<h2>Check that it worked<\/h2>\n<p>Walk the zone through each state again. The live meter and <strong class=\"path\">Controls<i>›<\/i>Live Inputs<\/strong> should show the matching state each time.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Save refused: states out of order<\/td>\n<td>One wiring step was wrong. Recapture that state.<\/td>\n<\/tr>\n<tr>\n<td>Save refused: two states too close<\/td>\n<td>The resistors are too close in value to tell apart. Use a different pair.<\/td>\n<\/tr>\n<tr>\n<td>Reading jumps around<\/td>\n<td>Check the loop's connections and capture again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a049\">049 EOL supervision: the four zone states<\/a><\/li>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<\/ul>", "text": "calibrate an eol zone how to calibrate a resistor pair on setup > eol calibration, save it as a profile and assign it to zones. for testers setting up supervised inputs.  summary setup › eol calibration measures a real supervised loop in its four wiring states and works out the voltage bands aether uses for normal, alarm, tamper and trouble. each resistor pair you calibrate is saved as a named profile. calibrate once per resistor pair before you rely on zone states in a test. before you start a test loop with the eol and alarm resistors you will use is wired to one of aether's analog inputs. you can short the loop, open the contact, close the contact and cut (disconnect) the wire during the calibration. you know both resistor values in ohms. calibrate a resistor pair open setup › eol calibration . pick the board and zone the test loop is wired to. enter the eol resistor and alarm resistor values. the profile is named from them, for example 3000 and 4500 become 3k/4.5k . start the calibration. confirm the button labels for starting and capturing. for each state, set up the wiring shown on screen, wait for the live reading to settle, then capture it: - tamper (short) : short the two zone wires together, bypassing both resistors. - alarm (contact open) : wire the resistors in and open the sensor contact. - normal (secured) : close the sensor contact. - trouble : cut or disconnect a zone wire. screenshot to add: eol calibration with the live band meter and the four capture steps review the captured voltages and the bands they produce. choose to save as a new profile or overwrite an existing one, and edit the name if needed. tick make default to use it for every zone, and/or use for this zone for just this one. the first profile you save becomes the default. save. saving is refused if the four states are not in voltage order, if two are within 50 mv of each other, or if the name is already taken. capture again if so. assign profiles to zones in the zones table, pick a profile for any zone that uses a different resistor pair. zones you leave alone use the default profile. manage profiles each profile card shows its resistors, date and the four measured voltages, with make default , recalibrate , rename and delete . deleting a profile moves its zones back to the default. the built-in factory 1k/2.2k profile can't be edited or deleted. reset makes the factory profile the default and clears zone overrides; saved profiles are kept. check that it worked walk the zone through each state again. the live meter and controls › live inputs should show the matching state each time. if something goes wrong symptom what to do save refused: states out of order one wiring step was wrong. recapture that state. save refused: two states too close the resistors are too close in value to tell apart. use a different pair. reading jumps around check the loop's connections and capture again. related articles 049 eol supervision: the four zone states 034 default i/o map: relays, inputs, supervision channels 036 hat pinout: pi header and sequent board pages "}, {"id": "a051", "num": "051", "title": "Add a switch profile and test the login", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to add an Ethernet switch to Switch Ports, protect its uplink, store the password and check that Aether can log in. For anyone setting up network-loss tests.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p><strong>Switch Ports<\/strong> lets Aether take a device's network link or PoE power down and bring it back, so offline tests run without pulling cables. Each switch is a <em>profile<\/em>.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>An Allied Telesis switch running AlliedWare Plus that Aether can reach over SSH. Other makes, including NETGEAR, are not supported.<\/li>\n<li>The switch's IP address, an admin username and its password.<\/li>\n<li>Know which switch port is the uplink and which port the Pi itself is plugged into.<\/li>\n<\/ul>\n<h2>Add the switch profile<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong>.<\/li>\n<li>Click <strong>New<\/strong>. On a Pi with no switches yet, click <strong>Add your first switch<\/strong> instead.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the Add a switch form with all fields empty<\/span><\/div>\n<ol start=\"3\">\n<li>In <strong>Profile ID<\/strong>, type a short ID such as <code>lab<\/code>. You can't change it later.<\/li>\n<li>In <strong>Display name<\/strong>, type the name for the switch list.<\/li>\n<li>In <strong>Switch IP<\/strong>, type <code>&lt;switch-ip&gt;<\/code>.<\/li>\n<li>In <strong>Username<\/strong>, type the switch's admin user (the form starts with <code>manager<\/code>).<\/li>\n<li>Leave <strong>SSH port<\/strong> at 22 and <strong>Interface prefix<\/strong> at <code>port1.0.<\/code> unless your switch differs.<\/li>\n<li>In <strong>Port count<\/strong>, type the number of physical ports on the switch.<\/li>\n<li>In <strong>Never touch these ports<\/strong>, type the uplink and management ports, comma-separated.<\/li>\n<li>Under <strong>Protect this host's port<\/strong>, tick <strong>Detect automatically<\/strong> so Aether finds the Pi's own port from the switch's MAC table.<\/li>\n<li>Click <strong>Add switch<\/strong>.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> If the uplink is not in <strong>Never touch these ports<\/strong>, a port test can cut the switch off from everything, including Aether. Aether refuses any change to a listed port or to the Pi's own port.<\/p>\n<h2>Store the password and test the login<\/h2>\n<ol>\n<li>With the new switch selected, type the switch password in the <strong>Password for …<\/strong> box.<\/li>\n<li>Click <strong>Save password<\/strong>. The badge changes from <strong>No password stored<\/strong> to <strong>Password stored<\/strong>.<\/li>\n<li>Click <strong>Test connection<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: a successful Test connection result under the password box<\/span><\/div>\n<p>The password is stored only on the Pi (file mode 600) and is never shown again.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li><strong>Test connection<\/strong> shows <strong>Connected to<\/strong> followed by the switch model and software version.<\/li>\n<li>The header pills show the switch IP and port count.<\/li>\n<li>The header says <strong>Port N carries this host's own link - locked<\/strong>. If it says <strong>This host's own port was not identified<\/strong>, add that port to <strong>Never touch these ports<\/strong> before you run unattended tests.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Failed:<\/strong> with a timeout or refused connection<\/td>\n<td>Check <code>&lt;switch-ip&gt;<\/code>, the SSH port, and that SSH is enabled.<\/td>\n<\/tr>\n<tr>\n<td><strong>Failed:<\/strong> with an authentication error<\/td>\n<td>Save the password again and retest.<\/td>\n<\/tr>\n<tr>\n<td>Connected, but the session stayed in user mode<\/td>\n<td>The switch needs an enable password. Ask your network admin.<\/td>\n<\/tr>\n<tr>\n<td>The page says the switch manager isn't initialized<\/td>\n<td>See <a href=\"#a104\">104 Switch Ports says the manager isn't initialized<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<li><a href=\"#a053\">053 Cut PoE to cold-boot a device<\/a><\/li>\n<li><a href=\"#a054\">054 Name ports and set PoE power caps<\/a><\/li>\n<li><a href=\"#a056\">056 Watch port traffic and take a switch snapshot<\/a><\/li>\n<li><a href=\"#a104\">104 Switch Ports says the manager isn't initialized<\/a><\/li>\n<\/ul>", "text": "add a switch profile and test the login how to add an ethernet switch to switch ports, protect its uplink, store the password and check that aether can log in. for anyone setting up network-loss tests.  summary switch ports lets aether take a device's network link or poe power down and bring it back, so offline tests run without pulling cables. each switch is a profile . before you start an allied telesis switch running alliedware plus that aether can reach over ssh. other makes, including netgear, are not supported. the switch's ip address, an admin username and its password. know which switch port is the uplink and which port the pi itself is plugged into. add the switch profile open tools › switch ports . click new . on a pi with no switches yet, click add your first switch instead. screenshot to add: the add a switch form with all fields empty in profile id , type a short id such as lab . you can't change it later. in display name , type the name for the switch list. in switch ip , type <switch-ip> . in username , type the switch's admin user (the form starts with manager ). leave ssh port at 22 and interface prefix at port1.0. unless your switch differs. in port count , type the number of physical ports on the switch. in never touch these ports , type the uplink and management ports, comma-separated. under protect this host's port , tick detect automatically so aether finds the pi's own port from the switch's mac table. click add switch . caution: if the uplink is not in never touch these ports , a port test can cut the switch off from everything, including aether. aether refuses any change to a listed port or to the pi's own port. store the password and test the login with the new switch selected, type the switch password in the password for … box. click save password . the badge changes from no password stored to password stored . click test connection . screenshot to add: a successful test connection result under the password box the password is stored only on the pi (file mode 600) and is never shown again. check that it worked test connection shows connected to followed by the switch model and software version. the header pills show the switch ip and port count. the header says port n carries this host's own link - locked . if it says this host's own port was not identified , add that port to never touch these ports before you run unattended tests. if something goes wrong symptom what to do failed: with a timeout or refused connection check <switch-ip> , the ssh port, and that ssh is enabled. failed: with an authentication error save the password again and retest. connected, but the session stayed in user mode the switch needs an enable password. ask your network admin. the page says the switch manager isn't initialized see 104 switch ports says the manager isn't initialized . related articles 052 turn a switch port off with an automatic hold 053 cut poe to cold-boot a device 054 name ports and set poe power caps 056 watch port traffic and take a switch snapshot 104 switch ports says the manager isn't initialized "}, {"id": "a052", "num": "052", "title": "Turn a switch port off with an automatic hold", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to take a switch port's link down for a set time so it comes back on its own. For testers running controller offline and recovery cases.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p>Disabling a switch port drops a device's network link without cutting its power, so you can test a controller going offline and coming back. Every disable has a hold time; when it ends, Aether turns the port back on by itself.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A switch profile that passes <strong>Test connection<\/strong>. See <a href=\"#a051\">051 Add a switch profile and test the login<\/a>.<\/li>\n<li>The uplink and the Pi's own port are in <strong>Never touch these ports<\/strong>.<\/li>\n<\/ul>\n<h2>Take a port down<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Disabling a port cuts the device's network link. Anything that reaches the device through that port, including your own session to it, drops until the port comes back.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> and pick the switch in the list.<\/li>\n<li>Click <strong>Scan switch<\/strong> so the port board shows the current state of each port.<\/li>\n<li>Click the port you want to take down. Ctrl-click to add more ports; Shift-click to select a range.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the selected-port panel with Bring back after, Reason and the Disable Port button<\/span><\/div>\n<ol start=\"4\">\n<li>In <strong>Bring back after<\/strong>, pick how long the port stays down: <strong>30 seconds<\/strong>, <strong>5 minutes<\/strong>, <strong>15 minutes<\/strong>, <strong>1 hour<\/strong>, <strong>4 hours<\/strong>, <strong>24 hours<\/strong> or <strong>7 days<\/strong>. The page starts on <strong>15 minutes<\/strong>.<\/li>\n<li>In <strong>Reason<\/strong>, type a short note, such as the test case name.<\/li>\n<li>Click <strong>Disable Port<\/strong>.<\/li>\n<\/ol>\n<p>Avoid <strong>Permanent<\/strong> for tests: nothing brings it back automatically. Use it only to retire a port.<\/p>\n<h2>Bring a port back early<\/h2>\n<ol>\n<li>Click the held port on the board.<\/li>\n<li>Click <strong>Enable Port<\/strong>.<\/li>\n<\/ol>\n<p>To bring back every held port at once, use <strong>Restore all<\/strong>. See <a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a>.<\/p>\n<h2>Disable a port from an automation rule<\/h2>\n<p>AEGIS Automation rules can also take a switch port down (<strong class=\"path\">AEGIS<i>›<\/i>Automation<\/strong>). A disable without a hold time gets the default hold of 1 hour, so the port still comes back on its own. See <a href=\"#a047\">047 Automation rules: triggers, conditions, actions<\/a>.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>A yellow panel above the board shows <strong>N down<\/strong> and one row per held port: <strong>Down since<\/strong> the time, your reason, and <strong>back in<\/strong> the time left.<\/li>\n<li>The selected-port panel says <strong>Held down since … - comes back in …<\/strong>.<\/li>\n<li>Click <strong>Inspect Port<\/strong> to read the port's real state from the switch.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Disable Port<\/strong> is greyed out<\/td>\n<td>The port is protected (the panel says <strong>View only.<\/strong>), or it is already held. Aether refuses any change to a protected port, from the page or from an automation rule.<\/td>\n<\/tr>\n<tr>\n<td>The port came back before the hold ended<\/td>\n<td>The switch may have rebooted. Port changes are never saved to its startup config, so a reboot brings every port up; the switch snapshot flags this. See <a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a051\">051 Add a switch profile and test the login<\/a><\/li>\n<li><a href=\"#a053\">053 Cut PoE to cold-boot a device<\/a><\/li>\n<li><a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a><\/li>\n<li><a href=\"#a056\">056 Watch port traffic and take a switch snapshot<\/a><\/li>\n<li><a href=\"#a047\">047 Automation rules: triggers, conditions, actions<\/a><\/li>\n<\/ul>", "text": "turn a switch port off with an automatic hold how to take a switch port's link down for a set time so it comes back on its own. for testers running controller offline and recovery cases.  summary disabling a switch port drops a device's network link without cutting its power, so you can test a controller going offline and coming back. every disable has a hold time; when it ends, aether turns the port back on by itself. before you start a switch profile that passes test connection . see 051 add a switch profile and test the login . the uplink and the pi's own port are in never touch these ports . take a port down caution: disabling a port cuts the device's network link. anything that reaches the device through that port, including your own session to it, drops until the port comes back. open tools › switch ports and pick the switch in the list. click scan switch so the port board shows the current state of each port. click the port you want to take down. ctrl-click to add more ports; shift-click to select a range. screenshot to add: the selected-port panel with bring back after, reason and the disable port button in bring back after , pick how long the port stays down: 30 seconds , 5 minutes , 15 minutes , 1 hour , 4 hours , 24 hours or 7 days . the page starts on 15 minutes . in reason , type a short note, such as the test case name. click disable port . avoid permanent for tests: nothing brings it back automatically. use it only to retire a port. bring a port back early click the held port on the board. click enable port . to bring back every held port at once, use restore all . see 055 revert all held ports and reconcile drift . disable a port from an automation rule aegis automation rules can also take a switch port down ( aegis › automation ). a disable without a hold time gets the default hold of 1 hour, so the port still comes back on its own. see 047 automation rules: triggers, conditions, actions . check that it worked a yellow panel above the board shows n down and one row per held port: down since the time, your reason, and back in the time left. the selected-port panel says held down since … - comes back in … . click inspect port to read the port's real state from the switch. if something goes wrong symptom what to do disable port is greyed out the port is protected (the panel says view only. ), or it is already held. aether refuses any change to a protected port, from the page or from an automation rule. the port came back before the hold ended the switch may have rebooted. port changes are never saved to its startup config, so a reboot brings every port up; the switch snapshot flags this. see 055 revert all held ports and reconcile drift . related articles 051 add a switch profile and test the login 053 cut poe to cold-boot a device 055 revert all held ports and reconcile drift 056 watch port traffic and take a switch snapshot 047 automation rules: triggers, conditions, actions "}, {"id": "a053", "num": "053", "title": "Cut PoE to cold-boot a device", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to cut PoE power on a switch port to cold-boot the device behind it, with an automatic restore time. For testers checking power-loss recovery.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p>Turning PoE off on a port removes the device's power, so the device cold-boots and loses anything it held in memory. This is different from disabling the port, which only drops the network link. Use it to test how a PoE-powered controller, reader or camera recovers from a power loss. Like a port disable, a PoE cut has a hold time and Aether turns power back on when it ends.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A switch profile that passes <strong>Test connection<\/strong>. See <a href=\"#a051\">051 Add a switch profile and test the login<\/a>.<\/li>\n<li>The switch supplies PoE. The PoE buttons and the <strong>Power Budget<\/strong> panel only appear after a scan of a PoE-capable switch.<\/li>\n<li>The uplink and the Pi's own port are in <strong>Never touch these ports<\/strong>.<\/li>\n<\/ul>\n<h2>Cut power to a port<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Disabling PoE removes power from the device. It cold-boots and loses volatile state, such as events it had not yet sent. Don't use it on a device that is in the middle of a firmware update.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> and pick the switch.<\/li>\n<li>Click <strong>Scan switch<\/strong>.<\/li>\n<li>Click the port that powers the device. Ctrl-click or Shift-click to select more than one.<\/li>\n<li>In <strong>Bring back after<\/strong>, pick how long power stays off.<\/li>\n<li>In <strong>Reason<\/strong>, type a short note.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the selected-port panel with Disable PoE and Enable PoE buttons<\/span><\/div>\n<ol start=\"6\">\n<li>Click <strong>Disable PoE<\/strong>.<\/li>\n<\/ol>\n<h2>Turn power back on early<\/h2>\n<ol>\n<li>Click the port.<\/li>\n<li>Click <strong>Enable PoE<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The selected-port panel says <strong>Power cut since …<\/strong> and when power is restored.<\/li>\n<li>The held-ports panel counts the port as <strong>unpowered<\/strong> and its row says <strong>power off<\/strong>.<\/li>\n<li>After power returns, scan again. The <strong>Port N Monitor<\/strong> panel shows <strong>PoE draw<\/strong> rising as the device boots.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No PoE buttons<\/td>\n<td>Click <strong>Scan switch<\/strong>. If they still don't appear, the switch reported no PoE support.<\/td>\n<\/tr>\n<tr>\n<td>Another port lost power during the test<\/td>\n<td>Check the <strong>Power Budget<\/strong> panel. When devices ask for more power than the switch can allocate, cutting one port frees power that another may take, so results change from run to run. Set power caps first. See <a href=\"#a054\">054 Name ports and set PoE power caps<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Disable PoE<\/strong> is greyed out<\/td>\n<td>The port is protected, PoE is already off, or a PoE hold is already running on it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<li><a href=\"#a054\">054 Name ports and set PoE power caps<\/a><\/li>\n<li><a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a><\/li>\n<li><a href=\"#a056\">056 Watch port traffic and take a switch snapshot<\/a><\/li>\n<\/ul>", "text": "cut poe to cold-boot a device how to cut poe power on a switch port to cold-boot the device behind it, with an automatic restore time. for testers checking power-loss recovery.  summary turning poe off on a port removes the device's power, so the device cold-boots and loses anything it held in memory. this is different from disabling the port, which only drops the network link. use it to test how a poe-powered controller, reader or camera recovers from a power loss. like a port disable, a poe cut has a hold time and aether turns power back on when it ends. before you start a switch profile that passes test connection . see 051 add a switch profile and test the login . the switch supplies poe. the poe buttons and the power budget panel only appear after a scan of a poe-capable switch. the uplink and the pi's own port are in never touch these ports . cut power to a port caution: disabling poe removes power from the device. it cold-boots and loses volatile state, such as events it had not yet sent. don't use it on a device that is in the middle of a firmware update. open tools › switch ports and pick the switch. click scan switch . click the port that powers the device. ctrl-click or shift-click to select more than one. in bring back after , pick how long power stays off. in reason , type a short note. screenshot to add: the selected-port panel with disable poe and enable poe buttons click disable poe . turn power back on early click the port. click enable poe . check that it worked the selected-port panel says power cut since … and when power is restored. the held-ports panel counts the port as unpowered and its row says power off . after power returns, scan again. the port n monitor panel shows poe draw rising as the device boots. if something goes wrong symptom what to do no poe buttons click scan switch . if they still don't appear, the switch reported no poe support. another port lost power during the test check the power budget panel. when devices ask for more power than the switch can allocate, cutting one port frees power that another may take, so results change from run to run. set power caps first. see 054 name ports and set poe power caps . disable poe is greyed out the port is protected, poe is already off, or a poe hold is already running on it. related articles 052 turn a switch port off with an automatic hold 054 name ports and set poe power caps 055 revert all held ports and reconcile drift 056 watch port traffic and take a switch snapshot "}, {"id": "a054", "num": "054", "title": "Name ports and set PoE power caps", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P3", "status": "Draft", "brief": "How to give switch ports readable names and cap the PoE power each port reserves, then save the caps on the switch. For anyone maintaining a test switch.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p>Port names make the port board and traffic charts easier to read: \"Lobby NHP\" instead of \"Port 3\". PoE caps limit how much power the switch reserves for a port. In static power mode the switch reserves each device's full class maximum, so a 6 W camera on a class 4 port ties up 30 W. Capping ports frees that budget so other ports aren't refused power.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A switch profile that passes <strong>Test connection<\/strong>. See <a href=\"#a051\">051 Add a switch profile and test the login<\/a>.<\/li>\n<li>Click <strong>Scan switch<\/strong> once so Aether knows the ports and the PoE budget.<\/li>\n<\/ul>\n<h2>Name a port<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> and pick the switch.<\/li>\n<li>Click the port on the board.<\/li>\n<li>In <strong>Name this port<\/strong>, type a name of up to 40 characters.<\/li>\n<li>Click <strong>Save name<\/strong>, or press Enter.<\/li>\n<\/ol>\n<p>The name is saved in Aether's profile for that switch, not on the switch itself. To remove a name, clear the box and save.<\/p>\n<h2>Set a PoE power cap<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> A cap changes the switch's configuration. A cap lower than what the device draws makes the switch refuse it power. The page warns you when the value you typed is below the port's current draw.<\/p>\n<ol>\n<li>Click the port on the board.<\/li>\n<li>In <strong>Max W<\/strong>, type the most power, in watts, the switch should reserve for this port. Caps from 4 W to 30 W are accepted.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the Max W box and Set Wattage Cap button with the Power Budget panel above<\/span><\/div>\n<ol start=\"3\">\n<li>Click <strong>Set Wattage Cap<\/strong>.<\/li>\n<li>To remove a cap and go back to the class default, click <strong>Clear<\/strong>.<\/li>\n<\/ol>\n<h2>Save caps to the switch's startup config<\/h2>\n<p>Caps are lost when the switch reboots unless you save them.<\/p>\n<p class=\"caution\"><strong>Caution:<\/strong> <strong>Save config<\/strong> writes the switch's running config to its startup config. Ports held down by a test are not saved, so they still come back up after a reboot. Only the caps and other running settings are kept.<\/p>\n<ol>\n<li>In the <strong>Power Budget<\/strong> panel, click <strong>Save config<\/strong>.<\/li>\n<li>Confirm the prompt.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The port board and the selected-port title show the new name.<\/li>\n<li><strong>Power Budget<\/strong> shows <strong>Consumption<\/strong>, <strong>Allocated<\/strong>, <strong>Requested<\/strong> and <strong>Threshold<\/strong>. After capping, <strong>Requested<\/strong> should drop.<\/li>\n<li>The <strong>Port N Monitor<\/strong> panel shows <strong>PoE draw<\/strong> as \"X W of Y W max\".<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The cap is refused with a range error<\/td>\n<td>Use a value from 4 to 30 W.<\/td>\n<\/tr>\n<tr>\n<td>The device lost power after you set a cap<\/td>\n<td>The cap is below its draw. Raise it or click <strong>Clear<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Caps disappeared after a switch reboot<\/td>\n<td>Set them again and click <strong>Save config<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a051\">051 Add a switch profile and test the login<\/a><\/li>\n<li><a href=\"#a053\">053 Cut PoE to cold-boot a device<\/a><\/li>\n<li><a href=\"#a056\">056 Watch port traffic and take a switch snapshot<\/a><\/li>\n<\/ul>", "text": "name ports and set poe power caps how to give switch ports readable names and cap the poe power each port reserves, then save the caps on the switch. for anyone maintaining a test switch.  summary port names make the port board and traffic charts easier to read: \"lobby nhp\" instead of \"port 3\". poe caps limit how much power the switch reserves for a port. in static power mode the switch reserves each device's full class maximum, so a 6 w camera on a class 4 port ties up 30 w. capping ports frees that budget so other ports aren't refused power. before you start a switch profile that passes test connection . see 051 add a switch profile and test the login . click scan switch once so aether knows the ports and the poe budget. name a port open tools › switch ports and pick the switch. click the port on the board. in name this port , type a name of up to 40 characters. click save name , or press enter. the name is saved in aether's profile for that switch, not on the switch itself. to remove a name, clear the box and save. set a poe power cap caution: a cap changes the switch's configuration. a cap lower than what the device draws makes the switch refuse it power. the page warns you when the value you typed is below the port's current draw. click the port on the board. in max w , type the most power, in watts, the switch should reserve for this port. caps from 4 w to 30 w are accepted. screenshot to add: the max w box and set wattage cap button with the power budget panel above click set wattage cap . to remove a cap and go back to the class default, click clear . save caps to the switch's startup config caps are lost when the switch reboots unless you save them. caution: save config writes the switch's running config to its startup config. ports held down by a test are not saved, so they still come back up after a reboot. only the caps and other running settings are kept. in the power budget panel, click save config . confirm the prompt. check that it worked the port board and the selected-port title show the new name. power budget shows consumption , allocated , requested and threshold . after capping, requested should drop. the port n monitor panel shows poe draw as \"x w of y w max\". if something goes wrong symptom what to do the cap is refused with a range error use a value from 4 to 30 w. the device lost power after you set a cap the cap is below its draw. raise it or click clear . caps disappeared after a switch reboot set them again and click save config . related articles 051 add a switch profile and test the login 053 cut poe to cold-boot a device 056 watch port traffic and take a switch snapshot "}, {"id": "a055", "num": "055", "title": "Revert all held ports and reconcile drift", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to bring every held switch port back at once, and how Aether checks the switch against its own records after a restart or a switch reboot. For testers cleaning up after a run.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p>Every port or PoE hold that Aether starts is recorded on the Pi with the time it should end. <strong>Restore all<\/strong> brings every held port back immediately. Separately, Aether <em>reconciles<\/em> when its backend starts: it reads the switch, restores holds that expired while it was down, and restarts the timers for holds still running. Use this article after a test run ends early, after the Pi restarts, or when the switch has rebooted.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A switch profile that passes <strong>Test connection<\/strong>. See <a href=\"#a051\">051 Add a switch profile and test the login<\/a>.<\/li>\n<\/ul>\n<h2>Restore every held port<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> <strong>Restore all<\/strong> turns links and PoE back on for every port Aether is holding, including ports held as <strong>Permanent<\/strong>. Devices on those ports reconnect or power up straight away.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> and pick the switch.<\/li>\n<li>In the yellow held-ports panel, click <strong>Restore all<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the held-ports panel listing two ports with the Restore all button<\/span><\/div>\n<ol start=\"3\">\n<li>Confirm <strong>Bring every held port back up now?<\/strong><\/li>\n<\/ol>\n<h2>What happens after a restart<\/h2>\n<p>When the Aether backend starts, it goes through every recorded hold:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Hold state<\/th>\n<th>What Aether does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hold time already passed<\/td>\n<td>Turns the port or PoE back on now<\/td>\n<\/tr>\n<tr>\n<td>Hold still running<\/td>\n<td>Restarts the timer for the time left<\/td>\n<\/tr>\n<tr>\n<td><strong>Permanent<\/strong> hold<\/td>\n<td>Keeps the port listed as deliberately down<\/td>\n<\/tr>\n<tr>\n<td>Port recorded as down, but the switch reads it as up<\/td>\n<td>Reports drift: the switch probably rebooted<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The system log shows a line like <strong>Switch reconciled N port(s) against hardware<\/strong>. <span class=\"sme\">confirm whether the current build has a button to run this check from the page; the 2026-09-20 code only runs it at backend start.<\/span><\/p>\n<p>To run the same check by hand, run this on the Pi:<\/p>\n<pre><code class=\"language-bash\">curl -s -X POST http://localhost:3001/api/switch/reconcile\n<\/code><\/pre>\n<h2>When the switch reboots<\/h2>\n<p>Port and PoE test changes are never saved to the switch's startup config, so a switch reboot brings every port back up. After a scan, the snapshot flags it and the page shows <strong>This switch rebooted<\/strong>. Any hold that spanned the reboot no longer applies, and neither does a test result that depended on it. Run that part of the test again.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The held-ports panel disappears.<\/li>\n<li>The system log shows how many ports were restored.<\/li>\n<li>Open <strong>Event Log<\/strong> at the bottom of the page to see each change, with <strong>link<\/strong> or <strong>poe<\/strong> and the reason.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A port is still down after <strong>Restore all<\/strong><\/td>\n<td>Click the port, then <strong>Inspect Port<\/strong>. If the switch says it is down, click <strong>Enable Port<\/strong> or <strong>Enable PoE<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>A port is down but not in the held list<\/td>\n<td>Someone changed it on the switch directly, or the record was lost. Turn it back on from the port panel.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<li><a href=\"#a053\">053 Cut PoE to cold-boot a device<\/a><\/li>\n<li><a href=\"#a056\">056 Watch port traffic and take a switch snapshot<\/a><\/li>\n<li><a href=\"#a104\">104 Switch Ports says the manager isn't initialized<\/a><\/li>\n<\/ul>", "text": "revert all held ports and reconcile drift how to bring every held switch port back at once, and how aether checks the switch against its own records after a restart or a switch reboot. for testers cleaning up after a run.  summary every port or poe hold that aether starts is recorded on the pi with the time it should end. restore all brings every held port back immediately. separately, aether reconciles when its backend starts: it reads the switch, restores holds that expired while it was down, and restarts the timers for holds still running. use this article after a test run ends early, after the pi restarts, or when the switch has rebooted. before you start a switch profile that passes test connection . see 051 add a switch profile and test the login . restore every held port caution: restore all turns links and poe back on for every port aether is holding, including ports held as permanent . devices on those ports reconnect or power up straight away. open tools › switch ports and pick the switch. in the yellow held-ports panel, click restore all . screenshot to add: the held-ports panel listing two ports with the restore all button confirm bring every held port back up now? what happens after a restart when the aether backend starts, it goes through every recorded hold: hold state what aether does hold time already passed turns the port or poe back on now hold still running restarts the timer for the time left permanent hold keeps the port listed as deliberately down port recorded as down, but the switch reads it as up reports drift: the switch probably rebooted the system log shows a line like switch reconciled n port(s) against hardware . confirm whether the current build has a button to run this check from the page; the 2026-09-20 code only runs it at backend start. to run the same check by hand, run this on the pi: curl -s -x post http://localhost:3001/api/switch/reconcile when the switch reboots port and poe test changes are never saved to the switch's startup config, so a switch reboot brings every port back up. after a scan, the snapshot flags it and the page shows this switch rebooted . any hold that spanned the reboot no longer applies, and neither does a test result that depended on it. run that part of the test again. check that it worked the held-ports panel disappears. the system log shows how many ports were restored. open event log at the bottom of the page to see each change, with link or poe and the reason. if something goes wrong symptom what to do a port is still down after restore all click the port, then inspect port . if the switch says it is down, click enable port or enable poe . a port is down but not in the held list someone changed it on the switch directly, or the record was lost. turn it back on from the port panel. related articles 052 turn a switch port off with an automatic hold 053 cut poe to cold-boot a device 056 watch port traffic and take a switch snapshot 104 switch ports says the manager isn't initialized "}, {"id": "a056", "num": "056", "title": "Watch port traffic and take a switch snapshot", "area": "Network switch, SUNAPI and VMS", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to read each switch port's state, take a full switch snapshot and chart port traffic during a test. For testers who need evidence of when a link dropped.", "sources": ["aether-v2.1.45 main 2026-09-20: frontend/src/components/SwitchSection.tsx, backend/routes-switch.js, backend/switch/SwitchManager.js", "Aether product QA testing (chat)"], "html": "<h2>Summary<\/h2>\n<p><strong>Switch Ports<\/strong> can show what is on each port, how much traffic it carries and when Aether changed it. A <em>snapshot<\/em> (<strong>Scan switch<\/strong>) reads the whole switch: port status, device names from LLDP, MAC and IP addresses, counters, PoE and uptime. The traffic monitor samples counters over time and draws a chart with markers where Aether took ports down. Use it while a scenario runs, not around the clock.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A switch profile that passes <strong>Test connection<\/strong>. See <a href=\"#a051\">051 Add a switch profile and test the login<\/a>.<\/li>\n<\/ul>\n<h2>Take a snapshot<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Tools<i>›<\/i>Switch Ports<\/strong> and pick the switch.<\/li>\n<li>Click <strong>Scan switch<\/strong>. A scan takes several SSH round trips, so it can take a while on a large switch.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the port board after a scan, with the Uptime, named and ARP pill in the header<\/span><\/div>\n<ol start=\"3\">\n<li>Read the header pill: <strong>Uptime<\/strong>, how many ports were named from LLDP, and how many ARP entries were found.<\/li>\n<li>Turn on <strong>Live<\/strong> to refresh the board every 15 s while the page is open. <strong>Paused<\/strong> means the board changes only when you scan or click <strong>Refresh<\/strong>.<\/li>\n<\/ol>\n<h2>Read one port<\/h2>\n<ol>\n<li>Click a port on the board.<\/li>\n<li>Scroll to <strong>Port N Monitor<\/strong>. It shows <strong>Device<\/strong>, <strong>Link<\/strong>, <strong>Identified via<\/strong>, <strong>Speed<\/strong>, <strong>IP address<\/strong>, <strong>MAC<\/strong>, <strong>Duplex<\/strong>, <strong>Remote port<\/strong>, <strong>Throughput<\/strong>, <strong>Description<\/strong>, <strong>Traffic totals<\/strong>, <strong>PoE<\/strong>, <strong>PoE draw<\/strong>, <strong>Errors<\/strong> and <strong>Drops<\/strong>.<\/li>\n<li>Click <strong>Inspect Port<\/strong> to read the port's admin and link state straight from the switch.<\/li>\n<\/ol>\n<p><strong>Throughput<\/strong> comes from the counter change between the last two scans. It is not a live rate.<\/p>\n<h2>Chart traffic during a test<\/h2>\n<ol>\n<li>Select the ports to watch. Ctrl-click to add ports. The chart shows up to 8 ports.<\/li>\n<li>In the traffic panel, click <strong>Start monitoring<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: the traffic chart with receive and transmit lines and a disable marker<\/span><\/div>\n<ol start=\"3\">\n<li>Run your test. Port changes made by Aether appear as markers on the chart.<\/li>\n<li>Click <strong>Stop monitoring<\/strong> when the test ends.<\/li>\n<\/ol>\n<p>The monitor reads the switch every 30 s by default, and never more often than every 10 s. A disconnect shows as traffic falling to zero. A switch reboot breaks the line instead of drawing a spike.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The chart title shows <strong>Port N Traffic<\/strong> or <strong>Traffic - N ports<\/strong>, and a note under it gives the sample interval.<\/li>\n<li><strong>Event Log<\/strong> lists each change with its time, <strong>link<\/strong> or <strong>poe<\/strong>, and the reason. It is kept in memory since the backend started.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Device<\/strong> says <strong>Unknown<\/strong><\/td>\n<td>The device doesn't send LLDP. <strong>Identified via<\/strong> may show <strong>Learned MAC (not a hostname)<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>IP address<\/strong> says <strong>Not in ARP table<\/strong><\/td>\n<td>The switch hasn't seen traffic from it recently. Scan again after the device talks.<\/td>\n<\/tr>\n<tr>\n<td>The chart is empty<\/td>\n<td>Monitoring isn't running. Click <strong>Start monitoring<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a051\">051 Add a switch profile and test the login<\/a><\/li>\n<li><a href=\"#a052\">052 Turn a switch port off with an automatic hold<\/a><\/li>\n<li><a href=\"#a053\">053 Cut PoE to cold-boot a device<\/a><\/li>\n<li><a href=\"#a055\">055 Revert all held ports and reconcile drift<\/a><\/li>\n<\/ul>", "text": "watch port traffic and take a switch snapshot how to read each switch port's state, take a full switch snapshot and chart port traffic during a test. for testers who need evidence of when a link dropped.  summary switch ports can show what is on each port, how much traffic it carries and when aether changed it. a snapshot ( scan switch ) reads the whole switch: port status, device names from lldp, mac and ip addresses, counters, poe and uptime. the traffic monitor samples counters over time and draws a chart with markers where aether took ports down. use it while a scenario runs, not around the clock. before you start a switch profile that passes test connection . see 051 add a switch profile and test the login . take a snapshot open tools › switch ports and pick the switch. click scan switch . a scan takes several ssh round trips, so it can take a while on a large switch. screenshot to add: the port board after a scan, with the uptime, named and arp pill in the header read the header pill: uptime , how many ports were named from lldp, and how many arp entries were found. turn on live to refresh the board every 15 s while the page is open. paused means the board changes only when you scan or click refresh . r
