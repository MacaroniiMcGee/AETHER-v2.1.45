>Aether channel<\/th>\n<th>Direction<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reader<\/td>\n<td>Wiegand R<em>n<\/em> D0/D1 + GND → controller reader <em>n<\/em><\/td>\n<td>Aether → controller<\/td>\n<\/tr>\n<tr>\n<td>DPS<\/td>\n<td><strong>REL 2n−1<\/strong><\/td>\n<td>Aether drives the controller's DPS input<\/td>\n<\/tr>\n<tr>\n<td>REX<\/td>\n<td><strong>REL 2n<\/strong><\/td>\n<td>Aether drives the controller's REX input<\/td>\n<\/tr>\n<tr>\n<td>Lock<\/td>\n<td>Controller's door <em>n<\/em> lock relay → <strong>OPTO n<\/strong><\/td>\n<td>Aether watches; it never drives the lock<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>So door 1 uses REL 1, REL 2 and OPTO 1; door 4 uses REL 7, REL 8 and OPTO 4. A door's lock can instead watch an EOL zone, and its DPS or REX can use a DAC output. With every relay used by doors 1–4, run doors 5–8 on emulated Azure boards.<\/p>\n<h2>HAT channels at a glance<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Channels<\/th>\n<th>Type<\/th>\n<th>Default use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>REL 1–8<\/td>\n<td>Dry-contact relay outputs<\/td>\n<td>Door 1–4 DPS and REX (two relays per door)<\/td>\n<\/tr>\n<tr>\n<td>OPTO 1–4<\/td>\n<td>Opto inputs<\/td>\n<td>Watch door 1–4 lock relays<\/td>\n<\/tr>\n<tr>\n<td>OPTO 5–8<\/td>\n<td>Opto inputs<\/td>\n<td>Free (aux outputs, extra watched points)<\/td>\n<\/tr>\n<tr>\n<td>Analog 1–8 (0–10 V)<\/td>\n<td>Analog inputs<\/td>\n<td>EOL zones 1–8; default elevator floor grants<\/td>\n<\/tr>\n<tr>\n<td>O.D. 1–4<\/td>\n<td>Open-drain outputs<\/td>\n<td>Default elevator floor tracking (floors 1–4)<\/td>\n<\/tr>\n<tr>\n<td>DAC 1–4 (0–10 V)<\/td>\n<td>Analog outputs<\/td>\n<td>Elevator tracking for floors 5–8 when no emulated board runs; spare door outputs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"sme\">confirm the elevator Auto-assign defaults (O.D. 1–4, then DAC 1–4 for tracking; EOL zones 1–8 for grants) on the current Pi.<\/span><\/p>\n<h2>System outputs<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Output<\/th>\n<th>Default<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Power Fault Relay<\/td>\n<td>Unconfigured<\/td>\n<\/tr>\n<tr>\n<td>Battery Fault Relay<\/td>\n<td>Unconfigured<\/td>\n<\/tr>\n<tr>\n<td>System Tamper Relay<\/td>\n<td>Unconfigured<\/td>\n<\/tr>\n<tr>\n<td>Fire Alarm Relay<\/td>\n<td>Unconfigured<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Set them on <strong class=\"path\">Access Control<i>›<\/i>Doors<i>›<\/i>System Outputs<i>›<\/i>Configure GPIO<\/strong>. In the 4-door layout every relay is already used, so a system output shares a relay with a door unless you free one.<\/p>\n<h2>Supervision (EOL) thresholds<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Zone state<\/th>\n<th>Default range<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TAMPER<\/td>\n<td>0–0.103 V<\/td>\n<\/tr>\n<tr>\n<td>ALARM<\/td>\n<td>0.104–0.292 V<\/td>\n<\/tr>\n<tr>\n<td>NORMAL<\/td>\n<td>0.293–1.354 V<\/td>\n<\/tr>\n<tr>\n<td>TROUBLE<\/td>\n<td>1.355–3.5 V<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>These are the factory values; <strong class=\"path\">Setup<i>›<\/i>EOL Calibration<\/strong> replaces them. See <a href=\"#a049\">049<\/a>.<\/p>\n<h2>Wiegand pins<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Reader<\/th>\n<th>D0 / D1 (Pi GPIO)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R1<\/td>\n<td>17 / 27<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>22 / 23<\/td>\n<\/tr>\n<tr>\n<td>R3<\/td>\n<td>24 / 25<\/td>\n<\/tr>\n<tr>\n<td>R4<\/td>\n<td>5 / 6<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Pi GPIO is 3.3 V. A 5 V Wiegand line needs a level shifter or an open-collector buffer.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Setup &gt; HAT Pinout, Sequent board page, with REL, OPTO and analog terminals labelled by door<\/span><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a035\">035 Map I/O and spot relay conflicts (I/O Mapping)<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<\/ul>", "text": "default i/o map: relays, inputs, supervision channels reference table of aether's default channel use: door dps/rex relays, watched lock inputs, analog eol zones, elevator outputs, system outputs and wiegand pins. for anyone wiring or checking a bench.  summary this page lists what each ioplus channel does in aether's default layout. aether stands in for the field devices around a controller: its relays drive the controller's inputs , and its opto and analog inputs watch the controller's outputs . the layout below is what apply 4-door layout on the doors page and the board blueprints auto-wire produce. channels are numbered 1–8 on screen and on the hat. the api counts from 0, so rel 1 is channel 0 in api calls. door wiring (doors 1–4) door n signal aether channel direction reader wiegand r n d0/d1 + gnd → controller reader n aether → controller dps rel 2n−1 aether drives the controller's dps input rex rel 2n aether drives the controller's rex input lock controller's door n lock relay → opto n aether watches; it never drives the lock so door 1 uses rel 1, rel 2 and opto 1; door 4 uses rel 7, rel 8 and opto 4. a door's lock can instead watch an eol zone, and its dps or rex can use a dac output. with every relay used by doors 1–4, run doors 5–8 on emulated azure boards. hat channels at a glance channels type default use rel 1–8 dry-contact relay outputs door 1–4 dps and rex (two relays per door) opto 1–4 opto inputs watch door 1–4 lock relays opto 5–8 opto inputs free (aux outputs, extra watched points) analog 1–8 (0–10 v) analog inputs eol zones 1–8; default elevator floor grants o.d. 1–4 open-drain outputs default elevator floor tracking (floors 1–4) dac 1–4 (0–10 v) analog outputs elevator tracking for floors 5–8 when no emulated board runs; spare door outputs confirm the elevator auto-assign defaults (o.d. 1–4, then dac 1–4 for tracking; eol zones 1–8 for grants) on the current pi. system outputs output default power fault relay unconfigured battery fault relay unconfigured system tamper relay unconfigured fire alarm relay unconfigured set them on access control › doors › system outputs › configure gpio . in the 4-door layout every relay is already used, so a system output shares a relay with a door unless you free one. supervision (eol) thresholds zone state default range tamper 0–0.103 v alarm 0.104–0.292 v normal 0.293–1.354 v trouble 1.355–3.5 v these are the factory values; setup › eol calibration replaces them. see 049 . wiegand pins reader d0 / d1 (pi gpio) r1 17 / 27 r2 22 / 23 r3 24 / 25 r4 5 / 6 pi gpio is 3.3 v. a 5 v wiegand line needs a level shifter or an open-collector buffer. screenshot to add: setup > hat pinout, sequent board page, with rel, opto and analog terminals labelled by door related articles 035 map i/o and spot relay conflicts (i/o mapping) 036 hat pinout: pi header and sequent board pages 037 wire aether to an nhp or nop controller 022 wiegand pins and voltage levels (r1–r4) "}, {"id": "a035", "num": "035", "title": "Map I/O and spot relay conflicts (I/O Mapping)", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to use Setup > I/O Mapping to name channels, set input types and find relays claimed by two things. For testers combining doors, elevator and system outputs.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>I/O Mapping<\/strong> names Aether's HAT channels and sets how each monitored input is read. Its <strong>Relay usage<\/strong> strip shows, for each of the 8 relays, everything that switches it, and flags any relay used by two things. Check it before a test so a door, the elevator and a system output don't fight over one relay.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Doors, the Elevator and the system outputs are set up the way you want to test.<\/li>\n<li>Settings on this page are saved on the Pi, so every browser sees the same mapping.<\/li>\n<\/ul>\n<h2>Check for relay conflicts<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>I/O Mapping<\/strong>.<\/li>\n<li>Look at the <strong>Relay usage<\/strong> strip at the top. Each of the 8 relays lists its users: door DPS and REX, elevator floor tracking, system outputs and controller aux outputs.<\/li>\n<li>Read the header on the right of the strip. It says <strong>No relay is used twice<\/strong>, or how many relays are used twice.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Relay usage strip with one relay highlighted as used twice<\/span><\/div>\n<ol start=\"4\">\n<li>For each highlighted relay, decide which user should keep it.<\/li>\n<li>Move the other user to a free channel: door channels in Door Settings, floor outputs in Elevator Settings, system outputs under <strong class=\"path\">Doors<i>›<\/i>System Outputs<i>›<\/i>Configure GPIO<\/strong>.<\/li>\n<li>Come back and check the strip is clear.<\/li>\n<\/ol>\n<p>Disabled doors and doors on Azure boards are not counted. The Doors page also refuses to save two enabled doors on the same output. A floor sharing a door's output only shows a note on the Elevator page, so this strip is where you see it.<\/p>\n<h2>Name channels and set input types<\/h2>\n<ol>\n<li>In <strong>Relay outputs<\/strong>, give each relay a name and type, for example \"Door 1 DPS\".<\/li>\n<li>In <strong>Monitored inputs<\/strong>, give each input a name and pick <strong>Opto<\/strong> or <strong>Analog<\/strong>. An input set to Analog reads the EOL zone on that channel, which lets an EOL alarm show on <strong>Controls<\/strong>.<\/li>\n<li>Each row has a live state dot.<\/li>\n<li>In the controller aux outputs table, set the 4 aux outputs.<\/li>\n<li>Click <strong>Save<\/strong> above the page.<\/li>\n<\/ol>\n<p><span class=\"sme\">confirm the table titles and the Save button label on the Pi.<\/span><\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The Relay usage strip shows no conflicts.<\/li>\n<li>On <strong class=\"path\">Access Control<i>›<\/i>Controls<\/strong>, the rows use your names and the inputs change when the controller drives them.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A door input changes when the elevator moves<\/td>\n<td>A floor's tracking output is a door relay. Move it in Elevator Settings.<\/td>\n<\/tr>\n<tr>\n<td>A monitored input never changes<\/td>\n<td>Check its Opto/Analog setting, and keep a browser page open: the Pi reads inputs only while one is connected.<\/td>\n<\/tr>\n<tr>\n<td>Changes are gone in another browser<\/td>\n<td>You didn't click <strong>Save<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<li><a href=\"#a028\">028 Controls page: outputs, inputs and system outputs<\/a><\/li>\n<li><a href=\"#a033\">033 Emulate an elevator: floors, call button, relays<\/a><\/li>\n<\/ul>", "text": "map i/o and spot relay conflicts (i/o mapping) how to use setup > i/o mapping to name channels, set input types and find relays claimed by two things. for testers combining doors, elevator and system outputs.  summary setup › i/o mapping names aether's hat channels and sets how each monitored input is read. its relay usage strip shows, for each of the 8 relays, everything that switches it, and flags any relay used by two things. check it before a test so a door, the elevator and a system output don't fight over one relay. before you start doors, the elevator and the system outputs are set up the way you want to test. settings on this page are saved on the pi, so every browser sees the same mapping. check for relay conflicts open setup › i/o mapping . look at the relay usage strip at the top. each of the 8 relays lists its users: door dps and rex, elevator floor tracking, system outputs and controller aux outputs. read the header on the right of the strip. it says no relay is used twice , or how many relays are used twice. screenshot to add: relay usage strip with one relay highlighted as used twice for each highlighted relay, decide which user should keep it. move the other user to a free channel: door channels in door settings, floor outputs in elevator settings, system outputs under doors › system outputs › configure gpio . come back and check the strip is clear. disabled doors and doors on azure boards are not counted. the doors page also refuses to save two enabled doors on the same output. a floor sharing a door's output only shows a note on the elevator page, so this strip is where you see it. name channels and set input types in relay outputs , give each relay a name and type, for example \"door 1 dps\". in monitored inputs , give each input a name and pick opto or analog . an input set to analog reads the eol zone on that channel, which lets an eol alarm show on controls . each row has a live state dot. in the controller aux outputs table, set the 4 aux outputs. click save above the page. confirm the table titles and the save button label on the pi. check that it worked the relay usage strip shows no conflicts. on access control › controls , the rows use your names and the inputs change when the controller drives them. if something goes wrong symptom what to do a door input changes when the elevator moves a floor's tracking output is a door relay. move it in elevator settings. a monitored input never changes check its opto/analog setting, and keep a browser page open: the pi reads inputs only while one is connected. changes are gone in another browser you didn't click save . related articles 034 default i/o map: relays, inputs, supervision channels 036 hat pinout: pi header and sequent board pages 028 controls page: outputs, inputs and system outputs 033 emulate an elevator: floors, call button, relays "}, {"id": "a036", "num": "036", "title": "HAT Pinout: Pi header and Sequent board pages", "area": "Doors, I/O and IOplus", "type": "Reference", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "What the two HAT Pinout pages show: the Pi's 40-pin header and the Sequent IOplus terminals with their live use. For anyone wiring or checking Aether.", "sources": ["Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>HAT Pinout<\/strong> shows two pages: the Raspberry Pi's 40-pin header and the Sequent IOplus board. Both label each pin or terminal with what Aether uses it for and show live states. Use it while wiring, or to check what a terminal is connected to.<\/p>\n<h2>Raspberry Pi header page<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Pin group<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Power and ground<\/td>\n<td>3.3 V, 5 V and GND pins<\/td>\n<\/tr>\n<tr>\n<td>Wiegand readers<\/td>\n<td>D0/D1 for each reader, read live from the reader config (R1 17/27, R2 22/23, R3 24/25, R4 5/6)<\/td>\n<\/tr>\n<tr>\n<td>I2C (pins 3 and 5)<\/td>\n<td>The bus to the Sequent board. Click them, or the link beside them, to open the Sequent page<\/td>\n<\/tr>\n<tr>\n<td>UART (pins 8 and 10, GPIO 14/15)<\/td>\n<td>Drives the Sequent card's RS-485 port as <code>/dev/ttyAMA0<\/code><\/td>\n<\/tr>\n<tr>\n<td>Others<\/td>\n<td>Marked as not used<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Hover a group to highlight its pins. If your reader config has fewer than four Wiegand readers, only those are drawn.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: HAT Pinout, Raspberry Pi header page with the Wiegand group highlighted<\/span><\/div>\n<h2>Sequent IOplus board page<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Terminal group<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relays REL 1–8<\/td>\n<td>What each relay drives (for example \"Main Entrance DPS\", an elevator floor), and on/off<\/td>\n<\/tr>\n<tr>\n<td>Opto inputs OPTO 1–8<\/td>\n<td>What each input watches (for example a door's lock relay), and on/off<\/td>\n<\/tr>\n<tr>\n<td>Analog inputs 1–8<\/td>\n<td>The EOL zone, its voltage and state (NORMAL, ALARM, TROUBLE, TAMPER). All 8 show as zones, wired or not<\/td>\n<\/tr>\n<tr>\n<td>Analog outputs (DAC 1–4)<\/td>\n<td>Voltage and use<\/td>\n<\/tr>\n<tr>\n<td>Open-drain outputs (O.D. 1–4)<\/td>\n<td>Use, if any, for example elevator tracking<\/td>\n<\/tr>\n<tr>\n<td>RS-485 A (+) / B (−)<\/td>\n<td>\"OSDP bus · /dev/ttyAMA0\" with the number of readers on that port, or \"Controller Emulator\" when the emulator uses it<\/td>\n<\/tr>\n<tr>\n<td>Unused groups<\/td>\n<td>Marked \"not used by Aether\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A terminal used by two things is highlighted. Names come from your doors, elevator and I/O Mapping, and states refresh every few seconds.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: HAT Pinout, Sequent board page with door names on REL and OPTO terminals<\/span><\/div>\n<p><span class=\"sme\">confirm the page tab names and which groups are marked unused on the current Pi.<\/span><\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a035\">035 Map I/O and spot relay conflicts (I/O Mapping)<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<\/ul>", "text": "hat pinout: pi header and sequent board pages what the two hat pinout pages show: the pi's 40-pin header and the sequent ioplus terminals with their live use. for anyone wiring or checking aether.  summary setup › hat pinout shows two pages: the raspberry pi's 40-pin header and the sequent ioplus board. both label each pin or terminal with what aether uses it for and show live states. use it while wiring, or to check what a terminal is connected to. raspberry pi header page pin group what it shows power and ground 3.3 v, 5 v and gnd pins wiegand readers d0/d1 for each reader, read live from the reader config (r1 17/27, r2 22/23, r3 24/25, r4 5/6) i2c (pins 3 and 5) the bus to the sequent board. click them, or the link beside them, to open the sequent page uart (pins 8 and 10, gpio 14/15) drives the sequent card's rs-485 port as /dev/ttyama0 others marked as not used hover a group to highlight its pins. if your reader config has fewer than four wiegand readers, only those are drawn. screenshot to add: hat pinout, raspberry pi header page with the wiegand group highlighted sequent ioplus board page terminal group what it shows relays rel 1–8 what each relay drives (for example \"main entrance dps\", an elevator floor), and on/off opto inputs opto 1–8 what each input watches (for example a door's lock relay), and on/off analog inputs 1–8 the eol zone, its voltage and state (normal, alarm, trouble, tamper). all 8 show as zones, wired or not analog outputs (dac 1–4) voltage and use open-drain outputs (o.d. 1–4) use, if any, for example elevator tracking rs-485 a (+) / b (−) \"osdp bus · /dev/ttyama0\" with the number of readers on that port, or \"controller emulator\" when the emulator uses it unused groups marked \"not used by aether\" a terminal used by two things is highlighted. names come from your doors, elevator and i/o mapping, and states refresh every few seconds. screenshot to add: hat pinout, sequent board page with door names on rel and opto terminals confirm the page tab names and which groups are marked unused on the current pi. related articles 034 default i/o map: relays, inputs, supervision channels 035 map i/o and spot relay conflicts (i/o mapping) 022 wiegand pins and voltage levels (r1–r4) 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters "}, {"id": "a037", "num": "037", "title": "Wire Aether to an NHP or NOP controller", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to wire Aether to a Hanwha NHP or NOP controller, using Board Blueprints Auto-wire and the Doors page 4-door layout. For engineers setting up a test bench.", "sources": ["claude/board-blueprints-aether.md", "Blueprint tool automation", "Aether Board and Wiring tool"], "html": "<h2>Summary<\/h2>\n<p>To test a Hanwha NHP or NOP controller, wire Aether in place of each door's field devices: its Wiegand outputs into the controller's reader ports, its relays into the controller's DPS and REX inputs, and the controller's lock relays into Aether's opto inputs. <strong>Board Blueprints<\/strong> can draw this wiring for you, and the <strong>Doors<\/strong> page has a matching one-click layout.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You know the controller model and how many doors it has: NOP-IC2 2, NHP-P100 1, NHP-P200 2, NHP-P400 4. NOP-RI2MS and NOP-RI4S add 2 and 4 reader doors.<\/li>\n<li>Power is off on the controller while you wire.<\/li>\n<li>Pi GPIO is 3.3 V. If the controller's Wiegand inputs need 5 V, fit a level shifter or open-collector buffer.<\/li>\n<\/ul>\n<h2>Draw the wiring in Board Blueprints<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong> and open the controller's sheet.<\/li>\n<li>Place the Aether board: <strong class=\"path\">Board ▾<i>›<\/i>Switch board<\/strong> (Aether group), or <strong class=\"path\">New board…<i>›<\/i>Aether<\/strong>.<\/li>\n<li>Press <strong>Auto-wire<\/strong>.<\/li>\n<li>Check the drawing and the wire schedule. When the controller runs out of reader ports, Aether doors carry on onto downstream reader boards; a door with no free port is left unwired with a warning.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Board Blueprints with the Aether board auto-wired to a NOP-IC2<\/span><\/div>\n<h2>Wire each door<\/h2>\n<p>For door <em>n<\/em>:<\/p>\n<ol>\n<li>Connect Aether Wiegand <strong>R<em>n<\/em><\/strong> D0, D1 and GND to the controller's reader <em>n<\/em>.<\/li>\n<li>Connect <strong>REL 2n−1<\/strong> to door <em>n<\/em>'s DPS input.<\/li>\n<li>Connect <strong>REL 2n<\/strong> to door <em>n<\/em>'s REX input. On an NHP P-series controller, use the input labelled REX POWER. <span class=\"sme\">confirm the REX terminal label on NHP P-series boards.<\/span><\/li>\n<li>Connect the controller's door <em>n<\/em> lock relay to Aether's <strong>OPTO n<\/strong>, so Aether can see the controller unlock the door.<\/li>\n<li>Add EOL resistors for any supervised inputs yourself. Auto-wire does not add them.<\/li>\n<\/ol>\n<h2>Match the Doors page<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>Click <strong>Apply 4-door layout<\/strong>. Doors 1–4 get DPS on REL 2n−1, REX on REL 2n and the lock watched on OPTO n.<\/li>\n<li>Set each door's reader in Door Settings.<\/li>\n<li>Click <strong>Save Configuration<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> These steps send real door events to the controller.<\/p>\n<ol>\n<li>Power the controller.<\/li>\n<li>On a door card, click DPS, then REX. The controller logs door open/close and a REX request.<\/li>\n<li>Present a card that the controller grants. The door badge shows the unlock seen on OPTO n.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The controller reads no cards<\/td>\n<td>Check D0/D1 aren't swapped, GND is shared, and the voltage level. See <a href=\"#a105\">105<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>DPS and REX events are swapped<\/td>\n<td>REL 2n−1 and REL 2n are crossed at the controller.<\/td>\n<\/tr>\n<tr>\n<td>Lock badge never changes<\/td>\n<td>Check the lock relay to OPTO n wiring, and keep a browser page open.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a077\">077 Place the Aether board and auto-wire a controller<\/a><\/li>\n<li><a href=\"#a029\">029 Set up a door: reader, strike, DPS and REX<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<\/ul>", "text": "wire aether to an nhp or nop controller how to wire aether to a hanwha nhp or nop controller, using board blueprints auto-wire and the doors page 4-door layout. for engineers setting up a test bench.  summary to test a hanwha nhp or nop controller, wire aether in place of each door's field devices: its wiegand outputs into the controller's reader ports, its relays into the controller's dps and rex inputs, and the controller's lock relays into aether's opto inputs. board blueprints can draw this wiring for you, and the doors page has a matching one-click layout. before you start you know the controller model and how many doors it has: nop-ic2 2, nhp-p100 1, nhp-p200 2, nhp-p400 4. nop-ri2ms and nop-ri4s add 2 and 4 reader doors. power is off on the controller while you wire. pi gpio is 3.3 v. if the controller's wiegand inputs need 5 v, fit a level shifter or open-collector buffer. draw the wiring in board blueprints open integrations › board blueprints and open the controller's sheet. place the aether board: board ▾ › switch board (aether group), or new board… › aether . press auto-wire . check the drawing and the wire schedule. when the controller runs out of reader ports, aether doors carry on onto downstream reader boards; a door with no free port is left unwired with a warning. screenshot to add: board blueprints with the aether board auto-wired to a nop-ic2 wire each door for door n : connect aether wiegand r n d0, d1 and gnd to the controller's reader n . connect rel 2n−1 to door n 's dps input. connect rel 2n to door n 's rex input. on an nhp p-series controller, use the input labelled rex power. confirm the rex terminal label on nhp p-series boards. connect the controller's door n lock relay to aether's opto n , so aether can see the controller unlock the door. add eol resistors for any supervised inputs yourself. auto-wire does not add them. match the doors page open access control › doors . click apply 4-door layout . doors 1–4 get dps on rel 2n−1, rex on rel 2n and the lock watched on opto n. set each door's reader in door settings. click save configuration . check that it worked caution: these steps send real door events to the controller. power the controller. on a door card, click dps, then rex. the controller logs door open/close and a rex request. present a card that the controller grants. the door badge shows the unlock seen on opto n. if something goes wrong symptom what to do the controller reads no cards check d0/d1 aren't swapped, gnd is shared, and the voltage level. see 105 . dps and rex events are swapped rel 2n−1 and rel 2n are crossed at the controller. lock badge never changes check the lock relay to opto n wiring, and keep a browser page open. related articles 034 default i/o map: relays, inputs, supervision channels 077 place the aether board and auto-wire a controller 029 set up a door: reader, strike, dps and rex 022 wiegand pins and voltage levels (r1–r4) "}, {"id": "a038", "num": "038", "title": "Build a test run from blocks (Emulation)", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to build a test workflow from blocks in AEGIS > Emulation, and save, load, export and restore it. For testers automating repeatable runs.", "sources": ["claude/source-frontend.md", "Aether product QA testing", "claude/hv-gui-migration.md"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong> is a workflow builder for repeatable test runs. You drag blocks such as Read, Door, Wait and Scenario onto a canvas of columns. Columns run left to right, one after another; blocks stacked in the same column run at the same time. Save a workflow on the Pi to reuse it, or link it to a door's custom event.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The doors, readers and emulated boards your blocks will use are set up.<\/li>\n<li>Aether shows the Pi as connected. <strong>Run Workflow<\/strong> is disabled while it is not.<\/li>\n<\/ul>\n<h2>Build a workflow<\/h2>\n<ol>\n<li>Open <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong>.<\/li>\n<li>From <strong>Blocks<\/strong>, drag a block onto the canvas, or click a block type to add it. The basic blocks are <strong>Read<\/strong>, <strong>Door<\/strong>, <strong>I/O<\/strong>, <strong>Wait<\/strong>, <strong>Schedule<\/strong> and <strong>Control<\/strong>; the advanced ones are <strong>Wait Input<\/strong>, <strong>Log/Assert<\/strong>, <strong>Supervision<\/strong> and <strong>Scenario<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Emulation builder with three columns, one holding two stacked blocks<\/span><\/div>\n<ol start=\"3\">\n<li>Click <strong>Add Column<\/strong> for the next step in time. Drop a block under another to run both together (<strong>+ Simultaneous<\/strong>).<\/li>\n<li>Click a block to edit it in the panel on the right. For example:\n   - <strong>Read<\/strong>: the reader, <strong>Card<\/strong> or <strong>PIN<\/strong>, the format, facility code and card number.\n   - <strong>Door<\/strong>: the door, the event (<strong>Lock<\/strong>, <strong>DPS<\/strong> or <strong>REX<\/strong>), the action and <strong>Pulse Duration (ms)<\/strong>.\n   - <strong>Wait<\/strong>: <strong>Seconds<\/strong>, <strong>Minutes<\/strong>, <strong>Random (seconds)<\/strong> or <strong>Until Clock Time<\/strong>.\n   - <strong>Wait Input<\/strong>: the input to watch, the state to wait for, and <strong>On Timeout<\/strong> (<strong>Continue<\/strong> or <strong>Skip to Next Column<\/strong>).\n   - <strong>Log/Assert<\/strong>: write a message, or check an input is in an <strong>Expected State<\/strong>.\n   - <strong>Control<\/strong>: <strong>Stop Workflow<\/strong> or <strong>Loop to Column<\/strong>.<\/li>\n<li>To use a ready-made test, add a <strong>Scenario<\/strong> block and pick <strong>Valid Access<\/strong>, <strong>Denied Access<\/strong>, <strong>Forced Door<\/strong>, <strong>Held Door<\/strong>, <strong>REX Egress<\/strong>, <strong>Anti-Passback<\/strong>, <strong>Tailgating<\/strong> or <strong>Interlock<\/strong>.<\/li>\n<li>To delete a block, select it and click <strong>Delete Block<\/strong>.<\/li>\n<\/ol>\n<p>Door and reader blocks can target <strong>This door<\/strong>. That only works when a door's custom event runs the workflow. See <a href=\"#a030\">030<\/a>.<\/p>\n<h2>Save and reuse<\/h2>\n<ol>\n<li>Click <strong>Save<\/strong>, enter a name and click <strong>Save<\/strong>. The workflow is stored on the Pi and every browser can load it.<\/li>\n<li>Click <strong>Load<\/strong> to open a saved workflow.<\/li>\n<li>Click <strong>File<\/strong> to download the workflow as an <code>.aether-workflow.json<\/code> file, or import one.<\/li>\n<li>If the browser closed with unsaved work, click <strong>Restore Last<\/strong>.<\/li>\n<\/ol>\n<p>Under <strong>Scenarios<\/strong> you can save the current canvas as a reusable scenario and load, rename or delete it later. Saved scenarios are kept in this browser only; to share one, save it as a workflow or use <strong>File<\/strong>.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Run it (see <a href=\"#a039\">039<\/a>). The <strong>Execution Log<\/strong> lists each block as it runs, and the current column is highlighted.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Run Workflow<\/strong> is greyed out<\/td>\n<td>The canvas is empty, or the Pi is not connected.<\/td>\n<\/tr>\n<tr>\n<td>Wait Input or Assert always fails<\/td>\n<td>Check the input is wired and its type is right in <strong>I/O Mapping<\/strong>, and keep this page's browser open.<\/td>\n<\/tr>\n<tr>\n<td>A Read block sends nothing<\/td>\n<td>The reader isn't enrolled or the format isn't valid for that reader.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a039\">039 Run, pause and schedule a workflow<\/a><\/li>\n<li><a href=\"#a040\">040 Card sequences and ranges in workflows<\/a><\/li>\n<li><a href=\"#a030\">030 Build a custom door event sequence<\/a><\/li>\n<li><a href=\"#a047\">047 Automation rules: triggers, conditions, actions<\/a><\/li>\n<\/ul>", "text": "build a test run from blocks (emulation) how to build a test workflow from blocks in aegis > emulation, and save, load, export and restore it. for testers automating repeatable runs.  summary aegis › emulation is a workflow builder for repeatable test runs. you drag blocks such as read, door, wait and scenario onto a canvas of columns. columns run left to right, one after another; blocks stacked in the same column run at the same time. save a workflow on the pi to reuse it, or link it to a door's custom event. before you start the doors, readers and emulated boards your blocks will use are set up. aether shows the pi as connected. run workflow is disabled while it is not. build a workflow open aegis › emulation . from blocks , drag a block onto the canvas, or click a block type to add it. the basic blocks are read , door , i/o , wait , schedule and control ; the advanced ones are wait input , log/assert , supervision and scenario . screenshot to add: emulation builder with three columns, one holding two stacked blocks click add column for the next step in time. drop a block under another to run both together ( + simultaneous ). click a block to edit it in the panel on the right. for example: - read : the reader, card or pin , the format, facility code and card number. - door : the door, the event ( lock , dps or rex ), the action and pulse duration (ms) . - wait : seconds , minutes , random (seconds) or until clock time . - wait input : the input to watch, the state to wait for, and on timeout ( continue or skip to next column ). - log/assert : write a message, or check an input is in an expected state . - control : stop workflow or loop to column . to use a ready-made test, add a scenario block and pick valid access , denied access , forced door , held door , rex egress , anti-passback , tailgating or interlock . to delete a block, select it and click delete block . door and reader blocks can target this door . that only works when a door's custom event runs the workflow. see 030 . save and reuse click save , enter a name and click save . the workflow is stored on the pi and every browser can load it. click load to open a saved workflow. click file to download the workflow as an .aether-workflow.json file, or import one. if the browser closed with unsaved work, click restore last . under scenarios you can save the current canvas as a reusable scenario and load, rename or delete it later. saved scenarios are kept in this browser only; to share one, save it as a workflow or use file . check that it worked run it (see 039 ). the execution log lists each block as it runs, and the current column is highlighted. if something goes wrong symptom what to do run workflow is greyed out the canvas is empty, or the pi is not connected. wait input or assert always fails check the input is wired and its type is right in i/o mapping , and keep this page's browser open. a read block sends nothing the reader isn't enrolled or the format isn't valid for that reader. related articles 039 run, pause and schedule a workflow 040 card sequences and ranges in workflows 030 build a custom door event sequence 047 automation rules: triggers, conditions, actions "}, {"id": "a039", "num": "039", "title": "Run, pause and schedule a workflow", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to run, repeat, pause, stop and schedule an Emulation workflow, and what the Running badge means. For testers running workflows.", "sources": ["claude/source-frontend.md", "claude/hv-gui-migration.md", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Once a workflow is on the Emulation canvas you can run it now, repeat it, pause it, stop it, or schedule it to start at a set time. A run keeps going when you switch to another page in Aether, and the sidebar shows a <strong>Running<\/strong> badge while it is active.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A workflow is on the canvas. See <a href=\"#a038\">038<\/a>.<\/li>\n<li>Aether shows the Pi as connected.<\/li>\n<li>Runs and scheduled starts are driven by the browser tab that started them. Keep that tab open: closing or refreshing it ends a run and cancels a scheduled start.<\/li>\n<\/ul>\n<h2>Run a workflow now<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> A run switches real relays and sends real cards to the controller.<\/p>\n<ol>\n<li>Open <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong>.<\/li>\n<li>Optional: set <strong>Repeat<\/strong> with the <strong>−<\/strong> and <strong>+<\/strong> buttons.<\/li>\n<li>Optional: click the settings icon and set <strong>Delay Between Columns (ms)<\/strong>.<\/li>\n<li>Click <strong>Run Workflow<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Emulation run bar showing Running: Column 2, with Pause and Stop<\/span><\/div>\n<h2>Pause, resume or stop<\/h2>\n<ol>\n<li>Click <strong>Pause<\/strong>. The run waits before its next step.<\/li>\n<li>Click <strong>Resume<\/strong> to carry on.<\/li>\n<li>Click <strong>Stop<\/strong> to end the run. A stopped run logs nothing more.<\/li>\n<\/ol>\n<p>Only one workflow runs at a time, including runs started by a door's custom event. Stop is always on this page.<\/p>\n<h2>Schedule a run<\/h2>\n<ol>\n<li>Click <strong>Schedule Run<\/strong>.<\/li>\n<li>Enter <strong>Time (24h)<\/strong>.<\/li>\n<li>Optional: enter <strong>Date (optional)<\/strong>. Left blank, it runs at the next occurrence: today if the time has not passed, otherwise tomorrow.<\/li>\n<li>Check the <strong>Will start at<\/strong> line, then click <strong>Schedule<\/strong>.<\/li>\n<li>The run bar shows the time and <strong>Starts in<\/strong> with a countdown. Click <strong>Run Now<\/strong> to start early, or <strong>Cancel<\/strong>.<\/li>\n<\/ol>\n<p>To hold a workflow until a time in the middle of a run, put a <strong>Schedule<\/strong> block in it instead.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The <strong>Execution Log<\/strong> lists each block with a time stamp, and the run bar shows the current column.<\/li>\n<li>The sidebar shows <strong>Running<\/strong> while the run is active, even on other pages.<\/li>\n<li>After the run, the log is also in <strong class=\"path\">Reports<i>›<\/i>Emulation<\/strong>.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Not connected<\/strong> shows on the run bar<\/td>\n<td>Reconnect to the Pi, then run again.<\/td>\n<\/tr>\n<tr>\n<td>The scheduled run did not start<\/td>\n<td>The browser tab was closed or the Pi was offline at that time. Schedule it again and keep the tab open.<\/td>\n<\/tr>\n<tr>\n<td>A door event says another workflow is running<\/td>\n<td>Stop the current run here first.<\/td>\n<\/tr>\n<tr>\n<td>Schedule shows <strong>Invalid or past time<\/strong><\/td>\n<td>Pick a time later than now, or leave the date blank.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a038\">038 Build a test run from blocks (Emulation)<\/a><\/li>\n<li><a href=\"#a040\">040 Card sequences and ranges in workflows<\/a><\/li>\n<li><a href=\"#a048\">048 Schedule an automation rule<\/a><\/li>\n<li><a href=\"#a089\">089 Reports: audit, system and emulation logs<\/a><\/li>\n<\/ul>", "text": "run, pause and schedule a workflow how to run, repeat, pause, stop and schedule an emulation workflow, and what the running badge means. for testers running workflows.  summary once a workflow is on the emulation canvas you can run it now, repeat it, pause it, stop it, or schedule it to start at a set time. a run keeps going when you switch to another page in aether, and the sidebar shows a running badge while it is active. before you start a workflow is on the canvas. see 038 . aether shows the pi as connected. runs and scheduled starts are driven by the browser tab that started them. keep that tab open: closing or refreshing it ends a run and cancels a scheduled start. run a workflow now caution: a run switches real relays and sends real cards to the controller. open aegis › emulation . optional: set repeat with the − and + buttons. optional: click the settings icon and set delay between columns (ms) . click run workflow . screenshot to add: emulation run bar showing running: column 2, with pause and stop pause, resume or stop click pause . the run waits before its next step. click resume to carry on. click stop to end the run. a stopped run logs nothing more. only one workflow runs at a time, including runs started by a door's custom event. stop is always on this page. schedule a run click schedule run . enter time (24h) . optional: enter date (optional) . left blank, it runs at the next occurrence: today if the time has not passed, otherwise tomorrow. check the will start at line, then click schedule . the run bar shows the time and starts in with a countdown. click run now to start early, or cancel . to hold a workflow until a time in the middle of a run, put a schedule block in it instead. check that it worked the execution log lists each block with a time stamp, and the run bar shows the current column. the sidebar shows running while the run is active, even on other pages. after the run, the log is also in reports › emulation . if something goes wrong symptom what to do not connected shows on the run bar reconnect to the pi, then run again. the scheduled run did not start the browser tab was closed or the pi was offline at that time. schedule it again and keep the tab open. a door event says another workflow is running stop the current run here first. schedule shows invalid or past time pick a time later than now, or leave the date blank. related articles 038 build a test run from blocks (emulation) 040 card sequences and ranges in workflows 048 schedule an automation rule 089 reports: audit, system and emulation logs "}, {"id": "a040", "num": "040", "title": "Card sequences and ranges in workflows", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How a Read block sends card ranges, random cards, replays and invalid cards, with each Sequence Mode explained. For testers doing load and card-database tests.", "sources": ["claude/source-frontend.md"], "html": "<h2>Summary<\/h2>\n<p>A <strong>Read<\/strong> block can send one card or a whole series. In range mode it walks through facility codes and card numbers, picks random cards from a range, repeats one card, or sends deliberately invalid cards. Use it for load tests, card-database checks and invalid-format tests without typing each card.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A workflow is open in <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong> with a <strong>Read<\/strong> block. See <a href=\"#a038\">038<\/a>.<\/li>\n<li>The reader the block uses is enrolled, and you know the card format the controller expects.<\/li>\n<\/ul>\n<h2>Send a range of cards<\/h2>\n<ol>\n<li>Select the <strong>Read<\/strong> block.<\/li>\n<li>Pick the <strong>Reader<\/strong> and set <strong>Read Type<\/strong> to <strong>Card<\/strong>.<\/li>\n<li>Pick the <strong>Format<\/strong>.<\/li>\n<li>Under <strong>Mode<\/strong>, click <strong>range<\/strong>.<\/li>\n<li>Pick a <strong>Sequence Mode<\/strong> (see the table below).<\/li>\n<li>Enter <strong>FC Start<\/strong>, <strong>FC End<\/strong>, <strong>CN Start<\/strong> and <strong>CN End<\/strong>.<\/li>\n<li>For <strong>Random from range<\/strong> or <strong>Replay same card N times<\/strong>, set <strong>Card Count<\/strong>.<\/li>\n<li>Set <strong>Delay Between Cards (ms)<\/strong> so the controller has time to answer each card.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Read block settings in range mode with Sequence Mode open<\/span><\/div>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Sequence Mode<\/th>\n<th>What it sends<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Sequential<\/strong><\/td>\n<td>Every card number for every facility code in the range<\/td>\n<\/tr>\n<tr>\n<td><strong>Increment CN only<\/strong><\/td>\n<td>CN Start to CN End, all at FC Start<\/td>\n<\/tr>\n<tr>\n<td><strong>Increment FC only<\/strong><\/td>\n<td>FC Start to FC End, all with CN Start<\/td>\n<\/tr>\n<tr>\n<td><strong>Increment both<\/strong><\/td>\n<td>FC and CN step up together; the shorter range stops at its end<\/td>\n<\/tr>\n<tr>\n<td><strong>Random from range<\/strong><\/td>\n<td><strong>Card Count<\/strong> random cards from the range (default 10)<\/td>\n<\/tr>\n<tr>\n<td><strong>Replay same card N times<\/strong><\/td>\n<td>The single-mode facility code and card number, <strong>Card Count<\/strong> times<\/td>\n<\/tr>\n<tr>\n<td><strong>Invalid/Out of range<\/strong><\/td>\n<td>Three cards the format can't hold: facility code one above its maximum, card number one above its maximum, and facility code −1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Sequential<\/strong> over wide ranges produces a lot of cards: 10 facility codes × 1000 card numbers is 10,000 reads.<\/p>\n<h2>Run it<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Every card in the sequence is sent to the controller as a real read.<\/p>\n<ol>\n<li>Click <strong>Run Workflow<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The <strong>Execution Log<\/strong> shows each card with its facility code and number.<\/li>\n<li>The controller logs one read per card, granted or denied.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Only one card is sent<\/td>\n<td><strong>Mode<\/strong> is still <strong>single<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Cards are rejected as bad format<\/td>\n<td>Check the format matches the controller and the values fit it. The format line under the list shows its FC and card limits.<\/td>\n<\/tr>\n<tr>\n<td>The controller misses cards<\/td>\n<td>Raise <strong>Delay Between Cards (ms)<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a038\">038 Build a test run from blocks (Emulation)<\/a><\/li>\n<li><a href=\"#a039\">039 Run, pause and schedule a workflow<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a026\">026 Save cards for quick reuse<\/a><\/li>\n<\/ul>", "text": "card sequences and ranges in workflows how a read block sends card ranges, random cards, replays and invalid cards, with each sequence mode explained. for testers doing load and card-database tests.  summary a read block can send one card or a whole series. in range mode it walks through facility codes and card numbers, picks random cards from a range, repeats one card, or sends deliberately invalid cards. use it for load tests, card-database checks and invalid-format tests without typing each card. before you start a workflow is open in aegis › emulation with a read block. see 038 . the reader the block uses is enrolled, and you know the card format the controller expects. send a range of cards select the read block. pick the reader and set read type to card . pick the format . under mode , click range . pick a sequence mode (see the table below). enter fc start , fc end , cn start and cn end . for random from range or replay same card n times , set card count . set delay between cards (ms) so the controller has time to answer each card. screenshot to add: read block settings in range mode with sequence mode open sequence mode what it sends sequential every card number for every facility code in the range increment cn only cn start to cn end, all at fc start increment fc only fc start to fc end, all with cn start increment both fc and cn step up together; the shorter range stops at its end random from range card count random cards from the range (default 10) replay same card n times the single-mode facility code and card number, card count times invalid/out of range three cards the format can't hold: facility code one above its maximum, card number one above its maximum, and facility code −1 sequential over wide ranges produces a lot of cards: 10 facility codes × 1000 card numbers is 10,000 reads. run it caution: every card in the sequence is sent to the controller as a real read. click run workflow . check that it worked the execution log shows each card with its facility code and number. the controller logs one read per card, granted or denied. if something goes wrong symptom what to do only one card is sent mode is still single . cards are rejected as bad format check the format matches the controller and the values fit it. the format line under the list shows its fc and card limits. the controller misses cards raise delay between cards (ms) . related articles 038 build a test run from blocks (emulation) 039 run, pause and schedule a workflow 023 the built-in card format library 026 save cards for quick reuse "}, {"id": "a041", "num": "041", "title": "What the Controller Emulator does", "area": "Emulation, Controller Emulator and automations", "type": "Concept", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Explains what the Controller Emulator does: Azure downstream boards on RS-485, the five models, and how inputs, outputs, readers and status behave. For testers new to the emulator.", "sources": ["claude/source-frontend.md", "claude/source-backend-protocols.md", "Resistor calibration tool", "OSDP firmware upload logger"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Controller Emulator<\/strong> makes Aether act as Azure Access downstream boards on an RS-485 bus. You connect one of the Pi's USB-RS485 adapters to the downstream port of an IC2 (or another controller that polls these boards), add boards at OSDP addresses, and the controller sees them as real boards. Use it to test doors, inputs and readers beyond what Aether's own IOplus I/O can carry.<\/p>\n<h2>What it emulates<\/h2>\n<p>Up to 32 boards on one bus, at addresses 0–31. Each board can be one of five models:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Inputs<\/th>\n<th>Outputs<\/th>\n<th>Reader ports<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I16S<\/td>\n<td>16<\/td>\n<td>0<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>O8S<\/td>\n<td>0<\/td>\n<td>8<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>IO168S<\/td>\n<td>16<\/td>\n<td>8<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>RI2MS<\/td>\n<td>6<\/td>\n<td>4<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>RI4S<\/td>\n<td>12<\/td>\n<td>8<\/td>\n<td>4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each board also reports <strong>TAMPER<\/strong> and <strong>POWER FAIL<\/strong> status.<\/p>\n<h2>How it behaves on the bus<\/h2>\n<p>The controller polls each address. Aether answers for every board you added, the way the real board would:<\/p>\n<ul>\n<li><strong>Inputs<\/strong> you click on the page are reported to the controller on its next poll, as if a contact had closed.<\/li>\n<li><strong>Outputs<\/strong> are driven by the controller. Aether shows what the controller commanded; you can't click them.<\/li>\n<li><strong>Readers<\/strong> on RI2MS and RI4S boards send the cards and PINs you enter, and show the LED colour, buzzer and text the controller sends back.<\/li>\n<li><strong>Tamper<\/strong> and <strong>power fail<\/strong> are latching: they stay on until you clear them.<\/li>\n<\/ul>\n<h2>Where it fits with the rest of Aether<\/h2>\n<ul>\n<li>A door on the <strong>Doors<\/strong> page can run on a board instead of Aether's relays. See <a href=\"#a032\">032<\/a>.<\/li>\n<li>Emulation workflows and Elevator floors can drive board inputs and watch board outputs.<\/li>\n<\/ul>\n<h2>Sharing the serial port<\/h2>\n<p>The Controller Emulator needs a serial port to itself. If OSDP reader emulation already uses that port, Aether asks before taking it, and gives it back when you stop the bus. See <a href=\"#a046\">046<\/a>.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Controller Emulator page with the bus running and a grid of boards<\/span><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a043\">043 Simulate tamper and power fail on a board<\/a><\/li>\n<li><a href=\"#a044\">044 Send a card or keys through a board's reader port<\/a><\/li>\n<li><a href=\"#a045\">045 Save, export and import emulator configs<\/a><\/li>\n<li><a href=\"#a046\">046 Share a serial port between readers and the emulator<\/a><\/li>\n<\/ul>", "text": "what the controller emulator does explains what the controller emulator does: azure downstream boards on rs-485, the five models, and how inputs, outputs, readers and status behave. for testers new to the emulator.  summary the controller emulator makes aether act as azure access downstream boards on an rs-485 bus. you connect one of the pi's usb-rs485 adapters to the downstream port of an ic2 (or another controller that polls these boards), add boards at osdp addresses, and the controller sees them as real boards. use it to test doors, inputs and readers beyond what aether's own ioplus i/o can carry. what it emulates up to 32 boards on one bus, at addresses 0–31. each board can be one of five models: model inputs outputs reader ports i16s 16 0 0 o8s 0 8 0 io168s 16 8 0 ri2ms 6 4 2 ri4s 12 8 4 each board also reports tamper and power fail status. how it behaves on the bus the controller polls each address. aether answers for every board you added, the way the real board would: inputs you click on the page are reported to the controller on its next poll, as if a contact had closed. outputs are driven by the controller. aether shows what the controller commanded; you can't click them. readers on ri2ms and ri4s boards send the cards and pins you enter, and show the led colour, buzzer and text the controller sends back. tamper and power fail are latching: they stay on until you clear them. where it fits with the rest of aether a door on the doors page can run on a board instead of aether's relays. see 032 . emulation workflows and elevator floors can drive board inputs and watch board outputs. sharing the serial port the controller emulator needs a serial port to itself. if osdp reader emulation already uses that port, aether asks before taking it, and gives it back when you stop the bus. see 046 . screenshot to add: controller emulator page with the bus running and a grid of boards related articles 042 add a downstream board and drive its i/o 043 simulate tamper and power fail on a board 044 send a card or keys through a board's reader port 045 save, export and import emulator configs 046 share a serial port between readers and the emulator "}, {"id": "a042", "num": "042", "title": "Add a downstream board and drive its I/O", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to start the Controller Emulator bus, add Azure boards at addresses, toggle their inputs and watch their outputs. For testers adding downstream I/O.", "sources": ["claude/source-frontend.md", "claude/source-backend-protocols.md", "Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Start the emulated RS-485 bus, add Azure boards at the addresses the controller expects, then click their inputs to send events and watch their outputs follow the controller. This is how you add I/O points or reader doors that Aether's own HAT doesn't have.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A USB-RS485 adapter is wired to the controller's downstream port (A to A, B to B, shared ground).<\/li>\n<li>The boards are enrolled on the controller at the addresses you will use, with the same models.<\/li>\n<li>You know the downstream bus baud rate.<\/li>\n<\/ul>\n<h2>Start the bus<\/h2>\n<ol>\n<li>Open <strong>Controller Emulator<\/strong>.<\/li>\n<li>In <strong>Serial Port<\/strong>, pick the adapter. Click the refresh icon if it isn't listed.<\/li>\n<li>In <strong>Baud<\/strong>, pick the bus speed: 9600, 19200, 38400, 57600 or 115200.<\/li>\n<li>Click <strong>Start Bus<\/strong>. The badge changes to <strong>Running<\/strong> and the frame counters start moving when the controller polls.<\/li>\n<\/ol>\n<p>If the port is used by OSDP reader emulation, see <a href=\"#a046\">046<\/a>.<\/p>\n<h2>Add a board<\/h2>\n<ol>\n<li>In <strong>Devices<\/strong>, click the empty slot for the address you want.<\/li>\n<li>Pick the model: I16S, O8S, IO168S, RI2MS or RI4S.<\/li>\n<li>Click <strong>Add<\/strong>. The board appears in its slot.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Devices grid with an IO168S at address 2 and its corner poll dot green<\/span><\/div>\n<p>The dot in the board's corner shows polling: green when polled in the last 3 s, then yellow, orange and red as polls stop. Hover it for the time since the last poll.<\/p>\n<h2>Drive inputs and watch outputs<\/h2>\n<ol>\n<li>Click a board to open its details.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> Clicking an input sends a real input change to the controller.<\/p>\n<ol start=\"2\">\n<li>In <strong>Inputs<\/strong>, click an input to toggle it. The controller receives it on its next poll.<\/li>\n<li>In <strong>Outputs<\/strong>, watch the lamps. They light when the controller turns an output on.<\/li>\n<li>Click <strong>Remove<\/strong> on the details panel to take a board off the bus.<\/li>\n<\/ol>\n<h2>Stop the bus<\/h2>\n<ol>\n<li>Click <strong>Stop Bus<\/strong>. The controller then sees the boards go offline.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The board's poll dot is green and the controller shows the board online.<\/li>\n<li>An input you toggle shows as an event on the controller.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Board says never polled<\/td>\n<td>The controller isn't polling that address: check enrollment, address, baud and A/B wiring.<\/td>\n<\/tr>\n<tr>\n<td>Frame counters don't move<\/td>\n<td>Wrong port or baud, or the controller's downstream port is disabled.<\/td>\n<\/tr>\n<tr>\n<td>\"Port in use\" when starting<\/td>\n<td>See <a href=\"#a097\">097 Port in use when starting the emulator or an upload<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<li><a href=\"#a043\">043 Simulate tamper and power fail on a board<\/a><\/li>\n<li><a href=\"#a044\">044 Send a card or keys through a board's reader port<\/a><\/li>\n<li><a href=\"#a045\">045 Save, export and import emulator configs<\/a><\/li>\n<li><a href=\"#a032\">032 Drive a door on an Azure board (Aether/Azure switch)<\/a><\/li>\n<\/ul>", "text": "add a downstream board and drive its i/o how to start the controller emulator bus, add azure boards at addresses, toggle their inputs and watch their outputs. for testers adding downstream i/o.  summary start the emulated rs-485 bus, add azure boards at the addresses the controller expects, then click their inputs to send events and watch their outputs follow the controller. this is how you add i/o points or reader doors that aether's own hat doesn't have. before you start a usb-rs485 adapter is wired to the controller's downstream port (a to a, b to b, shared ground). the boards are enrolled on the controller at the addresses you will use, with the same models. you know the downstream bus baud rate. start the bus open controller emulator . in serial port , pick the adapter. click the refresh icon if it isn't listed. in baud , pick the bus speed: 9600, 19200, 38400, 57600 or 115200. click start bus . the badge changes to running and the frame counters start moving when the controller polls. if the port is used by osdp reader emulation, see 046 . add a board in devices , click the empty slot for the address you want. pick the model: i16s, o8s, io168s, ri2ms or ri4s. click add . the board appears in its slot. screenshot to add: devices grid with an io168s at address 2 and its corner poll dot green the dot in the board's corner shows polling: green when polled in the last 3 s, then yellow, orange and red as polls stop. hover it for the time since the last poll. drive inputs and watch outputs click a board to open its details. caution: clicking an input sends a real input change to the controller. in inputs , click an input to toggle it. the controller receives it on its next poll. in outputs , watch the lamps. they light when the controller turns an output on. click remove on the details panel to take a board off the bus. stop the bus click stop bus . the controller then sees the boards go offline. check that it worked the board's poll dot is green and the controller shows the board online. an input you toggle shows as an event on the controller. if something goes wrong symptom what to do board says never polled the controller isn't polling that address: check enrollment, address, baud and a/b wiring. frame counters don't move wrong port or baud, or the controller's downstream port is disabled. \"port in use\" when starting see 097 port in use when starting the emulator or an upload . related articles 041 what the controller emulator does 043 simulate tamper and power fail on a board 044 send a card or keys through a board's reader port 045 save, export and import emulator configs 032 drive a door on an azure board (aether/azure switch) "}, {"id": "a043", "num": "043", "title": "Simulate tamper and power fail on a board", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to raise and clear tamper and power-fail status on an emulated Azure board and check the controller's response. For testers of board supervision alarms.", "sources": ["claude/source-frontend.md", "Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>Every emulated Azure board can report a tamper and a power failure to the controller. Turn them on from the board's <strong>Status<\/strong> section to check that the controller raises the right alarm and clears it again. Both are latching: they stay on until you turn them off.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Controller Emulator bus is running and the board is being polled. See <a href=\"#a042\">042<\/a>.<\/li>\n<\/ul>\n<h2>Raise a tamper or power fail<\/h2>\n<ol>\n<li>Open <strong>Controller Emulator<\/strong>.<\/li>\n<li>Click the board in <strong>Devices<\/strong>.<\/li>\n<li>Scroll to <strong>Status<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Board details with the Status section showing TAMPER and POWER FAIL buttons<\/span><\/div>\n<p class=\"caution\"><strong>Caution:<\/strong> The next step sends a real alarm to the controller.<\/p>\n<ol start=\"4\">\n<li>Click <strong>TAMPER<\/strong> or <strong>POWER FAIL<\/strong>. The button lights, and the board's tile in <strong>Devices<\/strong> shows a small red (tamper) or orange (power fail) dot.<\/li>\n<li>The board reports the new status on the controller's next poll.<\/li>\n<\/ol>\n<h2>Clear it<\/h2>\n<ol>\n<li>Click the same button again. The board reports normal status on the next poll.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The controller logs a tamper or power-fail alarm for that board, then a restore when you clear it.<\/li>\n<li>The VMS Stream page puts a red frame and label on the board while either is active.<\/li>\n<li>In <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>, the board's local status reply shows TAMPER or POWER FAIL.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Button lights but the controller shows nothing<\/td>\n<td>Check the board is polled (green dot). The status only goes out when the controller asks for it.<\/td>\n<\/tr>\n<tr>\n<td>Alarm stays on the controller after clearing<\/td>\n<td>Some controllers need the alarm acknowledged. Check the controller's alarm list.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<\/ul>", "text": "simulate tamper and power fail on a board how to raise and clear tamper and power-fail status on an emulated azure board and check the controller's response. for testers of board supervision alarms.  summary every emulated azure board can report a tamper and a power failure to the controller. turn them on from the board's status section to check that the controller raises the right alarm and clears it again. both are latching: they stay on until you turn them off. before you start the controller emulator bus is running and the board is being polled. see 042 . raise a tamper or power fail open controller emulator . click the board in devices . scroll to status . screenshot to add: board details with the status section showing tamper and power fail buttons caution: the next step sends a real alarm to the controller. click tamper or power fail . the button lights, and the board's tile in devices shows a small red (tamper) or orange (power fail) dot. the board reports the new status on the controller's next poll. clear it click the same button again. the board reports normal status on the next poll. check that it worked the controller logs a tamper or power-fail alarm for that board, then a restore when you clear it. the vms stream page puts a red frame and label on the board while either is active. in readers › osdp trace , the board's local status reply shows tamper or power fail. if something goes wrong symptom what to do button lights but the controller shows nothing check the board is polled (green dot). the status only goes out when the controller asks for it. alarm stays on the controller after clearing some controllers need the alarm acknowledged. check the controller's alarm list. related articles 041 what the controller emulator does 042 add a downstream board and drive its i/o 017 read a conversation in osdp trace "}, {"id": "a044", "num": "044", "title": "Send a card or keys through a board's reader port", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to send a card read or keypad digits through an emulated RI2MS or RI4S reader port. For testers of doors on downstream reader boards.", "sources": ["claude/source-frontend.md", "claude/source-backend-routes.md", "OSDP firmware upload logger"], "html": "<h2>Summary<\/h2>\n<p>RI2MS and RI4S boards have reader ports. From a board's <strong>Send Credential<\/strong> panel you can send a card read or keypad digits through any of its ports, exactly as a reader wired to that port would. Use it to test card access on doors that sit on downstream reader boards.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Controller Emulator bus is running with an RI2MS or RI4S added and polled. See <a href=\"#a042\">042<\/a>.<\/li>\n<li>The controller has the board's reader ports set up as door readers, and the card is in its database if you expect a grant.<\/li>\n<\/ul>\n<h2>Send a card<\/h2>\n<ol>\n<li>Open <strong>Controller Emulator<\/strong> and click the reader board.<\/li>\n<li>In <strong>Readers<\/strong>, click a reader tile, or pick the port under <strong>Target reader port<\/strong> (<strong>R0<\/strong>, <strong>R1<\/strong> …). Ports are numbered from 0.<\/li>\n<li>In <strong>Send Credential<\/strong>, pick the <strong>Category<\/strong>, <strong>Bits<\/strong> and <strong>Format<\/strong>. The line below shows the format's facility code and card number limits.<\/li>\n<li>Enter <strong>Facility<\/strong> and <strong>Card #<\/strong> (and the issue level if the format has one).<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Send Credential panel with a 26-bit format, facility and card filled in<\/span><\/div>\n<p class=\"caution\"><strong>Caution:<\/strong> The next step sends a real card read to the controller.<\/p>\n<ol start=\"5\">\n<li>Click <strong>Send Card → Reader n<\/strong>. The read is queued and goes out on the controller's next poll.<\/li>\n<\/ol>\n<h2>Send keypad digits<\/h2>\n<ol>\n<li>Under <strong>PIN / Keypad<\/strong>, type the digits, plus <code>#<\/code> or <code>*<\/code> if needed (for example <code>1234#<\/code>).<\/li>\n<li>Click <strong>Send PIN<\/strong>, or press Enter.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The reader tile shows the LED colour, buzzer and text the controller sends back, for example green for a grant.<\/li>\n<li>The controller logs the read against that board and port.<\/li>\n<li>The emulator frame log shows the outgoing card frame.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"No device at address\"<\/td>\n<td>The board isn't on the bus at that address. Add it first.<\/td>\n<\/tr>\n<tr>\n<td>\"Reader port out of range\"<\/td>\n<td>RI2MS has ports 0–1 and RI4S 0–3.<\/td>\n<\/tr>\n<tr>\n<td>Read sent but nothing on the controller<\/td>\n<td>Check the board is polled and the format matches the controller's card format.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A door on the Doors page that runs on this board can also send its card here with <strong>Present card<\/strong>. Emulation <strong>Read<\/strong> blocks can use board reader ports too.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a032\">032 Drive a door on an Azure board (Aether/Azure switch)<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<\/ul>", "text": "send a card or keys through a board's reader port how to send a card read or keypad digits through an emulated ri2ms or ri4s reader port. for testers of doors on downstream reader boards.  summary ri2ms and ri4s boards have reader ports. from a board's send credential panel you can send a card read or keypad digits through any of its ports, exactly as a reader wired to that port would. use it to test card access on doors that sit on downstream reader boards. before you start the controller emulator bus is running with an ri2ms or ri4s added and polled. see 042 . the controller has the board's reader ports set up as door readers, and the card is in its database if you expect a grant. send a card open controller emulator and click the reader board. in readers , click a reader tile, or pick the port under target reader port ( r0 , r1 …). ports are numbered from 0. in send credential , pick the category , bits and format . the line below shows the format's facility code and card number limits. enter facility and card # (and the issue level if the format has one). screenshot to add: send credential panel with a 26-bit format, facility and card filled in caution: the next step sends a real card read to the controller. click send card → reader n . the read is queued and goes out on the controller's next poll. send keypad digits under pin / keypad , type the digits, plus # or * if needed (for example 1234# ). click send pin , or press enter. check that it worked the reader tile shows the led colour, buzzer and text the controller sends back, for example green for a grant. the controller logs the read against that board and port. the emulator frame log shows the outgoing card frame. if something goes wrong symptom what to do \"no device at address\" the board isn't on the bus at that address. add it first. \"reader port out of range\" ri2ms has ports 0–1 and ri4s 0–3. read sent but nothing on the controller check the board is polled and the format matches the controller's card format. a door on the doors page that runs on this board can also send its card here with present card . emulation read blocks can use board reader ports too. related articles 041 what the controller emulator does 042 add a downstream board and drive its i/o 032 drive a door on an azure board (aether/azure switch) 023 the built-in card format library "}, {"id": "a045", "num": "045", "title": "Save, export and import emulator configs", "area": "Emulation, Controller Emulator and automations", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to save, load, export and import Controller Emulator configs (sets of boards). For testers who rebuild or share benches.", "sources": ["claude/source-frontend.md", "claude/source-backend-routes.md"], "html": "<h2>Summary<\/h2>\n<p>An emulator config is a named set of boards: their addresses and models. Save one to set up the same bench again in one click, export it as a JSON file to share with another Aether, or import a file someone sent you. Configs are saved on the Pi, in the backend's <code>emulator-configs<\/code> folder.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>For saving: the boards you want are added on <strong>Controller Emulator<\/strong>.<\/li>\n<\/ul>\n<h2>Save the current boards<\/h2>\n<ol>\n<li>Open <strong>Controller Emulator<\/strong>.<\/li>\n<li>Click <strong>Save<\/strong>.<\/li>\n<li>Enter a config name, for example <code>azure-3board<\/code>.<\/li>\n<li>Click <strong>Save<\/strong>. Saving under an existing name replaces that config.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Saved Configurations row with Load, Save, Export and Import buttons<\/span><\/div>\n<h2>Load a saved config<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Loading replaces every board on the page. If the bus is running, the controller sees the old boards disappear and the new ones appear.<\/p>\n<ol>\n<li>In <strong>Saved Configurations<\/strong>, pick the config. Each entry shows how many devices it has.<\/li>\n<li>Click <strong>Load<\/strong>.<\/li>\n<\/ol>\n<h2>Export a config<\/h2>\n<ol>\n<li>Pick the config in <strong>Saved Configurations<\/strong>.<\/li>\n<li>Click <strong>Export<\/strong>. The browser downloads it as a JSON file.<\/li>\n<\/ol>\n<h2>Import a config<\/h2>\n<ol>\n<li>Click <strong>Import<\/strong>.<\/li>\n<li>Choose a config <code>.json<\/code> file.<\/li>\n<li>The config is added to <strong>Saved Configurations<\/strong> and selected.<\/li>\n<li>Click <strong>Load<\/strong> to use it.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>After <strong>Load<\/strong>, the <strong>Devices<\/strong> grid shows the config's boards and the log says how many devices were applied.<\/li>\n<li>After <strong>Import<\/strong>, the log shows \"Imported config\" with its name.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The new config isn't in the list<\/td>\n<td>Click the refresh icon next to <strong>Saved Configurations<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Import fails<\/td>\n<td>The file isn't a valid config JSON. Export it again from the other Aether.<\/td>\n<\/tr>\n<tr>\n<td>Boards loaded but show never polled<\/td>\n<td>The controller doesn't have those addresses enrolled.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Configs are also included in <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<i>›<\/i>Download backup<\/strong>. <span class=\"sme\">confirm emulator configs are part of the full backup.<\/span><\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<\/ul>", "text": "save, export and import emulator configs how to save, load, export and import controller emulator configs (sets of boards). for testers who rebuild or share benches.  summary an emulator config is a named set of boards: their addresses and models. save one to set up the same bench again in one click, export it as a json file to share with another aether, or import a file someone sent you. configs
