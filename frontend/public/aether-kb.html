re upload is running\" <span class=\"sme\">confirm exact wording<\/span><\/td>\n<td>Wait for the upload to finish<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a067\">067 Update history, restore and automatic rollback<\/a><\/li>\n<li><a href=\"#a074\">074 Keep Board Blueprints up to date<\/a><\/li>\n<li><a href=\"#a100\">100 An update failed or rolled back<\/a><\/li>\n<\/ul>", "text": "install order and named update bundles reference for the kinds of aether update bundles, how they are named, and the order to install them in. for anyone handling several updates.  summary aether updates come as files you drop on setup › device firmware . this page lists the bundle types, how their names appear on the page, and the order to install them in. bundle types type what is inside what the page does script bundle ( .tgz or .zip ) an apply.sh script plus the files it needs backs up, runs apply.sh , checks health file bundle ( .tgz or .zip ) plain backend/… and frontend/… files backs up, copies the files in, rebuilds pages and restarts as needed, checks health single file one file, for example a script finds where it lives, puts it in place, then does nothing, rebuilds or restarts board blueprints bundle ( aether-update-blueprints-<date>.zip ) the board blueprints page and its installer as a script bundle; see 074 every bundle backs up the aether folder first. after applying, aether must answer its health check twice within 60 s, or the backup is restored. how names appear file name on the page apply.sh with line 2 like # update nn: title the title from that line, for example \"update 82: integrations tab\" bundle without that line the file name named bundles, for example aether-update-https-1.tgz the title from apply.sh update numbers have collided before. newer bundles are named, not numbered, for example sunapi-4, https-1 or academy-2.2. before installing a numbered update, check history on the device firmware page for the latest number, and if two files claim the same number, ask which one is current. install order rule why install numbered aether updates in number order later updates are built on top of earlier ones and check the files they change install aether updates before board blueprints updates aether updates check their files against the version they expect; blueprints changes one line in a shared file an update that says files changed and stops needs a rebuild it was built for an older copy; nothing was changed do not apply an update that restarts the backend during a reader firmware upload the page refuses it until the upload ends reload with ctrl+shift+r after each update the browser may keep the old pages what a refused update looks like log line meaning \"stopped: these files changed since update nn\" the update did not fit; nothing was changed. the page then rolls back as a precaution \"already in\" that part was installed before; running the update again is safe \"refused: a reader firmware upload is running\" confirm exact wording wait for the upload to finish related articles 066 install an aether update (device firmware) 067 update history, restore and automatic rollback 074 keep board blueprints up to date 100 an update failed or rolled back "}, {"id": "a069", "num": "069", "title": "Update OSDP reader firmware (Firmware wizard)", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Shows how to push a firmware file to one or more real OSDP readers with the Firmware wizard on Readers > OSDP > Firmware, and how to read the live trace.", "sources": ["OSDP firmware upload logger", "OSDP Trace tool app", "frontend/src/components/OSDPFirmwareWizard.tsx (2026-09-20 source)"], "html": "<h2>Summary<\/h2>\n<p>The Firmware wizard on <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Firmware<\/strong> sends a firmware file to real OSDP readers over RS-485, using OSDP file transfer. The wizard has four steps: <strong>Targets<\/strong>, <strong>Identify<\/strong>, <strong>Firmware<\/strong> and <strong>Confirm &amp; flash<\/strong>. Every upload is traced byte by byte.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The reader is wired to an RS-485 port on the Pi and powered.<\/li>\n<li>You know the reader's port, baud rate and OSDP address, or you will scan for it.<\/li>\n<li>The firmware file (<code>.bin<\/code>, up to 10 MB) is on your PC or in the firmware library. See <a href=\"#a070\">070<\/a>.<\/li>\n<li>No other firmware upload is running. Only one runs at a time.<\/li>\n<\/ul>\n<p class=\"caution\"><strong>Caution:<\/strong> This writes new firmware to a real reader. Use the file the manufacturer gave you for that model, and do not cut power to the reader during the upload.<\/p>\n<h2>Pick the targets<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and click the <strong>Firmware<\/strong> tab.<\/li>\n<li>In <strong>Targets<\/strong>, pick a configured reader, or enter the port, baud and address.<\/li>\n<li>If you do not know the address, open <strong>Scan the bus<\/strong>, pick the port and baud, and click <strong>Scan addresses 0–15<\/strong>.<\/li>\n<\/ol>\n<h2>Identify the reader<\/h2>\n<ol>\n<li>Run <strong>Identify<\/strong>.<\/li>\n<li>Check the vendor, model, serial and firmware version.<\/li>\n<li>Check that the reader lists file transfer in its capabilities. If it does not, it cannot take firmware over OSDP.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Identify step showing vendor code, model, firmware version and capabilities<\/span><\/div>\n<h2>Pick the firmware<\/h2>\n<ol>\n<li>In <strong>Firmware<\/strong>, pick a library file or a file from your PC, and check its name and version.<\/li>\n<\/ol>\n<h2>Confirm and flash<\/h2>\n<ol>\n<li>In <strong>Confirm &amp; flash<\/strong>, read the summary.<\/li>\n<li>Type the confirmation phrase the wizard shows, for example <code>FLASH 1 READER<\/code>.<\/li>\n<li>Click <strong>Begin batch flash<\/strong>.<\/li>\n<li>Watch the progress bar: percent, fragment count, time elapsed and time left.<\/li>\n<li>Wait until each reader shows <strong>✓ Flashed<\/strong>.<\/li>\n<\/ol>\n<p>While the upload runs, Aether takes the serial port from reader emulation and gives it back after.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Upload in progress at 22 %, fragment 122/546, with the live trace panel below<\/span><\/div>\n<h2>Use the live trace<\/h2>\n<ul>\n<li>Pick a view: <strong>All frames<\/strong>, <strong>Compact<\/strong> or <strong>Anomalies &amp; notes<\/strong>. Click a row to see its hex.<\/li>\n<li>Type a marker, such as \"LED went solid red\", to stamp it into the trace.<\/li>\n<li>Add a technician name and notes for the manufacturer.<\/li>\n<li>After the upload, download the <strong>Manufacturer bundle (.zip)<\/strong>. It holds a report, a standard <code>.osdpcap<\/code> capture, a CSV and metadata.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The reader shows <strong>✓ Flashed<\/strong>.<\/li>\n<li>Run <strong>Identify<\/strong> again; the firmware version is the new one.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>You need to stop<\/td>\n<td>Click <strong>Abort batch<\/strong> and confirm. The port goes back to emulation. Run <strong>Identify<\/strong>; if the reader does not answer, power-cycle it and identify again.<\/td>\n<\/tr>\n<tr>\n<td>Port in use<\/td>\n<td>Another tool holds the port. See <a href=\"#a097\">097<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Upload fails or stalls<\/td>\n<td>Check the anomalies view and export the bundle. See <a href=\"#a098\">098<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a070\">070 Manage the reader firmware library<\/a><\/li>\n<li><a href=\"#a071\">071 Change a reader's OSDP address or baud (COMSET)<\/a><\/li>\n<li><a href=\"#a019\">019 Export an OSDP trace for a manufacturer<\/a><\/li>\n<li><a href=\"#a063\">063 Send reader firmware or config through a controller<\/a><\/li>\n<li><a href=\"#a098\">098 Reader firmware upload fails or stalls<\/a><\/li>\n<\/ul>", "text": "update osdp reader firmware (firmware wizard) shows how to push a firmware file to one or more real osdp readers with the firmware wizard on readers > osdp > firmware, and how to read the live trace.  summary the firmware wizard on readers › osdp › firmware sends a firmware file to real osdp readers over rs-485, using osdp file transfer. the wizard has four steps: targets , identify , firmware and confirm & flash . every upload is traced byte by byte. before you start the reader is wired to an rs-485 port on the pi and powered. you know the reader's port, baud rate and osdp address, or you will scan for it. the firmware file ( .bin , up to 10 mb) is on your pc or in the firmware library. see 070 . no other firmware upload is running. only one runs at a time. caution: this writes new firmware to a real reader. use the file the manufacturer gave you for that model, and do not cut power to the reader during the upload. pick the targets open readers › osdp and click the firmware tab. in targets , pick a configured reader, or enter the port, baud and address. if you do not know the address, open scan the bus , pick the port and baud, and click scan addresses 0–15 . identify the reader run identify . check the vendor, model, serial and firmware version. check that the reader lists file transfer in its capabilities. if it does not, it cannot take firmware over osdp. screenshot to add: identify step showing vendor code, model, firmware version and capabilities pick the firmware in firmware , pick a library file or a file from your pc, and check its name and version. confirm and flash in confirm & flash , read the summary. type the confirmation phrase the wizard shows, for example flash 1 reader . click begin batch flash . watch the progress bar: percent, fragment count, time elapsed and time left. wait until each reader shows ✓ flashed . while the upload runs, aether takes the serial port from reader emulation and gives it back after. screenshot to add: upload in progress at 22 %, fragment 122/546, with the live trace panel below use the live trace pick a view: all frames , compact or anomalies & notes . click a row to see its hex. type a marker, such as \"led went solid red\", to stamp it into the trace. add a technician name and notes for the manufacturer. after the upload, download the manufacturer bundle (.zip) . it holds a report, a standard .osdpcap capture, a csv and metadata. check that it worked the reader shows ✓ flashed . run identify again; the firmware version is the new one. if something goes wrong symptom what to do you need to stop click abort batch and confirm. the port goes back to emulation. run identify ; if the reader does not answer, power-cycle it and identify again. port in use another tool holds the port. see 097 . upload fails or stalls check the anomalies view and export the bundle. see 098 . related articles 070 manage the reader firmware library 071 change a reader's osdp address or baud (comset) 019 export an osdp trace for a manufacturer 063 send reader firmware or config through a controller 098 reader firmware upload fails or stalls "}, {"id": "a070", "num": "070", "title": "Manage the reader firmware library", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "Shows how to add, check and remove reader firmware files in Aether's firmware library, which the Firmware wizard and the SUNAPI Console use.", "sources": ["OSDP firmware upload logger", "OSDP Trace tool app", "frontend/src/components/OSDPFirmwareWizard.tsx (2026-09-20 source)", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>The reader firmware library keeps firmware files on the Pi, with the model, version and notes for each. The Firmware wizard and the SUNAPI Console's reader firmware panel can then pick a file from the library instead of uploading it from your PC each time.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have the firmware file from the reader's manufacturer: a <code>.bin<\/code>, up to 10 MB.<\/li>\n<li>You know the reader model and firmware version the file is for.<\/li>\n<\/ul>\n<h2>Add a file to the library<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and click the <strong>Firmware<\/strong> tab.<\/li>\n<li>In the wizard's <strong>Firmware<\/strong> step, select <strong>Upload .bin<\/strong>.<\/li>\n<li>Click the drop area and pick the file from your PC, or drag it there.<\/li>\n<li>Tick <strong>Also save this firmware to the library<\/strong>.<\/li>\n<li>Enter the <strong>Model<\/strong> the file is for.<\/li>\n<li>Enter the <strong>Version<\/strong>.<\/li>\n<li>Add <strong>Notes<\/strong>, for example where the file came from or what it fixes.<\/li>\n<li>Click <strong>Continue<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Firmware step, Upload .bin tab with the library box ticked and Model, Version and Notes filled in<\/span><\/div>\n<p>The same file can't be added twice.<\/p>\n<h2>Check what is in the library<\/h2>\n<p>The <strong>Firmware library<\/strong> tab in the wizard's <strong>Firmware<\/strong> step lists, for each file:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>File name<\/td>\n<td>The name of the <code>.bin<\/code><\/td>\n<\/tr>\n<tr>\n<td>Model<\/td>\n<td>The reader model you entered, or \"no model\"<\/td>\n<\/tr>\n<tr>\n<td>Version<\/td>\n<td>The firmware version you entered, or \"no version\"<\/td>\n<\/tr>\n<tr>\n<td>Size<\/td>\n<td>File size<\/td>\n<\/tr>\n<tr>\n<td>sha<\/td>\n<td>The start of the file's checksum<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Use a library file<\/h2>\n<ol>\n<li>In the Firmware wizard's <strong>Firmware<\/strong> step, click <strong>Select<\/strong> next to the file.<\/li>\n<li>In the SUNAPI Console's reader firmware panel, pick it from the same list. See <a href=\"#a063\">063<\/a>.<\/li>\n<\/ol>\n<h2>Remove a file<\/h2>\n<ol>\n<li>Find the file in the <strong>Firmware library<\/strong> list.<\/li>\n<li>Click <strong>×<\/strong> (<strong>Remove from library<\/strong>) next to it.<\/li>\n<li>Confirm.<\/li>\n<\/ol>\n<p>Removing a file does not change any reader. It only removes the stored copy from the Pi.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>A new file shows in the list with the model and version you entered.<\/li>\n<li>The wizard's <strong>Firmware<\/strong> step lists the same file.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Library is empty\"<\/td>\n<td>Add the file here first, or choose a file from your PC in that tool.<\/td>\n<\/tr>\n<tr>\n<td>Wrong model or version on an entry<\/td>\n<td>Remove the entry and add the file again with the right details.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a063\">063 Send reader firmware or config through a controller<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<\/ul>", "text": "manage the reader firmware library shows how to add, check and remove reader firmware files in aether's firmware library, which the firmware wizard and the sunapi console use.  summary the reader firmware library keeps firmware files on the pi, with the model, version and notes for each. the firmware wizard and the sunapi console's reader firmware panel can then pick a file from the library instead of uploading it from your pc each time. before you start you have the firmware file from the reader's manufacturer: a .bin , up to 10 mb. you know the reader model and firmware version the file is for. add a file to the library open readers › osdp and click the firmware tab. in the wizard's firmware step, select upload .bin . click the drop area and pick the file from your pc, or drag it there. tick also save this firmware to the library . enter the model the file is for. enter the version . add notes , for example where the file came from or what it fixes. click continue . screenshot to add: firmware step, upload .bin tab with the library box ticked and model, version and notes filled in the same file can't be added twice. check what is in the library the firmware library tab in the wizard's firmware step lists, for each file: item what it shows file name the name of the .bin model the reader model you entered, or \"no model\" version the firmware version you entered, or \"no version\" size file size sha the start of the file's checksum use a library file in the firmware wizard's firmware step, click select next to the file. in the sunapi console's reader firmware panel, pick it from the same list. see 063 . remove a file find the file in the firmware library list. click × ( remove from library ) next to it. confirm. removing a file does not change any reader. it only removes the stored copy from the pi. check that it worked a new file shows in the list with the model and version you entered. the wizard's firmware step lists the same file. if something goes wrong symptom what to do \"library is empty\" add the file here first, or choose a file from your pc in that tool. wrong model or version on an entry remove the entry and add the file again with the right details. related articles 069 update osdp reader firmware (firmware wizard) 063 send reader firmware or config through a controller 072 system & backup: health, backup and restore "}, {"id": "a071", "num": "071", "title": "Change a reader's OSDP address or baud (COMSET)", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Shows how to change a real OSDP reader's address and baud rate with the Address & baud (COMSET) panel on Readers > OSDP > Firmware, and how to read the result.", "sources": ["OSDP Trace tool app"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Address &amp; baud (COMSET)<\/strong> panel sends the standard OSDP COMSET command to a real reader to change its address, its baud rate, or both. Aether then checks the reader at the new settings and tells you plainly whether it changed. These are the only two settings COMSET can change.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The reader is wired to an RS-485 port on the Pi and powered.<\/li>\n<li>You know the reader's current port, baud and address. If you do not know the address, only that one reader may be on the wire.<\/li>\n<li>No firmware upload is running. The panel refuses during an upload.<\/li>\n<\/ul>\n<p class=\"caution\"><strong>Caution:<\/strong> This writes to a real reader. After the change, any controller that talks to this reader must use the new address and baud.<\/p>\n<h2>Open the panel and identify the reader<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and click the <strong>Firmware<\/strong> tab.<\/li>\n<li>Scroll to <strong>Address &amp; baud (COMSET)<\/strong>, below the upload wizard.<\/li>\n<li>Pick the reader's port, current baud and current address.<\/li>\n<li>Click <strong>Identify<\/strong> and check the vendor and serial, so you know it is the right reader.<\/li>\n<\/ol>\n<p>If you do not know the address, tick the broadcast option (address 127). Use it only with one reader on the wire; every reader answers broadcast.<\/p>\n<h2>Set and send the new values<\/h2>\n<ol>\n<li>Pick the new address, from 0 to 126.<\/li>\n<li>Pick the new baud: 9600, 19200, 38400, 57600, 115200 or 230400. To change only the address, keep the current baud.<\/li>\n<li>Check the frame preview. It shows the exact bytes Aether will send, with the CRC.<\/li>\n<li>Confirm on the page. <span class=\"sme\">confirm the confirm button label<\/span><\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: COMSET panel with new address and baud set, frame preview and the confirm step<\/span><\/div>\n<p>Aether sends a POLL, then COMSET, and reads the reader's reply. The reader answers from its old address, then switches. It then polls the reader at the new settings, and at the old ones if that fails.<\/p>\n<h2>Read the result<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Result<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Changed<\/strong><\/td>\n<td>The reader answers at the new address and baud<\/td>\n<\/tr>\n<tr>\n<td><strong>Changed to something else<\/strong><\/td>\n<td>The reader reported different values, for example a baud it supports. Use the values shown<\/td>\n<\/tr>\n<tr>\n<td><strong>Refused<\/strong><\/td>\n<td>The reader sent a NAK. The panel shows the reason; NAK 0x06 means it needs secure channel first<\/td>\n<\/tr>\n<tr>\n<td><strong>Not changed<\/strong><\/td>\n<td>The reader still answers at the old settings<\/td>\n<\/tr>\n<tr>\n<td><strong>Lost<\/strong><\/td>\n<td>The reader answers at neither the old nor the new settings<\/td>\n<\/tr>\n<tr>\n<td><strong>No reader<\/strong><\/td>\n<td>Nothing answered before the change<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The panel also lists every byte sent and received, and the changes made in this session. After a change, the reader fields follow the reader.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The result is <strong>Changed<\/strong>.<\/li>\n<li>Power-cycle the reader once and run <strong>Identify<\/strong> at the new settings. Keeping settings after a power cycle is only recommended by the OSDP standard, not required.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lost<\/strong><\/td>\n<td>Scan the port at each baud rate, or power-cycle the reader and try its old settings.<\/td>\n<\/tr>\n<tr>\n<td><strong>Refused<\/strong> with NAK 0x06<\/td>\n<td>The reader needs a secure session for COMSET.<\/td>\n<\/tr>\n<tr>\n<td>The emulated readers don't change<\/td>\n<td>This panel is for real readers. To change an emulated reader, edit it in <strong>Bus &amp; readers<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a069\">069 Update OSDP reader firmware (Firmware wizard)<\/a><\/li>\n<li><a href=\"#a013\">013 Add, edit and import OSDP readers (Bus &amp; readers)<\/a><\/li>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "change a reader's osdp address or baud (comset) shows how to change a real osdp reader's address and baud rate with the address & baud (comset) panel on readers > osdp > firmware, and how to read the result.  summary the address & baud (comset) panel sends the standard osdp comset command to a real reader to change its address, its baud rate, or both. aether then checks the reader at the new settings and tells you plainly whether it changed. these are the only two settings comset can change. before you start the reader is wired to an rs-485 port on the pi and powered. you know the reader's current port, baud and address. if you do not know the address, only that one reader may be on the wire. no firmware upload is running. the panel refuses during an upload. caution: this writes to a real reader. after the change, any controller that talks to this reader must use the new address and baud. open the panel and identify the reader open readers › osdp and click the firmware tab. scroll to address & baud (comset) , below the upload wizard. pick the reader's port, current baud and current address. click identify and check the vendor and serial, so you know it is the right reader. if you do not know the address, tick the broadcast option (address 127). use it only with one reader on the wire; every reader answers broadcast. set and send the new values pick the new address, from 0 to 126. pick the new baud: 9600, 19200, 38400, 57600, 115200 or 230400. to change only the address, keep the current baud. check the frame preview. it shows the exact bytes aether will send, with the crc. confirm on the page. confirm the confirm button label screenshot to add: comset panel with new address and baud set, frame preview and the confirm step aether sends a poll, then comset, and reads the reader's reply. the reader answers from its old address, then switches. it then polls the reader at the new settings, and at the old ones if that fails. read the result result meaning changed the reader answers at the new address and baud changed to something else the reader reported different values, for example a baud it supports. use the values shown refused the reader sent a nak. the panel shows the reason; nak 0x06 means it needs secure channel first not changed the reader still answers at the old settings lost the reader answers at neither the old nor the new settings no reader nothing answered before the change the panel also lists every byte sent and received, and the changes made in this session. after a change, the reader fields follow the reader. check that it worked the result is changed . power-cycle the reader once and run identify at the new settings. keeping settings after a power cycle is only recommended by the osdp standard, not required. if something goes wrong symptom what to do lost scan the port at each baud rate, or power-cycle the reader and try its old settings. refused with nak 0x06 the reader needs a secure session for comset. the emulated readers don't change this panel is for real readers. to change an emulated reader, edit it in bus & readers . related articles 069 update osdp reader firmware (firmware wizard) 013 add, edit and import osdp readers (bus & readers) 014 assign a serial interface and baud rate 096 an osdp reader doesn't answer "}, {"id": "a072", "num": "072", "title": "System & Backup: health, backup and restore", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "Shows how to read the Pi's health on Setup > System & Backup and how to download and restore a backup of every Aether setting. For anyone looking after a kit.", "sources": ["Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong> shows the Pi's live health: CPU, memory, temperature, storage, USB devices, serial adapters, services and the IOplus HAT. It also lets you download one backup file with every Aether setting, and restore it on the same or another Pi.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is open in your browser.<\/li>\n<\/ul>\n<h2>Check the Pi's health<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong>. The page refreshes every 5 s while open.<\/li>\n<li>Read the headline tiles: CPU, memory, temperature, storage, USB devices and uptime.<\/li>\n<li>Check per-core CPU and its history line for one core running high.<\/li>\n<li>Check the USB and serial adapter lists. Each RS-485 adapter is listed by name.<\/li>\n<li>Check the IOplus HAT's hardware and firmware version and the I2C bus health.<\/li>\n<li>Look for power or heat throttle warnings.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: System &amp; Backup headline tiles and the USB/serial adapter list<\/span><\/div>\n<h2>Download a backup<\/h2>\n<ol>\n<li>Click <strong>Download backup<\/strong>.<\/li>\n<li>Save the file. It is named like <code>aether-backup-&lt;host&gt;-&lt;date&gt;.json<\/code>.<\/li>\n<\/ol>\n<p>The file holds every Aether config file on the Pi plus this browser's settings. The page says how many of each it saved. The HTTPS token and certificate keys are not included.<\/p>\n<h2>Restore a backup<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Restore replaces the Pi's Aether settings (doors, readers, I/O mapping and more) and needs a backend restart. Stop any running test first.<\/p>\n<ol>\n<li>Click <strong>Restore<\/strong> and pick a backup file. <span class=\"sme\">confirm the restore button label<\/span><\/li>\n<li>Check what the page says it will restore: the number of files and browser settings.<\/li>\n<li>Confirm the restore.<\/li>\n<li>Read the message. It names the copy of the old settings it kept on the Pi.<\/li>\n<li>Click <strong>Restart now<\/strong> to restart the backend.<\/li>\n<li>Wait for the page to reload, about 8 s.<\/li>\n<\/ol>\n<p>An older I/O-only export can also be restored; the page reloads after it.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>After the restart, doors, readers and I/O mapping match the backup.<\/li>\n<li>The health tiles update again every 5 s.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"not an Aether backup\"<\/td>\n<td>The file is not an Aether backup. Pick a file from <strong>Download backup<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>You want the old settings back<\/td>\n<td>Restore keeps a copy of what it replaced on the Pi. <span class=\"sme\">confirm how to restore that kept copy from the page<\/span><\/td>\n<\/tr>\n<tr>\n<td>One CPU core runs high<\/td>\n<td>See <a href=\"#a095\">095<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>HAT or I2C shows a problem<\/td>\n<td>See <a href=\"#a094\">094<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a067\">067 Update history, restore and automatic rollback<\/a><\/li>\n<li><a href=\"#a073\">073 Change the Pi's network settings with rollback<\/a><\/li>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<li><a href=\"#a031\">031 Save door settings so they survive a reboot<\/a><\/li>\n<\/ul>", "text": "system & backup: health, backup and restore shows how to read the pi's health on setup > system & backup and how to download and restore a backup of every aether setting. for anyone looking after a kit.  summary setup › system & backup shows the pi's live health: cpu, memory, temperature, storage, usb devices, serial adapters, services and the ioplus hat. it also lets you download one backup file with every aether setting, and restore it on the same or another pi. before you start aether is open in your browser. check the pi's health open setup › system & backup . the page refreshes every 5 s while open. read the headline tiles: cpu, memory, temperature, storage, usb devices and uptime. check per-core cpu and its history line for one core running high. check the usb and serial adapter lists. each rs-485 adapter is listed by name. check the ioplus hat's hardware and firmware version and the i2c bus health. look for power or heat throttle warnings. screenshot to add: system & backup headline tiles and the usb/serial adapter list download a backup click download backup . save the file. it is named like aether-backup-<host>-<date>.json . the file holds every aether config file on the pi plus this browser's settings. the page says how many of each it saved. the https token and certificate keys are not included. restore a backup caution: restore replaces the pi's aether settings (doors, readers, i/o mapping and more) and needs a backend restart. stop any running test first. click restore and pick a backup file. confirm the restore button label check what the page says it will restore: the number of files and browser settings. confirm the restore. read the message. it names the copy of the old settings it kept on the pi. click restart now to restart the backend. wait for the page to reload, about 8 s. an older i/o-only export can also be restored; the page reloads after it. check that it worked after the restart, doors, readers and i/o mapping match the backup. the health tiles update again every 5 s. if something goes wrong symptom what to do \"not an aether backup\" the file is not an aether backup. pick a file from download backup . you want the old settings back restore keeps a copy of what it replaced on the pi. confirm how to restore that kept copy from the page one cpu core runs high see 095 . hat or i2c shows a problem see 094 . related articles 067 update history, restore and automatic rollback 073 change the pi's network settings with rollback 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters 031 save door settings so they survive a reboot "}, {"id": "a073", "num": "073", "title": "Change the Pi's network settings with rollback", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Shows how to change the Pi's hostname, DHCP or static address on Setup > Network, and how the 90 s Keep rollback protects you from losing access.", "sources": ["Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>Network<\/strong> changes the Pi's hostname and its address: automatic (DHCP) or static. The change goes through NetworkManager. After you apply it, you have 90 s to press <strong>Keep these settings<\/strong> from the new address, or the Pi switches back to the old settings by itself.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You know the new address, subnet, gateway and DNS server if you are setting a static address.<\/li>\n<li>Your PC will be able to reach the new address.<\/li>\n<li>No test is running.<\/li>\n<\/ul>\n<p class=\"caution\"><strong>Caution:<\/strong> Applying network settings drops the Pi's connection for a few seconds. Reader emulation, OSDP polling and cluster links to this Pi pause while it switches.<\/p>\n<h2>Check the current settings<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>Network<\/strong>.<\/li>\n<li>Read <strong>Current status<\/strong>: hostname, <strong>Managed by<\/strong>, connection, <strong>Address mode<\/strong>, and each interface with its address.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Network page with Current status on the left and Change settings on the right<\/span><\/div>\n<h2>Change the settings<\/h2>\n<ol>\n<li>In <strong>Change settings<\/strong>, check <strong>Hostname<\/strong>. Change it only if needed.<\/li>\n<li>Pick the <strong>Interface<\/strong>, for example <code>eth0<\/code>.<\/li>\n<li>Under <strong>Address<\/strong>, pick <strong>Automatic (DHCP)<\/strong> or <strong>Static<\/strong>.<\/li>\n<li>For <strong>Static<\/strong>, enter <strong>IP address<\/strong> (<code>&lt;new-ip&gt;<\/code>), pick the <strong>Subnet<\/strong>, and enter <strong>Gateway<\/strong> and DNS.<\/li>\n<li>Click <strong>Apply<\/strong>.<\/li>\n<li>Read the summary: the new address mode, the new hostname if changed, and the 90 s warning.<\/li>\n<li>Click <strong>Apply<\/strong> in the summary to go ahead, or <strong>Cancel<\/strong>.<\/li>\n<\/ol>\n<h2>Keep the new settings<\/h2>\n<ol>\n<li>Open Aether at the new address, for example <code>http://&lt;new-ip&gt;:3001<\/code>.<\/li>\n<li>Go to <strong class=\"path\">Setup<i>›<\/i>Network<\/strong>. A banner counts down the seconds left.<\/li>\n<li>Click <strong>Keep these settings<\/strong> before the countdown ends.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Banner with the rollback countdown and the Keep these settings button<\/span><\/div>\n<p>If you do nothing, the Pi goes back to the old settings when 90 s are up.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The banner is gone and <strong>Current status<\/strong> shows the new address and mode.<\/li>\n<li>With DHCP, the address may change later; the page says so.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cannot reach the new address<\/td>\n<td>Wait 90 s. The Pi switches back; open the old address. See <a href=\"#a101\">101<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>\"This Pi doesn't use NetworkManager\"<\/td>\n<td>Settings cannot be applied from this page on this Pi.<\/td>\n<\/tr>\n<tr>\n<td>\"The network helper isn't installed\"<\/td>\n<td><strong>Apply<\/strong> is off until the Aether update that adds it is installed. See <a href=\"#a066\">066<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>HTTPS name points to the old address<\/td>\n<td>The Pi updates its DNS record within about 10 min.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a101\">101 Lost access after a network change<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<\/ul>", "text": "change the pi's network settings with rollback shows how to change the pi's hostname, dhcp or static address on setup > network, and how the 90 s keep rollback protects you from losing access.  summary setup › network changes the pi's hostname and its address: automatic (dhcp) or static. the change goes through networkmanager. after you apply it, you have 90 s to press keep these settings from the new address, or the pi switches back to the old settings by itself. before you start you know the new address, subnet, gateway and dns server if you are setting a static address. your pc will be able to reach the new address. no test is running. caution: applying network settings drops the pi's connection for a few seconds. reader emulation, osdp polling and cluster links to this pi pause while it switches. check the current settings open setup › network . read current status : hostname, managed by , connection, address mode , and each interface with its address. screenshot to add: network page with current status on the left and change settings on the right change the settings in change settings , check hostname . change it only if needed. pick the interface , for example eth0 . under address , pick automatic (dhcp) or static . for static , enter ip address ( <new-ip> ), pick the subnet , and enter gateway and dns. click apply . read the summary: the new address mode, the new hostname if changed, and the 90 s warning. click apply in the summary to go ahead, or cancel . keep the new settings open aether at the new address, for example http://<new-ip>:3001 . go to setup › network . a banner counts down the seconds left. click keep these settings before the countdown ends. screenshot to add: banner with the rollback countdown and the keep these settings button if you do nothing, the pi goes back to the old settings when 90 s are up. check that it worked the banner is gone and current status shows the new address and mode. with dhcp, the address may change later; the page says so. if something goes wrong symptom what to do cannot reach the new address wait 90 s. the pi switches back; open the old address. see 101 . \"this pi doesn't use networkmanager\" settings cannot be applied from this page on this pi. \"the network helper isn't installed\" apply is off until the aether update that adds it is installed. see 066 . https name points to the old address the pi updates its dns record within about 10 min. related articles 101 lost access after a network change 072 system & backup: health, backup and restore 007 set up https and a domain name 003 open aether in a browser "}, {"id": "a074", "num": "074", "title": "Keep Board Blueprints up to date", "area": "Firmware, updates and system", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "Shows how to install a Board Blueprints update through Device Firmware, in the right order with Aether updates, and what its installer checks.", "sources": ["Aether Board and Wiring tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Board Blueprints ships as its own update file, <code>aether-update-blueprints-&lt;date&gt;.zip<\/code>. You install it on <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> like any Aether update. Install Aether updates first, then Blueprints. The installer keeps the page in Aether's Dark/Light theme.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have the newest Blueprints file.<\/li>\n<li>Every Aether update you plan to install is already installed. See <a href=\"#a068\">068 Install order and named update bundles<\/a>.<\/li>\n<\/ul>\n<h2>Install the Blueprints update<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong>.<\/li>\n<li>Drop <code>aether-update-blueprints-&lt;date&gt;.zip<\/code> on <strong>Update bundle<\/strong>.<\/li>\n<li>Check what the page says the update will do.<\/li>\n<li>Click <strong>Apply<\/strong>.<\/li>\n<li>Watch the log until the result line.<\/li>\n<li>Press Ctrl+Shift+R.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Device Firmware log of a Blueprints update ending with the page version line<\/span><\/div>\n<h2>What the installer does<\/h2>\n<ol>\n<li>It stops without changing anything if another update left a newer Blueprints page with features this file lacks. Installing it would remove them.<\/li>\n<li>It copies the new page into Aether.<\/li>\n<li>It applies Aether's theme so the page follows Dark/Light.<\/li>\n<li>It updates the page version so browsers load the new page.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Open <strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>.<\/li>\n<li>The page shows the new features and follows the theme toggle.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The installer stops and says the page has functions this one lacks<\/td>\n<td>Another update shipped a newer Blueprints page. Ask for a Blueprints build made on top of it.<\/td>\n<\/tr>\n<tr>\n<td>A later Aether update stops on a changed file<\/td>\n<td>Blueprints changed one line in that file. Ask for the Aether update to be rebuilt.<\/td>\n<\/tr>\n<tr>\n<td>The page still looks old<\/td>\n<td>Press Ctrl+Shift+R. See <a href=\"#a093\">093<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>The page lost the OnCAFE sign-in form<\/td>\n<td>An older Blueprints file was installed over a newer page. Reinstall the update that added sign-in, or a newer Blueprints build. <span class=\"sme\">confirm which current update carries the OnCAFE sign-in page<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<li><a href=\"#a066\">066 Install an Aether update (Device Firmware)<\/a><\/li>\n<li><a href=\"#a068\">068 Install order and named update bundles<\/a><\/li>\n<li><a href=\"#a067\">067 Update history, restore and automatic rollback<\/a><\/li>\n<\/ul>", "text": "keep board blueprints up to date shows how to install a board blueprints update through device firmware, in the right order with aether updates, and what its installer checks.  summary board blueprints ships as its own update file, aether-update-blueprints-<date>.zip . you install it on setup › device firmware like any aether update. install aether updates first, then blueprints. the installer keeps the page in aether's dark/light theme. before you start you have the newest blueprints file. every aether update you plan to install is already installed. see 068 install order and named update bundles . install the blueprints update open setup › device firmware . drop aether-update-blueprints-<date>.zip on update bundle . check what the page says the update will do. click apply . watch the log until the result line. press ctrl+shift+r. screenshot to add: device firmware log of a blueprints update ending with the page version line what the installer does it stops without changing anything if another update left a newer blueprints page with features this file lacks. installing it would remove them. it copies the new page into aether. it applies aether's theme so the page follows dark/light. it updates the page version so browsers load the new page. check that it worked open integrations › board blueprints . the page shows the new features and follows the theme toggle. if something goes wrong symptom what to do the installer stops and says the page has functions this one lacks another update shipped a newer blueprints page. ask for a blueprints build made on top of it. a later aether update stops on a changed file blueprints changed one line in that file. ask for the aether update to be rebuilt. the page still looks old press ctrl+shift+r. see 093 . the page lost the oncafe sign-in form an older blueprints file was installed over a newer page. reinstall the update that added sign-in, or a newer blueprints build. confirm which current update carries the oncafe sign-in page related articles 076 what board blueprints does 066 install an aether update (device firmware) 068 install order and named update bundles 067 update history, restore and automatic rollback "}, {"id": "a075", "num": "075", "title": "Use the OnCAFE Console builder", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to open the OnCAFE Console in Aether, pick a task, set it up and copy the script it builds. For OnCAFE engineers, T/S and QA who script work in an OnCAFE organization.", "sources": ["Resistor calibration tool", "Export Figma GUI guidelines"], "html": "<h2>Summary<\/h2>\n<p>The OnCAFE Console is a script builder for the OnCAFE cloud. You pick a task, fill in its options, and the page builds a helper script that runs inside the OnCAFE web app. Use it when you need to repeat a job across many items, such as listing devices or provisioning identities, instead of clicking through OnCAFE by hand.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is open in a browser. See <a href=\"#a003\">003 Open Aether in a browser<\/a>.<\/li>\n<li>You can sign in to the OnCAFE organization you want to work in, in another browser tab.<\/li>\n<li>You know which organization the work is for. Scripts act on whatever organization that OnCAFE tab is signed in to.<\/li>\n<\/ul>\n<h2>Open the builder<\/h2>\n<ol>\n<li>In the sidebar, click <strong class=\"path\">Tools<i>›<\/i>OnCAFE Console<\/strong>.<\/li>\n<li>Wait for the <strong>Pick a task<\/strong> screen. It shows six task cards.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: OnCAFE Console home screen with the six &quot;Pick a task&quot; cards<\/span><\/div>\n<ol start=\"3\">\n<li>To see every action instead of the six tasks, click <strong>Full builder<\/strong>. Its menu groups actions under <strong>Discover<\/strong>, <strong>Operations<\/strong>, <strong>Provision<\/strong>, <strong>Reports<\/strong>, <strong>System<\/strong>, <strong>Devices<\/strong>, <strong>Identities<\/strong> and <strong>Organization<\/strong>.<\/li>\n<\/ol>\n<h2>Build and run a script<\/h2>\n<ol>\n<li>Click the task or action you want.<\/li>\n<li>Fill in its fields. Choose between <strong>Console<\/strong> and <strong>API<\/strong> with the switch at the top of the action. <span class=\"sme\">confirm what the Console / API switch changes in the generated script.<\/span><\/li>\n<li>Set <strong>Parallel workers<\/strong> if the action offers it. <span class=\"sme\">confirm what Parallel workers controls and a safe default.<\/span><\/li>\n<li>Check the connection settings under <strong>Connection<\/strong>. <span class=\"sme\">confirm which fields Connection holds.<\/span><\/li>\n<li>Click <strong>Copy script<\/strong>. To keep a copy, click <strong>Save .js<\/strong> instead.<\/li>\n<li>Go to your signed-in OnCAFE tab and paste the script into the browser's developer console. <span class=\"sme\">confirm the script is run from the browser DevTools console of a signed-in OnCAFE tab.<\/span><\/li>\n<li>Press Enter and watch the console output until the script finishes.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> Scripts under <strong>Provision<\/strong>, <strong>Identities<\/strong>, <strong>Devices<\/strong> and <strong>Organization<\/strong> can change a real OnCAFE organization. Check which organization the OnCAFE tab is signed in to before you run one, and try new scripts on a test organization first.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The console in the OnCAFE tab shows the script's progress and a finish message.<\/li>\n<li>For actions that change data, the changes appear in OnCAFE after you reload its page.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The builder looks like an older version, or <strong>Parallel workers<\/strong> and <strong>Save .js<\/strong> are missing<\/td>\n<td>The browser is showing a cached copy. See <a href=\"#a093\">093 A tool page still shows the old version<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>The page is blank<\/td>\n<td>Reload with Ctrl+Shift+R. If it stays blank, see <a href=\"#a092\">092 Aether won't load or shows Backend offline<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>The script stops with a sign-in or permission error<\/td>\n<td>Sign in to OnCAFE again in that tab, with an account that has the needed role, and run it again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a081\">081 Read an OnCAFE site into Blueprints<\/a><\/li>\n<li><a href=\"#a093\">093 A tool page still shows the old version<\/a><\/li>\n<\/ul>", "text": "use the oncafe console builder how to open the oncafe console in aether, pick a task, set it up and copy the script it builds. for oncafe engineers, t/s and qa who script work in an oncafe organization.  summary the oncafe console is a script builder for the oncafe cloud. you pick a task, fill in its options, and the page builds a helper script that runs inside the oncafe web app. use it when you need to repeat a job across many items, such as listing devices or provisioning identities, instead of clicking through oncafe by hand. before you start aether is open in a browser. see 003 open aether in a browser . you can sign in to the oncafe organization you want to work in, in another browser tab. you know which organization the work is for. scripts act on whatever organization that oncafe tab is signed in to. open the builder in the sidebar, click tools › oncafe console . wait for the pick a task screen. it shows six task cards. screenshot to add: oncafe console home screen with the six \"pick a task\" cards to see every action instead of the six tasks, click full builder . its menu groups actions under discover , operations , provision , reports , system , devices , identities and organization . build and run a script click the task or action you want. fill in its fields. choose between console and api with the switch at the top of the action. confirm what the console / api switch changes in the generated script. set parallel workers if the action offers it. confirm what parallel workers controls and a safe default. check the connection settings under connection . confirm which fields connection holds. click copy script . to keep a copy, click save .js instead. go to your signed-in oncafe tab and paste the script into the browser's developer console. confirm the script is run from the browser devtools console of a signed-in oncafe tab. press enter and watch the console output until the script finishes. caution: scripts under provision , identities , devices and organization can change a real oncafe organization. check which organization the oncafe tab is signed in to before you run one, and try new scripts on a test organization first. check that it worked the console in the oncafe tab shows the script's progress and a finish message. for actions that change data, the changes appear in oncafe after you reload its page. if something goes wrong symptom what to do the builder looks like an older version, or parallel workers and save .js are missing the browser is showing a cached copy. see 093 a tool page still shows the old version . the page is blank reload with ctrl+shift+r. if it stays blank, see 092 aether won't load or shows backend offline . the script stops with a sign-in or permission error sign in to oncafe again in that tab, with an account that has the needed role, and run it again. related articles 004 find your way around: sidebar, page tabs, last page 081 read an oncafe site into blueprints 093 a tool page still shows the old version "}, {"id": "a076", "num": "076", "title": "What Board Blueprints does", "area": "Tools", "type": "Concept", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Explains what Board Blueprint Studio is, its five views and three workspaces, and how it fits with Aether and OnCAFE. For anyone who draws, checks or supports access-control panels.", "sources": ["Aether Board and Wiring tool", "Aether features presentation", "Blueprint tool automation"], "html": "<h2>Summary<\/h2>\n<p>Board Blueprint Studio (Board Blueprints) draws access-control panels from a library of real boards and parts. One project holds the board layouts, wiring, site riser, floor plan and enclosure, and it checks power, voltage drop and fit as you work. Use it to plan a bench or site, hand a wiring sheet to an installer, or trace a problem on an installed site.<\/p>\n<h2>Where to find it<\/h2>\n<p>In Aether, open <strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>. Its subtitle reads \"Powered by HYDRA\". It also runs outside Aether from a shared launcher file, <code>Board-Blueprints.html<\/code>, which loads the current release over the internet.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Board Blueprints open in Aether in the Building workspace, with the path bar visible<\/span><\/div>\n<h2>Five views<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>View<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Layout<\/strong><\/td>\n<td>Each board's terminals, ports, LEDs and parts at real size.<\/td>\n<\/tr>\n<tr>\n<td><strong>Wiring<\/strong><\/td>\n<td>Doors, readers, locks and supplies wired to a board, with cables and a wire schedule.<\/td>\n<\/tr>\n<tr>\n<td><strong>Site<\/strong><\/td>\n<td>The riser: controllers and their downstream boards for the whole site.<\/td>\n<\/tr>\n<tr>\n<td><strong>Map<\/strong><\/td>\n<td>Devices placed on a floor plan.<\/td>\n<\/tr>\n<tr>\n<td><strong>Enclosure<\/strong><\/td>\n<td>Boards, power hardware and batteries placed on a real backplane, such as an Altronix Trove.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Three workspaces<\/h2>\n<p>Pick a workspace from <strong>Workspace ▾<\/strong> in the top bar. The tool opens in <strong>Building<\/strong>.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Workspace<\/th>\n<th>Views<\/th>\n<th>For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Controller Builder<\/strong><\/td>\n<td>Layout, Wiring<\/td>\n<td>Designing and correcting boards, and publishing them to the library.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tech Support<\/strong><\/td>\n<td>Wiring, Site, Map, Enclosure<\/td>\n<td>Working on an installed site: trace, troubleshoot, note and fix.<\/td>\n<\/tr>\n<tr>\n<td><strong>Building<\/strong><\/td>\n<td>Site, Layout, Wiring, Enclosure, Map<\/td>\n<td>The whole job, start to finish.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>A path bar shows the workspace's views as steps, each with its check status.<\/p>\n<h2>Checks and paperwork<\/h2>\n<p>The <strong>Power<\/strong> tab checks each supply, output and terminal against its rating, sizes batteries and works out voltage drop. <strong>Issues<\/strong> gathers every check in the project. The materials list, wire schedule and print sheets come from the same project.<\/p>\n<h2>Working with Aether and OnCAFE<\/h2>\n<ul>\n<li>The <strong>Aether<\/strong> board lets you wire Aether itself to an NHP or NOP controller.<\/li>\n<li>A site can be read straight from OnCAFE through Aether, so you don't retype devices.<\/li>\n<li>Projects can be saved to a team space and shared.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a077\">077 Place the Aether board and auto-wire a controller<\/a><\/li>\n<li><a href=\"#a078\">078 Build a Hanwha Trove kit enclosure<\/a><\/li>\n<li><a href=\"#a080\">080 Power checks and device draws<\/a><\/li>\n<li><a href=\"#a081\">081 Read an OnCAFE site into Blueprints<\/a><\/li>\n<li><a href=\"#a082\">082 Share projects in team spaces<\/a><\/li>\n<li><a href=\"#a074\">074 Keep Board Blueprints up to date<\/a><\/li>\n<\/ul>", "text": "what board blueprints does explains what board blueprint studio is, its five views and three workspaces, and how it fits with aether and oncafe. for anyone who draws, checks or supports access-control panels.  summary board blueprint studio (board blueprints) draws access-control panels from a library of real boards and parts. one project holds the board layouts, wiring, site riser, floor plan and enclosure, and it checks power, voltage drop and fit as you work. use it to plan a bench or site, hand a wiring sheet to an installer, or trace a problem on an installed site. where to find it in aether, open integrations › board blueprints . its subtitle reads \"powered by hydra\". it also runs outside aether from a shared launcher file, board-blueprints.html , which loads the current release over the internet. screenshot to add: board blueprints open in aether in the building workspace, with the path bar visible five views view what it shows layout each board's terminals, ports, leds and parts at real size. wiring doors, readers, locks and supplies wired to a board, with cables and a wire schedule. site the riser: controllers and their downstream boards for the whole site. map devices placed on a floor plan. enclosure boards, power hardware and batteries placed on a real backplane, such as an altronix trove. three workspaces pick a workspace from workspace ▾ in the top bar. the tool opens in building . workspace views for controller builder layout, wiring designing and correcting boards, and publishing them to the library. tech support wiring, site, map, enclosure working on an installed site: trace, troubleshoot, note and fix. building site, layout, wiring, enclosure, map the whole job, start to finish. a path bar shows the workspace's views as steps, each with its check status. checks and paperwork the power tab checks each supply, output and terminal against its rating, sizes batteries and works out voltage drop. issues gathers every check in the project. the materials list, wire schedule and print sheets come from the same project. working with aether and oncafe the aether board lets you wire aether itself to an nhp or nop controller. a site can be read straight from oncafe through aether, so you don't retype devices. projects can be saved to a team space and shared. related articles 077 place the aether board and auto-wire a controller 078 build a hanwha trove kit enclosure 080 power checks and device draws 081 read an oncafe site into blueprints 082 share projects in team spaces 074 keep board blueprints up to date "}, {"id": "a077", "num": "077", "title": "Place the Aether board and auto-wire a controller", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to add the Aether board to a Blueprints project and auto-wire it to an NHP or NOP controller, door by door. For engineers and QA building a test bench drawing.", "sources": ["Aether Board and Wiring tool", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Board Blueprints has a drawing of Aether itself: the Pi 5 with the Sequent IOplus card, terminals in their real positions. Place it on a controller's wiring sheet and <strong>Auto-wire<\/strong> draws the reader, door contact, REX and lock connections for each door. Use it to plan or document how a bench Aether is wired to the controller under test.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Board Blueprints is open (<strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>) with a project that has an NHP or NOP controller board.<\/li>\n<li>You know how many doors you want Aether to cover on that controller.<\/li>\n<\/ul>\n<h2>Add the Aether board to the project<\/h2>\n<ol>\n<li>Click <strong>Board ▾<\/strong>, then <strong>Switch board<\/strong>.<\/li>\n<li>Under the <strong>Aether<\/strong> group, pick <strong>Aether (Pi 5 + Sequent IOplus)<\/strong>.<\/li>\n<\/ol>\n<p>You can also create it from <strong>New board…<\/strong> &gt; <strong>Aether<\/strong>.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Aether board in Layout view, with the 10-wire Wiegand block on the back edge<\/span><\/div>\n<ol start=\"3\">\n<li>Check the layout. A 10-wire Wiegand block sits on the back edge: <strong>+5V<\/strong>, <strong>GND<\/strong>, then R1–R4 D0/D1 on GPIO 17/27, 22/23, 24/25 and 5/6.<\/li>\n<\/ol>\n<h2>Wire Aether to a controller<\/h2>\n<ol>\n<li>Open the controller's sheet in the <strong>Wiring<\/strong> view.<\/li>\n<li>In <strong class=\"path\">Devices<i>›<\/i>Boards<\/strong>, place the Aether board on the sheet.<\/li>\n<li>Click <strong>Auto-wire<\/strong>.<\/li>\n<\/ol>\n<p>For each door <em>n<\/em>, Auto-wire draws:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>From Aether<\/th>\n<th>To the controller<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wiegand R<em>n<\/em> D0, D1 and GND<\/td>\n<td>Reader <em>n<\/em><\/td>\n<\/tr>\n<tr>\n<td>REL 2<em>n<\/em>−1 (dry contact)<\/td>\n<td>Door <em>n<\/em> DPS input<\/td>\n<\/tr>\n<tr>\n<td>REL 2<em>n<\/em> (dry contact)<\/td>\n<td>Door <em>n<\/em> REX input<\/td>\n<\/tr>\n<tr>\n<td>OPTO <em>n<\/em> (relay C to OPTO GND, NO to OPTO <em>n<\/em>)<\/td>\n<td>Door <em>n<\/em> lock relay<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Each door gets one reader cable and one I/O cable. Doors the controller has no reader for are left off.<\/p>\n<ol start=\"4\">\n<li>Add what Auto-wire leaves out:\n   - EOL resistors for supervised controller inputs.\n   - <strong>+5V<\/strong> is not wired to the panel.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> The Pi's GPIO is 3.3 V logic. A 5 V Wiegand line needs a level shifter or an open-collector buffer before it reaches Aether.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Each door on the sheet shows a reader cable and an I/O cable to the Aether board.<\/li>\n<li>The <strong>Checks<\/strong> tab shows no wiring errors for the sheet.<\/li>\n<li>The Aether channels in the drawing match each door's Lock, DPS and REX channels in <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>. This is the same layout the Doors page's <strong>Apply 4-door layout<\/strong> button sets up.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>Aether<\/strong> group in <strong>Switch board<\/strong><\/td>\n<td>Update Board Blueprints. See <a href=\"#a074\">074 Keep Board Blueprints up to date<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>An older project shows an \"Aether test device\" instead of the board<\/td>\n<td>Older projects still open and draw. Replace it with the Aether board from <strong class=\"path\">Devices<i>›<\/i>Boards<\/strong> for new work.<\/td>\n<\/tr>\n<tr>\n<td>A door was not wired<\/td>\n<td>The controller has no reader for that door. Add the reader or wire it by hand.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a034\">034 Default I/O map (relays, inputs, supervision channels)<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<\/ul>", "text": "place the aether board and auto-wire a controller how to add the aether board to a blueprints project and auto-wire it to an nhp or nop controller, door by door. for engineers and qa building a test bench drawing.  summary board blueprints has a drawing of aether itself: the pi 5 with the sequent ioplus card, terminals in their real positions. place it on a controller's wiring sheet and auto-wire draws the reader, door contact, rex and lock connections for each door. use it to plan or document how a bench aether is wired to the controller under test. before you start board blueprints is open ( integrations › board blueprints ) with a project that has an nhp or nop controller board. you know how many doors you want aether to cover on that controller. add the aether board to the project click board ▾ , then switch board . under the aether group, pick aether (pi 5 + sequent ioplus) . you can also create it from new board… > aether . screenshot to add: aether board in layout view, with the 10-wire wiegand block on the back edge check the layout. a 10-wire wiegand block sits on the back edge: +5v , gnd , then r1–r4 d0/d1 on gpio 17/27, 22/23, 24/25 and 5/6. wire aether to a controller open the controller's sheet in the wiring view. in devices › boards , place the aether board on the sheet. click auto-wire . for each door n , auto-wire draws: from aether to the controller wiegand r n d0, d1 and gnd reader n rel 2 n −1 (dry contact) door n dps input rel 2 n (dry contact) door n rex input opto n (relay c to opto gnd, no to opto n ) door n lock relay each door gets one reader cable and one i/o cable. doors the controller has no reader for are left off. add what auto-wire leaves out: - eol resistors for supervised controller inputs. - +5v is not wired to the panel. caution: the pi's gpio is 3.3 v logic. a 5 v wiegand line needs a level shifter or an open-collector buffer before it reaches aether. check that it worked each door on the sheet shows a reader cable and an i/o cable to the aether board. the checks tab shows no wiring errors for the sheet. the aether channels in the drawing match each door's lock, dps and rex channels in access control › doors . this is the same layout the doors page's apply 4-door layout button sets up. if something goes wrong symptom what to do no aether group in switch board update board blueprints. see 074 keep board blueprints up to date . an older project shows an \"aether test device\" instead of the board older projects still open and draw. replace it with the aether board from devices › boards for new work. a door was not wired the controller has no reader for that door. add the reader or wire it by hand. related articles 022 wiegand pins and voltage levels (r1–r4) 034 default i/o map (relays, inputs, supervision channels) 037 wire aether to an nhp or nop controller 076 what board blueprints does "}, {"id": "a078", "num": "078", "title": "Build a Hanwha Trove kit enclosure", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to build a Hanwha Trove kit (NOA-E1W4/US or NOA-E2W8/US) in the Blueprints Enclosure view and what the Trove builder positions allow. For engineers, FAEs and sales sizing a panel.", "sources": ["Aether Board and Wiring tool"], "html": "<h2>Summary<\/h2>\n<p>The Enclosure view can build either Hanwha Trove kit in one step, with each board in the same position the Altronix Trove builder uses and the kit's power hardware mounted. It then checks the layout against each Trove's limits. Use it to plan a kit panel or to check that a board count fits before you order.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Board Blueprints is open (<strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>) on a project, in the <strong>Enclosure<\/strong> view.<\/li>\n<li>For a 2-door kit you need one NOP-IC2; the kit adds what is missing.<\/li>\n<\/ul>\n<h2>Build a kit<\/h2>\n<ol>\n<li>In the <strong>Enclosure<\/strong> view, open <strong>Properties<\/strong>.<\/li>\n<li>Under <strong>Hanwha Trove kit<\/strong>, pick the kit: <span class=\"sme\">confirm the control label and whether it is a button or a picker.<\/span><\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Kit<\/th>\n<th>Enclosure<\/th>\n<th>Boards<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NOA-E1W4/US<\/td>\n<td>Trove1<\/td>\n<td>NOP-IC2 + NOP-RI2MS<\/td>\n<\/tr>\n<tr>\n<td>NOA-E2W8/US<\/td>\n<td>Trove2<\/td>\n<td>NOP-IC2 + 3 × NOP-RI2MS<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ol start=\"3\">\n<li>Check the drawing. The tool adds only the boards the riser is missing. If the open board isn't an IC2 controller, it creates one and puts the RI2MS boards under it. Picking the kit again adds nothing.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Trove2 enclosure built as NOA-E2W8/US, boards in builder positions<\/span><\/div>\n<ol start=\"4\">\n<li>Check the materials list. The Hanwha kit is listed first with its Altronix parts under it. The NOP boards are listed separately, because the kit holds them but doesn't include them.<\/li>\n<\/ol>\n<p>The kit's power hardware, including the access power controller, is mounted straight away. The usual rating checks apply once you wire locks.<\/p>\n<h2>Choose how boards are laid out<\/h2>\n<p>In <strong class=\"path\">Properties<i>›<\/i>Layout<\/strong>:<\/p>\n<ul>\n<li><strong>Trove builder positions<\/strong> (default) places boards and power hardware in the builder's slots and names the backplane.<\/li>\n<li><strong>Smallest Trove that fits<\/strong> tries Trove1, then Trove2, then a free-form Trove3.<\/li>\n<li><strong>Free<\/strong> keeps a free-form layout on a blank backplane.<\/li>\n<\/ul>\n<p>Drag a board to move it, or select it and press R to turn it. This works in every layout.<\/p>\n<h2>Trove limits<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Trove<\/th>\n<th>Holds<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Trove1<\/td>\n<td>One BLU-IC4; or one IC2/IO168S plus one RI2MS; or two RI2MS.<\/td>\n<\/tr>\n<tr>\n<td>Trove2<\/td>\n<td>One controller on top, then two rows each holding one IC2/IO168S or two RI2MS. One more IC2/IO168S fits at the bottom of the power column if that spot is free. The bottom-right slots mount boards turned 180°.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Hanwha backplanes have no room for batteries, and NOP-RI4S is not offered.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li><strong>Properties<\/strong> says the layout matches the Hanwha kit.<\/li>\n<li>The <strong>Checks<\/strong> notes show no \"no free position\" errors.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"no free … position left on the … backplane\"<\/td>\n<td>You have more boards than the Trove holds. Use a larger Trove or a second enclosure.<\/td>\n<\/tr>\n<tr>\n<td>Warning that batteries need a separate enclosure<\/td>\n<td>Expected for Hanwha backplanes. Plan a separate battery enclosure.<\/td>\n<\/tr>\n<tr>\n<td>No VR6 drawn in the 4-door kit<\/td>\n<td>The tool adds a VR6 only to step a 24 V supply down to 12 V. <span class=\"sme\">confirm whether the VR6 shipped in NOA-E1W4/US should be drawn anyway.<\/span><\/td>\n<\/tr>\n<tr>\n<td>A warning that a knockout is overfull<\/td>\n<td>Spread cables over more knockouts or plan a larger knockout. <span class=\"sme\">confirm how knockout fill is handled in the current release.<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a076\">076 What Board Blueprints does<\/a><\/li>\n<li><a href=\"#a080\">080 Power checks and device draws<\/a><\/li>\n<li><a href=\"#a079\">079 Pick reader, lock and peripheral models<\/a><\/li>\n<\/ul>", "text": "build a hanwha trove kit enclosure how to build a hanwha trove kit (noa-e1w4/us or noa-e2w8/us) in the blueprints enclosure view and what the trove builder positions allow. for engineers, faes and sales sizing a panel.  summary the enclosure view can build either hanwha trove kit in one step, with each board in the same position the altronix trove builder uses and the kit's power hardware mounted. it then checks the layout against each trove's limits. use it to plan a kit panel or to check that a board count fits before you order. before you start board blueprints is open ( integrations › board blueprints ) on a project, in the enclosure view. for a 2-door kit you need one nop-ic2; the kit adds what is missing. build a kit in the enclosure view, open properties . under hanwha trove kit , pick the kit: confirm the control label and whether it is a button or a picker. kit enclosure boards noa-e1w4/us trove1 nop-ic2 + nop-ri2ms noa-e2w8/us trove2 nop-ic2 + 3 × nop-ri2ms check the drawing. the tool adds only the boards the riser is missing. if the open board isn't an ic2 controller, it creates one and puts the ri2ms boards under it. picking the kit again adds nothing. screenshot to add: trove2 enclosure built as noa-e2w8/us, boards in builder positions check the materials list. the hanwha kit is listed first with its altronix parts under it. the nop boards are listed separately, because the kit holds them but doesn't include them. the kit's power hardware, including the access power controller, is mounted straight away. the usual rating checks apply once you wire locks. choose how boards are laid out in properties › layout : trove builder positions (default) places boards and power hardware in the builder's slots and names the backplane. smallest trove that fits tries trove1, then trove2, then a free-form trove3. free keeps a free-form layout on a blank backplane. drag a board to move it, or select it and press r to turn it. this works in every layout. trove limits trove holds trove1 one blu-ic4; or one ic2/io168s plus one ri2ms; or two ri2ms. trove2 one controller on top, then two rows each holding one ic2/io168s or two ri2ms. one more ic2/io168s fits at the bottom of the power column if that spot is free. the bottom-right slots mount boards turned 180°. the hanwha backplanes have no room for batteries, and nop-ri4s is not offered. check that it worked properties says the layout matches the hanwha kit. the checks notes show no \"no free position\" errors. if something goes wrong symptom what to do \"no free … position left on the … backplane\" you have more boards than the trove holds. use a larger trove or a second enclosure. warning that batteries need a separate enclosure expected for hanwha backplanes. plan a separate battery enclosure. no vr6 drawn in the 4-door kit the tool adds a vr6 only to step a 24 v supply down to 12 v. confirm whether the vr6 shipped in noa-e1w4/us should be drawn anyway. a warning that a knockout is overfull spread cables over more knockouts or plan a larger knockout. confirm how knockout fill is handled in the current release. related articles 076 what board blueprints does 080 power checks and device draws 079 pick reader, lock and peripheral models "}, {"id": "a079", "num": "079", "title": "Pick reader, lock and peripheral models", "area": "Tools", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to use the Product picker in Blueprints to set a reader, lock or other device to a real manufacturer model, so voltage and current come from published data. For anyone drawing wiring or sizing power.", "sources": ["Aether Board and Wiring tool", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Devices in Board Blueprints start with typical values. The <strong>Product<\/strong> section lets you pick a real manufacturer and model, which fills in the voltage, current draw and spec from data sheets. Use it whenever the power check matters, so the <strong>Power<\/strong> tab works from real figures rather than typical ones.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Board Blueprints is open (<strong class=\"path\">Integrations<i>›<\/i>Board Blueprints<\/strong>) on a <strong>Wiring<\/strong> sheet with the device placed.<\/li>\n<li>Know the brand and model of the device, or its ADI part number.<\/li>\n<\/ul>\n<h2>Pick a model<\/h2>\n<ol>\n<li>Select the device on the sheet. The <strong>Product<\/strong> section appears in its pane.<\/li>\n<li>Open <strong>Manufacturer<\/strong>. It lists only brands that make that kind of device, with the number of models each has.<\/li>\n<li>In <strong>Model<\/strong>, type a model number, an ADI part number or words, such as <code>9600<\/code> or <code>1200 lb<\/code>.<\/li>\n<li>Click the model in the list.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Product section for a strike with Manufacturer and Model filled and the data sheet link shown<\/span><\/div>\n<ol start=\"5\">\n<li>Check what was filled in:\n   - <strong>Spec<\/strong>: brand and model.\n   - <strong>Voltage<\/strong>: with a 12 V / 24 V choice when the model supports both.\n   - <strong>Draw<\/strong>: the published current at 12 V and 24 V.\n   - For locks: fail mode, holding force, a data sheet link, and a warning if the model is discontinued.\n   - For readers: PoE, protocols and credential technology.<\/li>\n<li>If the draw shows <strong>assumed<
