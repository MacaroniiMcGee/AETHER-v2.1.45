/a><\/li>\n<li><a href=\"#a021\">021 Send keypad entries over Wiegand<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<li><a href=\"#a077\">077 Place the Aether board and auto-wire a controller<\/a><\/li>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<\/ul>", "text": "wiegand pins and voltage levels (r1–r4) reference for the pi gpio pins that drive wiegand readers r1–r4 and the voltage levels to respect when wiring a controller.  summary aether's four wiegand reader outputs use pi gpio pins. this page lists the pins and the voltage rules for wiring them to a controller's reader ports. pins reader d0 (gpio) d1 (gpio) default name r1 17 27 main entrance r2 22 23 back door r3 24 25 side door r4 5 6 elevator gpio numbers are bcm numbers, not header pin numbers. see 036 hat pinout: pi header and sequent board pages for the header positions. terminal block in board blueprints, the aether board has a 10-wire wiegand block: +5v, gnd, then r1–r4 d0/d1 in the order above. voltage levels item value pi gpio logic 3.3 v controller wiegand input at 5 v needs a level shifter or an open-collector buffer ground share gnd between aether and the controller caution: don't connect a 5 v wiegand line directly to a pi gpio pin. fit a level shifter or open-collector buffer first. wiring to a controller aether controller reader port r n d0 d0 (data 0) r n d1 d1 (data 1) gnd gnd auto-wire in board blueprints wires reader n to door n this way. +5v isn't wired to the panel. frame length frames up to 256 bits are supported. frames over 128 bits need the updated transmitter on the pi. confirm the transmitter on the shipped pi supports 256-bit frames. related articles 020 send a card from an emulated wiegand reader 021 send keypad entries over wiegand 036 hat pinout: pi header and sequent board pages 037 wire aether to an nhp or nop controller 077 place the aether board and auto-wire a controller 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters "}, {"id": "a023", "num": "023", "title": "The built-in card format library", "area": "Readers and protocols", "type": "Reference", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "Reference for Aether's built-in card format library: what's in it, the Common list, and what the VERIFIED, UNVERIFIED, CONFIRMED and MINE tags mean.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Aether features presentation (chat)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>Aether ships with a library of 113 card formats. The same library and encoder are used for OSDP and Wiegand, so a format sends the same bits on both. Tags tell you how far each format has been checked.<\/p>\n<h2>The Common list<\/h2>\n<p>The format picker opens on <strong>Common<\/strong>, the ten most-used formats:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Format<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>HID 26-bit (H10301)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>HID Corporate 1000 35-bit<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>HID Corporate 1000 48-bit<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>HID 37-bit with facility (H10304)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>HID 37-bit card-only (H10302)<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>34-bit (H10306)<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>MIFARE CSN 32-bit<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>AWID 26-bit<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Indala 26-bit<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>HID 33-bit (D10202)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Star any format to pin it above these. Stars are saved per browser. The built-in ten always stay in the list. Below <strong>Common<\/strong>, formats are grouped by vendor. Search spans all of them; type \"37\" or a vendor name.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: format picker open, Common section with one starred format<\/span><\/div>\n<h2>Tags<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Meaning<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>VERIFIED<\/strong><\/td>\n<td>Checked against a trusted reference encoder.<\/td>\n<td>Use it.<\/td>\n<\/tr>\n<tr>\n<td><strong>UNVERIFIED<\/strong><\/td>\n<td>Follows the library layout, or was repaired because the library definition didn't add up, but not checked against a published spec. A repaired format shows a note saying what was guessed.<\/td>\n<td>Test against the controller before relying on it.<\/td>\n<\/tr>\n<tr>\n<td><strong>CONFIRMED<\/strong><\/td>\n<td>You clicked <strong>Mark confirmed<\/strong> after the controller read it correctly. Saved on the Pi and in backups. <strong>Undo<\/strong> reverses it.<\/td>\n<td>Use it.<\/td>\n<\/tr>\n<tr>\n<td><strong>MINE<\/strong><\/td>\n<td>A format you built or enrolled.<\/td>\n<td>Use it; edit it in the Builder.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>At the time of the readers rebuild, 24 formats were VERIFIED and 89 UNVERIFIED. <span class=\"sme\">confirm the current counts.<\/span><\/p>\n<h2>Ranges<\/h2>\n<p>The composer shows only the fields a format has (facility code, card number, issue level) and caps each at its maximum as you type. Switching to a smaller format trims values that no longer fit.<\/p>\n<h2>Where the library is used<\/h2>\n<ul>\n<li><strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong> and <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong> composers.<\/li>\n<li><strong class=\"path\">Readers<i>›<\/i>Card Formats<\/strong> (<strong>Builder<\/strong> and <strong>Analyzer<\/strong>).<\/li>\n<li>OSDP Trace, to name the facility code and card number in a card read.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a024\">024 Build a custom card format (Builder)<\/a><\/li>\n<li><a href=\"#a025\">025 Decode a card with the Format Analyzer<\/a><\/li>\n<li><a href=\"#a016\">016 Enroll a card format from a real OSDP reader<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a><\/li>\n<\/ul>", "text": "the built-in card format library reference for aether's built-in card format library: what's in it, the common list, and what the verified, unverified, confirmed and mine tags mean.  summary aether ships with a library of 113 card formats. the same library and encoder are used for osdp and wiegand, so a format sends the same bits on both. tags tell you how far each format has been checked. the common list the format picker opens on common , the ten most-used formats: # format 1 hid 26-bit (h10301) 2 hid corporate 1000 35-bit 3 hid corporate 1000 48-bit 4 hid 37-bit with facility (h10304) 5 hid 37-bit card-only (h10302) 6 34-bit (h10306) 7 mifare csn 32-bit 8 awid 26-bit 9 indala 26-bit 10 hid 33-bit (d10202) star any format to pin it above these. stars are saved per browser. the built-in ten always stay in the list. below common , formats are grouped by vendor. search spans all of them; type \"37\" or a vendor name. screenshot to add: format picker open, common section with one starred format tags tag meaning what to do verified checked against a trusted reference encoder. use it. unverified follows the library layout, or was repaired because the library definition didn't add up, but not checked against a published spec. a repaired format shows a note saying what was guessed. test against the controller before relying on it. confirmed you clicked mark confirmed after the controller read it correctly. saved on the pi and in backups. undo reverses it. use it. mine a format you built or enrolled. use it; edit it in the builder. at the time of the readers rebuild, 24 formats were verified and 89 unverified. confirm the current counts. ranges the composer shows only the fields a format has (facility code, card number, issue level) and caps each at its maximum as you type. switching to a smaller format trims values that no longer fit. where the library is used readers › osdp › emulate and readers › wiegand composers. readers › card formats ( builder and analyzer ). osdp trace, to name the facility code and card number in a card read. related articles 024 build a custom card format (builder) 025 decode a card with the format analyzer 016 enroll a card format from a real osdp reader 010 present a card or pin on an emulated osdp reader 020 send a card from an emulated wiegand reader "}, {"id": "a024", "num": "024", "title": "Build a custom card format (Builder)", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to build your own card format bit by bit in the Card Formats Builder, test it, and save it for use on OSDP and Wiegand.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Builder<\/strong> is an editable bit map. You mark which bits are facility code, card number, issue level, fixed bits or parity, set what each parity bit covers, and test with real values. A saved format appears as <strong>MINE<\/strong> in every composer.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You know the format's total length and where each field sits, or you have a library format to start from.<\/li>\n<\/ul>\n<h2>Lay out the bits<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>Card Formats<\/strong> and select <strong>Builder<\/strong>.<\/li>\n<li>Start from an existing format, or click <strong>Blank<\/strong>.<\/li>\n<li>Set the total number of bits (1–256).<\/li>\n<li>Pick a field button, then drag across the bits it covers:\n   - <strong>Facility<\/strong>\n   - <strong>Card<\/strong>\n   - issue level and fixed bits <span class=\"sme\">confirm the button labels for issue level and fixed bits<\/span><\/li>\n<li>For each parity bit, pick <strong>Even parity<\/strong> or <strong>Odd parity<\/strong> and drag onto the bit.<\/li>\n<li>Set what the parity bit covers, for example <strong>First half<\/strong> or <strong>Second half<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Builder with a 40-bit layout, facility, card and two parity bits painted<\/span><\/div>\n<h2>Test it<\/h2>\n<ol>\n<li>Enter test values for the facility code and card number.<\/li>\n<li>Check the encoded bit string. It is built on the Pi by the same encoder that sends cards.<\/li>\n<li>To try it on a controller without saving, send a test frame. <span class=\"sme\">confirm the test-send control and which reader it uses.<\/span><\/li>\n<\/ol>\n<h2>Save it<\/h2>\n<ol>\n<li>Enter a name, such as \"Test 40-bit\".<\/li>\n<li>Click <strong>Save as mine<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong> or <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong>.<\/li>\n<li>Search the format picker for the name. It shows the <strong>MINE<\/strong> tag.<\/li>\n<li>Send a card and check that the controller reads the expected numbers.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Save is refused<\/td>\n<td>Read the message. Fields overlap, run past the last bit, or the name is empty.<\/td>\n<\/tr>\n<tr>\n<td>Controller reads wrong values<\/td>\n<td>Check bit positions and parity coverage; compare with <a href=\"#a025\">025 Decode a card with the Format Analyzer<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Don't know the layout<\/td>\n<td>Capture a real card with <a href=\"#a016\">016 Enroll a card format from a real OSDP reader<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a025\">025 Decode a card with the Format Analyzer<\/a><\/li>\n<li><a href=\"#a016\">016 Enroll a card format from a real OSDP reader<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a><\/li>\n<\/ul>", "text": "build a custom card format (builder) how to build your own card format bit by bit in the card formats builder, test it, and save it for use on osdp and wiegand.  summary the builder is an editable bit map. you mark which bits are facility code, card number, issue level, fixed bits or parity, set what each parity bit covers, and test with real values. a saved format appears as mine in every composer. before you start you know the format's total length and where each field sits, or you have a library format to start from. lay out the bits open readers › card formats and select builder . start from an existing format, or click blank . set the total number of bits (1–256). pick a field button, then drag across the bits it covers: - facility - card - issue level and fixed bits confirm the button labels for issue level and fixed bits for each parity bit, pick even parity or odd parity and drag onto the bit. set what the parity bit covers, for example first half or second half . screenshot to add: builder with a 40-bit layout, facility, card and two parity bits painted test it enter test values for the facility code and card number. check the encoded bit string. it is built on the pi by the same encoder that sends cards. to try it on a controller without saving, send a test frame. confirm the test-send control and which reader it uses. save it enter a name, such as \"test 40-bit\". click save as mine . check that it worked open readers › osdp › emulate or readers › wiegand . search the format picker for the name. it shows the mine tag. send a card and check that the controller reads the expected numbers. if something goes wrong symptom what to do save is refused read the message. fields overlap, run past the last bit, or the name is empty. controller reads wrong values check bit positions and parity coverage; compare with 025 decode a card with the format analyzer . don't know the layout capture a real card with 016 enroll a card format from a real osdp reader . related articles 023 the built-in card format library 025 decode a card with the format analyzer 016 enroll a card format from a real osdp reader 010 present a card or pin on an emulated osdp reader 020 send a card from an emulated wiegand reader "}, {"id": "a025", "num": "025", "title": "Decode a card with the Format Analyzer", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to paste a card's bits or hex into the Format Analyzer and see which library formats fit, with decoded values and parity checks.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Analyzer<\/strong> takes raw card data, from a trace, a controller log or the History tab, and tries every library format of that length. For each one it shows the facility code, card number and whether each parity bit is right. Use it to identify an unknown card or to check a format.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have the card data as bits (1s and 0s) or as hex.<\/li>\n<li>For hex, you know the bit count.<\/li>\n<\/ul>\n<h2>Decode a card<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>Card Formats<\/strong> and select <strong>Analyzer<\/strong>.<\/li>\n<li>Choose binary or hex input. <span class=\"sme\">confirm the input mode labels.<\/span><\/li>\n<li>Paste the data. For hex, enter the <strong>Bit count<\/strong>.<\/li>\n<li>Read the summary line: the number of bits, how many formats have that length, and how many have correct parity.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Analyzer with a 26-bit value and two format cards, one with all parity OK<\/span><\/div>\n<h2>Read the results<\/h2>\n<p>Each matching format gets a card:<\/p>\n<ul>\n<li>A green tick means all parity bits and fixed bits match; a red cross means at least one doesn't.<\/li>\n<li>The bit strip colours each field.<\/li>\n<li>Below it: facility code, card number, issue level and other fields the format has.<\/li>\n<li>Each parity bit shows <strong>OK<\/strong> or <strong>wrong<\/strong>, with its position. Fixed bits that don't match are flagged too.<\/li>\n<\/ul>\n<p>Several formats of the same length can all pass. If you know the number printed on the card, pick the format whose decoded card number matches it.<\/p>\n<h2>Check that it worked<\/h2>\n<p>At least one format shows a green tick and the card number you expect.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"No format is N bits long\"<\/td>\n<td>Build one in the Builder, or enroll the card from a real reader.<\/td>\n<\/tr>\n<tr>\n<td>Every format shows wrong parity<\/td>\n<td>Check the bit count and that you pasted the whole frame.<\/td>\n<\/tr>\n<tr>\n<td>Two formats both pass<\/td>\n<td>Use the printed card number to choose. Enrollment does the same comparison for you.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a024\">024 Build a custom card format (Builder)<\/a><\/li>\n<li><a href=\"#a016\">016 Enroll a card format from a real OSDP reader<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<\/ul>", "text": "decode a card with the format analyzer how to paste a card's bits or hex into the format analyzer and see which library formats fit, with decoded values and parity checks.  summary the analyzer takes raw card data, from a trace, a controller log or the history tab, and tries every library format of that length. for each one it shows the facility code, card number and whether each parity bit is right. use it to identify an unknown card or to check a format. before you start you have the card data as bits (1s and 0s) or as hex. for hex, you know the bit count. decode a card open readers › card formats and select analyzer . choose binary or hex input. confirm the input mode labels. paste the data. for hex, enter the bit count . read the summary line: the number of bits, how many formats have that length, and how many have correct parity. screenshot to add: analyzer with a 26-bit value and two format cards, one with all parity ok read the results each matching format gets a card: a green tick means all parity bits and fixed bits match; a red cross means at least one doesn't. the bit strip colours each field. below it: facility code, card number, issue level and other fields the format has. each parity bit shows ok or wrong , with its position. fixed bits that don't match are flagged too. several formats of the same length can all pass. if you know the number printed on the card, pick the format whose decoded card number matches it. check that it worked at least one format shows a green tick and the card number you expect. if something goes wrong symptom what to do \"no format is n bits long\" build one in the builder, or enroll the card from a real reader. every format shows wrong parity check the bit count and that you pasted the whole frame. two formats both pass use the printed card number to choose. enrollment does the same comparison for you. related articles 023 the built-in card format library 024 build a custom card format (builder) 016 enroll a card format from a real osdp reader 017 read a conversation in osdp trace "}, {"id": "a026", "num": "026", "title": "Save cards for quick reuse", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How to keep frequently used test cards close at hand: starring formats in the picker and saving cards for one-click reuse.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "Aether OSDP credential injector tool (chat)", "frontend/src/components/CredentialQuickPills.tsx (2026-09-20 source)"], "html": "<h2>Summary<\/h2>\n<p>Most tests reuse the same few credentials: a known-good card, a known-bad card, a wrong facility code. Aether lets you pin the formats you use and keep saved cards you can send again with one click. Use them to speed up repeated tests.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have sent the card at least once and know it reads correctly at the controller.<\/li>\n<\/ul>\n<h2>Pin the formats you use<\/h2>\n<ol>\n<li>Open the format picker on <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Emulate<\/strong> or <strong class=\"path\">Readers<i>›<\/i>Wiegand<\/strong>.<\/li>\n<li>Click the star on a format's row.<\/li>\n<li>The format moves to the top of <strong>Common<\/strong>. Stars are saved in that browser, so set them on each browser you use.<\/li>\n<\/ol>\n<h2>Save a card<\/h2>\n<p><strong>Quick Credentials<\/strong> gives you four slots. It appears on the OSDP <strong>Emulate<\/strong> tab and in the Controller Emulator. <span class=\"sme\">confirm whether the rebuilt Wiegand page has Quick Credentials.<\/span><\/p>\n<ol>\n<li>Fill in the format, facility code and card number.<\/li>\n<li>Under <strong>Quick Credentials<\/strong>, click <strong>Save<\/strong>. The card goes into the next empty slot.<\/li>\n<li>To name a slot or overwrite one, click <strong>Edit<\/strong>, then use <strong>Save current here<\/strong> or <strong>Overwrite<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Quick Credentials with four slots, two filled<\/span><\/div>\n<p>Slots are saved in the browser, not on the Pi. To move them to another computer, click <strong>Edit<\/strong>, then <strong>Export<\/strong> under <strong>Backup<\/strong>, and <strong>Import<\/strong> the file on the other computer.<\/p>\n<h2>Send a saved card<\/h2>\n<ol>\n<li>Pick the reader.<\/li>\n<li>Click the slot. Its values fill the credential fields; nothing is sent yet.<\/li>\n<li>Send the card as usual.<\/li>\n<\/ol>\n<p><strong>Prev<\/strong> brings back the credential you had before loading a slot. <strong>Reset<\/strong> sets the facility code, card number and issue level to zero. Right-click a slot to clear it.<\/p>\n<h2>Check that it worked<\/h2>\n<p>The OSDP History tab or the Wiegand <strong>Sent<\/strong> table shows the saved card's values.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stars or slots are gone<\/td>\n<td>You are on another browser or cleared site data. Star the formats again and import your slot backup.<\/td>\n<\/tr>\n<tr>\n<td>A saved card reads wrong<\/td>\n<td>Check its format; it may be <strong>UNVERIFIED<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>You need many card numbers in a run<\/td>\n<td>Use card ranges in an Emulation workflow instead.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a020\">020 Send a card from an emulated Wiegand reader<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a040\">040 Card sequences and ranges in workflows<\/a><\/li>\n<\/ul>", "text": "save cards for quick reuse how to keep frequently used test cards close at hand: starring formats in the picker and saving cards for one-click reuse.  summary most tests reuse the same few credentials: a known-good card, a known-bad card, a wrong facility code. aether lets you pin the formats you use and keep saved cards you can send again with one click. use them to speed up repeated tests. before you start you have sent the card at least once and know it reads correctly at the controller. pin the formats you use open the format picker on readers › osdp › emulate or readers › wiegand . click the star on a format's row. the format moves to the top of common . stars are saved in that browser, so set them on each browser you use. save a card quick credentials gives you four slots. it appears on the osdp emulate tab and in the controller emulator. confirm whether the rebuilt wiegand page has quick credentials. fill in the format, facility code and card number. under quick credentials , click save . the card goes into the next empty slot. to name a slot or overwrite one, click edit , then use save current here or overwrite . screenshot to add: quick credentials with four slots, two filled slots are saved in the browser, not on the pi. to move them to another computer, click edit , then export under backup , and import the file on the other computer. send a saved card pick the reader. click the slot. its values fill the credential fields; nothing is sent yet. send the card as usual. prev brings back the credential you had before loading a slot. reset sets the facility code, card number and issue level to zero. right-click a slot to clear it. check that it worked the osdp history tab or the wiegand sent table shows the saved card's values. if something goes wrong symptom what to do stars or slots are gone you are on another browser or cleared site data. star the formats again and import your slot backup. a saved card reads wrong check its format; it may be unverified . you need many card numbers in a run use card ranges in an emulation workflow instead. related articles 010 present a card or pin on an emulated osdp reader 020 send a card from an emulated wiegand reader 023 the built-in card format library 040 card sequences and ranges in workflows "}, {"id": "a027", "num": "027", "title": "NFC reader and the NFC-to-OSDP bridge", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "How the optional PN532 NFC reader and the NFC-to-OSDP bridge let a physical card tap arrive at the controller as a reader card read.", "sources": ["AccessGrid specs in Aether (chat)", "Aether product QA testing (chat)", "frontend/src/components/NFCSection.tsx, backend/nfc/PN532Manager.js (2026-09-20 source)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>Aether can take an optional PN532 NFC reader. With the NFC-to-OSDP bridge, a real card tapped on the PN532 is passed on to the controller as a card read from an emulated reader. The <strong>NFC<\/strong> page appears under <strong>Readers<\/strong> only when NFC is enabled on the Pi.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>A PN532 NFC reader is fitted to the Pi on I2C (bus 1, <code>/dev/i2c-1<\/code>), the same bus the IOplus HAT uses.<\/li>\n<li>NFC is enabled on this Pi, so <strong class=\"path\">Readers<i>›<\/i>NFC<\/strong> is in the sidebar. <span class=\"sme\">confirm how NFC is enabled and whether it is enabled on shipped kits.<\/span><\/li>\n<li>The emulated reader that will carry the read is set up and polled by the controller.<\/li>\n<\/ul>\n<h2>What the bridge does<\/h2>\n<ol>\n<li>The PN532 reads the card's UID.<\/li>\n<li>The bridge turns the UID into a card read in a 26, 34 or 37-bit format.<\/li>\n<li>Aether sends it as OSDP from the chosen emulated reader, as Wiegand, or both.<\/li>\n<\/ol>\n<p>Phone wallet passes show a new random UID on each tap, so they don't work through the bridge. Use plastic cards or tags.<\/p>\n<h2>Use the NFC reader<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>NFC<\/strong>.<\/li>\n<li>Pick the <strong>Target Reader<\/strong>, the emulated reader that will carry the read.<\/li>\n<li>Pick the <strong>Format Category<\/strong>.<\/li>\n<li>Tap a card on the PN532.<\/li>\n<li>Read <strong>Last Scanned Card<\/strong>: UID, facility code, card number, decimal value and format.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: NFC page showing the PN532 connected and the last card read<\/span><\/div>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<i>›<\/i>Conversation<\/strong>.<\/li>\n<li>Find the poll answered with <strong>Card read<\/strong> from the chosen reader.<\/li>\n<li>Check the controller's event log.<\/li>\n<\/ol>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>No <strong>NFC<\/strong> item under <strong>Readers<\/strong><\/td>\n<td>NFC isn't enabled on this Pi. Ask your Aether admin.<\/td>\n<\/tr>\n<tr>\n<td>Page shows no reader<\/td>\n<td>Check the PN532 wiring and power, then reload.<\/td>\n<\/tr>\n<tr>\n<td>A phone tap gives a different number each time<\/td>\n<td>Expected for wallet passes. Use a physical card.<\/td>\n<\/tr>\n<tr>\n<td>Card read never reaches the controller<\/td>\n<td>Check the emulated reader is polled; see <a href=\"#a096\">096 An OSDP reader doesn't answer<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a096\">096 An OSDP reader doesn't answer<\/a><\/li>\n<\/ul>", "text": "nfc reader and the nfc-to-osdp bridge how the optional pn532 nfc reader and the nfc-to-osdp bridge let a physical card tap arrive at the controller as a reader card read.  summary aether can take an optional pn532 nfc reader. with the nfc-to-osdp bridge, a real card tapped on the pn532 is passed on to the controller as a card read from an emulated reader. the nfc page appears under readers only when nfc is enabled on the pi. before you start a pn532 nfc reader is fitted to the pi on i2c (bus 1, /dev/i2c-1 ), the same bus the ioplus hat uses. nfc is enabled on this pi, so readers › nfc is in the sidebar. confirm how nfc is enabled and whether it is enabled on shipped kits. the emulated reader that will carry the read is set up and polled by the controller. what the bridge does the pn532 reads the card's uid. the bridge turns the uid into a card read in a 26, 34 or 37-bit format. aether sends it as osdp from the chosen emulated reader, as wiegand, or both. phone wallet passes show a new random uid on each tap, so they don't work through the bridge. use plastic cards or tags. use the nfc reader open readers › nfc . pick the target reader , the emulated reader that will carry the read. pick the format category . tap a card on the pn532. read last scanned card : uid, facility code, card number, decimal value and format. screenshot to add: nfc page showing the pn532 connected and the last card read check that it worked open readers › osdp trace › conversation . find the poll answered with card read from the chosen reader. check the controller's event log. if something goes wrong symptom what to do no nfc item under readers nfc isn't enabled on this pi. ask your aether admin. page shows no reader check the pn532 wiring and power, then reload. a phone tap gives a different number each time expected for wallet passes. use a physical card. card read never reaches the controller check the emulated reader is polled; see 096 an osdp reader doesn't answer . related articles 009 how osdp reader emulation works 010 present a card or pin on an emulated osdp reader 017 read a conversation in osdp trace 096 an osdp reader doesn't answer "}, {"id": "a028", "num": "028", "title": "Controls page: outputs, inputs and system outputs", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to use the Controls page to switch Aether's relays by hand, watch the controller's outputs on the monitored inputs, and trigger the four system outputs. For testers checking wiring or driving single points.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Controls<\/strong> page is the manual panel for the IOplus HAT. From it you switch Aether's 8 relays by hand (each one drives a controller input), watch the 8 monitored inputs that read the controller's outputs, and drive the controller's aux points. Use it to check wiring before a test.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The IOplus HAT is detected and Aether shows the Pi as connected.<\/li>\n<li>Aether's relays are wired to the controller inputs you want to drive (DPS, REX, tamper and so on), and its opto inputs to the controller outputs you want to watch (lock relays, aux outputs). See <a href=\"#a034\">034 Default I/O map<\/a>.<\/li>\n<\/ul>\n<h2>Switch a relay by hand<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Controls<\/strong>.<\/li>\n<li>Find the relay in <strong>Input Group (Relay Outputs)<\/strong>. Its rows are named <strong>Device Input 1–8<\/strong> until you rename them in <strong>I/O Mapping<\/strong>, and show the channel and type.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Controls page with the relay group on the left and the monitored inputs on the right<\/span><\/div>\n<p class=\"caution\"><strong>Caution:<\/strong> The next step closes a real relay and changes a real input on the controller.<\/p>\n<ol start=\"3\">\n<li>Click the row's button. It reads <strong>ACTIVE<\/strong> and the dot turns green while the relay is closed.<\/li>\n<li>Click it again to open the relay.<\/li>\n<\/ol>\n<h2>Watch the controller's outputs<\/h2>\n<ol>\n<li>On the same page, look at <strong>Output Group (Monitoring Inputs)<\/strong>, rows <strong>Device Output 1–8<\/strong>.<\/li>\n<li>Each row shows its channel and whether it reads an <strong>Opto<\/strong> or <strong>Analog 0-10V<\/strong> input. Supervised rows show the zone state (NORMAL, ALARM, TROUBLE or TAMPER) instead of on/off.<\/li>\n<li>Make the controller drive the output. The row changes within about half a second.<\/li>\n<li>To see all 8 opto inputs and all 8 EOL zones (with volts) at once, use the <strong>Live Inputs<\/strong> panel.<\/li>\n<\/ol>\n<h2>Drive the controller's aux points<\/h2>\n<ol>\n<li>Scroll to <strong>Controller Based Aux Inputs / Outputs<\/strong>. There are 4 controller aux outputs.<\/li>\n<li>Click a row's toggle to switch it.<\/li>\n<\/ol>\n<h2>Trigger a system output<\/h2>\n<p>The four global system outputs are on <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>, in <strong>System Outputs (ACS Global Triggers)<\/strong>.<\/p>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong> and expand <strong>System Outputs<\/strong>.<\/li>\n<li>Click <strong>Configure GPIO<\/strong> and set the relay channel for <strong>Power Fault Relay<\/strong>, <strong>Battery Fault Relay<\/strong>, <strong>System Tamper Relay<\/strong> and <strong>Fire Alarm Relay<\/strong>. A channel left unset shows <strong>UNCONFIGURED<\/strong>.<\/li>\n<\/ol>\n<p class=\"caution\"><strong>Caution:<\/strong> The next step switches the configured relay and sends the alarm to the controller.<\/p>\n<ol start=\"3\">\n<li>Click the output's button. It changes from <strong>NORMAL<\/strong> to <strong>FAULT<\/strong>, <strong>TAMPER ACTIVE<\/strong> or <strong>FIRE ALARM<\/strong>; click again to return to <strong>NORMAL<\/strong>.<\/li>\n<li>Click <strong>Save Configuration<\/strong> to keep the channels.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The relay dot and the controller's input event change together.<\/li>\n<li>A controller output you trigger shows on the matching monitored input row.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relays don't switch, or the page says the board isn't found<\/td>\n<td>See <a href=\"#a094\">094 IOplus not detected or relays stop responding<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>A monitored input never changes<\/td>\n<td>Check its Opto/Analog setting in <strong class=\"path\">Setup<i>›<\/i>I/O Mapping<\/strong>, and keep a browser page open.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a035\">035 Map I/O and spot relay conflicts (I/O Mapping)<\/a><\/li>\n<li><a href=\"#a049\">049 EOL supervision: the four zone states<\/a><\/li>\n<\/ul>", "text": "controls page: outputs, inputs and system outputs how to use the controls page to switch aether's relays by hand, watch the controller's outputs on the monitored inputs, and trigger the four system outputs. for testers checking wiring or driving single points.  summary the controls page is the manual panel for the ioplus hat. from it you switch aether's 8 relays by hand (each one drives a controller input), watch the 8 monitored inputs that read the controller's outputs, and drive the controller's aux points. use it to check wiring before a test. before you start the ioplus hat is detected and aether shows the pi as connected. aether's relays are wired to the controller inputs you want to drive (dps, rex, tamper and so on), and its opto inputs to the controller outputs you want to watch (lock relays, aux outputs). see 034 default i/o map . switch a relay by hand open access control › controls . find the relay in input group (relay outputs) . its rows are named device input 1–8 until you rename them in i/o mapping , and show the channel and type. screenshot to add: controls page with the relay group on the left and the monitored inputs on the right caution: the next step closes a real relay and changes a real input on the controller. click the row's button. it reads active and the dot turns green while the relay is closed. click it again to open the relay. watch the controller's outputs on the same page, look at output group (monitoring inputs) , rows device output 1–8 . each row shows its channel and whether it reads an opto or analog 0-10v input. supervised rows show the zone state (normal, alarm, trouble or tamper) instead of on/off. make the controller drive the output. the row changes within about half a second. to see all 8 opto inputs and all 8 eol zones (with volts) at once, use the live inputs panel. drive the controller's aux points scroll to controller based aux inputs / outputs . there are 4 controller aux outputs. click a row's toggle to switch it. trigger a system output the four global system outputs are on access control › doors , in system outputs (acs global triggers) . open access control › doors and expand system outputs . click configure gpio and set the relay channel for power fault relay , battery fault relay , system tamper relay and fire alarm relay . a channel left unset shows unconfigured . caution: the next step switches the configured relay and sends the alarm to the controller. click the output's button. it changes from normal to fault , tamper active or fire alarm ; click again to return to normal . click save configuration to keep the channels. check that it worked the relay dot and the controller's input event change together. a controller output you trigger shows on the matching monitored input row. if something goes wrong symptom what to do relays don't switch, or the page says the board isn't found see 094 ioplus not detected or relays stop responding . a monitored input never changes check its opto/analog setting in setup › i/o mapping , and keep a browser page open. related articles 034 default i/o map: relays, inputs, supervision channels 035 map i/o and spot relay conflicts (i/o mapping) 049 eol supervision: the four zone states "}, {"id": "a029", "num": "029", "title": "Set up a door: reader, DPS, REX and lock", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "How to set up a door on the Doors page: name, reader, the DPS and REX relays Aether drives, and the opto input that watches the controller's lock. For testers preparing door tests.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Each door on the <strong>Doors<\/strong> page stands in for a real door's field devices: a reader, a door position switch (DPS) and a request-to-exit (REX) button. Aether drives the controller's DPS and REX inputs and watches the controller's lock relay. You pick the door's reader and channels, then present cards and open or close the door from its card.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The reader is enrolled on the Pi (Wiegand or OSDP).<\/li>\n<li>The door is wired to the controller. In the default layout, Aether's <strong>REL 2n−1<\/strong> drives door <em>n<\/em>'s DPS input, <strong>REL 2n<\/strong> drives its REX input, and the controller's door <em>n<\/em> lock relay is wired to Aether's <strong>OPTO n<\/strong>. See <a href=\"#a034\">034<\/a>.<\/li>\n<li>For a door on an Azure board, see <a href=\"#a032\">032<\/a>.<\/li>\n<\/ul>\n<h2>Name the door and pick its reader<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>On the door's card, click the settings (gear) icon. <strong>Door Settings<\/strong> opens.<\/li>\n<li>On the <strong>Basic<\/strong> tab, enter a <strong>Door Name<\/strong>.<\/li>\n<li>In <strong>Reader<\/strong>, pick any enrolled Wiegand or OSDP reader, or an emulated board reader port.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Door Settings, Basic tab, with the Reader list open<\/span><\/div>\n<h2>Set the lock, DPS and REX<\/h2>\n<ol>\n<li>Open the <strong>Mandatory I/O<\/strong> tab.<\/li>\n<li>For the lock, set which input watches the controller's lock relay: an opto input (<strong>OPTO n<\/strong>) or an EOL zone. Aether never drives a watched lock. <span class=\"sme\">confirm the option names in <strong>Lock Signal<\/strong> on the Pi.<\/span><\/li>\n<li>Set the <strong>DPS<\/strong> and <strong>REX<\/strong> channels: a relay or a DAC output.<\/li>\n<li>Turn on <strong>Reverse Sense (Active at Rest)<\/strong> only if the controller expects that point active when idle.<\/li>\n<li>Click <strong>Save Settings<\/strong>. Aether refuses to save if two enabled doors use the same output.<\/li>\n<\/ol>\n<h3>Set doors 1–4 in one step<\/h3>\n<p><strong>Apply 4-door layout<\/strong> sets doors 1–4 to the default layout above. Click <strong>Save Configuration<\/strong> to keep it, or <strong>Load Configuration<\/strong> to undo.<\/p>\n<h2>Test the door<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> The DPS and REX buttons switch real relays and send real input changes to the controller.<\/p>\n<ol>\n<li>On the door card, click the DPS button to open and close the door.<\/li>\n<li>Click the REX button for a 1 s press. Shift+click latches it; Shift+click again releases it.<\/li>\n<li>In the reader line, click <strong>Present card<\/strong> (<strong>edit<\/strong> changes the card).<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The card shows one badge: <strong>LOCKED<\/strong>, <strong>UNLOCKED<\/strong>, <strong>OPEN<\/strong> or <strong>DISABLED<\/strong>, with a green border when unlocked and blue when open.<\/li>\n<li>A granted card switches the controller's lock relay, and the badge follows.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Save Settings<\/strong> is refused<\/td>\n<td>Another enabled door uses that output. Change or disable one.<\/td>\n<\/tr>\n<tr>\n<td>The controller doesn't see the card<\/td>\n<td>See <a href=\"#a105\">105<\/a> or <a href=\"#a096\">096<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>The lock badge never changes<\/td>\n<td>Check the lock relay is wired to the input the door watches, and keep a browser page open.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a031\">031 Save door settings so they survive a reboot<\/a><\/li>\n<li><a href=\"#a030\">030 Build a custom door event sequence<\/a><\/li>\n<li><a href=\"#a037\">037 Wire Aether to an NHP or NOP controller<\/a><\/li>\n<li><a href=\"#a013\">013 Add, edit and import OSDP readers (Bus &amp; readers)<\/a><\/li>\n<\/ul>", "text": "set up a door: reader, dps, rex and lock how to set up a door on the doors page: name, reader, the dps and rex relays aether drives, and the opto input that watches the controller's lock. for testers preparing door tests.  summary each door on the doors page stands in for a real door's field devices: a reader, a door position switch (dps) and a request-to-exit (rex) button. aether drives the controller's dps and rex inputs and watches the controller's lock relay. you pick the door's reader and channels, then present cards and open or close the door from its card. before you start the reader is enrolled on the pi (wiegand or osdp). the door is wired to the controller. in the default layout, aether's rel 2n−1 drives door n 's dps input, rel 2n drives its rex input, and the controller's door n lock relay is wired to aether's opto n . see 034 . for a door on an azure board, see 032 . name the door and pick its reader open access control › doors . on the door's card, click the settings (gear) icon. door settings opens. on the basic tab, enter a door name . in reader , pick any enrolled wiegand or osdp reader, or an emulated board reader port. screenshot to add: door settings, basic tab, with the reader list open set the lock, dps and rex open the mandatory i/o tab. for the lock, set which input watches the controller's lock relay: an opto input ( opto n ) or an eol zone. aether never drives a watched lock. confirm the option names in lock signal on the pi. set the dps and rex channels: a relay or a dac output. turn on reverse sense (active at rest) only if the controller expects that point active when idle. click save settings . aether refuses to save if two enabled doors use the same output. set doors 1–4 in one step apply 4-door layout sets doors 1–4 to the default layout above. click save configuration to keep it, or load configuration to undo. test the door caution: the dps and rex buttons switch real relays and send real input changes to the controller. on the door card, click the dps button to open and close the door. click the rex button for a 1 s press. shift+click latches it; shift+click again releases it. in the reader line, click present card ( edit changes the card). check that it worked the card shows one badge: locked , unlocked , open or disabled , with a green border when unlocked and blue when open. a granted card switches the controller's lock relay, and the badge follows. if something goes wrong symptom what to do save settings is refused another enabled door uses that output. change or disable one. the controller doesn't see the card see 105 or 096 . the lock badge never changes check the lock relay is wired to the input the door watches, and keep a browser page open. related articles 031 save door settings so they survive a reboot 030 build a custom door event sequence 037 wire aether to an nhp or nop controller 013 add, edit and import osdp readers (bus & readers) "}, {"id": "a030", "num": "030", "title": "Build a custom door event sequence", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "How to link a door's Custom Events to AEGIS Emulation workflows, convert old step lists and run events from the door card. For testers who repeat door sequences.", "sources": ["claude/source-frontend.md", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>A door's <strong>Custom Events<\/strong> are buttons on the door card that run a saved test sequence, such as \"present card, open, wait, close\". Each event links a workflow from the <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong> builder, so an event can do anything the builder can. Workflows are saved on the Pi and shared by every door and every browser.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The door is set up with its reader and I/O. See <a href=\"#a029\">029<\/a>.<\/li>\n<li>You know how to place blocks in the Emulation builder. See <a href=\"#a038\">038 Build a test run from blocks<\/a>.<\/li>\n<\/ul>\n<h2>Link a new workflow to an event<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>On the door card, click the settings (gear) icon, then open the <strong>Custom Events<\/strong> tab.<\/li>\n<li>Pick an event slot, turn on <strong>Enabled<\/strong> and enter a name, for example \"Valid entry\".<\/li>\n<li>Click <strong>New workflow<\/strong>. Aether saves the door and opens an empty builder named \"<door> · <event>\". A banner reads <strong>Editing <event> for <door><\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Emulation builder with the &quot;Editing … for …&quot; banner and Back to Doors button<\/span><\/div>\n<ol start=\"5\">\n<li>Build the sequence. In door, reader and Wait Input blocks, choose <strong>This door<\/strong> so the workflow acts on whichever door runs the event.<\/li>\n<li>Click <strong>Save<\/strong>. The workflow is linked to the event.<\/li>\n<li>Click <strong>Back to Doors<\/strong>.<\/li>\n<\/ol>\n<h2>Use an existing workflow<\/h2>\n<ol>\n<li>In the event slot, pick the workflow in <strong>Workflow<\/strong>.<\/li>\n<li>To change it, click <strong>Edit in builder<\/strong>. Edits change the workflow for every door that uses it.<\/li>\n<li>Click <strong>Save Settings<\/strong>.<\/li>\n<\/ol>\n<h2>Convert an old step list<\/h2>\n<p>Events made before workflows show <strong>This event uses the old step list<\/strong>.<\/p>\n<ol>\n<li>Click <strong>Convert to workflow<\/strong>. Aether saves an equivalent workflow, links it and clears the old steps.<\/li>\n<li>Check the new workflow in the builder. Toggle-I/O steps have no match, so they become a log line you need to replace.<\/li>\n<\/ol>\n<p>Events you have not converted still run as before.<\/p>\n<h2>Run the event<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Running an event switches real relays and sends real cards to the controller.<\/p>\n<ol>\n<li>On the door card, click the event button.<\/li>\n<li>Watch the run in the door's activity log and in the Emulation log, labelled with the door and event.<\/li>\n<\/ol>\n<p>Only one workflow runs at a time. If another run is active, the event does not start and the Doors log says which run is busy; stop it on <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong>.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The Emulation <strong>Execution Log<\/strong> shows each block with the door name.<\/li>\n<li>The controller logs the events the workflow caused.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A block logs that \"This door\" only works from a door event<\/td>\n<td>You ran the workflow from the builder. Run it from the door card, or pick a fixed door in that block.<\/td>\n<\/tr>\n<tr>\n<td>The event doesn't start<\/td>\n<td>Another workflow is running. Stop it on the Emulation page.<\/td>\n<\/tr>\n<tr>\n<td>A reader block says no reader matches<\/td>\n<td>Give the door a reader in Door Settings.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a038\">038 Build a test run from blocks (Emulation)<\/a><\/li>\n<li><a href=\"#a039\">039 Run, pause and schedule a workflow<\/a><\/li>\n<li><a href=\"#a029\">029 Set up a door: reader, strike, DPS and REX<\/a><\/li>\n<li><a href=\"#a031\">031 Save door settings so they survive a reboot<\/a><\/li>\n<\/ul>", "text": "build a custom door event sequence how to link a door's custom events to aegis emulation workflows, convert old step lists and run events from the door card. for testers who repeat door sequences.  summary a door's custom events are buttons on the door card that run a saved test sequence, such as \"present card, open, wait, close\". each event links a workflow from the aegis › emulation builder, so an event can do anything the builder can. workflows are saved on the pi and shared by every door and every browser. before you start the door is set up with its reader and i/o. see 029 . you know how to place blocks in the emulation builder. see 038 build a test run from blocks . link a new workflow to an event open access control › doors . on the door card, click the settings (gear) icon, then open the custom events tab. pick an event slot, turn on enabled and enter a name, for example \"valid entry\". click new workflow . aether saves the door and opens an empty builder named \" · \". a banner reads editing for . screenshot to add: emulation builder with the \"editing … for …\" banner and back to doors button build the sequence. in door, reader and wait input blocks, choose this door so the workflow acts on whichever door runs the event. click save . the workflow is linked to the event. click back to doors . use an existing workflow in the event slot, pick the workflow in workflow . to change it, click edit in builder . edits change the workflow for every door that uses it. click save settings . convert an old step list events made before workflows show this event uses the old step list . click convert to workflow . aether saves an equivalent workflow, links it and clears the old steps. check the new workflow in the builder. toggle-i/o steps have no match, so they become a log line you need to replace. events you have not converted still run as before. run the event caution: running an event switches real relays and sends real cards to the controller. on the door card, click the event button. watch the run in the door's activity log and in the emulation log, labelled with the door and event. only one workflow runs at a time. if another run is active, the event does not start and the doors log says which run is busy; stop it on aegis › emulation . check that it worked the emulation execution log shows each block with the door name. the controller logs the events the workflow caused. if something goes wrong symptom what to do a block logs that \"this door\" only works from a door event you ran the workflow from the builder. run it from the door card, or pick a fixed door in that block. the event doesn't start another workflow is running. stop it on the emulation page. a reader block says no reader matches give the door a reader in door settings. related articles 038 build a test run from blocks (emulation) 039 run, pause and schedule a workflow 029 set up a door: reader, strike, dps and rex 031 save door settings so they survive a reboot "}, {"id": "a031", "num": "031", "title": "Save door settings so they survive a reboot", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How door settings are saved on the Pi, when to press Save Configuration, and how to reload or reset doors. For anyone who needs a door setup to survive a reboot.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Door settings, system output channels, reader assignments and custom event links are saved on the Pi, so every browser sees the same doors and they come back after a reboot. Most changes save themselves when you click <strong>Save Settings<\/strong> in a door's settings. Some changes made straight on the Doors page need <strong>Save Configuration<\/strong>.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether shows the Pi as connected. A save made while the backend is offline does not reach the Pi.<\/li>\n<\/ul>\n<h2>Save after editing one door<\/h2>\n<ol>\n<li>On the door card, click the settings (gear) icon.<\/li>\n<li>Make your changes on any tab.<\/li>\n<li>Click <strong>Save Settings<\/strong>. The door configuration is written to the Pi.<\/li>\n<\/ol>\n<p>If two enabled doors would share an output, the save is refused and the conflict is listed. Fix it and save again.<\/p>\n<h2>Save changes made on the Doors page<\/h2>\n<p>Use this after <strong>Apply 4-door layout<\/strong>, after changing system output channels, or after enabling, disabling or deleting a door. <span class=\"sme\">confirm which card-level changes now save automatically on the Pi.<\/span><\/p>\n<ol>\n<li>Scroll to <strong>Configuration Management<\/strong> at the bottom of <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>Click <strong>Save Configuration<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Configuration Management box with Save Configuration, Load Configuration and Reset to Defaults<\/span><\/div>\n<h2>Undo unsaved changes<\/h2>\n<ol>\n<li>Click <strong>Load Configuration<\/strong>. The page reloads the doors last saved on the Pi.<\/li>\n<\/ol>\n<h2>Start again from defaults<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> This clears every door and the system output channels on the page. Click <strong>Save Configuration<\/strong> afterwards only if you want the defaults kept on the Pi.<\/p>\n<ol>\n<li>Click <strong>Reset to Defaults<\/strong>.<\/li>\n<li>Confirm the prompt.<\/li>\n<\/ol>\n<h2>Keep a copy off the Pi<\/h2>\n<p>Door settings are included in <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<i>›<\/i>Download backup<\/strong>, which saves every config file on the Pi in one file. See <a href=\"#a072\">072<\/a>.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>After <strong>Load Configuration<\/strong>, the log shows \"Door configuration restored from device (survives reboot)\".<\/li>\n<li>Open Aether in a second browser: it shows the same doors.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Log says the backend is not reachable and defaults are used<\/td>\n<td>The browser could not reach the Pi. See <a href=\"#a092\">092<\/a>, then load again.<\/td>\n<\/tr>\n<tr>\n<td>Save is refused<\/td>\n<td>Two enabled doors share an output. The banner at the top of the page lists them.<\/td>\n<\/tr>\n<tr>\n<td>Doors came back different after a reboot<\/td>\n<td>A change was made on the page but not saved. Make it again and click <strong>Save Configuration<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a029\">029 Set up a door: reader, strike, DPS and REX<\/a><\/li>\n<li><a href=\"#a030\">030 Build a custom door event sequence<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<\/ul>", "text": "save door settings so they survive a reboot how door settings are saved on the pi, when to press save configuration, and how to reload or reset doors. for anyone who needs a door setup to survive a reboot.  summary door settings, system output channels, reader assignments and custom event links are saved on the pi, so every browser sees the same doors and they come back after a reboot. most changes save themselves when you click save settings in a door's settings. some changes made straight on the doors page need save configuration . before you start aether shows the pi as connected. a save made while the backend is offline does not reach the pi. save after editing one door on the door card, click the settings (gear) icon. make your changes on any tab. click save settings . the door configuration is written to the pi. if two enabled doors would share an output, the save is refused and the conflict is listed. fix it and save again. save changes made on the doors page use this after apply 4-door layout , after changing system output channels, or after enabling, disabling or deleting a door. confirm which card-level changes now save automatically on the pi. scroll to configuration management at the bottom of access control › doors . click save configuration . screenshot to add: configuration management box with save configuration, load configuration and reset to defaults undo unsaved changes click load configuration . the page reloads the doors last saved on the pi. start again from defaults caution: this clears every door and the system output channels on the page. click save configuration afterwards only if you want the defaults kept on the pi. click reset to defaults . confirm the prompt. keep a copy off the pi door settings are included in setup › system & backup › download backup , which saves every config file on the pi in one file. see 072 . check that it worked after load configuration , the log shows \"door configuration restored from device (survives reboot)\". open aether in a second browser: it shows the same doors. if something goes wrong symptom what to do log says the backend is not reachable and defaults are used the browser could not reach the pi. see 092 , then load again. save is refused two enabled doors share an output. the banner at the top of the page lists them. doors came back different after a reboot a change was made on the page but not saved. make it again and click save configuration . related articles 029 set up a door: reader, strike, dps and rex 030 build a custom door event sequence 072 system & backup: health, backup and restore "}, {"id": "a032", "num": "032", "title": "Drive a door on an Azure board (Aether/Azure switch)", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to switch a door from Aether's own I/O to an emulated Azure downstream board and pick its board and reader port. For testers running doors on Controller Emulator boards.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>A door can run on Aether's own IOplus I/O or on an emulated Azure downstream board from the <strong>Controller Emulator<\/strong>. Switch a door to <strong>Azure<\/strong> when the controller expects the door on a board such as an RI2MS, or when Aether's own relays are already used. The door's DPS, REX and reader then travel to the controller over OSDP instead of wires.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Controller Emulator bus is running and has a board at the address you want. See <a href=\"#a042\">042<\/a>.<\/li>\n<li>The board is enrolled on the controller.<\/li>\n<li>For card reads, the board is a reader model (RI2MS or RI4S).<\/li>\n<\/ul>\n<h2>Switch the door to an Azure board<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Doors<\/strong>.<\/li>\n<li>In the door card's footer, set the switch from <strong>Aether<\/strong> to <strong>Azure<\/strong>. <span class=\"sme\">confirm the switch labels on the Pi; older builds show an <strong>I/O Source<\/strong> list.<\/span><\/li>\n<li>In <strong>Board<\/strong>, pick the emulated board. Each entry shows its address and model, and \"(offline)\" if the controller is not polling it.<\/li>\n<li>In <strong>Reader Port<\/strong>, pick the board's reader port for this door.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Door card footer set to Azure, with the Board and Reader Port lists<\/span><\/div>\n<ol start=\"5\">\n<li>Open the door settings and, on <strong>Mandatory I/O<\/strong>, pick the board input or output for the lock, DPS and REX. <span class=\"sme\">confirm the field names for board points in Mandatory I/O.<\/span><\/li>\n<li>Click <strong>Save Settings<\/strong>.<\/li>\n<\/ol>\n<h2>Test it<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> These steps change inputs on the emulated board, which the controller treats as real door events.<\/p>\n<ol>\n<li>Click the door's DPS or REX button. The board reports the input change to the controller on its next poll.<\/li>\n<li>Click <strong>Present card<\/strong>. The card is sent through the board's reader port.<\/li>\n<li>When the controller switches the board output used as the lock, the door badge follows.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The card header says the door runs on an Azure board.<\/li>\n<li>On <strong>Controller Emulator<\/strong>, the board's inputs change when you use the door, and its outputs light when the controller drives them.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The board shows \"(offline)\"<\/td>\n<td>The controller is not polling that address. Check the bus wiring and the board's enrollment.<\/td>\n<\/tr>\n<tr>\n<td>No board in the list<\/td>\n<td>Start the Controller Emulator bus and add the board first.<\/td>\n<\/tr>\n<tr>\n<td>Card reaches the board but the controller ignores it<\/td>\n<td>Check the board model has reader ports and the reader port is the one the controller expects.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Doors on Azure boards don't use Aether's relays, so they are left out of the shared-output check on the Doors page.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a044\">044 Send a card or keys through a board's reader port<\/a><\/li>\n<li><a href=\"#a029\">029 Set up a door: reader, strike, DPS and REX<\/a><\/li>\n<\/ul>", "text": "drive a door on an azure board (aether/azure switch) how to switch a door from aether's own i/o to an emulated azure downstream board and pick its board and reader port. for testers running doors on controller emulator boards.  summary a door can run on aether's own ioplus i/o or on an emulated azure downstream board from the controller emulator . switch a door to azure when the controller expects the door on a board such as an ri2ms, or when aether's own relays are already used. the door's dps, rex and reader then travel to the controller over osdp instead of wires. before you start the controller emulator bus is running and has a board at the address you want. see 042 . the board is enrolled on the controller. for card reads, the board is a reader model (ri2ms or ri4s). switch the door to an azure board open access control › doors . in the door card's footer, set the switch from aether to azure . confirm the switch labels on the pi; older builds show an i/o source list. in board , pick the emulated board. each entry shows its address and model, and \"(offline)\" if the controller is not polling it. in reader port , pick the board's reader port for this door. screenshot to add: door card footer set to azure, with the board and reader port lists open the door settings and, on mandatory i/o , pick the board input or output for the lock, dps and rex. confirm the field names for board points in mandatory i/o. click save settings . test it caution: these steps change inputs on the emulated board, which the controller treats as real door events. click the door's dps or rex button. the board reports the input change to the controller on its next poll. click present card . the card is sent through the board's reader port. when the controller switches the board output used as the lock, the door badge follows. check that it worked the card header says the door runs on an azure board. on controller emulator , the board's inputs change when you use the door, and its outputs light when the controller drives them. if something goes wrong symptom what to do the board shows \"(offline)\" the controller is not polling that address. check the bus wiring and the board's enrollment. no board in the list start the controller emulator bus and add the board first. card reaches the board but the controller ignores it check the board model has reader ports and the reader port is the one the controller expects. doors on azure boards don't use aether's relays, so they are left out of the shared-output check on the doors page. related articles 041 what the controller emulator does 042 add a downstream board and drive its i/o 044 send a card or keys through a board's reader port 029 set up a door: reader, strike, dps and rex "}, {"id": "a033", "num": "033", "title": "Emulate an elevator: floors, call button, relays", "area": "Doors, I/O and IOplus", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "How to set up and ride the emulated elevator: grant modes, per-floor tracking, grant, button and hall-call points, and Auto-assign. For testers of elevator destination lockout.", "sources": ["claude/source-frontend.md", "Resistor calibration tool", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Elevator<\/strong> page emulates one 8-floor elevator for destination-lockout tests. A rider presents a card at the car reader, the controller grants floors, and Aether shows which floor buttons work. Aether drives a tracking output as the car moves and pulses an output for every car button and hall call press.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The car reader is enrolled on the Pi (Wiegand or OSDP).<\/li>\n<li>You know which Aether outputs feed the controller's floor tracking and button inputs, and which Aether inputs watch the controller's floor grant relays.<\/li>\n<\/ul>\n<h2>Choose who grants floors<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Access Control<i>›<\/i>Elevator<\/strong>.<\/li>\n<li>Click the settings (gear) icon.<\/li>\n<li>Under <strong>Who grants floors<\/strong>, pick one:\n   - <strong>Open (no controller)<\/strong>: every floor button works. A grant input that turns on still lights its floor. This is the default, for testing with nothing wired.\n   - <strong>Access controller<\/strong>: secured floors stay locked until the controller turns on that floor's grant input.\n   - <strong>Simulated grants<\/strong>: a card grants its floors from this page for a few seconds.<\/li>\n<li>Pick the <strong>Reader<\/strong> and the card format, facility code and card number to send.<\/li>\n<\/ol>\n<h2>Set each floor's outputs and inputs<\/h2>\n<ol>\n<li>In Settings, for each floor set:\n   - the name, and whether the floor is secured;\n   - <strong>Tracking<\/strong>: a relay, O.D. output, DAC output or emulated board input. A DAC output gives 0 V for on and a rest voltage (default 5 V) for off;\n   - <strong>Grant<\/strong>: an opto input, an EOL zone or an emulated board output;\n   - <strong>Button<\/strong> and <strong>Hall call<\/strong> outputs, pulsed for <strong>Button pulse (ms)<\/strong> (default 500 ms).<\/li>\n<li>Or click the <strong>Auto-assign<\/strong> buttons to fill them in. Tracking uses a running emulated board first, then O.D. 1–4, then DAC 1–4; grants use EOL zones 1–8. <span class=\"sme\">confirm the Auto-assign button names and the defaults they use.<\/span><\/li>\n<li>A floor sharing a door's output shows a note such as \"also Main Entrance DPS\".<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Elevator Settings with the per-floor Tracking, Grant, Button and Hall call pickers<\/span><\/div>\n<p><span class=\"sme\">confirm whether Elevator settings are now saved on the Pi or only in this browser.<\/span><\/p>\n<h2>Ride the elevator<\/h2>\n<p class=\"caution\"><strong>Caution:<\/strong> Moving the car and pressing buttons switch real tracking and button outputs on the controller.<\/p>\n<ol>\n<li>Click <strong>Present card<\/strong>.<\/li>\n<li>Press a floor button. Granted floors glow teal; a pressed floor lights amber and the car goes there.<\/li>\n<li>Press a hall call button in the shaft view to call the car.<\/li>\n<li>Use <strong>Door open<\/strong>, <strong>Door close<\/strong> and <strong>Stop<\/strong> (which becomes <strong>Resume<\/strong>) as needed.<\/li>\n<li>For a quick check, use a Demo button such as <strong>All floors<\/strong> or <strong>Round trip<\/strong>.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>In the shaft view, each floor's <strong>TRK<\/strong> light shows the tracking output and <strong>ACU<\/strong> shows the grant input.<\/li>\n<li>The <strong>Activity<\/strong> log lists each card, press, pulse and refusal.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"refused: secured floor, no grant\"<\/td>\n<td>You're in <strong>Access controller<\/strong> mode and the controller has not turned on that floor's grant input. Check the grant wiring, or switch to <strong>Open (no controller)<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>Moving the car switches a door input<\/td>\n<td>A floor's tracking output is also used by a door. Pick another output.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a035\">035 Map I/O and spot relay conflicts (I/O Mapping)<\/a><\/li>\n<li><a href=\"#a042\">042 Add a downstream board and drive its I/O<\/a><\/li>\n<li><a href=\"#a049\">049 EOL supervision: the four zone states<\/a><\/li>\n<\/ul>", "text": "emulate an elevator: floors, call button, relays how to set up and ride the emulated elevator: grant modes, per-floor tracking, grant, button and hall-call points, and auto-assign. for testers of elevator destination lockout.  summary the elevator page emulates one 8-floor elevator for destination-lockout tests. a rider presents a card at the car reader, the controller grants floors, and aether shows which floor buttons work. aether drives a tracking output as the car moves and pulses an output for every car button and hall call press. before you start the car reader is enrolled on the pi (wiegand or osdp). you know which aether outputs feed the controller's floor tracking and button inputs, and which aether inputs watch the controller's floor grant relays. choose who grants floors open access control › elevator . click the settings (gear) icon. under who grants floors , pick one: - open (no controller) : every floor button works. a grant input that turns on still lights its floor. this is the default, for testing with nothing wired. - access controller : secured floors stay locked until the controller turns on that floor's grant input. - simulated grants : a card grants its floors from this page for a few seconds. pick the reader and the card format, facility code and card number to send. set each floor's outputs and inputs in settings, for each floor set: - the name, and whether the floor is secured; - tracking : a relay, o.d. output, dac output or emulated board input. a dac output gives 0 v for on and a rest voltage (default 5 v) for off; - grant : an opto input, an eol zone or an emulated board output; - button and hall call outputs, pulsed for button pulse (ms) (default 500 ms). or click the auto-assign buttons to fill them in. tracking uses a running emulated board first, then o.d. 1–4, then dac 1–4; grants use eol zones 1–8. confirm the auto-assign button names and the defaults they use. a floor sharing a door's output shows a note such as \"also main entrance dps\". screenshot to add: elevator settings with the per-floor tracking, grant, button and hall call pickers confirm whether elevator settings are now saved on the pi or only in this browser. ride the elevator caution: moving the car and pressing buttons switch real tracking and button outputs on the controller. click present card . press a floor button. granted floors glow teal; a pressed floor lights amber and the car goes there. press a hall call button in the shaft view to call the car. use door open , door close and stop (which becomes resume ) as needed. for a quick check, use a demo button such as all floors or round trip . check that it worked in the shaft view, each floor's trk light shows the tracking output and acu shows the grant input. the activity log lists each card, press, pulse and refusal. if something goes wrong symptom what to do \"refused: secured floor, no grant\" you're in access controller mode and the controller has not turned on that floor's grant input. check the grant wiring, or switch to open (no controller) . moving the car switches a door input a floor's tracking output is also used by a door. pick another output. related articles 035 map i/o and spot relay conflicts (i/o mapping) 042 add a downstream board and drive its i/o 049 eol supervision: the four zone states "}, {"id": "a034", "num": "034", "title": "Default I/O map: relays, inputs, supervision channels", "area": "Doors, I/O and IOplus", "type": "Reference", "audience": "Both", "priority": "P1", "status": "Needs SME", "brief": "Reference table of Aether's default channel use: door DPS/REX relays, watched lock inputs, analog EOL zones, elevator outputs, system outputs and Wiegand pins. For anyone wiring or checking a bench.", "sources": ["claude/board-blueprints-aether.md", "Aether product QA testing", "Resistor calibration tool"], "html": "<h2>Summary<\/h2>\n<p>This page lists what each IOplus channel does in Aether's default layout. Aether stands in for the field devices around a controller: <strong>its relays drive the controller's inputs<\/strong>, and <strong>its opto and analog inputs watch the controller's outputs<\/strong>. The layout below is what <strong>Apply 4-door layout<\/strong> on the Doors page and the Board Blueprints auto-wire produce.<\/p>\n<p>Channels are numbered 1–8 on screen and on the HAT. The API counts from 0, so REL 1 is channel 0 in API calls.<\/p>\n<h2>Door wiring (doors 1–4)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Door <em>n<\/em> signal<\/th>\n<th
