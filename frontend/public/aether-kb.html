<script>(function () {
  // Follow Aether's theme when shown inside Aether; otherwise keep the page's own toggle.
  var embedded = false; try { embedded = window.parent && window.parent !== window && !!window.parent.document; } catch (e) {}
  function read() {
    var t = null;
    try { t = embedded ? window.parent.document.documentElement.dataset.theme : null; } catch (e) {}
    if (!t) { try { t = localStorage.getItem('hv-theme'); } catch (e) {} }
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  }
  read();
  if (embedded) {
    document.documentElement.classList.add('in-aether');
    try { window.parent.addEventListener('hv-theme', read); } catch (e) {}
    try { new MutationObserver(read).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
  }
  window.addEventListener('storage', function (e) { if (e.key === 'hv-theme') read(); });
})();</script>

<style>
/* Layout: HV app shell — top bar, 2-depth side menu by area, one reading column. Colors follow Aether's HV tokens. */
:root{
  --surface:#EEEFF1; --widget:#FFFFFF; --panel:#F6F7F8; --line:rgba(0,0,0,.08); --line-strong:rgba(0,0,0,.21);
  --text:#000; --text-2:rgba(0,0,0,.77); --text-3:rgba(0,0,0,.49);
  --brand:#F37321; --brand-tint:rgba(243,115,33,.14); --brand-fg:#B4510F;
  --warn-tint:rgba(255,164,0,.16); --warn-fg:#9E4C00; --warn-line:rgba(255,164,0,.45);
  --info-tint:rgba(65,100,241,.12); --info-fg:#2F4FD0;
  --ok-tint:rgba(0,136,71,.12); --ok-fg:#006B38;
  --err-tint:rgba(228,37,37,.10); --err-fg:#B91C1C; --err-line:rgba(228,37,37,.4);
  --hover:rgba(0,0,0,.04); --code-bg:rgba(0,0,0,.05);
  --f-sans:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Noto Sans Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --bar:56px; --nav:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#101011; --widget:#202021; --panel:#181819; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.21);
  --text:#fff; --text-2:rgba(255,255,255,.77); --text-3:rgba(255,255,255,.49);
  --brand-tint:rgba(243,115,33,.18); --brand-fg:#F79A5C;
  --warn-tint:rgba(255,180,0,.14); --warn-fg:#FFC640; --warn-line:rgba(255,180,0,.4);
  --info-tint:rgba(72,123,255,.16); --info-fg:#8DADFF;
  --ok-tint:rgba(0,185,96,.16); --ok-fg:#4AD99A;
  --err-tint:rgba(250,77,77,.14); --err-fg:#FF8A8A; --err-line:rgba(250,77,77,.45);
  --hover:rgba(255,255,255,.04); --code-bg:rgba(255,255,255,.07); color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#101011; --widget:#202021; --panel:#181819; --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.21);
  --text:#fff; --text-2:rgba(255,255,255,.77); --text-3:rgba(255,255,255,.49);
  --brand-tint:rgba(243,115,33,.18); --brand-fg:#F79A5C;
  --warn-tint:rgba(255,180,0,.14); --warn-fg:#FFC640; --warn-line:rgba(255,180,0,.4);
  --info-tint:rgba(72,123,255,.16); --info-fg:#8DADFF;
  --ok-tint:rgba(0,185,96,.16); --ok-fg:#4AD99A;
  --err-tint:rgba(250,77,77,.14); --err-fg:#FF8A8A; --err-line:rgba(250,77,77,.45);
  --hover:rgba(255,255,255,.04); --code-bg:rgba(255,255,255,.07); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--surface);color:var(--text);font:400 15px/1.6 var(--f-sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--widget)}
a{color:var(--brand-fg)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
button,input,select{font:inherit;color:inherit}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar);display:flex;align-items:center;gap:12px;
  background:var(--widget);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex:none}
.mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand b{font-weight:700;font-size:16px;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--text-3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.search{flex:1;min-width:0;max-width:520px;margin-left:auto;position:relative}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);padding:0 12px 0 34px}
.search input:focus{outline:none;border-color:var(--text)}
.search svg{position:absolute;left:10px;top:10px;width:16px;height:16px;stroke:var(--text-3)}
.iconbtn{flex:none;height:36px;min-width:36px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0 8px}
.iconbtn:hover{background:var(--hover)}
.iconbtn svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:1.8}
#menuBtn{display:none}

/* shell */
.shell{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:calc(100vh - var(--bar))}
nav{background:var(--widget);border-right:1px solid var(--line);position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));
  height:calc(100vh - var(--bar) - env(safe-area-inset-top,0px));overflow:auto;padding:12px 10px 24px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.chip{border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--text-2)}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--brand-tint);border-color:rgba(243,115,33,.5);color:var(--brand-fg);font-weight:600}
.navtop{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px}
.navtop:hover{background:var(--hover)}
.navtop[aria-current="page"]{background:var(--brand-tint);color:var(--brand-fg)}
details.area{margin-top:2px}
details.area summary{list-style:none;cursor:pointer;padding:7px 10px;border-radius:8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
details.area summary::-webkit-details-marker{display:none}
details.area summary:hover{background:var(--hover)}
details.area summary .caret{width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2;transition:transform .15s;flex:none}
details.area[open] summary .caret{transform:rotate(90deg)}
details.area summary .n{margin-left:auto;font-size:12px;color:var(--text-3);font-weight:500;font-variant-numeric:tabular-nums}
.alist{list-style:none;margin:0 0 6px;padding:0}
.alist a{display:flex;gap:8px;align-items:baseline;padding:5px 10px 5px 32px;border-radius:8px;text-decoration:none;color:var(--text-2);font-size:13.5px;line-height:1.35}
.alist a:hover{background:var(--hover);color:var(--text)}
.alist a[aria-current="page"]{background:var(--brand-tint);color:var(--text);font-weight:600}
.alist .num{font:500 11.5px var(--f-mono);color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.dot{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.Draft{background:var(--info-fg)} .dot.Needs{background:#FFA400} .dot.Ready,.dot.Published{background:var(--ok-fg)}

main{min-width:0;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:760px;margin:0 auto}

/* article */
.crumb{font-size:13px;color:var(--text-3);margin-bottom:6px}
.crumb a{color:var(--text-3);text-decoration:none}.crumb a:hover{color:var(--text)}
h1{font-size:28px;line-height:36px;font-weight:700;margin:0 0 10px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--hover);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
.badge.st-Draft{background:var(--info-tint);color:var(--info-fg);box-shadow:none}
.badge.st-Needs{background:var(--warn-tint);color:var(--warn-fg);box-shadow:none}
.badge.st-Ready,.badge.st-Published{background:var(--ok-tint);color:var(--ok-fg);box-shadow:none}
.badge.p1{background:var(--brand-tint);color:var(--brand-fg);box-shadow:none}
.brief{color:var(--text-2);font-size:15.5px;border-left:3px solid var(--line-strong);padding:2px 0 2px 14px;margin:0 0 22px}
.article{background:var(--widget);border:1px solid var(--line);border-radius:12px;padding:8px 32px 28px}
.article h2{font-size:20px;line-height:28px;margin:28px 0 8px;font-weight:700;text-wrap:balance}
.article h3{font-size:16px;margin:20px 0 6px}
.article p,.article li{color:var(--text-2)}
.article strong{color:var(--text);font-weight:600}
.article ol,.article ul{padding-left:22px}
.article li{margin:4px 0}
.article li::marker{color:var(--text-3);font-variant-numeric:tabular-nums}
.article code{font:500 13px var(--f-mono);background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.article pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;position:relative}
.article pre code{background:none;padding:0;font-size:13px;line-height:1.55;overflow-wrap:normal;white-space:pre}
.copy{position:absolute;top:6px;right:6px;font-size:11.5px;border:1px solid var(--line-strong);background:var(--widget);border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--text-2)}
.tablewrap{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
.article table{border-collapse:collapse;width:100%;font-size:14px}
.article th{background:var(--panel);text-align:left;font-weight:600;color:var(--text)}
.article th,.article td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.article tr:last-child td{border-bottom:0}
.path{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px;font-weight:600;color:var(--text)}
.path i{font-style:normal;color:var(--text-3);font-weight:400}
.caution{background:var(--err-tint);border:1px solid var(--err-line);border-radius:8px;padding:10px 14px;margin:14px 0}
.caution strong:first-child{color:var(--err-fg)}
.sme{background:var(--warn-tint);color:var(--warn-fg);border:1px dashed var(--warn-line);border-radius:6px;padding:0 6px;font-size:13px;font-weight:500}
.sme::before{content:"SME ";font-weight:700;letter-spacing:.04em}
.shot{display:flex;gap:10px;align-items:flex-start;border:1px dashed var(--line-strong);border-radius:8px;padding:10px 12px;margin:10px 0;color:var(--text-3);font-size:13px;background:var(--panel)}
.shot svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:1.6;flex:none;margin-top:1px}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.foot a{display:flex;flex-direction:column;text-decoration:none;color:var(--text);background:var(--widget);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:48%;min-width:0;font-weight:600;font-size:14px}
.foot a small{color:var(--text-3);font-weight:500;font-size:12px}
.foot a:hover{border-color:var(--line-strong)}
.foot .next{margin-left:auto;text-align:right}
.src{margin-top:14px;font-size:12px;color:var(--text-3)}

/* home */
.hero h1{font-size:32px;line-height:40px}
.lead{color:var(--text-2);font-size:16px;max-width:64ch;margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 26px}
.stat{background:var(--widget);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sect{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:26px 0 10px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.areacard{background:var(--widget);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px}
.areacard:hover{border-color:var(--line-strong)}
.areacard b{font-size:15px}
.areacard small{color:var(--text-3);font-size:12.5px;font-variant-numeric:tabular-nums}
.bar2{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--hover)}
.bar2 i{display:block}
.bar2 .d{background:var(--info-fg)} .bar2 .s{background:#FFA400} .bar2 .r{background:var(--ok-fg)}
.list{background:var(--widget);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--text)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row .num{font:500 12px var(--f-mono);color:var(--text-3);flex:none;width:30px}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--text-3);font-size:12.5px;margin-top:2px;overflow-wrap:anywhere}
.row mark{background:var(--brand-tint);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--text-3);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:grid}
  nav{position:fixed;z-index:25;left:0;top:calc(var(--bar) + env(safe-area-inset-top,0px));width:min(320px,88vw);
    box-shadow:0 12px 32px rgba(0,0,0,.25);transform:translateX(-105%);transition:transform .2s}
  nav.open{transform:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .article{padding:4px 18px 22px}
  .brand small{display:none}
}
@media (max-width:520px){.brand b{display:none} h1{font-size:24px;line-height:32px}.foot a{max-width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<script id="kb" type="application/json">{"title": "Aether Knowledge Base", "brand": "Aether KB", "heading": "Aether Knowledge Base", "lead": "How to set up, test with and troubleshoot Aether, the Raspberry Pi access-control test kit. Draft articles: anything marked SME still needs confirming on a real Pi.", "areas": [{"name": "Getting started", "slug": "getting-started"}, {"name": "Readers and protocols", "slug": "readers"}, {"name": "Doors, I/O and IOplus", "slug": "doors-io"}, {"name": "Emulation, Controller Emulator and automations", "slug": "emulation-automation"}, {"name": "Network switch, SUNAPI and VMS", "slug": "switch-sunapi-vms"}, {"name": "Firmware, updates and system", "slug": "firmware-system"}, {"name": "Tools", "slug": "tools"}, {"name": "Troubleshooting", "slug": "troubleshooting"}], "articles": [{"id": "a001", "num": "001", "title": "What Aether is and what it emulates", "area": "Getting started", "type": "Concept", "audience": "Both", "priority": "P1", "status": "Draft", "brief": "Explains what the Aether test kit is, what hardware and devices it stands in for, and how you work with it. For anyone new to Aether.", "sources": ["Resistor calibration tool", "Aether features presentation", "Export Figma GUI guidelines"], "html": "<h2>Summary<\/h2>\n<p>Aether is an access-control test kit built on a Raspberry Pi 5. It stands in for the doors, readers and downstream boards around a real controller, so you can run access tests on a bench without a full site. You use it from a web browser on the same network.<\/p>\n<h2>What Aether emulates<\/h2>\n<p>One kit can stand in for:<\/p>\n<ul>\n<li><strong>Up to 8 doors.<\/strong> Aether's relays drive the controller's door inputs (DPS, REX), and its opto inputs watch the controller's lock relay outputs.<\/li>\n<li><strong>One 8-floor elevator<\/strong>, with per-floor tracking outputs, grant inputs, and car-button and hall-call outputs.<\/li>\n<li><strong>Four onboard Wiegand readers<\/strong> (R1–R4) that send cards and keypad entries to the controller.<\/li>\n<li><strong>OSDP readers<\/strong> on RS-485. Aether answers the controller's polls, sends card reads and shows the LED and buzzer commands it gets back.<\/li>\n<li><strong>Azure downstream boards<\/strong>, through the <strong>Controller Emulator<\/strong>.<\/li>\n<li>An optional <strong>NFC reader<\/strong> (PN532) that can pass real cards on as OSDP reads.<\/li>\n<\/ul>\n<h2>What else it does<\/h2>\n<p>Aether also helps around a test:<\/p>\n<ul>\n<li><strong>OSDP Trace<\/strong> records and decodes an OSDP bus, and exports it for a manufacturer.<\/li>\n<li><strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong> runs test sequences built from blocks, now or on a schedule, and <strong class=\"path\">AEGIS<i>›<\/i>Automation<\/strong> runs WHEN/IF/THEN rules.<\/li>\n<li><strong class=\"path\">Setup<i>›<\/i>Device Firmware<\/strong> installs Aether updates, and the OSDP <strong>Firmware<\/strong> tab updates real readers.<\/li>\n<li><strong>Tools<\/strong> includes the OnCAFE Console, VMS Stream (Aether as an RTSP camera), Switch Ports, the SUNAPI Console, OSDP Academy and KB Studio.<\/li>\n<li><strong>Reports<\/strong> holds audit, system and emulation logs, and <strong>Log Analytics<\/strong> grades controller logs.<\/li>\n<\/ul>\n<h2>How it fits together<\/h2>\n<p>The Pi runs a backend service (<code>aether-backend<\/code>) on port 3001. It drives a Sequent Microsystems <strong>IOplus<\/strong> HAT for relays and inputs, RS-485 adapters for OSDP, and Pi GPIO pins for Wiegand. The web app talks to that backend, so every browser that opens the Pi sees the same live state. Several kits can be run from one browser in Cluster mode.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Aether home page with the sidebar open, showing Access Control, Readers, AEGIS, Setup and Tools<\/span><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a002\">002 Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters<\/a><\/li>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a009\">009 How OSDP reader emulation works<\/a><\/li>\n<li><a href=\"#a041\">041 What the Controller Emulator does<\/a><\/li>\n<\/ul>", "text": "what aether is and what it emulates explains what the aether test kit is, what hardware and devices it stands in for, and how you work with it. for anyone new to aether.  summary aether is an access-control test kit built on a raspberry pi 5. it stands in for the doors, readers and downstream boards around a real controller, so you can run access tests on a bench without a full site. you use it from a web browser on the same network. what aether emulates one kit can stand in for: up to 8 doors. aether's relays drive the controller's door inputs (dps, rex), and its opto inputs watch the controller's lock relay outputs. one 8-floor elevator , with per-floor tracking outputs, grant inputs, and car-button and hall-call outputs. four onboard wiegand readers (r1–r4) that send cards and keypad entries to the controller. osdp readers on rs-485. aether answers the controller's polls, sends card reads and shows the led and buzzer commands it gets back. azure downstream boards , through the controller emulator . an optional nfc reader (pn532) that can pass real cards on as osdp reads. what else it does aether also helps around a test: osdp trace records and decodes an osdp bus, and exports it for a manufacturer. aegis › emulation runs test sequences built from blocks, now or on a schedule, and aegis › automation runs when/if/then rules. setup › device firmware installs aether updates, and the osdp firmware tab updates real readers. tools includes the oncafe console, vms stream (aether as an rtsp camera), switch ports, the sunapi console, osdp academy and kb studio. reports holds audit, system and emulation logs, and log analytics grades controller logs. how it fits together the pi runs a backend service ( aether-backend ) on port 3001. it drives a sequent microsystems ioplus hat for relays and inputs, rs-485 adapters for osdp, and pi gpio pins for wiegand. the web app talks to that backend, so every browser that opens the pi sees the same live state. several kits can be run from one browser in cluster mode. screenshot to add: aether home page with the sidebar open, showing access control, readers, aegis, setup and tools related articles 002 aether hardware: pi 5, sequent ioplus, usb-rs485 adapters 003 open aether in a browser 004 find your way around: sidebar, page tabs, last page 009 how osdp reader emulation works 041 what the controller emulator does "}, {"id": "a002", "num": "002", "title": "Aether hardware: Pi 5, Sequent IOplus, USB-RS485 adapters", "area": "Getting started", "type": "Reference", "audience": "Both", "priority": "P1", "status": "Needs SME", "brief": "Lists the parts of an Aether kit, what each one does and how the Pi sees it. For anyone wiring, checking or replacing kit hardware.", "sources": ["Resistor calibration tool", "Aether product QA testing", "Aether features presentation"], "html": "<h2>Summary<\/h2>\n<p>An Aether kit is a Raspberry Pi 5 with a Sequent Microsystems IOplus HAT, one or more RS-485 adapters for OSDP, and wiring for four Wiegand readers. This page lists each part, what Aether uses it for and how it shows up on the Pi.<\/p>\n<h2>Parts of the kit<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What Aether uses it for<\/th>\n<th>How the Pi sees it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Raspberry Pi 5<\/td>\n<td>Runs the backend (<code>aether-backend<\/code>, port 3001), the web app and the VMS stream (<code>aether-stream<\/code>)<\/td>\n<td>Aether folder <code>/home/aether/Desktop/Aether/M1.2.2<\/code><\/td>\n<\/tr>\n<tr>\n<td>Sequent Microsystems IOplus HAT<\/td>\n<td>8 relays (drive the controller's inputs: DPS, REX, tamper), 8 opto inputs (watch the controller's outputs: lock relay, aux), 8 analog inputs (EOL supervised zones)<\/td>\n<td>I2C bus. <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong> shows its hardware and firmware version and I2C health<\/td>\n<\/tr>\n<tr>\n<td>IOplus RS-485 terminals<\/td>\n<td>Onboard OSDP bus<\/td>\n<td><code>/dev/ttyAMA0<\/code> (the default OSDP port)<\/td>\n<\/tr>\n<tr>\n<td>USB-RS485 adapters<\/td>\n<td>More OSDP buses, firmware uploads, enrollment, trace<\/td>\n<td><code>/dev/ttyACM*<\/code> or <code>/dev/ttyUSB*<\/code>, listed by name on <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Pi GPIO header<\/td>\n<td>Four Wiegand readers, R1–R4<\/td>\n<td>D0/D1 on GPIO 17/27, 22/23, 24/25 and 5/6<\/td>\n<\/tr>\n<tr>\n<td>PN532 NFC reader (optional)<\/td>\n<td>Reads real cards; can pass them on as OSDP reads<\/td>\n<td>Shown as <strong class=\"path\">Readers<i>›<\/i>NFC<\/strong> only when enabled<\/td>\n<\/tr>\n<tr>\n<td>Case<\/td>\n<td>Holds the Pi and HAT, with a 40 mm fan; DIN-rail or wall mount<\/td>\n<td><span class=\"sme\">confirm the current case build<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Default I/O use<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Channel (UI numbers 1–8)<\/th>\n<th>Default use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Relay 2n−1 (1, 3, 5, 7)<\/td>\n<td>Door <em>n<\/em> DPS input on the controller (doors 1–4)<\/td>\n<\/tr>\n<tr>\n<td>Relay 2n (2, 4, 6, 8)<\/td>\n<td>Door <em>n<\/em> REX input on the controller (doors 1–4)<\/td>\n<\/tr>\n<tr>\n<td>Opto inputs 1–4<\/td>\n<td>Watch door 1–4 lock relay on the controller (Aether never drives them)<\/td>\n<\/tr>\n<tr>\n<td>Analog inputs 1–8<\/td>\n<td>EOL supervised zones 1–8<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>This is the layout from <strong>Apply 4-door layout<\/strong> on the Doors page and from Blueprints Auto-wire. Aether's relays never drive a lock; they stand in for the door's sensors and buttons. The API numbers channels 0–7. See <a href=\"#a034\">034 Default I/O map<\/a> for the full map.<\/p>\n<h2>Electrical notes<\/h2>\n<ul>\n<li>Pi GPIO is 3.3 V logic. A 5 V Wiegand line needs a level shifter or an open-collector buffer.<\/li>\n<li>EOL zone defaults (1k/2.2k): TAMPER 0–0.103 V, ALARM 0.104–0.292 V, NORMAL 0.293–1.354 V, TROUBLE 1.355–3.5 V. Calibration can change them.<\/li>\n<li>If a USB adapter drops off and comes back, it may return under a new <code>ttyACM<\/code> number. Check <strong class=\"path\">Setup<i>›<\/i>System &amp; Backup<\/strong> and restart the backend if a port stays dead.<\/li>\n<\/ul>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Setup &gt; HAT Pinout, Sequent IOplus board page with relay, opto and analog terminal groups labelled<\/span><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a001\">001 What Aether is and what it emulates<\/a><\/li>\n<li><a href=\"#a022\">022 Wiegand pins and voltage levels (R1–R4)<\/a><\/li>\n<li><a href=\"#a034\">034 Default I/O map: relays, inputs, supervision channels<\/a><\/li>\n<li><a href=\"#a036\">036 HAT Pinout: Pi header and Sequent board pages<\/a><\/li>\n<li><a href=\"#a072\">072 System &amp; Backup: health, backup and restore<\/a><\/li>\n<li><a href=\"#a094\">094 IOplus not detected or relays stop responding<\/a><\/li>\n<\/ul>", "text": "aether hardware: pi 5, sequent ioplus, usb-rs485 adapters lists the parts of an aether kit, what each one does and how the pi sees it. for anyone wiring, checking or replacing kit hardware.  summary an aether kit is a raspberry pi 5 with a sequent microsystems ioplus hat, one or more rs-485 adapters for osdp, and wiring for four wiegand readers. this page lists each part, what aether uses it for and how it shows up on the pi. parts of the kit part what aether uses it for how the pi sees it raspberry pi 5 runs the backend ( aether-backend , port 3001), the web app and the vms stream ( aether-stream ) aether folder /home/aether/desktop/aether/m1.2.2 sequent microsystems ioplus hat 8 relays (drive the controller's inputs: dps, rex, tamper), 8 opto inputs (watch the controller's outputs: lock relay, aux), 8 analog inputs (eol supervised zones) i2c bus. setup › system & backup shows its hardware and firmware version and i2c health ioplus rs-485 terminals onboard osdp bus /dev/ttyama0 (the default osdp port) usb-rs485 adapters more osdp buses, firmware uploads, enrollment, trace /dev/ttyacm* or /dev/ttyusb* , listed by name on setup › system & backup pi gpio header four wiegand readers, r1–r4 d0/d1 on gpio 17/27, 22/23, 24/25 and 5/6 pn532 nfc reader (optional) reads real cards; can pass them on as osdp reads shown as readers › nfc only when enabled case holds the pi and hat, with a 40 mm fan; din-rail or wall mount confirm the current case build default i/o use channel (ui numbers 1–8) default use relay 2n−1 (1, 3, 5, 7) door n dps input on the controller (doors 1–4) relay 2n (2, 4, 6, 8) door n rex input on the controller (doors 1–4) opto inputs 1–4 watch door 1–4 lock relay on the controller (aether never drives them) analog inputs 1–8 eol supervised zones 1–8 this is the layout from apply 4-door layout on the doors page and from blueprints auto-wire. aether's relays never drive a lock; they stand in for the door's sensors and buttons. the api numbers channels 0–7. see 034 default i/o map for the full map. electrical notes pi gpio is 3.3 v logic. a 5 v wiegand line needs a level shifter or an open-collector buffer. eol zone defaults (1k/2.2k): tamper 0–0.103 v, alarm 0.104–0.292 v, normal 0.293–1.354 v, trouble 1.355–3.5 v. calibration can change them. if a usb adapter drops off and comes back, it may return under a new ttyacm number. check setup › system & backup and restart the backend if a port stays dead. screenshot to add: setup > hat pinout, sequent ioplus board page with relay, opto and analog terminal groups labelled related articles 001 what aether is and what it emulates 022 wiegand pins and voltage levels (r1–r4) 034 default i/o map: relays, inputs, supervision channels 036 hat pinout: pi header and sequent board pages 072 system & backup: health, backup and restore 094 ioplus not detected or relays stop responding "}, {"id": "a003", "num": "003", "title": "Open Aether in a browser", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Shows how to open the Aether web app from a PC on the same network, by IP address or by its HTTPS name, and how to reload it after an update.", "sources": ["Aether product QA testing", "Export Figma GUI guidelines", "Device firmware tool development"], "html": "<h2>Summary<\/h2>\n<p>Aether runs as a web app on the Pi. You open it in any modern browser on a PC that can reach the Pi over the network. There is nothing to install on the PC.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The Pi is powered on and on the same network as your PC.<\/li>\n<li>You know the Pi's IP address (<code>&lt;pi-ip&gt;<\/code>), or its HTTPS name if HTTPS has been set up.<\/li>\n<\/ul>\n<h2>Open Aether by IP address<\/h2>\n<ol>\n<li>Open Chrome, Edge, Brave or Firefox on your PC.<\/li>\n<li>Type <code>http://&lt;pi-ip&gt;:3001<\/code> in the address bar.<\/li>\n<li>Press Enter.<\/li>\n<li>Wait for the top bar to show <strong>Connected<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Aether top bar showing the Node IP field and a green connected badge<\/span><\/div>\n<p>If HTTPS has been set up and checked from this browser, the Pi sends you on to its HTTPS name. To stay on plain HTTP, open <code>http://&lt;pi-ip&gt;:3001/?http=1<\/code> instead.<\/p>\n<h2>Open Aether by its HTTPS name<\/h2>\n<ol>\n<li>Type <code>https://&lt;name&gt;.aetheraccesstools.com<\/code> in the address bar.<\/li>\n<li>If the HTTPS page says the port is 3443, add it: <code>https://&lt;name&gt;.aetheraccesstools.com:3443<\/code>.<\/li>\n<li>Press Enter and check for the padlock.<\/li>\n<\/ol>\n<h2>Reload after an update<\/h2>\n<p>After an update is installed, your browser may still hold the old pages.<\/p>\n<ol>\n<li>Press Ctrl+Shift+R (Cmd+Shift+R on a Mac) to reload without the cache.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The sidebar shows <strong>Access Control<\/strong>, <strong>Readers<\/strong>, <strong>AEGIS<\/strong>, <strong>Setup<\/strong> and <strong>Tools<\/strong>.<\/li>\n<li>The top bar shows <strong>Connected<\/strong>.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Page does not load at all<\/td>\n<td>Check the Pi has power and network, and that you typed port 3001. See <a href=\"#a092\">092<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Page loads but shows <strong>Disconnected<\/strong><\/td>\n<td>The live connection dropped, often after a backend restart. Press <strong>Connect<\/strong> or refresh the page.<\/td>\n<\/tr>\n<tr>\n<td>A page still looks old after an update<\/td>\n<td>Press Ctrl+Shift+R. See <a href=\"#a093\">093<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>HTTPS name does not load<\/td>\n<td>See <a href=\"#a102\">102<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<li><a href=\"#a006\">006 Manage several Aether units in Cluster mode<\/a><\/li>\n<li><a href=\"#a092\">092 Aether won't load or shows backend offline<\/a><\/li>\n<\/ul>", "text": "open aether in a browser shows how to open the aether web app from a pc on the same network, by ip address or by its https name, and how to reload it after an update.  summary aether runs as a web app on the pi. you open it in any modern browser on a pc that can reach the pi over the network. there is nothing to install on the pc. before you start the pi is powered on and on the same network as your pc. you know the pi's ip address ( <pi-ip> ), or its https name if https has been set up. open aether by ip address open chrome, edge, brave or firefox on your pc. type http://<pi-ip>:3001 in the address bar. press enter. wait for the top bar to show connected . screenshot to add: aether top bar showing the node ip field and a green connected badge if https has been set up and checked from this browser, the pi sends you on to its https name. to stay on plain http, open http://<pi-ip>:3001/?http=1 instead. open aether by its https name type https://<name>.aetheraccesstools.com in the address bar. if the https page says the port is 3443, add it: https://<name>.aetheraccesstools.com:3443 . press enter and check for the padlock. reload after an update after an update is installed, your browser may still hold the old pages. press ctrl+shift+r (cmd+shift+r on a mac) to reload without the cache. check that it worked the sidebar shows access control , readers , aegis , setup and tools . the top bar shows connected . if something goes wrong symptom what to do page does not load at all check the pi has power and network, and that you typed port 3001. see 092 . page loads but shows disconnected the live connection dropped, often after a backend restart. press connect or refresh the page. a page still looks old after an update press ctrl+shift+r. see 093 . https name does not load see 102 . related articles 004 find your way around: sidebar, page tabs, last page 007 set up https and a domain name 006 manage several aether units in cluster mode 092 aether won't load or shows backend offline "}, {"id": "a004", "num": "004", "title": "Find your way around: sidebar, page tabs, last page", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P1", "status": "Needs SME", "brief": "Explains the Aether sidebar menu, page tabs, breadcrumbs and how Aether remembers the last page you used. For new users.", "sources": ["Export Figma GUI guidelines", "OSDP Trace tool app", "Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Aether has one sidebar menu with up to two levels, and each page has at most one row of tabs. A breadcrumb and a page title at the top tell you where you are. Aether also remembers the last page you used in each section.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is open in your browser. See <a href=\"#a003\">003 Open Aether in a browser<\/a>.<\/li>\n<\/ul>\n<h2>Use the sidebar<\/h2>\n<ol>\n<li>Click a section in the sidebar, for example <strong>Readers<\/strong>.<\/li>\n<li>Click a page under it, for example <strong>OSDP<\/strong>.<\/li>\n<li>To make the sidebar narrow, click the menu button at the left of the top bar. Click it again to widen it.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Sidebar with Readers expanded, showing OSDP, OSDP Trace, Wiegand and Card Formats<\/span><\/div>\n<p>The sections are:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>Pages<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Access Control<\/strong><\/td>\n<td><strong>Controls<\/strong> · <strong>Doors<\/strong> · <strong>Elevator<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Readers<\/strong><\/td>\n<td><strong>OSDP<\/strong> · <strong>OSDP Trace<\/strong> · <strong>Wiegand<\/strong> · <strong>Card Formats<\/strong> · <strong>NFC<\/strong> (only when enabled)<\/td>\n<\/tr>\n<tr>\n<td><strong>AEGIS<\/strong><\/td>\n<td><strong>Emulation<\/strong> · <strong>Automation<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Controller Emulator<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Reports<\/strong><\/td>\n<td><strong>Audit<\/strong> · <strong>System<\/strong> · <strong>Emulation<\/strong> · <strong>Log Analytics<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Setup<\/strong><\/td>\n<td><strong>HAT Pinout<\/strong> · <strong>I/O Mapping<\/strong> · <strong>EOL Calibration<\/strong> · <strong>Network<\/strong> · <strong>System &amp; Backup<\/strong> · <strong>Device Firmware<\/strong> · <strong>HTTPS &amp; Domain<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Tools<\/strong><\/td>\n<td><strong>KB Studio<\/strong> · <strong>OnCAFE Console<\/strong> · <strong>Switch Ports<\/strong> · <strong>VMS Stream<\/strong> · <strong>SUNAPI Console<\/strong> · <strong>OSDP Academy<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Integrations<\/strong><\/td>\n<td><strong>Board Blueprints<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><span class=\"sme\">confirm the final Tools order on the Pi.<\/span><\/p>\n<p>Some pages show a count badge in the sidebar, for example the number of enabled OSDP readers. <strong class=\"path\">AEGIS<i>›<\/i>Emulation<\/strong> shows a <strong>Running<\/strong> badge while a workflow runs.<\/p>\n<h2>Use page tabs<\/h2>\n<ol>\n<li>Open a page that has tabs, for example <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong>.<\/li>\n<li>Click a tab: <strong>Emulate<\/strong>, <strong>History<\/strong>, <strong>Enrollment<\/strong>, <strong>Firmware<\/strong> or <strong>Bus &amp; readers<\/strong>.<\/li>\n<\/ol>\n<p>The breadcrumb at the top shows the path, for example <strong class=\"path\">Aether<i>›<\/i>Readers<i>›<\/i>OSDP<\/strong>.<\/p>\n<h2>Go back to the last page<\/h2>\n<ol>\n<li>Click a section name in the sidebar, for example <strong>Setup<\/strong>.<\/li>\n<li>Aether opens the page you last used in that section.<\/li>\n<\/ol>\n<p>Aether keeps this for the current browser tab. <span class=\"sme\">confirm whether the last page is kept after the browser is closed.<\/span><\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The page title matches the page you picked in the sidebar.<\/li>\n<li>Clicking a section reopens the page you used last in it.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<ul>\n<li><strong>A page is missing from the sidebar:<\/strong> some pages appear only when a feature is turned on (for example <strong>NFC<\/strong>), or after an update adds them. See <a href=\"#a066\">066 Install an Aether update<\/a>.<\/li>\n<li><strong>A running workflow seems to stop when you change page:<\/strong> it keeps running in the background; check the <strong>Running<\/strong> badge.<\/li>\n<\/ul>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a005\">005 Switch between Dark and Light theme<\/a><\/li>\n<li><a href=\"#a006\">006 Manage several Aether units in Cluster mode<\/a><\/li>\n<\/ul>", "text": "find your way around: sidebar, page tabs, last page explains the aether sidebar menu, page tabs, breadcrumbs and how aether remembers the last page you used. for new users.  summary aether has one sidebar menu with up to two levels, and each page has at most one row of tabs. a breadcrumb and a page title at the top tell you where you are. aether also remembers the last page you used in each section. before you start aether is open in your browser. see 003 open aether in a browser . use the sidebar click a section in the sidebar, for example readers . click a page under it, for example osdp . to make the sidebar narrow, click the menu button at the left of the top bar. click it again to widen it. screenshot to add: sidebar with readers expanded, showing osdp, osdp trace, wiegand and card formats the sections are: section pages access control controls · doors · elevator readers osdp · osdp trace · wiegand · card formats · nfc (only when enabled) aegis emulation · automation controller emulator — reports audit · system · emulation · log analytics setup hat pinout · i/o mapping · eol calibration · network · system & backup · device firmware · https & domain tools kb studio · oncafe console · switch ports · vms stream · sunapi console · osdp academy integrations board blueprints confirm the final tools order on the pi. some pages show a count badge in the sidebar, for example the number of enabled osdp readers. aegis › emulation shows a running badge while a workflow runs. use page tabs open a page that has tabs, for example readers › osdp . click a tab: emulate , history , enrollment , firmware or bus & readers . the breadcrumb at the top shows the path, for example aether › readers › osdp . go back to the last page click a section name in the sidebar, for example setup . aether opens the page you last used in that section. aether keeps this for the current browser tab. confirm whether the last page is kept after the browser is closed. check that it worked the page title matches the page you picked in the sidebar. clicking a section reopens the page you used last in it. if something goes wrong a page is missing from the sidebar: some pages appear only when a feature is turned on (for example nfc ), or after an update adds them. see 066 install an aether update . a running workflow seems to stop when you change page: it keeps running in the background; check the running badge. related articles 003 open aether in a browser 005 switch between dark and light theme 006 manage several aether units in cluster mode "}, {"id": "a005", "num": "005", "title": "Switch between Dark and Light theme", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P3", "status": "Needs SME", "brief": "Shows how to switch Aether between Dark and Light theme and explains what changes and what keeps its colors. For any user.", "sources": ["Export Figma GUI guidelines"], "html": "<h2>Summary<\/h2>\n<p>Aether has a Dark and a Light theme. You switch with one button in the top bar. Each browser remembers its own choice, so two people on two PCs can use different themes on the same Pi.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Aether is open in your browser. See <a href=\"#a003\">003 Open Aether in a browser<\/a>.<\/li>\n<\/ul>\n<h2>Switch the theme<\/h2>\n<ol>\n<li>Find the sun/moon button in the top bar. <span class=\"sme\">confirm the button position and tooltip text on the Pi<\/span><\/li>\n<li>Click it once.<\/li>\n<li>The whole app changes to the other theme straight away.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Top bar with the sun/moon theme button highlighted, Light theme active<\/span><\/div>\n<ol start=\"4\">\n<li>Click it again to switch back.<\/li>\n<\/ol>\n<p>In Cluster mode, the button is also on the Cluster overview page.<\/p>\n<h2>What changes and what does not<\/h2>\n<ul>\n<li><strong>Changes:<\/strong> menus, cards, tables, buttons, text and status colors. Status text gets darker in Light so it stays readable on white.<\/li>\n<li><strong>Follows along:<\/strong> pages that open inside Aether, such as Board Blueprints and the OnCAFE Console, switch with the app.<\/li>\n<li><strong>Keeps its real colors:<\/strong> drawings of physical things, such as the door scene, the OSDP and Wiegand reader drawings, the elevator car and the switch port faceplate. Only the interface around them changes.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>The page background and menus change color when you click the button.<\/li>\n<li>After you reload the page (F5), the theme you chose is still set.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The theme goes back after reload<\/td>\n<td>The browser may be blocking site storage (for example a private window). Use a normal window, or allow storage for the Pi's address.<\/td>\n<\/tr>\n<tr>\n<td>A colleague sees a different theme<\/td>\n<td>That is expected. The choice is saved per browser, not on the Pi.<\/td>\n<\/tr>\n<tr>\n<td>One embedded page did not switch<\/td>\n<td>Reload the page with Ctrl+Shift+R. See <a href=\"#a093\">093<\/a>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<\/ul>", "text": "switch between dark and light theme shows how to switch aether between dark and light theme and explains what changes and what keeps its colors. for any user.  summary aether has a dark and a light theme. you switch with one button in the top bar. each browser remembers its own choice, so two people on two pcs can use different themes on the same pi. before you start aether is open in your browser. see 003 open aether in a browser . switch the theme find the sun/moon button in the top bar. confirm the button position and tooltip text on the pi click it once. the whole app changes to the other theme straight away. screenshot to add: top bar with the sun/moon theme button highlighted, light theme active click it again to switch back. in cluster mode, the button is also on the cluster overview page. what changes and what does not changes: menus, cards, tables, buttons, text and status colors. status text gets darker in light so it stays readable on white. follows along: pages that open inside aether, such as board blueprints and the oncafe console, switch with the app. keeps its real colors: drawings of physical things, such as the door scene, the osdp and wiegand reader drawings, the elevator car and the switch port faceplate. only the interface around them changes. check that it worked the page background and menus change color when you click the button. after you reload the page (f5), the theme you chose is still set. if something goes wrong symptom what to do the theme goes back after reload the browser may be blocking site storage (for example a private window). use a normal window, or allow storage for the pi's address. a colleague sees a different theme that is expected. the choice is saved per browser, not on the pi. one embedded page did not switch reload the page with ctrl+shift+r. see 093 . related articles 004 find your way around: sidebar, page tabs, last page 003 open aether in a browser "}, {"id": "a006", "num": "006", "title": "Manage several Aether units in Cluster mode", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "Shows how to add several Aether Pis to the Cluster overview and switch between them from one browser. For users who run more than one kit.", "sources": ["Export Figma GUI guidelines", "OSDP Trace tool app", "AETHER device communication features", "Aether product QA testing", "docs/project-facts-digest"], "html": "<h2>Summary<\/h2>\n<p>Cluster mode lets one browser work with several Aether Pis. The <strong>Cluster overview<\/strong> lists every Pi (node) with an online dot. When you open a node, a node switcher in the top bar lets you jump to another Pi or back to the overview. All nodes stay connected while you switch.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>Each Pi is powered on and reachable from your PC.<\/li>\n<li>You know each Pi's address (<code>&lt;pi-ip&gt;<\/code>).<\/li>\n<li>Cluster mode is the default view: open <code>http://&lt;pi-ip&gt;:3001<\/code> on any Pi. The first node is the Pi you opened.<\/li>\n<\/ul>\n<h2>Add a node<\/h2>\n<ol>\n<li>Open the <strong>Cluster overview<\/strong>.<\/li>\n<li>In the node list on the left, click <strong>Add Node<\/strong>. A new row opens with a name and an address field.<\/li>\n<li>Enter a name for the Pi, for example <code>Bench 1<\/code>.<\/li>\n<li>Enter its address, <code>&lt;pi-ip&gt;<\/code>.<\/li>\n<li>Click <strong>Save<\/strong>.<\/li>\n<li>Repeat for each Pi.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Cluster overview with three node cards, each with a name, address and online dot<\/span><\/div>\n<p>The node list header shows how many nodes are online, for example <strong>2/3 online<\/strong>.<\/p>\n<h2>Open a node<\/h2>\n<ol>\n<li>On the <strong>Cluster overview<\/strong>, click a node card.<\/li>\n<li>That Pi's Aether opens, with its own sidebar.<\/li>\n<li>The node's address is managed by the Cluster overview, so the <strong>Node IP<\/strong> field in the top bar cannot be edited here.<\/li>\n<\/ol>\n<h2>Switch between nodes<\/h2>\n<ol>\n<li>Click the node switcher in the top bar. It shows the current node's name.<\/li>\n<li>Pick another node from the list. Each node shows its name, address and online dot.<\/li>\n<li>To go back, pick <strong>Cluster overview<\/strong> at the top of the list.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Node switcher open in the top bar, listing Cluster overview and three nodes with online dots<\/span><\/div>\n<h2>Edit or remove a node<\/h2>\n<ol>\n<li>Go to the <strong>Cluster overview<\/strong>.<\/li>\n<li>Point at the node in the node list and click <strong>Edit<\/strong> (pencil) or <strong>Remove node<\/strong> (bin). Removing asks you to confirm.<\/li>\n<\/ol>\n<p>Nodes are only added and edited here, not from inside a node.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Each node you added shows a green online dot.<\/li>\n<li>Switching nodes keeps the other nodes connected; a workflow running on one node keeps running.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A node stays offline<\/td>\n<td>Open <code>http://&lt;pi-ip&gt;:3001<\/code> directly to check the Pi answers. See <a href=\"#a092\">092<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>Other nodes are blocked when you use HTTPS<\/td>\n<td>A page opened over HTTPS cannot reach other nodes over plain HTTP. Open the cluster over <code>http://<\/code> until every node has HTTPS.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a004\">004 Find your way around: sidebar, page tabs, last page<\/a><\/li>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<\/ul>", "text": "manage several aether units in cluster mode shows how to add several aether pis to the cluster overview and switch between them from one browser. for users who run more than one kit.  summary cluster mode lets one browser work with several aether pis. the cluster overview lists every pi (node) with an online dot. when you open a node, a node switcher in the top bar lets you jump to another pi or back to the overview. all nodes stay connected while you switch. before you start each pi is powered on and reachable from your pc. you know each pi's address ( <pi-ip> ). cluster mode is the default view: open http://<pi-ip>:3001 on any pi. the first node is the pi you opened. add a node open the cluster overview . in the node list on the left, click add node . a new row opens with a name and an address field. enter a name for the pi, for example bench 1 . enter its address, <pi-ip> . click save . repeat for each pi. screenshot to add: cluster overview with three node cards, each with a name, address and online dot the node list header shows how many nodes are online, for example 2/3 online . open a node on the cluster overview , click a node card. that pi's aether opens, with its own sidebar. the node's address is managed by the cluster overview, so the node ip field in the top bar cannot be edited here. switch between nodes click the node switcher in the top bar. it shows the current node's name. pick another node from the list. each node shows its name, address and online dot. to go back, pick cluster overview at the top of the list. screenshot to add: node switcher open in the top bar, listing cluster overview and three nodes with online dots edit or remove a node go to the cluster overview . point at the node in the node list and click edit (pencil) or remove node (bin). removing asks you to confirm. nodes are only added and edited here, not from inside a node. check that it worked each node you added shows a green online dot. switching nodes keeps the other nodes connected; a workflow running on one node keeps running. if something goes wrong symptom what to do a node stays offline open http://<pi-ip>:3001 directly to check the pi answers. see 092 . other nodes are blocked when you use https a page opened over https cannot reach other nodes over plain http. open the cluster over http:// until every node has https. related articles 003 open aether in a browser 004 find your way around: sidebar, page tabs, last page 007 set up https and a domain name "}, {"id": "a007", "num": "007", "title": "Set up HTTPS and a domain name", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P2", "status": "Needs SME", "brief": "Walks through Setup > HTTPS & Domain: naming the Pi, saving the Cloudflare token, getting a Let's Encrypt certificate and checking it from your browser.", "sources": ["Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p><strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong> gives the Pi its own name, such as <code>bench1.aetheraccesstools.com<\/code>, with a trusted Let's Encrypt certificate and a padlock in the browser. The Pi proves it owns the name through a Cloudflare DNS token, so nothing on your network has to be opened to the internet. <code>http://&lt;pi-ip&gt;:3001<\/code> keeps working.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You have a Cloudflare API token for the domain. See <a href=\"#a008\">008 Create the Cloudflare token for HTTPS<\/a>.<\/li>\n<li>The Pi can reach the internet.<\/li>\n<li>The HTTPS update is installed (the page is listed under <strong>Setup<\/strong>).<\/li>\n<\/ul>\n<h2>Name the Pi and save the token<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong>.<\/li>\n<li>In <strong>Domain (in Cloudflare)<\/strong>, check the domain, for example <code>aetheraccesstools.com<\/code>.<\/li>\n<li>In <strong>This Pi's name<\/strong>, type a short name with letters, numbers and dashes, for example <code>bench1<\/code>. The page shows the full address under the field.<\/li>\n<li>Paste the token into <strong>Cloudflare API token<\/strong>. Paste only the token string, nothing else.<\/li>\n<li>Optional: type an email address if you want Let's Encrypt to warn you when renewal keeps failing.<\/li>\n<li>Tick <strong>I accept the Let's Encrypt Subscriber Agreement<\/strong>.<\/li>\n<li>Click <strong>Check token &amp; save<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: HTTPS &amp; Domain Setup card with steps 1–4 filled in and the Check token &amp; save button<\/span><\/div>\n<p>A green message that the token works appears at the top. The token is kept on the Pi only and is never shown again.<\/p>\n<h2>Get the certificate<\/h2>\n<ol>\n<li>In the <strong>Secure address<\/strong> card, click <strong>Get certificate<\/strong>. <span class=\"sme\">confirm the card and button labels on the Pi<\/span><\/li>\n<li>Watch the steps: zone found, DNS record set, proof record added, certificate installed. It usually takes 30–90 s.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Secure address card showing the certificate steps ending in &quot;Certificate installed&quot;<\/span><\/div>\n<h2>Check from this browser<\/h2>\n<ol>\n<li>Click <strong>Check from this browser<\/strong>.<\/li>\n<li>Wait for the check to pass.<\/li>\n<\/ol>\n<p>After this check passes, opening the Pi by IP in this browser sends you to the HTTPS name.<\/p>\n<h2>Check that it worked<\/h2>\n<ul>\n<li><code>https://&lt;name&gt;.aetheraccesstools.com<\/code> opens with a padlock.<\/li>\n<li>If the page says HTTPS is on port 3443 (another program holds 443), use <code>https://&lt;name&gt;.aetheraccesstools.com:3443<\/code>.<\/li>\n<li>The certificate renews by itself when fewer than 30 days remain.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Red message after <strong>Check token &amp; save<\/strong><\/td>\n<td>Check the token's permissions and the zone it is limited to. See <a href=\"#a008\">008<\/a>.<\/td>\n<\/tr>\n<tr>\n<td>\"DNS address could not be found\"<\/td>\n<td>The browser may have cached the name before it existed. Run <code>ipconfig /flushdns<\/code> on Windows, clear the browser's host cache, then try again.<\/td>\n<\/tr>\n<tr>\n<td>Name works on one network but not another<\/td>\n<td>Some routers block DNS answers that point to private addresses. See <a href=\"#a102\">102<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Disconnected<\/strong> after saving<\/td>\n<td>The live connection dropped while the backend restarted. Press <strong>Connect<\/strong> or refresh.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a008\">008 Create the Cloudflare token for HTTPS<\/a><\/li>\n<li><a href=\"#a003\">003 Open Aether in a browser<\/a><\/li>\n<li><a href=\"#a006\">006 Manage several Aether units in Cluster mode<\/a><\/li>\n<li><a href=\"#a102\">102 No padlock, or the HTTPS name doesn't load<\/a><\/li>\n<\/ul>", "text": "set up https and a domain name walks through setup > https & domain: naming the pi, saving the cloudflare token, getting a let's encrypt certificate and checking it from your browser.  summary setup › https & domain gives the pi its own name, such as bench1.aetheraccesstools.com , with a trusted let's encrypt certificate and a padlock in the browser. the pi proves it owns the name through a cloudflare dns token, so nothing on your network has to be opened to the internet. http://<pi-ip>:3001 keeps working. before you start you have a cloudflare api token for the domain. see 008 create the cloudflare token for https . the pi can reach the internet. the https update is installed (the page is listed under setup ). name the pi and save the token open setup › https & domain . in domain (in cloudflare) , check the domain, for example aetheraccesstools.com . in this pi's name , type a short name with letters, numbers and dashes, for example bench1 . the page shows the full address under the field. paste the token into cloudflare api token . paste only the token string, nothing else. optional: type an email address if you want let's encrypt to warn you when renewal keeps failing. tick i accept the let's encrypt subscriber agreement . click check token & save . screenshot to add: https & domain setup card with steps 1–4 filled in and the check token & save button a green message that the token works appears at the top. the token is kept on the pi only and is never shown again. get the certificate in the secure address card, click get certificate . confirm the card and button labels on the pi watch the steps: zone found, dns record set, proof record added, certificate installed. it usually takes 30–90 s. screenshot to add: secure address card showing the certificate steps ending in \"certificate installed\" check from this browser click check from this browser . wait for the check to pass. after this check passes, opening the pi by ip in this browser sends you to the https name. check that it worked https://<name>.aetheraccesstools.com opens with a padlock. if the page says https is on port 3443 (another program holds 443), use https://<name>.aetheraccesstools.com:3443 . the certificate renews by itself when fewer than 30 days remain. if something goes wrong symptom what to do red message after check token & save check the token's permissions and the zone it is limited to. see 008 . \"dns address could not be found\" the browser may have cached the name before it existed. run ipconfig /flushdns on windows, clear the browser's host cache, then try again. name works on one network but not another some routers block dns answers that point to private addresses. see 102 . disconnected after saving the live connection dropped while the backend restarted. press connect or refresh. related articles 008 create the cloudflare token for https 003 open aether in a browser 006 manage several aether units in cluster mode 102 no padlock, or the https name doesn't load "}, {"id": "a008", "num": "008", "title": "Create the Cloudflare token for HTTPS", "area": "Getting started", "type": "How-to", "audience": "User", "priority": "P2", "status": "Draft", "brief": "Shows how to create a Cloudflare API token limited to one domain's DNS, which Aether needs to get an HTTPS certificate, and how to handle it safely.", "sources": ["Aether product QA testing"], "html": "<h2>Summary<\/h2>\n<p>Aether gets its HTTPS certificate by adding a short-lived DNS record in Cloudflare. For that it needs a Cloudflare API token that can edit DNS for one domain only. You make the token once in your Cloudflare account and paste it into <strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong>.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>You can log in to the Cloudflare account that holds the domain, for example <code>aetheraccesstools.com<\/code>.<\/li>\n<li><strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong> is open in another tab, ready for the token.<\/li>\n<\/ul>\n<h2>Create the token<\/h2>\n<ol>\n<li>Go to <code>dash.cloudflare.com<\/code> and log in.<\/li>\n<li>Click the person icon at the top right, then <strong>My Profile<\/strong>.<\/li>\n<li>In the left menu, click <strong>API Tokens<\/strong>.<\/li>\n<li>Click <strong>Create Token<\/strong>.<\/li>\n<li>Find <strong>Edit zone DNS<\/strong> and click <strong>Use template<\/strong> next to it.<\/li>\n<li>Under <strong>Permissions<\/strong>, check that <em>Zone · DNS · Edit<\/em> is already there.<\/li>\n<li>Click <strong>+ Add more<\/strong> and set the new row to <em>Zone · Zone · Read<\/em>.<\/li>\n<li>Under <strong>Zone Resources<\/strong>, set <em>Include · Specific zone<\/em> and pick your domain.<\/li>\n<li>Leave everything else as it is. Click <strong>Continue to summary<\/strong>.<\/li>\n<li>\n<p>Click <strong>Create Token<\/strong>.<\/p>\n<p><div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Cloudflare token summary showing Zone DNS Edit and Zone Read limited to one zone<\/span><\/div><\/p>\n<h2>Paste the token into Aether<\/h2>\n<\/li>\n<\/ol>\n<p>Cloudflare shows the token only once.<\/p>\n<ol>\n<li>Click <strong>Copy<\/strong> next to the token on Cloudflare's screen.<\/li>\n<li>Paste it straight into <strong>Cloudflare API token<\/strong> on <strong class=\"path\">Setup<i>›<\/i>HTTPS &amp; Domain<\/strong>.<\/li>\n<li>Click <strong>Check token &amp; save<\/strong>.<\/li>\n<\/ol>\n<p>Paste only the token itself. If Cloudflare shows a <code>curl<\/code> test line, leave out <code>curl<\/code>, the address, <code>-H \"Authorization: Bearer<\/code> and the quotes. You do not need to run that test; Aether runs the same check when you save.<\/p>\n<p class=\"caution\"><strong>Caution:<\/strong> Do not use the <strong>Global API Key<\/strong>. It controls your whole Cloudflare account. The token you made can only edit DNS for one domain.<\/p>\n<h2>Keep the token safe<\/h2>\n<ul>\n<li>Paste the token only into the Aether page. Do not put it in chat, email, tickets or documents.<\/li>\n<li>If the token was shown anywhere else, replace it: on <strong class=\"path\">My Profile<i>›<\/i>API Tokens<\/strong>, open the token's <strong>⋯<\/strong> menu, choose <strong>Roll<\/strong>, confirm, and paste the new token into Aether.<\/li>\n<li>If you lose the token before saving it, delete it in Cloudflare and create a new one.<\/li>\n<\/ul>\n<h2>Check that it worked<\/h2>\n<ul>\n<li>Aether shows a green message that the token works, and <strong>Token saved on the Pi<\/strong>.<\/li>\n<\/ul>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aether says the token cannot see the domain<\/td>\n<td>Check <strong>Zone Resources<\/strong> is set to the right domain and <em>Zone · Zone · Read<\/em> was added.<\/td>\n<\/tr>\n<tr>\n<td>Aether says the token is not valid<\/td>\n<td>Copy it again with no spaces or quotes, or roll it and paste the new one.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a007\">007 Set up HTTPS and a domain name<\/a><\/li>\n<li><a href=\"#a102\">102 No padlock, or the HTTPS name doesn't load<\/a><\/li>\n<\/ul>", "text": "create the cloudflare token for https shows how to create a cloudflare api token limited to one domain's dns, which aether needs to get an https certificate, and how to handle it safely.  summary aether gets its https certificate by adding a short-lived dns record in cloudflare. for that it needs a cloudflare api token that can edit dns for one domain only. you make the token once in your cloudflare account and paste it into setup › https & domain . before you start you can log in to the cloudflare account that holds the domain, for example aetheraccesstools.com . setup › https & domain is open in another tab, ready for the token. create the token go to dash.cloudflare.com and log in. click the person icon at the top right, then my profile . in the left menu, click api tokens . click create token . find edit zone dns and click use template next to it. under permissions , check that zone · dns · edit is already there. click + add more and set the new row to zone · zone · read . under zone resources , set include · specific zone and pick your domain. leave everything else as it is. click continue to summary . click create token . screenshot to add: cloudflare token summary showing zone dns edit and zone read limited to one zone paste the token into aether cloudflare shows the token only once. click copy next to the token on cloudflare's screen. paste it straight into cloudflare api token on setup › https & domain . click check token & save . paste only the token itself. if cloudflare shows a curl test line, leave out curl , the address, -h \"authorization: bearer and the quotes. you do not need to run that test; aether runs the same check when you save. caution: do not use the global api key . it controls your whole cloudflare account. the token you made can only edit dns for one domain. keep the token safe paste the token only into the aether page. do not put it in chat, email, tickets or documents. if the token was shown anywhere else, replace it: on my profile › api tokens , open the token's ⋯ menu, choose roll , confirm, and paste the new token into aether. if you lose the token before saving it, delete it in cloudflare and create a new one. check that it worked aether shows a green message that the token works, and token saved on the pi . if something goes wrong symptom what to do aether says the token cannot see the domain check zone resources is set to the right domain and zone · zone · read was added. aether says the token is not valid copy it again with no spaces or quotes, or roll it and paste the new one. related articles 007 set up https and a domain name 102 no padlock, or the https name doesn't load "}, {"id": "a009", "num": "009", "title": "How OSDP reader emulation works", "area": "Readers and protocols", "type": "Concept", "audience": "User", "priority": "P1", "status": "Draft", "brief": "Explains how Aether pretends to be one or more OSDP readers on an RS-485 bus, so a real controller can be tested. For anyone setting up OSDP tests.", "sources": ["IOAccessEmulator codebase review (chat)", "Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "OSDP Trace tool app (chat)", "docs/house-style-and-facts.md"], "html": "<h2>Summary<\/h2>\n<p>On OSDP, Aether plays the reader, not the controller. Each emulated reader answers a real controller's polls on an RS-485 bus, so you can send cards and PINs without a physical reader.<\/p>\n<h2>Aether is the reader (PD), the controller is the ACU<\/h2>\n<p>The controller (ACU) speaks first and every reader (PD) only replies:<\/p>\n<ul>\n<li>The controller sends <strong>POLL<\/strong> to a reader address.<\/li>\n<li>If the emulated reader has nothing to report, Aether answers <strong>ACK<\/strong>.<\/li>\n<li>If you have sent a card, Aether answers that poll with a card read (<strong>RAW<\/strong>). A PIN goes out as a keypad reply.<\/li>\n<\/ul>\n<p>So a card you send is queued until the controller polls that address. A success message means queued, not sent. Confirm what went out in <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong>.<\/p>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: OSDP Trace Conversation tab showing a POLL answered with a card read<\/span><\/div>\n<h2>Where the readers live<\/h2>\n<p>Each emulated reader has an address (0–126; 127 is broadcast) and belongs to one serial port:<\/p>\n<ul>\n<li>The onboard RS-485 port on the IOplus HAT (<code>/dev/ttyAMA0<\/code>).<\/li>\n<li>USB-RS485 adapters (<code>/dev/ttyACM…<\/code>).<\/li>\n<\/ul>\n<p>Readers can share a port if their addresses differ, and they use that port's baud rate. You set this up in <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Bus &amp; readers<\/strong>.<\/p>\n<h2>Secure channel<\/h2>\n<p>A reader can run in plain mode or with OSDP Secure Channel. Secure Channel needs both sides to hold the same key (SCBK). A new emulated reader starts with Secure Channel off and uses the default install key, SCBK-D, until you set another.<\/p>\n<h2>Things that borrow the port<\/h2>\n<p>Some tools borrow a serial port from reader emulation and hand it back afterwards:<\/p>\n<ul>\n<li>A reader firmware upload (only one at a time).<\/li>\n<li><strong>Enrollment<\/strong>, where the Pi acts as the controller for a real reader.<\/li>\n<\/ul>\n<p>While a port is borrowed, its emulated readers don't answer polls, and the controller may report them offline.<\/p>\n<h2>Related articles<\/h2>\n<ul>\n<li><a href=\"#a010\">010 Present a card or PIN on an emulated OSDP reader<\/a><\/li>\n<li><a href=\"#a013\">013 Add, edit and import OSDP readers (Bus &amp; readers)<\/a><\/li>\n<li><a href=\"#a014\">014 Assign a serial interface and baud rate<\/a><\/li>\n<li><a href=\"#a015\">015 Set or reset a reader's secure channel key (SCBK)<\/a><\/li>\n<li><a href=\"#a017\">017 Read a conversation in OSDP Trace<\/a><\/li>\n<li><a href=\"#a023\">023 The built-in card format library<\/a><\/li>\n<li><a href=\"#a046\">046 Share a serial port between readers and the emulator<\/a><\/li>\n<\/ul>", "text": "how osdp reader emulation works explains how aether pretends to be one or more osdp readers on an rs-485 bus, so a real controller can be tested. for anyone setting up osdp tests.  summary on osdp, aether plays the reader, not the controller. each emulated reader answers a real controller's polls on an rs-485 bus, so you can send cards and pins without a physical reader. aether is the reader (pd), the controller is the acu the controller (acu) speaks first and every reader (pd) only replies: the controller sends poll to a reader address. if the emulated reader has nothing to report, aether answers ack . if you have sent a card, aether answers that poll with a card read ( raw ). a pin goes out as a keypad reply. so a card you send is queued until the controller polls that address. a success message means queued, not sent. confirm what went out in readers › osdp trace . screenshot to add: osdp trace conversation tab showing a poll answered with a card read where the readers live each emulated reader has an address (0–126; 127 is broadcast) and belongs to one serial port: the onboard rs-485 port on the ioplus hat ( /dev/ttyama0 ). usb-rs485 adapters ( /dev/ttyacm… ). readers can share a port if their addresses differ, and they use that port's baud rate. you set this up in readers › osdp › bus & readers . secure channel a reader can run in plain mode or with osdp secure channel. secure channel needs both sides to hold the same key (scbk). a new emulated reader starts with secure channel off and uses the default install key, scbk-d, until you set another. things that borrow the port some tools borrow a serial port from reader emulation and hand it back afterwards: a reader firmware upload (only one at a time). enrollment , where the pi acts as the controller for a real reader. while a port is borrowed, its emulated readers don't answer polls, and the controller may report them offline. related articles 010 present a card or pin on an emulated osdp reader 013 add, edit and import osdp readers (bus & readers) 014 assign a serial interface and baud rate 015 set or reset a reader's secure channel key (scbk) 017 read a conversation in osdp trace 023 the built-in card format library 046 share a serial port between readers and the emulator "}, {"id": "a010", "num": "010", "title": "Present a card or PIN on an emulated OSDP reader", "area": "Readers and protocols", "type": "How-to", "audience": "User", "priority": "P1", "status": "Draft", "brief": "How to send a card read or a PIN from an emulated OSDP reader to the controller, using the Card Composer on the Emulate tab.", "sources": ["Resistor calibration tool (chat: Readers rebuild, enrollment, OSDP Trace)", "IOAccessEmulator codebase review (chat)", "Aether OSDP credential injector tool (chat)", "Aether product QA testing (chat)", "frontend/src/components/OSDPSection.tsx (2026-09-20 source)"], "html": "<h2>Summary<\/h2>\n<p>The <strong>Emulate<\/strong> tab lets you present a card or a PIN on any emulated OSDP reader. Aether builds the card bits from the format you pick and answers the controller's next poll with them. Use it to check that the controller grants, denies or logs a credential as expected.<\/p>\n<h2>Before you start<\/h2>\n<ul>\n<li>The controller is wired to the bus and polling the reader's address. See <a href=\"#a014\">014 Assign a serial interface and baud rate<\/a>.<\/li>\n<li>The reader is set up and enabled in <strong class=\"path\">Readers<i>›<\/i>OSDP<i>›<\/i>Bus &amp; readers<\/strong>.<\/li>\n<li>You know the format, facility code and card number the controller expects.<\/li>\n<\/ul>\n<h2>Present a card<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP<\/strong> and select the <strong>Emulate<\/strong> tab.<\/li>\n<li>Pick the reader in the reader list. This also picks its serial port.<\/li>\n<li>In the Card Composer, open the format picker. The <strong>Common<\/strong> section lists the ten most-used formats; type to search the rest.<\/li>\n<li>Enter the <strong>Facility Code<\/strong> and <strong>Card #<\/strong>, plus <strong>IL<\/strong> (issue level) if the format has one. Values above the format's range are clamped to the maximum as you type.<\/li>\n<li>Check the live bit strip under the fields.<\/li>\n<li>Click <strong>Send Card<\/strong>.<\/li>\n<\/ol>\n<div class=\"shot\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M8 5l1.5-2h5L16 5\"/><\/svg><span>Screenshot to add: Emulate tab with the Card Composer, format picker open on Common, bit strip below<\/span><\/div>\n<p>Tapping the card zone on the on-screen reader sends the same credential as <strong>Send Card<\/strong>.<\/p>\n<h2>Present a PIN<\/h2>\n<ol>\n<li>Stay on the <strong>Emulate<\/strong> tab with the same reader selected.<\/li>\n<li>Type the digits under <strong>Quick PINs<\/strong>.<\/li>\n<li>Send the PIN. Aether answers the next poll with a keypad reply.<\/li>\n<\/ol>\n<h2>Check that it worked<\/h2>\n<ol>\n<li>Open <strong class=\"path\">Readers<i>›<\/i>OSDP Trace<\/strong> and select <strong>Conversation<\/strong>.<\/li>\n<li>Find the poll that was answered with <strong>Card read<\/strong> (or <strong>Keypad<\/strong>). The line shows the bit count and, for a known format, the facility code and card number.<\/li>\n<li>Check the controller's event log for the grant or denial.<\/li>\n<\/ol>\n<p>A message in Aether only means the card was queued. The trace shows when it went out.<\/p>\n<h2>If something goes wrong<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Symptom<\/th>\n<th>What to do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Aether says sent, but nothing in the trace<\/td>\n<td>The controller isn't polling that address. Check address, port and baud. See <a href=\"#a096\">096 An OSDP reader doesn't answer<\/a>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Send Card<\/strong> is greyed out<\/td>\n<td>Pick a reader
