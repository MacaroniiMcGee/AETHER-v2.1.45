<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnCAFE Scale Test Installation and Readiness Checklist</title>
<style>
:root {
  --bg:#f4f6f8; --panel:#ffffff; --text:#1f2937; --muted:#667085;
  --line:#d9dee7; --accent:#0b5cab; --good:#157347; --warn:#9a6700;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--text); }
header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); padding:16px 24px; }
h1 { margin:0 0 8px; font-size:24px; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button { border:1px solid var(--line); background:#fff; padding:9px 12px; border-radius:8px; cursor:pointer; font-weight:600; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.danger { color:#a61b1b; }
.progress-wrap { margin-left:auto; min-width:260px; }
.progress-text { font-size:13px; color:var(--muted); margin-bottom:4px; text-align:right; }
.progress { height:10px; background:#e8ecf2; border-radius:999px; overflow:hidden; }
.progress > div { height:100%; width:0; background:var(--good); transition:width .2s; }
main { max-width:1200px; margin:24px auto; padding:0 18px 60px; }
.meta, .section, .signoff { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
.meta { padding:16px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
label.small { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:700; }
input[type=text], input[type=date], textarea, select {
  width:100%; border:1px solid var(--line); border-radius:7px; padding:9px; font:inherit; background:#fff;
}
.section h2 { margin:0; padding:14px 16px; font-size:18px; border-bottom:1px solid var(--line); background:#f9fafb; border-radius:12px 12px 0 0; }
.item { display:grid; grid-template-columns:28px 1fr 150px 240px; gap:10px; align-items:start; padding:10px 16px; border-bottom:1px solid #edf0f4; }
.item:last-child { border-bottom:0; }
.item input[type=checkbox] { width:18px; height:18px; margin-top:3px; }
.item.completed .task { text-decoration:line-through; color:#667085; }
.task { line-height:1.35; }
.status { min-width:120px; }
.notes { min-height:38px; resize:vertical; }
.signoff { padding:18px; }
.sign-grid { display:grid; grid-template-columns:repeat(2,minmax(250px,1fr)); gap:14px; }
.approval { display:flex; flex-wrap:wrap; gap:18px; padding:12px 0; }
.approval label { font-weight:600; }
.summary { background:#f9fafb; border:1px solid var(--line); border-radius:8px; padding:12px; margin-top:12px; }
@media (max-width:850px) {
  .item { grid-template-columns:28px 1fr; }
  .status, .notes { grid-column:2; }
  .progress-wrap { width:100%; margin-left:0; }
}
@media print {
  header { position:static; }
  .toolbar button, .no-print { display:none !important; }
  body { background:#fff; }
  main { max-width:none; margin:0; }
  .section, .meta, .signoff { box-shadow:none; break-inside:avoid; }
  .item { grid-template-columns:24px 1fr 120px 220px; }
}
</style>
</head>
<body>
<header>
  <h1>OnCAFE Scale Test Installation and Readiness Checklist</h1>
  <div class="toolbar">
    <button class="primary" onclick="exportJSON()">Export Results (JSON)</button>
    <button onclick="exportCSV()">Export Results (CSV)</button>
    <button onclick="window.print()">Print / Save as PDF</button>
    <button onclick="saveState()">Save</button>
    <button class="danger" onclick="resetForm()">Reset</button>
    <div class="progress-wrap">
      <div class="progress-text" id="progressText">0 of 0 complete</div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
</header>

<main>
  <section class="meta">
    <div><label class="small">Test Location</label><input id="testLocation" type="text"></div>
    <div><label class="small">Test Release</label><input id="testRelease" type="text" value="M9 - Phase 1"></div>
    <div><label class="small">Checklist Owner</label><input id="checklistOwner" type="text"></div>
    <div><label class="small">Run / Build Identifier</label><input id="runId" type="text"></div>
    <div><label class="small">Start Date</label><input id="startDate" type="date"></div>
    <div><label class="small">Target Completion Date</label><input id="targetDate" type="date"></div>
  </section>

  <div id="checklist"></div>

  <section class="signoff">
    <h2>23. Final Sign-Off</h2>
    <div class="sign-grid">
      <div><label class="small">Installation Lead</label><input id="installationLead" type="text"></div>
      <div><label class="small">Date</label><input id="installationDate" type="date"></div>
      <div><label class="small">Network Lead</label><input id="networkLead" type="text"></div>
      <div><label class="small">Date</label><input id="networkDate" type="date"></div>
      <div><label class="small">Automation Lead</label><input id="automationLead" type="text"></div>
      <div><label class="small">Date</label><input id="automationDate" type="date"></div>
      <div><label class="small">QA Manager</label><input id="qaManager" type="text"></div>
      <div><label class="small">Date</label><input id="qaDate" type="date"></div>
      <div><label class="small">Product Management</label><input id="productManagement" type="text"></div>
      <div><label class="small">Date</label><input id="productManagementDate" type="date"></div>
    </div>

    <div style="margin-top:16px">
      <label class="small">Open Items or Exceptions</label>
      <textarea id="exceptions" rows="6" placeholder="Document any remaining open items, approved exceptions, owners, and target dates."></textarea>
    </div>

    <div style="margin-top:16px">
      <label class="small">Approved to Begin Phase 1 Scale Testing</label>
      <div class="approval">
        <label><input type="radio" name="approval" value="Yes"> Yes</label>
        <label><input type="radio" name="approval" value="No"> No</label>
        <label><input type="radio" name="approval" value="Approved with documented exceptions"> Approved with documented exceptions</label>
      </div>
    </div>

    <div class="summary" id="summaryBox"></div>
  </section>
</main>

<script>

const statuses = ["Not Started","In Progress","Complete","Blocked","Not Applicable"];
const container = document.getElementById("checklist");
let globalIndex = 0;

Object.entries(checklistData).forEach(([section, items]) => {
  const sec = document.createElement("section");
  sec.className = "section";
  const h2 = document.createElement("h2");
  h2.textContent = section;
  sec.appendChild(h2);

  items.forEach(task => {
    const idx = globalIndex++;
    const row = document.createElement("div");
    row.className = "item";
    row.dataset.index = idx;
    row.innerHTML = `
      <input type="checkbox" class="done" aria-label="Complete">
      <div class="task">${escapeHtml(task)}</div>
      <select class="status" aria-label="Status">
        ${statuses.map(s => `<option>${s}</option>`).join("")}
      </select>
      <textarea class="notes" rows="1" placeholder="Evidence / notes"></textarea>
    `;
    sec.appendChild(row);
  });
  container.appendChild(sec);
});

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function collectData() {
  const results = [];
  document.querySelectorAll(".item").forEach(row => {
    results.push({
      section: row.closest(".section").querySelector("h2").textContent,
      item: row.querySelector(".task").textContent,
      completed: row.querySelector(".done").checked,
      status: row.querySelector(".status").value,
      notes: row.querySelector(".notes").value
    });
  });
  const approval = document.querySelector('input[name="approval"]:checked');
  return {
    exportedAt: new Date().toISOString(),
    metadata: {
      testLocation: value("testLocation"),
      testRelease: value("testRelease"),
      checklistOwner: value("checklistOwner"),
      runId: value("runId"),
      startDate: value("startDate"),
      targetDate: value("targetDate")
    },
    results,
    signOff: {
      installationLead: value("installationLead"),
      installationDate: value("installationDate"),
      networkLead: value("networkLead"),
      networkDate: value("networkDate"),
      automationLead: value("automationLead"),
      automationDate: value("automationDate"),
      qaManager: value("qaManager"),
      qaDate: value("qaDate"),
      productManagement: value("productManagement"),
      productManagementDate: value("productManagementDate"),
      openItemsOrExceptions: value("exceptions"),
      approval: approval ? approval.value : ""
    }
  };
}

function value(id) { return document.getElementById(id).value; }

function updateProgress() {
  const rows = [...document.querySelectorAll(".item")];
  const complete = rows.filter(r => r.querySelector(".done").checked).length;
  const pct = rows.length ? Math.round(complete / rows.length * 100) : 0;
  document.getElementById("progressText").textContent = `${complete} of ${rows.length} complete (${pct}%)`;
  document.getElementById("progressBar").style.width = pct + "%";
  rows.forEach(r => r.classList.toggle("completed", r.querySelector(".done").checked));
  const blocked = rows.filter(r => r.querySelector(".status").value === "Blocked").length;
  const inProgress = rows.filter(r => r.querySelector(".status").value === "In Progress").length;
  document.getElementById("summaryBox").innerHTML =
    `<strong>Current Summary:</strong> ${complete} complete, ${inProgress} in progress, ${blocked} blocked, ${rows.length-complete} remaining.`;
}

function saveState() {
  localStorage.setItem("oncafeScaleChecklist", JSON.stringify(collectData()));
  alert("Checklist saved in this browser.");
}

function loadState() {
  const raw = localStorage.getItem("oncafeScaleChecklist");
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    Object.entries(data.metadata || {}).forEach(([k,v]) => {
      const el = document.getElementById(k); if (el) el.value = v || "";
    });
    (data.results || []).forEach((r, i) => {
      const row = document.querySelector(`.item[data-index="${i}"]`);
      if (!row) return;
      row.querySelector(".done").checked = !!r.completed;
      row.querySelector(".status").value = r.status || "Not Started";
      row.querySelector(".notes").value = r.notes || "";
    });
    const s = data.signOff || {};
    Object.entries(s).forEach(([k,v]) => {
      if (k === "approval") {
        const radio = document.querySelector(`input[name="approval"][value="${CSS.escape(v || "")}"]`);
        if (radio) radio.checked = true;
      } else if (k === "openItemsOrExceptions") {
        document.getElementById("exceptions").value = v || "";
      } else {
        const el = document.getElementById(k); if (el) el.value = v || "";
      }
    });
  } catch(e) { console.error(e); }
}

function download(content, filename, type) {
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeName() {
  const raw = value("runId") || "Phase1";
  return raw.replace(/[^a-z0-9_-]+/gi, "_");
}

function exportJSON() {
  const data = collectData();
  download(JSON.stringify(data, null, 2), `OnCAFE_Scale_Checklist_${safeName()}.json`, "application/json");
}

function csvCell(v) {
  const s = String(v ?? "");
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportCSV() {
  const data = collectData();
  const rows = [["Section","Checklist Item","Completed","Status","Evidence / Notes"]];
  data.results.forEach(r => rows.push([r.section,r.item,r.completed ? "Yes":"No",r.status,r.notes]));
  rows.push([]);
  rows.push(["Final Sign-Off"]);
  Object.entries(data.signOff).forEach(([k,v]) => rows.push([k,v]));
  const csv = rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  download(csv, `OnCAFE_Scale_Checklist_${safeName()}.csv`, "text/csv;charset=utf-8");
}

function resetForm() {
  if (!confirm("Clear all checklist results and saved browser data?")) return;
  localStorage.removeItem("oncafeScaleChecklist");
  location.reload();
}

document.addEventListener("change", e => {
  if (e.target.classList.contains("done")) {
    const row = e.target.closest(".item");
    if (e.target.checked) row.querySelector(".status").value = "Complete";
    else if (row.querySelector(".status").value === "Complete") row.querySelector(".status").value = "Not Started";
  }
  updateProgress();
  localStorage.setItem("oncafeScaleChecklist", JSON.stringify(collectData()));
});
document.addEventListener("input", () => {
  localStorage.setItem("oncafeScaleChecklist", JSON.stringify(collectData()));
});
loadState();
updateProgress();
</script>
</body>
</html>
